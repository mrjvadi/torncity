name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gates: formatting, build, vet, unit tests. No services needed.
  #
  # This job is what makes the architecture tests mean something. They exist
  # to stop a change from quietly breaking the layering (TestDomainImports) or
  # compiling player-facing text into the binary (TestNoHardcodedUserText);
  # tests that only ever run on one laptop protect nothing.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tests)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go build ./...
      - run: go build -tags=integration ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: no bot token committed
        run: |
          if grep -rnE "[0-9]{8,10}:[A-Za-z0-9_-]{35}" . --exclude-dir=.git; then
            echo "a Telegram bot token pattern is committed; rotate it"; exit 1
          fi

  # Integration: the behaviours only a real database can prove — claims that do
  # not overlap under concurrency, races resolved by ON CONFLICT, partial
  # indexes actually used.
  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: torn
          POSTGRES_PASSWORD: torn
          POSTGRES_DB: torn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U torn -d torn"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://torn:torn@localhost:5432/torn?sslmode=disable
      INTEGRATION_DSN: postgres://torn:torn@localhost:5432/torn?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/admin migrate
      - run: go test -tags=integration ./tests/ -v
