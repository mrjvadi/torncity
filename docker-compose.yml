# Every backing service also carries a globally-unique network alias
# (tc-postgres, tc-redis, tc-nats) and the connection strings use those, not
# the bare service name.
#
# This is not cosmetic. When a service joins a second network to reach
# something outside this stack, a bare name like "postgres" can resolve to
# another project's container on that network. The failure is silent if the
# credentials happen to match, and it points your writes at somebody else's
# database.
#
# configs/ is MOUNTED into every service, never baked into the image. The
# whole point of configuration and content living in files is changing them
# without a rebuild; an image that carried its own copy would need one for
# every number. Mounted read-only, because no service has any business
# writing its own configuration.
#
# Every service carries an explicit memory and cpu cap.
#
# This stack is not the only thing on its host: without caps one runaway
# process starves everything else on the box, and the failure looks like an
# unrelated service dying. Totals here are roughly 2.5 GB and 3.2 cpu.
#
services:
  postgres:
    mem_limit: 512m
    cpus: "0.50"
    memswap_limit: 512m
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: torn
      POSTGRES_PASSWORD: torn
      POSTGRES_DB: torn
    # Bound to loopback only, and on a non-default port. These services are
    # reached by service name from inside the compose network; the host
    # mapping exists for local tooling, not for anything remote. A database
    # published on 0.0.0.0 is how a shared host becomes somebody else's.
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      default:
        aliases: ["tc-postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torn -d torn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    mem_limit: 256m
    cpus: "0.25"
    memswap_limit: 256m
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redisdata:/data"]
    networks:
      default:
        aliases: ["tc-redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    mem_limit: 256m
    cpus: "0.25"
    memswap_limit: 256m
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:54222:4222", "127.0.0.1:58222:8222"]
    volumes: ["natsdata:/data"]
    networks:
      default:
        aliases: ["tc-nats"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local Bot API server — ADR 0003.
  # Never expose this port to the public internet: the server speaks plain HTTP.
  telegram-bot-api:
    mem_limit: 512m
    cpus: "0.50"
    memswap_limit: 512m
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes: ["botapidata:/var/lib/telegram-bot-api"]
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/ 2>&1 | grep -q . || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    mem_limit: 256m
    cpus: "0.50"
    memswap_limit: 256m
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: gateway}}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    restart: unless-stopped

  game:
    mem_limit: 256m
    cpus: "0.50"
    memswap_limit: 256m
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: game}}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    restart: unless-stopped

  # The outbox worker is not optional. Domain events are written to the
  # outbox table inside the transaction that changed state; without this
  # process nothing ever moves them to NATS, so player.created and every
  # event after it stay in the database forever.
  worker:
    mem_limit: 192m
    cpus: "0.25"
    memswap_limit: 192m
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: worker}}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
    restart: unless-stopped

  # Turns domain events into player notifications (internal/workers/notification)
  # and hands them to the gateway, which owns the Telegram API. Without it a
  # journey lands in silence.
  notifier:
    mem_limit: 128m
    cpus: "0.25"
    memswap_limit: 128m
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: notifier}}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
    restart: unless-stopped

  # Phase 0 stub: it starts, logs that it is not implemented and waits for a
  # signal. It is here so the process list matches the architecture from the
  # start rather than appearing later as a surprise.
  scheduler:
    mem_limit: 128m
    cpus: "0.15"
    memswap_limit: 128m
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: scheduler}}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # The operators' web panel (cmd/panel): the JSON API over the operator
  # tooling plus its web client, behind username-and-password accounts made
  # on the server (admin panel user add). Plain HTTP inside the network; TLS
  # is the reverse proxy's. The host port is loopback only, for an SSH tunnel:
  #   ssh -L 58090:127.0.0.1:58090 server   then open http://127.0.0.1:58090
  # 256m: a password check is argon2id at 64 MiB, and two run at most at once.
  panel:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.50"
    build: {context: ., dockerfile: deployments/panel.Dockerfile}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    environment:
      TORN_PANEL_LISTEN: "0.0.0.0:8080"
    ports: ["127.0.0.1:58090:8080"]
    networks:
      default:
        aliases: ["tc-panel"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # The game client API (cmd/clientapi, api/client-api.md): the HTTP JSON
  # edge a native or Telegram Mini App client plays through. It publishes
  # commands to the same stream the gateway does and issues the realtime
  # server's tokens. Loopback only on the host; public exposure is the
  # reverse proxy's (deployments/compose.server.yml).
  clientapi:
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: clientapi}}
    working_dir: /srv
    volumes: ["./configs:/srv/configs:ro"]
    env_file: [.env]
    environment:
      TORN_CLIENT_LISTEN: "0.0.0.0:8081"
    ports: ["127.0.0.1:58091:8081"]
    networks:
      default:
        aliases: ["tc-clientapi"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # The realtime server (Centrifugo v6): game clients hold a WebSocket to
  # it and receive their notices and their city's announcements
  # (deployments/centrifugo/config.json). Only the server API key publishes
  # (the notifier, the operators' panel); clients only subscribe, with tokens
  # the client API signs. The admin UI is off.
  centrifugo:
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    image: centrifugo/centrifugo:v6.7.0
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    volumes: ["./deployments/centrifugo/config.json:/centrifugo/config.json:ro"]
    environment:
      CENTRIFUGO_HTTP_API_KEY: "${CENTRIFUGO_API_KEY:-}"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_HMAC_SECRET:-}"
      # Browser origins allowed to open a WebSocket, space-separated (the
      # Mini App's, the panel's). A connection with no Origin (a native
      # client) is always allowed.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${CENTRIFUGO_ALLOWED_ORIGINS:-}"
    ports: ["127.0.0.1:58092:8000"]
    networks:
      default:
        aliases: ["tc-centrifugo"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # One-shot operator tool: migrations and content loads.
  #   docker compose --profile tools run --rm admin migrate
  #   docker compose --profile tools run --rm admin content load --reason "..."
  # It is behind a profile so `up` never starts it as a service.
  admin:
    profiles: ["tools"]
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: admin}}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    env_file: [.env]
    # Audit rows name the operator. Inside the container there is no login,
    # so the host's is passed in; --by on the command line still wins, and
    # with neither the admin tool refuses to change anything.
    environment:
      TORN_OPERATOR: "${TORN_OPERATOR:-${USER:-}}"
    working_dir: /srv
    volumes:
      - "./configs:/srv/configs:ro"
      - "./migrations:/srv/migrations:ro"
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  natsdata:
  botapidata:
