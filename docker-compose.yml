services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: torn
      POSTGRES_PASSWORD: torn
      POSTGRES_DB: torn
    # Host 5432 is already taken by a non-Docker PostgreSQL on this machine,
    # so the stack publishes on 55432. Services reach each other by service
    # name on the compose network and are unaffected by this mapping.
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torn -d torn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["54222:4222", "58222:8222"]
    volumes: ["natsdata:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local Bot API server — ADR 0003.
  # Never expose this port to the public internet: the server speaks plain HTTP.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes: ["botapidata:/var/lib/telegram-bot-api"]
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/ 2>&1 | grep -q . || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: gateway}}
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    restart: unless-stopped

  game:
    build: {context: ., dockerfile: deployments/Dockerfile, args: {CMD: game}}
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  natsdata:
  botapidata:
