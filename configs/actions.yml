# Semantic metadata for every player command's button, so a game client
# (cmd/clientapi, the Godot client) can draw a real UI instead of a row of
# Telegram-shaped text buttons.
#
# internal/clientapi/actions.go turns a screen's Telegram keyboard into
# actions {label, command, args}; it looks the command up here and adds:
#
#   kind:  how the client should draw the button.
#     primary    the main thing to do here (deposit, buy, commit the crime)
#     secondary  any other ordinary action
#     danger     ends or loses something (quit, leave, cancel, kick, drop)
#     navigation opens a screen; no state changes (list, view, show, mine)
#     confirm    answers a yes/no the game is waiting on (accept, decide)
#   icon:  a stable asset key. The client owns the actual picture; this is
#     only the lookup key, so the game may reuse one icon (action:deposit)
#     across several domains (bank, company treasury, savings) rather than
#     mint a new asset for each.
#   group: optional. Steps of one flow that a client may want to present
#     together (a wizard, a proposal and its answer) share a group name.
#
# A command not listed here (there should be none: a test in
# internal/clientapi holds this file to internal/commands' player table)
# gets `defaults` below, so a client never receives an action with no kind
# or icon.
#
# There is no "back" entry in this file: nothing in the command table is a
# dedicated back button. A screen's own list/hub/view command (already
# `navigation` here) is what a "back to X" button on a deeper screen sends,
# so the client renders it as `navigation` there too.

defaults:
  kind: secondary
  icon: "action:default"

