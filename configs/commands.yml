  inventory.item: {channel: private}
  inventory.use: {channel: private}
  inventory.give: {channel: private}
  inventory.drop: {channel: private}
  inventory.bag.wear: {channel: private}
  inventory.bag.off: {channel: private}
  inventory.store: {channel: private}
  inventory.fetch: {channel: private}
  inventory.claim: {channel: private}
