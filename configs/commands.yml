# Where each command may be used, and whose eyes its reply is for.
#
# The group is the public square: only a few things happen there, and
# everything else happens in the player's private chat with the bot (PV).
# Every command the game serves to players needs a line here; a test holds
# this file to internal/commands, so a new command cannot ship without a
# decision. The gateway enforces it (internal/gateway/groups/privacy.go).
#
#   channel: group    only in a group. Sent in PV, the player is told it is
#                     done in a group, and nothing runs.
#   channel: private  only in PV. Sent in a group, the player is told it is
#                     done in PV and given a button that opens PV and runs it.
#   channel: both     anywhere.
#
#   reply: private    (for "both") run from a group, the reply still goes to
#                     the player's PV; the group sees one neutral line.
#                     Omitted, the reply is posted in the group.
#
# Aliases (command_alias in the locales) obey the same table.
commands:
  # The home screen. In a group it leaves the player's money out.
  player.profile.get: {channel: both}
  player.settings: {channel: private}
  player.language.set: {channel: private}
  # The «last seen» setting is personal: private chat only, never a group.
  player.presence.set: {channel: private}

  # The map of the player's own city and the walks between its places work
  # everywhere: crime happens at a place, in the group, so moving between
  # places must too.
  map.list: {channel: both}
  place.go: {channel: both}

  # Going to another city is the player's own business: PV only.
  map.cities: {channel: private}
  travel.options: {channel: private}
  travel.start: {channel: private}
  travel.status: {channel: private}
  # «سفر به این روستا» in a village's group: the journey to that group's
  # village from wherever the player stands. The fares are the player's own
  # (their vehicle, their purse), so the answer goes to their PV and the group
  # sees one neutral line. The web asks for the same screens with client: true.
  travel.here: {channel: both, reply: private}

  skills.list: {channel: private}

  # Players meet in groups: finding someone and asking them to be friends
  # work there; the friend list and accepting are the player's own.
  social.search: {channel: both}
  social.friend.add: {channel: both}
  social.friend.accept: {channel: private}
  social.friend.list: {channel: private}
  social.friend.view: {channel: private}
  social.friend.remove: {channel: private}

  # The bank is private. Paying another player also works in a group — a
  # reply to their message names them — but the confirmation and the receipt
  # go to PV, and the amount never appears in the group.
  bank.show: {channel: private}
  bank.deposit: {channel: private}
  bank.withdraw: {channel: private}
  bank.pay: {channel: both, reply: private}
  bank.pay.send: {channel: private}

  # City hall: who holds office and the city's policies are public; running
  # an office is the holder's own work.
  gov.city: {channel: both}
  gov.history: {channel: both}
  gov.office: {channel: private}
  gov.lever: {channel: private}
  gov.confirm: {channel: private}
  gov.set: {channel: private}
  # Appointing to an office and removing its holder are the holder's own
  # work (docs/adr/0022).
  gov.appoint: {channel: private}
  gov.seat: {channel: private}
  gov.dismiss: {channel: private}
  gov.unseat: {channel: private}
  # Dividing a city's budget is the mayor's own work; the budget itself is
  # public, like the treasury it spends (docs/adr/0024).
  gov.alloc: {channel: private}
  gov.allocok: {channel: private}
  gov.allocset: {channel: private}
  city.budget: {channel: both}
  # Proposals before a council or a parliament and how each member voted
  # are public record; casting a vote is the member's own act.
  law.list: {channel: both}
  law.view: {channel: both}
  law.vote: {channel: private}
  # Property (docs/adr/0024): the city's market and an owner's offer are
  # public, like a shop's shelf; buying, renting, a player's own property
  # and resting at home are the player's own.
  property.list: {channel: both}
  property.type: {channel: both}
  property.offer: {channel: both}
  property.purchase: {channel: private}
  property.mine: {channel: private}
  property.view: {channel: private}
  property.sell: {channel: private}
  property.let: {channel: private}
  property.cancel: {channel: private}
  property.buy: {channel: private}
  property.rent: {channel: private}
  property.leave: {channel: private}
  property.rest: {channel: private}
  # A player's achievements are shown off where they are asked for.
  achievement.list: {channel: both}

  # A character's life (docs/adr/0025). «زندگی من» shows the player's net
  # worth, so its reply goes to PV; a card, a history (another's shows only
  # its public moments) and the leaderboards are public; writing the bio,
  # choosing an avatar and a night's lodging are the player's own.
  life.me: {channel: both, reply: private}
  life.card: {channel: both}
  life.history: {channel: both}
  life.top: {channel: both}
  life.bio: {channel: private}
  life.avatar: {channel: private}
  life.sleep: {channel: private}

  # Finance (docs/adr/0026). The exchange's list and a company's page are
  # market data, public anywhere (a company page shows the player's own
  # holding only in PV); the gold dealer's price is public too, what the
  # player holds only in PV. Loans, the credit score, savings, insurance,
  # orders, a listing, a dividend and the portfolio are the player's own.
  # The VC/SUP book of a settlement's own money (docs/adr/0033 6.8): the player's own orders and
  # balances, so PV; the web asks for the same screens with client: true.
  fx.book: {channel: private, client: true}
  fx.place: {channel: private, client: true}
  fx.cancel: {channel: private, client: true}
  fx.history: {channel: private, client: true}
  fx.convert: {channel: private, client: true}
  loan.hub: {channel: private}
  loan.offer: {channel: private}
  loan.take: {channel: private}
  loan.view: {channel: private}
  loan.repay: {channel: private}
  save.show: {channel: private}
  save.deposit: {channel: private}
  save.withdraw: {channel: private}
  insure.list: {channel: private}
  insure.buy: {channel: private}
  insure.cancel: {channel: private}
  stock.list: {channel: both}
  stock.view: {channel: both}
  stock.buy: {channel: private}
  stock.sell: {channel: private}
  stock.cancel: {channel: private}
  stock.mine: {channel: private}
  stock.ipo: {channel: private}
  stock.dividend: {channel: private}
  gold.show: {channel: both}
  gold.buy: {channel: private}
  gold.sell: {channel: private}

  job.status: {channel: private}
  job.list: {channel: private}
  job.view: {channel: private}
  job.apply: {channel: private}
  job.work: {channel: private}
  job.promote: {channel: private}
  job.quit: {channel: private}

  education.list: {channel: private}
  education.view: {channel: private}
  education.enroll: {channel: private}
  education.hire: {channel: private}
  education.teach: {channel: private}
  education.unteach: {channel: private}

