  # The web client has no group to play them in, so it runs them with
  # client: true (without it the bridge refused them and the screen stayed
  # blank); Telegram keeps its rules.
  crime.hub: {channel: group, client: true}
  crime.list: {channel: group, client: true}
  crime.view: {channel: group, client: true}
  crime.commit: {channel: group, client: true}
  crime.jail: {channel: both, client: true}
  crime.bail: {channel: private, client: true}
  crime.record: {channel: private, client: true}
  crime.report: {channel: private, client: true}
  crime.cases: {channel: private, client: true}

  # What a player carries, and buying, selling and trading it, show their
