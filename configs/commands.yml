  company.type: {channel: private}
  company.found: {channel: private}
  company.mine: {channel: private}
  company.manage: {channel: private}
  company.deposit: {channel: private}
  company.withdraw: {channel: private}
  company.price: {channel: private}
  company.auto: {channel: private}
  company.manager: {channel: private}
  company.close: {channel: private}
  company.openings: {channel: private}
  company.post: {channel: private}
  company.slots: {channel: private}
  company.staff: {channel: private}
  company.decide: {channel: private}
  company.fire: {channel: private}
  company.opening: {channel: private}
