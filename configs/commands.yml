# Where each command may be used, and whose eyes its reply is for.
#
# The group is the public square: only a few things happen there, and
# everything else happens in the player's private chat with the bot (PV).
# Every command the game serves to players needs a line here; a test holds
# this file to internal/commands, so a new command cannot ship without a
# decision. The gateway enforces it (internal/gateway/groups/privacy.go).
#
#   channel: group    only in a group. Sent in PV, the player is told it is
#                     done in a group, and nothing runs.
#   channel: private  only in PV. Sent in a group, the player is told it is
#                     done in PV and given a button that opens PV and runs it.
#   channel: both     anywhere.
#
#   reply: private    (for "both") run from a group, the reply still goes to
#                     the player's PV; the group sees one neutral line.
#                     Omitted, the reply is posted in the group.
#
# Aliases (command_alias in the locales) obey the same table.
commands:
  # The home screen. In a group it leaves the player's money out.
  player.profile.get: {channel: both}
  player.settings: {channel: private}
  player.language.set: {channel: private}

  # The map of the player's own city and the walks between its places work
  # everywhere: crime happens at a place, in the group, so moving between
  # places must too.
  map.list: {channel: both}
  place.go: {channel: both}

  # Going to another city is the player's own business: PV only.
  map.cities: {channel: private}
  travel.options: {channel: private}
  travel.start: {channel: private}
  travel.status: {channel: private}

  skills.list: {channel: private}

  # Players meet in groups: finding someone and asking them to be friends
  # work there; the friend list and accepting are the player's own.
  social.search: {channel: both}
  social.friend.add: {channel: both}
  social.friend.accept: {channel: private}
  social.friend.list: {channel: private}

  # The bank is private. Paying another player also works in a group — a
  # reply to their message names them — but the confirmation and the receipt
  # go to PV, and the amount never appears in the group.
  bank.show: {channel: private}
  bank.deposit: {channel: private}
  bank.withdraw: {channel: private}
  bank.pay: {channel: both, reply: private}
  bank.pay.send: {channel: private}

  # City hall: who holds office and the city's policies are public; running
  # an office is the holder's own work.
  gov.city: {channel: both}
  gov.history: {channel: both}
  gov.office: {channel: private}
  gov.lever: {channel: private}
  gov.confirm: {channel: private}
  gov.set: {channel: private}
  # Appointing to an office and removing its holder are the holder's own
  # work (docs/adr/0022).
  gov.appoint: {channel: private}
  gov.seat: {channel: private}
  gov.dismiss: {channel: private}
  gov.unseat: {channel: private}
  # Dividing a city's budget is the mayor's own work; the budget itself is
  # public, like the treasury it spends (docs/adr/0024).
  gov.alloc: {channel: private}
  gov.allocok: {channel: private}
  gov.allocset: {channel: private}
  city.budget: {channel: both}
  # Proposals before a council or a parliament and how each member voted
  # are public record; casting a vote is the member's own act.
  law.list: {channel: both}
  law.view: {channel: both}
  law.vote: {channel: private}
  # Property (docs/adr/0024): the city's market and an owner's offer are
  # public, like a shop's shelf; buying, renting, a player's own property
  # and resting at home are the player's own.
  property.list: {channel: both}
  property.type: {channel: both}
  property.offer: {channel: both}
  property.purchase: {channel: private}
  property.mine: {channel: private}
  property.view: {channel: private}
  property.sell: {channel: private}
  property.let: {channel: private}
  property.cancel: {channel: private}
  property.buy: {channel: private}
  property.rent: {channel: private}
  property.leave: {channel: private}
  property.rest: {channel: private}
  # A player's achievements are shown off where they are asked for.
  achievement.list: {channel: both}

  job.status: {channel: private}
  job.list: {channel: private}
  job.view: {channel: private}
  job.apply: {channel: private}
  job.work: {channel: private}
  job.promote: {channel: private}
  job.quit: {channel: private}

  education.list: {channel: private}
  education.view: {channel: private}
  education.enroll: {channel: private}

  # Crime happens in the city's group, where the victims are. The jail is
  # public knowledge; bail, the record and a victim's reports are private.
  crime.hub: {channel: group}
  crime.list: {channel: group}
  crime.view: {channel: group}
  crime.commit: {channel: group}
  crime.jail: {channel: both}
  crime.bail: {channel: private}
  crime.record: {channel: private}
  crime.report: {channel: private}
  crime.cases: {channel: private}

  # What a player carries, and buying, selling and trading it, show their
  # goods and their money: PV only.
  inventory.show: {channel: private}
  inventory.item: {channel: private}
  inventory.use: {channel: private}
  inventory.give: {channel: private}
  inventory.drop: {channel: private}
  shop.list: {channel: private}
  shop.view: {channel: private}
  shop.buy: {channel: private}
  shop.offers: {channel: private}
  shop.sell: {channel: private}
  market.list: {channel: private}
  market.book: {channel: private}
  market.order: {channel: private}
  market.cancel: {channel: private}
  market.mine: {channel: private}
  auction.list: {channel: private}
  auction.view: {channel: private}
  auction.new: {channel: private}
  auction.bid: {channel: private}
  auction.mine: {channel: private}

  # Elections are public business: the list and an election read anywhere
  # (in a group without the viewer's own buttons). Standing pays a deposit
  # and a ballot is secret: both in PV only.
  election.list: {channel: both}
  election.view: {channel: both}
  election.stand: {channel: private}
  election.vote: {channel: private}

  # Companies: a city's registry and a company's public page read anywhere
  # (in a group without the owner's buttons). Founding one pays a fee, and
  # running one shows and moves its money: PV only. So do an opening and
  # applying to it, which read the applicant's own standing.
  company.list: {channel: both}
  company.view: {channel: both}
  company.register: {channel: private}
  company.type: {channel: private}
  company.found: {channel: private}
  company.mine: {channel: private}
  company.manage: {channel: private}
  company.deposit: {channel: private}
  company.withdraw: {channel: private}
  company.price: {channel: private}
  company.auto: {channel: private}
  company.manager: {channel: private}
  company.close: {channel: private}
  company.openings: {channel: private}
  company.post: {channel: private}
  company.slots: {channel: private}
  company.staff: {channel: private}
  company.decide: {channel: private}
  company.fire: {channel: private}
  company.opening: {channel: private}
  company.apply: {channel: private}

  # The production economy: a company's floor — its warehouse, suppliers,
  # research lab and licenses, design studio, orders, reverse engineering
  # and listings — shows and spends its money and its secrets: PV only. The
  # city's company goods and buying them read and move the buyer's money:
  # PV only too. A company's public page (company.view) shows its products.
  company.warehouse: {channel: private}
  company.suppliers: {channel: private}
  company.supply: {channel: private}
  company.lab: {channel: private}
  company.research: {channel: private}
  company.techmode: {channel: private}
  company.license: {channel: private}
  company.studio: {channel: private}
  company.dnew: {channel: private}
  company.design: {channel: private}
  company.dfill: {channel: private}
  company.dqty: {channel: private}
  company.dname: {channel: private}
  company.dfinal: {channel: private}
  company.produce: {channel: private}
  company.orders: {channel: private}
  company.relab: {channel: private}
  company.reverse: {channel: private}
  company.sell: {channel: private}
  company.listings: {channel: private}
  company.unlist: {channel: private}
  company.goods: {channel: private}
  company.buy: {channel: private}

  # The armed forces (docs/adr/0022): a country's ministry of defence and the
  # public summary of its forces read anywhere (in a group without counts,
  # readiness or anyone's buttons); a branch in full, stationing it and
  # buying arms are the office holders', in PV only.
  military.ministry: {channel: both}
  military.forces: {channel: both}
  military.branch: {channel: private}
  military.station: {channel: private}
  military.procure: {channel: private}
  military.buy: {channel: private}

  # Diplomacy is public business: the sanctions and treaties boards and the
  # record read anywhere. Imposing, lifting, proposing, answering and ending
  # are the office holder's decisions, in PV only.
  diplomacy.sanctions: {channel: both}
  diplomacy.treaties: {channel: both}
  diplomacy.history: {channel: both}
  diplomacy.impose: {channel: private}
  diplomacy.lift: {channel: private}
  diplomacy.propose: {channel: private}
  diplomacy.answer: {channel: private}
  diplomacy.end: {channel: private}

  # War (docs/adr/0022, part two) is public business too: the war board reads
  # anywhere, in bands. Declaring, joining, proposing, answering and resuming
  # are the head of state's decisions; the war room, a target and launching
  # an operation are the commanders' — all in PV only.
  war.board: {channel: both}
  war.declare: {channel: private}
  war.join: {channel: private}
  war.propose: {channel: private}
  war.answer: {channel: private}
  war.resume: {channel: private}
  war.room: {channel: private}
  war.target: {channel: private}
  war.launch: {channel: private}

  # Health (docs/adr/0023): the hospital screen and a treatment show the
  # patient's health and move their money; a clinic's desk is its owner's.
  # All in PV. That someone was taken to hospital is read in the city's group.
  health.hospital: {channel: private}
  health.treat: {channel: private}
  health.clinic: {channel: private}
  health.price: {channel: private}
  health.open: {channel: private}

  # Factions (docs/adr/0023): the list and a faction's page are public.
  # Founding one and running it — members, ranks, invitations, its bank —
  # are the members' business, in PV. A faction is tied to its Telegram
  # group from inside that group. Its organised crimes are planned, joined
  # and launched where the crew stands — in PV or in a group — and the
  # group reads how they went, never the take.
  faction.list: {channel: both}
  faction.view: {channel: both}
  faction.found: {channel: private}
  faction.mine: {channel: private}
  faction.members: {channel: private}
  faction.invite: {channel: private}
  faction.apply: {channel: private}
  faction.answer: {channel: private}
  faction.kick: {channel: private}
  faction.rank: {channel: private}
  faction.leave: {channel: private}
  faction.bank: {channel: private}
  faction.deposit: {channel: private}
  faction.withdraw: {channel: private}
  faction.link: {channel: group}
  faction.crime: {channel: both}
  faction.plan: {channel: both}
  faction.join: {channel: both}
  faction.launch: {channel: both}
  faction.calloff: {channel: both}

  # Missions (docs/adr/0023): a board is a public noticeboard and reads
  # anywhere; taking a mission, the player's own missions, handing goods in
  # and giving one up are theirs, in PV.
  mission.board: {channel: both}
  mission.view: {channel: both}
  mission.accept: {channel: private}
  mission.mine: {channel: private}
  mission.deliver: {channel: private}
  mission.abandon: {channel: private}

# Free-text input (internal/gateway/input): a button «✏️ …» asks the player to
# type a value, and their next message fills one field of a command. Only the
# commands listed here may ask. field is the payload field the typed text
# fills; args are the names of what the button carries, in order; text: true
# keeps the answer as written (a name), where by default it is read as an
# amount (Persian digits and separators made ASCII).
input:
  bank.deposit: {field: amount}
  bank.withdraw: {field: amount}
  bank.pay: {field: amount, args: [to, method, origin]}
  company.found: {field: name, args: [type, method], text: true}
  company.deposit: {field: amount, args: [company, method]}
  company.withdraw: {field: amount, args: [company]}
  company.post: {field: wage, args: [company, career]}
  company.manager: {field: to, args: [company], text: true}
  company.supply: {field: qty, args: [company, component]}
  company.techmode: {field: price, args: [company, tech, mode]}
  company.dqty: {field: qty, args: [no, slot]}
  company.dname: {field: name, args: [no], text: true}
  company.sell: {field: price, args: [company, target, qty]}
  company.buy: {field: qty, args: [no]}
  gov.appoint: {field: to, args: [office, place], text: true}
  health.price: {field: price, args: [company]}
  faction.found: {field: name, args: [method], text: true}
  faction.invite: {field: to, text: true}
  faction.deposit: {field: amount, args: [method]}
  faction.withdraw: {field: amount}
  property.sell: {field: price, args: [no]}
  property.let: {field: price, args: [no]}
