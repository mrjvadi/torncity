  settlement.promotion.view: {channel: group, client: true}
  settlement.development.view: {channel: group, client: true}
  settlement.promote: {channel: group, client: true}

# Free-text input (internal/gateway/input): a button «✏️ …» asks the player to
# type a value, and their next message fills one field of a command. Only the
# commands listed here may ask. field is the payload field the typed text
# fills; args are the names of what the button carries, in order; text: true
# keeps the answer as written (a name), where by default it is read as an
# amount (Persian digits and separators made ASCII).
input:
  bank.deposit: {field: amount}
  bank.withdraw: {field: amount}
  bank.pay: {field: amount, args: [to, method, origin]}
  company.found: {field: name, args: [type, method], text: true}
  company.deposit: {field: amount, args: [company, method]}
  company.withdraw: {field: amount, args: [company]}
  company.post: {field: wage, args: [company, career]}
  company.manager: {field: to, args: [company], text: true}
  company.supply: {field: qty, args: [company, component]}
  company.techmode: {field: price, args: [company, tech, mode]}
  company.dqty: {field: qty, args: [no, slot]}
  company.dname: {field: name, args: [no], text: true}
  company.sell: {field: price, args: [company, target, qty]}
  company.buy: {field: qty, args: [no]}
  company.ramount: {field: amount, args: [no, field]}
