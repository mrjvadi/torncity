# Operational configuration for every service in this project.
#
# This file is committed and is the same in every environment. Anything that
# differs per environment is set with a TORN_<SECTION>_<FIELD> environment
# variable, which overrides the value here; see configs/README.md.
#
# No secret ever goes in this file. See docs/adr/0002-secret-management.md.
#
# Durations are written the way Go writes them: 250ms, 30s, 2m, 24h. There is
# no day unit, so thirty days is 720h.

# The Telegram gateway: the polling loop, and the drain when it stops.
gateway:
  # The long-poll window handed to getUpdates. Long polling means an idle bot
  # costs one held-open connection instead of a request every second.
  # Lowering it multiplies request volume for no benefit; raising it above
  # telegram.max_poll_timeout is rejected, because the client refuses such a
  # poll and every bot would fail to receive updates from the first attempt.
  poll_timeout: 30s

  # How long to wait after a failed getUpdates before trying again. It is what
  # stops a Telegram outage from turning into a request flood. Lowering it
  # towards zero turns a failing poll into a hot loop against an endpoint that
  # is already unhappy.
  poll_error_backoff: 2s

  # The budget for the whole gateway drain: in-flight updates, in-flight sends,
  # lease release and connection close. Shortening it makes a deploy faster and
  # makes it likelier that an update in flight is dropped rather than finished.
  shutdown_timeout: 20s

  # How many times one outbound Bot API call is tried. The second attempt
  # exists for exactly one case: a flood wait, where the limiter has already
  # been told to park the bot and the retry lands on the far side of the pause.
  # Raising it makes the gateway retry errors that will not improve on a
  # retry; setting it to 1 removes the flood-wait recovery.
  send_attempts: 2

  # How often one Telegram user is answered with the "play on the web"
  # redirect while switch.telegram_play is off, rather than silently ignored.
  # A player mashing a stale button gets one message per cooldown, not a
  # flood of identical ones.
  redirect_cooldown: 1m

  # How often one player may press «send it to my private chat» under a group
  # screen's web-app button, so a mashed button does not flood their private
  # chat.
  webapp_private_cooldown: 5s

# The per-bot lease: which gateway instance has the exclusive right to poll a
# given bot. Two instances polling one bot lose updates rather than duplicating
# them, because each getUpdates acknowledges the other's.
lease:
  # How long a claim survives without a renewal. It is the upper bound on how
  # long a crashed gateway's bots stay dark, so it is short. Raising it leaves
  # bots unattended for longer after a crash; lowering it makes a brief Redis
  # hiccup enough to lose a lease that is working fine.
  ttl: 30s

  # The renewal interval is ttl divided by this. Three means three attempts
  # inside one TTL, so two consecutive failures (a Redis failover, a GC pause)
  # are survivable. It must be at least 2: at 1 the renewal is due only once
  # the lease has already expired, and the bot flaps between instances.
  renew_divisor: 3

  # Bounds the release that runs after the keeper's context is already
  # cancelled, so shutdown cannot hang on it. If the release fails, the TTL
  # above is the fallback and the bot is claimable again once it expires.
  release_timeout: 5s

# Outbound pacing towards the Bot API, one independent gate per bot, so a
# flood wait on one bot never stalls the rest of the fleet.
ratelimit:
  # The per-bot allowance in messages per second for a bot with no rate of its
  # own in the registry. It sits below Telegram's documented "about 30 per
  # second" on purpose: that figure is not a contract, and our clock, the
  # network and the local Bot API server each add jitter in the wrong
  # direction. Raising it to the documented ceiling earns 429s.
  default_rate: 25

  # How many messages may go out back to back after an idle period. One means
  # strictly paced output. Raising it lets a quiet bot fire a burst, which
  # Telegram answers with 429 often enough that spending the allowance evenly
  # is the safer default.
  default_burst: 1

# The Bot API client itself.
telegram:
  # Bounds an ordinary, non-polling call. It is never applied to getUpdates.
  # It must stay below max_poll_timeout + poll_timeout_grace, and loading the
  # config fails if it does not.
  request_timeout: 30s

  # The largest long-poll window the client will accept. It exists so the
  # polling HTTP client can be given a transport timeout that is provably
  # larger than any poll it will be asked to make.
  max_poll_timeout: 120s

  # Added on top of max_poll_timeout to get the polling client's transport
  # timeout. Without the grace the classic bug appears: an HTTP timeout equal
  # to the long-poll timeout aborts every poll just before the server answers,
  # and the bot looks dead while every request reports success.
  poll_timeout_grace: 15s

  # Used when the server answers 429 with no usable retry_after. Deliberately
  # conservative: waiting a few seconds too long costs little, retrying too
  # early risks a longer ban.
  default_flood_wait: 5s

# Playing in Telegram groups. The game is played in groups: screens are
# ordinary group messages, except the player's own business (bank balances,
# payments, settings), which goes to their private chat with the bot with one
# neutral line left in the group. See internal/gateway/groups.
groups:
  # The longest popup a button press may answer with. Telegram accepts at
  # most 200 characters; longer text is cut with an ellipsis.
  callback_alert_max_runes: 200
  # A deep link that opens the private chat on a screen for a target (paying
  # a player named in the group) carries the target in Telegram's start
  # parameter, at most 64 characters of A-Z a-z 0-9 _ -. One that does not
  # fit is kept in Redis under a short token for this long instead.
  deep_link_ttl: 15m

# The bot's command menu (the "/" button). It is registered for private chats
# only, and the default and group menus are cleared at every gateway start, so
# a group shows no command menu at all: in the Bot API a group falls back to
# the default scope's menu when it has none of its own. Each command needs a
# description at command_menu.<command> in every locale.
menu:
  commands:
    - profile
    - map
    - job
    - study
    - bank
    - city
    - crime
    - skills
    - social
    - find
    - settings
    - help

# Suppression of Telegram updates that arrive more than once.
dedup:
  # How long an update id is remembered. Telegram redelivers an update until
  # it is confirmed by offset, so after a long outage a replayed update must
  # still be recognised. Shortening this to minutes would let such a replay be
  # processed a second time, charging a player twice for one command.
  # Lengthening it only costs memory for keys nobody reads again.
  ttl: 24h

# JetStream stream retention and redelivery.
nats:
  # How long an unconsumed command is kept. Commands are perishable in a way
  # events are not: replaying a three-day-old "travel to this city" after an
  # outage is worse than dropping it, because the player gave up long ago.
  command_max_age: 24h

  # How long events are kept: 720h is thirty days. Events are history, read by
  # projections, notifications and analytics, so they are retained far longer
  # than commands. Shortening it shortens how far a projection can be rebuilt.
  event_max_age: 720h

  # How long the server remembers a Nats-Msg-Id and drops a republication of
  # it. Two minutes covers the realistic case: an outbox row re-claimed after
  # a publisher crashed between publishing and marking the row published. It
  # is a first line of defence only; the inbox table is what actually
  # guarantees effectively-once processing.
  duplicate_window: 2m

  # How long the server waits for an acknowledgement before assuming the
  # handler died. It must exceed the slowest legitimate handler: set it too
  # low and a still-running handler's message is redelivered and the work is
  # done twice.
  ack_wait: 30s

  # How many times JetStream offers one message before giving up on it. The
  # transient failures clear inside the backoff schedule below; the ones that
  # do not are deterministic, and retrying those forever just parks one
  # message at the head of a work queue starving everything behind it. After
  # the last attempt the message goes to the dead-letter advisory path.
  max_deliver: 5

  # The delay requested when a handler returns an error. A plain immediate
  # nak against a dependency that is down becomes a hot loop that burns the
  # whole delivery budget in milliseconds, before the dependency has had any
  # chance to recover.
  nak_delay: 5s

  # The wait before each redelivery, one entry per redelivery. It is graduated
  # because the first retry asks "was that a blip" and wants to be quick,
  # while the fourth asks "has the dependency come back" and a tight loop
  # there only adds load. Entries must strictly increase; JetStream reuses the
  # last one if it ever needs more.
  backoff:
    - 1s
    - 5s
    - 15s
    - 60s

# The outbox worker, which turns committed database rows into published events.
worker:
  # How often an idle outbox is checked. It is the floor on end-to-end event
  # latency, so it is short; the partial index on pending rows makes an empty
  # poll almost free. Raising it delays every event by up to that much.
  poll_interval: 250ms

  # How many rows one claim takes. Large enough that a burst drains in a few
  # polls, small enough that a worker crash re-publishes little. Raising it
  # increases how much work a crash repeats.
  batch_size: 100

  # Bounds the final drain when the worker stops.
  shutdown_timeout: 15s

  # The attempt count at which a row stops being a normal retry and starts
  # being a problem worth an operator's attention. The row is still not
  # touched; only the reporting changes.
  noisy_attempts: 5

# The scheduler turns the durable schedule into published commands. It owns
# WHEN work happens, never WHAT happens: a due travel becomes a published
# command that the game service handles.
#
# Separate from worker even though the four values line up, because the two
# are paced by different things. The outbox worker is bounded by how fast a
# committed event should reach the broker; the scheduler by how late a player
# may notice their travel landing. One number serving both would be tuned for
# whichever incident happened last.
scheduler:
  # How often to look for work that has come due. Lower means players see
  # their travel land sooner; it also means more queries against an index
  # that is usually empty, which is cheap but not free.
  tick_interval: 1s

  # How many due actions to claim per tick. Too high and one slow batch
  # delays everything behind it; too low and a backlog never drains.
  batch_size: 100

  # How long to let the in-flight batch finish on shutdown before giving up.
  # Work that does not finish stays claimed and is retried on the next boot.
  shutdown_timeout: 15s

  # After this many failed attempts an action is logged at error rather than
  # warn. It changes log volume only; it never drops the action.
  noisy_attempts: 5

  # The lease on a claimed action. A claim moves a row from scheduled to
  # running, out of the due index; if the scheduler holding it dies before
  # completing it, nothing would ever look at the row again. A row still
  # running this long after its claim is returned to scheduled and dispatched
  # again. It must exceed shutdown_timeout, and loading the config fails if it
  # does not: a shorter lease reclaims rows a live batch is still publishing.
  # Lowering it recovers a stranded journey sooner and makes a slow batch more
  # likely to be dispatched twice; the game service's idempotency absorbs the
  # repeat, but it is work done twice.
  claim_timeout: 2m

# The notifier, which tells players about events that happened while they
# were away. It consumes events on the same redelivery policy as every other
# consumer (the nats section above) and hands each notice to the gateway as a
# request, waiting for a receipt before the event is acknowledged.
notifier:
  # How long one event's whole delivery may take: every bot tried, the
  # gateway's queueing behind direct replies and any flood wait included. It
  # must be shorter than nats.ack_wait, and loading the config fails if it is
  # not: a delivery still running when the ack wait runs out is handed to a
  # second delivery, and the player is told twice. Raising it lets a notice
  # ride out a longer flood wait; lowering it gives up sooner and retries.
  send_budget: 15s

  # The end of the send budget the gateway may not spend starting a send;
  # it is kept for the gateway's receipt to travel back. A notice carries a
  # deadline of send_budget minus this, and a gateway past it answers
  # "expired" instead of sending. It must be shorter than send_budget. Too
  # small and a send started at the last moment is confirmed after the
  # notifier stopped listening, so the retry sends it again.
  receipt_margin: 3s

  # How old an event may be and still be announced. A consumer created for
  # the first time reads the event stream from its start, and a month of
  # "you have arrived" at once is worse than none. It matches
  # nats.command_max_age: a notification about an intent expires with it.
  max_age: 24h

  # Bounds the drain of in-flight deliveries when the notifier stops. A
  # delivery cut short is not acknowledged and is retried on the next boot.
  shutdown_timeout: 15s

# The command-side game service.
game:
  # Bounds the drain of in-flight messages when the service stops.
  shutdown_timeout: 20s

  # How long a command's idempotency key blocks a replay. It must comfortably
  # outlast the broker's redelivery schedule above, and loading the config
  # fails if it does not: a redelivery arriving after the key expired is
  # executed a second time.
  idempotency_ttl: 24h

  # How often the service asks the database whether a newer content version
  # was loaded (`admin content load`), and swaps it in without a restart: new
  # transport modes, fares, cities. A request already running keeps the
  # version it started with. Lowering it makes a load visible sooner at the
  # cost of one tiny query per interval.
  content_reload_interval: 30s

  # The game clock (docs/adr/0018-game-clock.md): how many seconds of game
  # time pass in one real second. Every gameplay duration the content writes
  # is GAME time — a journey, a course, a shift, a promotion's time in tier,
  # the fatigue window — and the player waits it divided by this. At 60 a
  # game hour is a real minute. At 1 (now) a game hour IS a real hour and content
  # durations are written as real ones (docs/research/2026-10-05-realtime-clock.md).
  # Every screen shows the
  # real wait. What is NOT game time: a policy's notice and cooldown, an
  # office term, energy regeneration, a mode's demand window and every
  # operational timeout in this file. It must be between 1 and 86400.
  # Changing it changes every activity still to start, never one already
  # under way: its real end was fixed when it began. (It used to be
  # travel.time_scale, which is still read if present; this key wins.)
  time_scale: 1

  # The cut-over from the compressed clock (a game day was 24 real minutes, scale 60)
  # to real time (2026-10-05, owner: game time is real time, on UTC, worldwide). Until
  # clock_cutover (a UTC midnight) days are counted by clock_epoch and
  # clock_legacy_scale; from it a game day is a real day of the settlement's own time zone and the day number
  # keeps counting up, so no stored day key collides or goes back. Set once and
  # never moved: moving it renumbers days.
  clock_legacy_scale: 60
  clock_cutover: "2026-10-06T00:00:00Z"

  # The scale of a journey between places. 1 (owner, 2026-10-05): journeys take their real
  # time, a 3h bus ride is 3 hours; the speeds of the modes in transport.yml are real
  # speeds. A traveller is on the road: jobs, shops, village work and crime refuse them
  # until they arrive. Journeys under way keep the end they were given.
  travel_time_scale: 1

  # The real instant (RFC 3339) at which game day 0 began at 00:00. With
  # time_scale it makes the game's day and hour (gametime.Clock): what "once per
  # game day at 06:00" (the village shop's morning delivery, merchant.restock_hour)
  # means, the same on every replica. Changing it, or time_scale, renumbers the
  # days.
  clock_epoch: "2026-01-01T00:00:00Z"

  # The most one command may run, REAL time. Its context is then cancelled:
  # the transaction rolls back and the message is redelivered, instead of a
  # stuck handler holding its connection and its locks. Must be shorter than
  # postgres.idle_in_transaction_timeout.
  command_timeout: 30s

# The tuning of a journey that is not content. The RULES — how a distance and
# a transport mode become a duration and a fare — live in
# internal/domain/travel. The modes themselves (bus, train, flight…: speed,
# fare, energy, which cities serve them, how demand moves the price) are
# content, in configs/content/transport.yml. What a city charges on public
# transport is its mayor's decision (the city.transit_fare lever in
# governance.yml), never a number here.
travel:
  # XP a player earns on landing.
  arrival_xp: 25

  # How long a journey takes is the game clock's business: game.travel_time_scale (1 since
  # 2026-10-05: a journey takes its real time; speeds in transport.yml are real).

  # Where a CONTENT city stands on the generated world ("code=lat:lon",
  # degrees). A founded village stands on its own world cell; Support has
  # none, so its spot is set here: a temperate lowland cell of the seed-42
  # world's great continent, 940 km from any sea (docs/adr/0034). The
  # distance of a journey with no content route is the great-circle
  # distance between two such spots on a planet of worldgen.planet_radius_km.
  city_locations:
    - "support=32.30:-47.70"

  # Which transport modes (configs/content/transport.yml) serve those
  # world-derived journeys, and the longest one each will make ("mode=km").
  # A listed mode needs no facility at either end (a village has none): its
  # speed and fare per kilometre come from transport.yml, so time and fare
  # grow with the distance. A destination beyond every listed mode is not offered.
  world_reach:
    - "walk=40"
    - "cart=150"
    - "car=21000"

# Player-facing defaults.
player:
  # The language a player gets when Telegram tells us nothing usable about
  # theirs. The game ships Persian first, so an unknown locale falls back to
  # it rather than to English. It is a primary subtag only: "fa", not "fa-IR".
  default_language: "fa"

  # The time zone a clock time is shown in ("arrives at 14:32", "the shift
  # ends at 09:05") — an IANA zone name. Players are never shown UTC. The
  # zone database is built into the binaries, so any IANA name works in any
  # image.
  default_timezone: "Asia/Tehran"

# The money core (docs/adr/0009-economic-control.md). Every amount is a whole
# number of minor currency units; there are no fractions anywhere in the
# ledger, so a value like 5000.5 is refused on load rather than rounded.
economy:
  # What every player receives once, from the game's system_source account,
  # recorded as a reward grant with source starting_grant. New players get it
  # at first contact; players who existed before it get it from
  # `admin economy grant-starting --reason "..."`. A player is never granted
  # it twice, so changing this value affects only players not yet granted.
  starting_cash: 5000

  # The smallest and the largest amount of ONE bank deposit, withdrawal or
  # payment between players, in minor units. The maximum caps the damage of a
  # mistyped amount and of a stolen account in one action; the minimum stops
  # a flood of one-unit transfers. The bank's FEES are not here: they are
  # each city's policy (city.bank_withdrawal_fee and city.card_transfer_fee
  # in governance.yml), set by its mayor. The minimum must not exceed the
  # maximum.
  bank_min_amount: 1
  bank_max_amount: 1000000000

  # The round amounts the bank offers as buttons for a deposit, a withdrawal
  # or a payment, smallest first. A screen shows only those the player can
  # actually move (a withdrawal's fee included), up to four of them, beside
  # "all of it" and a button to type any amount.
  bank_quick_amounts: [1000, 5000, 10000, 50000, 100000, 500000, 1000000]

# The office holder's screens (docs/adr/0015-player-held-offices.md). Nothing
# here is a policy value or a bound — those are content (governance.yml) and
# the office holder's decision; these only size the buttons.
governance:
  # The step buttons of the policy screen move a proposed value by the
  # lever's range divided by these: a tax rate allowed between 0% and 25%
  # steps by 0.25% and by 2.5%. Raising a divisor makes that step finer and
  # the screen slower to cross the range; both must be at least 1.
  fine_step_divisor: 100
  coarse_step_divisor: 10
  # How far one press moves a budget line's share on the allocation screen
  # (city.budget, docs/adr/0024-property-and-politics.md), bps. 10000 must be
  # a whole number of steps, at most 35 of them.
  allocation_step_bps: 500

# The crime engine's tuning (docs/adr/0019-crime-engine.md). Which crimes
# exist and what each asks, risks and pays are content (crimes.yml); what a
# city's police charge and hand down is its police chief's policy
# (governance.yml). What is here is how the engine itself paces and protects.
crime:
  # NERVE is what an attempt costs: its own resource, so crime never competes
  # with work for energy, and the engine's rate limit. It refills by
  # nerve_regen_amount every nerve_regen_interval of REAL time, up to
  # nerve_max, like energy. Raising the max lets a thief binge; shortening the
  # interval makes crime the fastest money in the game.
  nerve_max: 20
  nerve_regen_amount: 1
  nerve_regen_interval: 5m

  # HEAT is how much the police are looking for a player: every crime adds
  # some (crimes.yml), it lowers their odds and raises the chance a report
  # against them is solved, and it cools off by heat_decay_per_hour each REAL
  # hour. heat_max is the top of the wanted scale.
  heat_max: 100
  heat_decay_per_hour: 4

  # Newcomer protection: a player below protect_min_level, or whose account
  # is younger than protect_min_age, is never a crime's victim. Someone who
  # has not had time to earn anything is not a mark.
  protect_min_level: 3
  protect_min_age: 72h

  # Who is "nearby". A crime that can hit a player lands on one standing in
  # the same city and venue who has done something in the game within
  # active_window — a mark must be someone playing, who can notice and
  # answer. A player who arrived by bus, train or plane stays at that
  # terminal's venue for arrival_linger after arriving.
  active_window: 30m
  arrival_linger: 20m

  # Farming protection. A player robbed by anyone is not robbed again for
  # victim_cooldown, so one active player is not drained by every thief in
  # town; a thief does not land on the same player again for thief_cooldown.
  victim_cooldown: 6h
  thief_cooldown: 24h

  # How long after a theft its victim may still report it to the police.
  # REAL time: it is a promise to the player.
  report_window: 24h

  # A report is investigated for investigation_duration of GAME time, waited
  # through the game clock (game.time_scale). Its solve chance, in basis
  # points (10000 = 100%), is investigation_base_bps + the suspect's heat x
  # investigation_per_heat_bps + investigation_witness_bonus_bps when the
  # theft was seen + the city's investigation effort x
  # investigation_effort_weight_bps / 10000, clamped to 1%..95%.
  investigation_duration: 6h
  investigation_base_bps: 2500
  investigation_per_heat_bps: 40
  investigation_witness_bonus_bps: 3500
  investigation_effort_weight_bps: 3000

  # The most NPC crime may pay into the economy per UTC day, across every
  # player and city, in minor units. It is the global cap on the one faucet
  # crime opens (crime_proceeds, ADR 0009); each crime's own max_cash caps a
  # single take. Once reached, an NPC crime still succeeds and pays nothing.
  npc_daily_cap: 500000

  # GEAR: what the tools a thief carries add to one attempt is content (each
  # item's `gear:` in items.yml); these cap the TOTAL of every tool, by
  # magnitude, so no bag of tools makes a crime certain (the success chance
  # is still held under 95%). Basis points (10000 = 100%); nerve in points.
  # Raising a cap makes gear matter more; lowering it makes skill matter
  # more.
  gear_max_success_bps: 2500
  gear_max_catch_bps: 2500
  gear_max_witness_bps: 3000
  gear_max_solve_bps: 3000
  gear_max_reward_bps: 5000
  gear_max_nerve: 5

# The player market and the auction house. Which goods exist is content
# (items.yml); the fee a trade or a sale pays is each city's policy
# (city.market_fee in governance.yml), never a number here. What is here
# bounds orders and auctions so a typo cannot lock a fortune in escrow.
trade:
  # How long a resting order lives, REAL time, before it expires and its
  # escrow — money for a buy, goods for a sell — goes back to its owner.
  market_order_ttl: 168h

  # One player's resting orders at a time, and the most one order may ask:
  # units, and minor units per unit.
  market_max_open_orders: 20
  # The village book (docs/adr/0040 section 5): stalls are the open orders a
  # settlement's market takes at once, per market post and per market hall that
  # stands, and how many of them one player may hold; a settlement that has
  # researched the periodic market holds a market day every so many game days,
  # when the listing fee is nothing and the dues are halved.
  village_stalls_post: 6
  village_stalls_hall: 20
  village_stalls_per_player_post: 3
  village_stalls_per_player_hall: 6
  market_day_every_days: 7
  market_max_quantity: 10000
  market_max_price: 100000000

  # The lengths a seller may choose for an auction, GAME time, waited
  # through the game clock (game.time_scale): at 60, 24h is 24 minutes.
  auction_durations: [1h, 6h, 24h]

  # The highest reserve a seller may set; how much a bid must beat the
  # standing one by (a share, at least a minimum, minor units); and one
  # seller's open auctions at a time.
  auction_max_reserve: 100000000
  auction_step_bps: 500
  auction_min_step: 10
  auction_max_open: 5

  # The reserves a seller is offered when putting a piece up, as shares of
  # the good's reference price in basis points: 10000 is the price itself.
  auction_reserves_bps: [5000, 10000, 15000]

# Player companies (docs/adr/0020-companies.md). The kinds of business and each
# city's NPC market are content (companies.yml); what a city charges a company
# — registration, corporate tax, minimum wage, sales tax — is its policy
# (governance.yml), never a number here.
company:
  # One settlement of a city's companies, GAME time: every period, once, the
  # population pays them and they pay their upkeep. At game.time_scale 60 a
  # day of game time is 24 minutes.
  period: 24h
  # Companies one player may own at a time.
  max_per_player: 2
  # A name's length, in characters; the longest must fit input.max_length.
  name_min_length: 3
  name_max_length: 24
  # Shares a company is founded with, every one of them its founder's. Kept
  # for the stock market; nothing trades them yet.
  founding_shares: 1000
  # Settlements in a row a company may end owing upkeep before it is
  # dissolved.
  insolvency_periods: 3
  # The most one city's population pays its companies in one period, minor
  # units, whatever companies.yml allows: the operator's last bound on this
  # faucet.
  npc_city_period_cap: 50000
  # Open job openings per company at a time.
  max_openings: 5
  # How far one press of «ارزان‌تر» or «گران‌تر» moves a price level, bps.
  price_step_bps: 1000
  # Citizen labour (docs/adr/0020): the job openings no player has taken are
  # worked by the city's citizens, paid the opening's wage per shift from the
  # company's free money. A player who takes a position replaces a citizen.
  # Shifts one citizen works in a full period.
  citizen_shifts_per_period: 2
  # What a citizen's shift counts for against a player's, bps: players stay
  # the better hire.
  citizen_productivity_bps: 7000
  # Share of a city's NPC population (companies.yml) its companies may
  # employ at once, bps.
  citizen_labour_share_bps: 500
  # The production economy (docs/adr/0021): production orders one company
  # runs at once, designs it keeps (drafts included), listings it has open.
  max_running_orders: 3
  max_designs: 20
  max_listings: 10
  # The level the company's best member (owner, manager or employee) needs
  # in a good's craft skill to author a design of it.
  design_min_skill: 1
  # How long taking a bought sample apart takes, GAME time.
  reverse_time: 6h
  # A quick order's size (docs/adr/0021, section 14): the one-tap order a
  # company's next step offers, and the size an order screen opens at —
  # units of a product, batches of a component — or what the warehouse can
  # cover when that is less.
  quick_order_units: 5
  # Product generations: how long one improvement project takes, GAME time,
  # and its flat fee, minor units (docs/adr/0021, generations addendum);
  # how long applying one retrofit kit to one unit takes, GAME time.
  improvement_time: 4h
  improvement_cost: 20000
  retrofit_time: 2h
  # How many basis points of market value a design version loses per
  # generation the newest of its lineage is ahead of it, and the least it
  # may ever fall to.
  obsolescence_decay_bps: 800
  obsolescence_floor_bps: 3000
  # Specialist recruitment (docs/adr/0027): who the NPC specialists are and
  # what they expect is content (recruitment.yml); how a campaign runs is
  # here. GAME time between two checks of a campaign, and the checks one
  # campaign runs: at scale 60, four checks six game hours apart are about
  # a real hour and a half.
  recruit_check_every: 6h
  recruit_checks: 4
  # Campaigns one company runs at once, and specialists one campaign seeks.
  recruit_max_campaigns: 2
  recruit_max_positions: 5
  # Candidates one check brings at most: the bound on notices and rows.
  recruit_max_candidates: 6
  # How long, GAME time, a candidate waits for an answer.
  recruit_patience: 24h
  # Specialists one company employs at most.
  recruit_max_staff: 10

# The armed forces (docs/adr/0022-military-and-diplomacy.md). Who decides a
# country's budget and who buys its arms are offices (governance.yml); what
# each class of equipment costs to keep is content (military.yml).
military:
  # One defence period, GAME time: every period, once, each city pays the
  # national treasury its share of what it took in, the defence fund is
  # appropriated its share of that, and the forces' upkeep is paid.
  period: 24h
  # Readiness a period with its upkeep short costs, and a period paid in
  # full gives back, bps of full readiness.
  readiness_loss_bps: 1000
  readiness_recovery_bps: 500
  # The radar the forces screen measures each design against: the km at
  # which it finds a 1 m² target.
  reference_radar_km: 150
  # How long a defence licence the defence minister revokes stays in force,
  # REAL time: the company is told and announced at once, and the licence
  # lapses when this runs out (docs/adr/0022, section 2.14).
  licence_revoke_notice: 24h
  # How many ended defence licences (revoked, rejected) the public registry
  # lists under the applications and the licences in force, newest first.
  ended_licences_shown: 5

# Sanctions and treaties. Every duration here is REAL time: a promise to
# players, like a lever's notice (docs/adr/0018-game-clock.md).
diplomacy:
  # How long after it is announced a sanction binds, and the least it stands
  # before it may be lifted (so it cannot be switched off for one trade).
  sanction_notice: 1h
  sanction_min_duration: 24h
  # How long a treaty proposal waits for the other country's answer.
  treaty_offer_ttl: 72h
  # How long an ended treaty stays on the treaties board.
  ended_shown_for: 168h
  # Entries of the diplomatic record on one page.
  history_page_size: 8

# War (docs/adr/0022-military-and-diplomacy.md, part two). How battles are
# fought is content (configs/content/military.yml, war). The notice and the
# proposal's life are REAL time: promises, like a lever's notice.
war:
  # How long after a declaration — or the end of a ceasefire — the war may be
  # fought: no hostilities without previous and explicit warning.
  declaration_notice: 24h
  # How long a ceasefire or a peace waits for the other side's answer.
  proposal_ttl: 48h
  # How long an ended war stays on the war board.
  ended_shown_for: 168h
  # Operations listed on the war board.
  board_operations: 8
  # The most players of a struck city told privately that it was hit.
  notice_cap: 200

# Missions (docs/adr/0023-health-missions-factions.md). What each mission asks
# and gives is content (configs/content/missions.yml). A mission's cash reward
# enters the economy (ADR 0009 mission_reward), so it is capped twice a UTC
# day: per player and for everyone together. What a cap withholds is not paid
# later.
missions:
  # Missions a player may run at once.
  max_active: 5
  # The most mission cash one player receives in a day, minor units.
  player_daily_cap: 5000
  # The most mission cash all players together receive in a day.
  economy_daily_cap: 1000000

# Factions (docs/adr/0023). What founding one costs, what each rank may do
# and the organised crimes are content (configs/content/factions.yml).
factions:
  # A faction's name, in letters, like a company's.
  name_min_length: 3
  name_max_length: 24
  # Members of one faction, its leader included.
  max_members: 30
  # Invitations and applications one faction may have waiting.
  max_pending: 20
  # People who must live in a settlement (the same group) before one of them
  # may found a faction there. Real founding minimums run from 3 (a German
  # party's board) through 7 (an Indian trade union) to hundreds (an Iranian
  # party's founding assembly); the owner sets 20.
  min_founders: 20
  # Factions or members on one screen.
  list_size: 10

# The watch (docs/adr/0023, internal/domain/watch): behavioural rules that
# notice alt-account abuse and farming. A rule records a flag with its
# evidence for an operator (`admin watch`); a payment above hold_above between
# accounts a flag links waits for review in the payer's escrow. Nothing is
# ever banned automatically. The window is REAL time.
anticheat:
  # How far back transfers are counted.
  window: 24h
  # One-way transfers: at least this many from one account to another in the
  # window, moving at least this much, with at least this share of the value
  # between them going that way.
  one_way_count: 4
  one_way_min_total: 20000
  one_way_ratio_bps: 9000
  # A market trade at least this far (bps) from the good's reference price,
  # moving at least this much, is an off-market trade.
  off_market_bps: 5000
  off_market_min_value: 5000
  # An account whose transfers (at least this many in the window) go this
  # share to one other account.
  single_partner_min_count: 6
  single_partner_share_bps: 9000
  # Commands a player sends in a minute before the rate is flagged.
  commands_per_minute: 90
  # Wash trading on the stock exchange: each of two accounts selling one
  # company's shares to the other at least this many times in the window.
  wash_trade_count: 3
  # The smallest payment held for review between accounts a flag links.
  hold_above: 50000

# Free-text input (internal/gateway/input): a button «✏️ مبلغ دلخواه» asks the
# player to type a value, and their next message answers it. Which commands
# may ask is configs/commands.yml, section input.
input:
  # How long a question waits for its answer.
  ttl: 5m
  # The least time between two questions to one player in one chat, so a
  # button pressed again and again cannot flood the chat.
  cooldown: 3s
  # The longest answer read, in characters; the rest is ignored.
  max_length: 32

# Public lines in a city's group: a player arrived, a player was jailed. They
# never carry an amount. A busy city must not drown its group: at most
# max_per_window lines in any window; what is held back is folded into a count
# on the next line.
announce:
  window: 1m
  max_per_window: 6
  # Village news (things finishing in a village, docs/adr/0030): a burst is
  # merged into one short post. Nothing goes out before the oldest waiting
  # item is village_merge_window old; a village's group gets at most one post
  # per village_min_gap; the notifier looks for due posts every
  # village_flush_interval.
  village_merge_window: 20s
  village_min_gap: 90s
  village_flush_interval: 5s
  # Literacy grows by a step every few minutes while a school stands; it is
  # only news each time it climbs this many percentage points.
  village_literacy_step_percent: 10

# The inbox badge (migrations/0037_notification_inbox): most notices are
# stored and counted on one Telegram message instead of arriving as their
# own. WHICH notification kind sends at once instead is content, not here —
# configs/notifications/delivery.yml — so an operator changes it without
# touching this file. Every value below is REAL time (a policy's notice and
# cooldown, never game.time_scale).
notifications:
  # /inbox category page size.
  inbox_page_size: 5
  # Least real time between two edits of one player's badge message; a
  # burst inside this window updates only the stored count, and the next
  # edit (or the player opening /inbox) catches the message up.
  edit_throttle: 8s
  # How long a badge may sit unread before the 24h nudge fires, and how
  # often cmd/notifier looks for one due.
  reminder_delay: 24h
  reminder_check_interval: 15m
  # How long a READ item is kept before the sweep removes it, and how often
  # that sweep runs.
  retention: 720h
  prune_interval: 24h
  # Least real time between two "you are hungry" instant notices to the
  # same player, so a hunger hovering at life.yml's needs.high threshold
  # cannot resend it on every command that happens to catch the life up.
  hunger_alert_cooldown: 2h
  # Least real time between two realtime vitals reads (cash, bank, energy,
  # health, xp, level, unread) for the same player, api/client-api.md
  # section 5: a burst of notices for one player publishes at most one.
  vitals_min_interval: 2s

# Votes of a body (docs/adr/0024-property-and-politics.md): a council
# confirming a mayor's budget or a large tax change, a national assembly
# approving a declaration of war. Which bodies confirm what is content
# (governance.yml). The window is REAL time: a promise, like a lever's notice.
legislature:
  # How long a proposal stays open for the members' votes. It closes earlier
  # the moment no vote still to come could change the outcome.
  vote_window: 48h
  # Proposals listed on one screen.
  list_size: 8

# A city's period (docs/adr/0024), GAME time: every period, once, the city's
# budget is spent by its allocation (city.budget), property pays its upkeep
# and tax, and rent falls due. At game.time_scale 60 a day is 24 minutes.
city:
  period: 24h

# Property (docs/adr/0024). What each kind of property costs, where, and how
# many a city sells are content (configs/content/property.yml); a city's
# property tax is its policy (city.property_tax).
property:
  # City periods in a row an owner may end owing upkeep or tax before the
  # city repossesses the property.
  foreclosure_periods: 3
  # Periods of rent in a row a tenant may owe before the lease ends.
  eviction_periods: 2
  # Properties one player may own at once.
  max_owned: 5
  # The highest asking price of a sale listing and the highest rent per
  # period, minor units, so a typo cannot lock a fortune.
  max_price: 100000000
  max_rent: 1000000
  # How long after resting at home a player may rest again, GAME time.
  rest_cooldown: 8h

# Achievements (docs/adr/0024). What each asks and gives is content
# (configs/content/achievements.yml). Their cash enters the economy (ADR 0009
# achievement_reward), so it is capped twice a UTC day, like missions'. What
# a cap withholds is not paid later.
achievements:
  player_daily_cap: 5000
  economy_daily_cap: 500000

# Every service's connection pool. A command holds exactly one connection —
# its unit of work's transaction; every read inside it runs on that
# transaction — so max_conns bounds how many commands run at once. A session
# left idle inside a transaction longer than idle_in_transaction_timeout is
# ended by the server, releasing its locks, so one stuck process can never
# freeze the others.
postgres:
  max_conns: 16
  idle_in_transaction_timeout: 60s

# The operators' web panel (cmd/panel). Accounts are created on the server
# only (`admin panel user add`); nothing here is a password or a key.
panel:
  # Where it listens. Loopback by default; the container overrides it with
  # TORN_PANEL_LISTEN so the reverse proxy on the docker network reaches it.
  listen: 127.0.0.1:8090
  # The one origin the panel answers for: state-changing requests from any
  # other origin (loopback aside, for an SSH tunnel) are refused.
  public_url: https://panelomm.ir404.site
  # Direct peers whose CF-Connecting-IP / X-Forwarded-For is believed, for
  # rate limiting and the audit trail. Anyone else is named by the socket.
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  # A session ends after this long without a request, and after
  # session_absolute whatever happens.
  session_idle: 30m
  session_absolute: 12h
  # Sign-in attempts one address may make per minute.
  login_per_minute: 10
  # After this many wrong passwords in a row an account is locked for
  # lockout_base, doubling with each further failure up to lockout_max.
  lockout_after: 5
  lockout_base: 1m
  lockout_max: 1h
  # Changes one operator may make per minute.
  mutations_per_minute: 30
  # The largest request body, bytes.
  max_body_bytes: 65536
  # How long a request id's answer is remembered, so a retry does not act
  # twice.
  idempotency_ttl: 24h
  # The shortest password `admin panel user` accepts.
  password_min_length: 12
  # The name an authenticator app shows beside the code.
  totp_issuer: torncity
  # The longest one request may run (a content load is the slowest).
  request_timeout: 2m
  # The console's lists: each read runs read-only and is cancelled by the
  # database after read_timeout; an export carries at most export_max_rows.
  read_timeout: 8s
  export_max_rows: 10000
  # How long a gateway trusts its cached copy of a player's mute or ban, so
  # a moderation takes effect within this long without a query per command.
  moderation_cache_ttl: 30s
  # How long a gateway trusts its cached copy of an operator switch
  # (switch.telegram_play, switch.telegram_notices), so a change on the
  # System > Switches page takes effect within this long without a query per
  # command.
  switch_cache_ttl: 15s
  # The live feed: new audit rows, flags and holds are looked for every
  # feed_interval, and the dashboard's figures pushed every kpi_interval.
  feed_interval: 3s
  kpi_interval: 30s
  # Centrifugo: its server API (the key is CENTRIFUGO_API_KEY), the
  # WebSocket the browser connects to (a path is on the panel's own origin),
  # and how long a connection or subscription token lasts. Tokens are signed
  # with CENTRIFUGO_TOKEN_HMAC_SECRET; without it the panel polls instead.
  realtime_api_url: http://tc-centrifugo:8000/api
  realtime_websocket_url: /connection/websocket
  realtime_token_ttl: 10m
  # NATS monitoring, for the system page's stream depths.
  nats_monitor_url: http://tc-nats:8222

# The game client API (cmd/clientapi, api/client-api.md): a native or
# Telegram Mini App client plays through the same command pipeline as a
# chat. Its signing secrets are environment (CLIENT_JWT_SECRET,
# CENTRIFUGO_TOKEN_HMAC_SECRET), never this file.
client:
  listen: 127.0.0.1:8081
  # Direct peers whose X-Forwarded-For names the client, for rate limits.
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  # An access token (JWT) lasts access_ttl; the refresh token that renews
  # it lasts refresh_ttl and is replaced on every use.
  access_ttl: 15m
  refresh_ttl: 720h
  # A /link code works once, for link_code_ttl; a player may ask for
  # link_codes_per_hour of them.
  link_code_ttl: 10m
  link_codes_per_hour: 5
  # Sign-in attempts (a link code, Mini App data) one address may make per
  # minute.
  sign_ins_per_minute: 10
  # Clients one player may have linked at once; one more signs the oldest
  # out.
  max_devices: 10
  # How long a command's answer is waited for, and how many commands one
  # player may send per minute.
  command_timeout: 15s
  commands_per_minute: 120
  # The largest request body, bytes.
  max_body_bytes: 16384
  # How old a Telegram Mini App's signed launch data may be.
  telegram_auth_max_age: 1h
  # How long a realtime connection or subscription token lasts.
  realtime_token_ttl: 15m
  # A command played only in a Telegram group (commands.yml, channel:
  # group), sent from a client: refuse (answered group_only) or allow.
  group_commands: refuse
  # The Mini App build's https address; empty until it is published.
  mini_app_url: ""
  # The move to a presentation-neutral core (docs/adr/0037): a screen the
  # core sends as data (a view and actions, no wording) is answered to a
  # client WITHOUT its Telegram-rendered `text`, unless it is listed here. A
  # web client deployed before it draws a screen from the view still reads
  # `text`, so this lists those screens ("*" is all of them). Empty it once
  # every deployed client draws the migrated screens itself.
  legacy_text_screens: []
  # World chunks (GET /api/v1/world/chunks/...): how many encoded chunks one
  # replica keeps in memory (about 10 KB each, raw and gzip together), and how
  # many one player may fetch per minute. A village layout samples the
  # settlement's terrain, so it has its own, lower, limit.
  chunk_cache_entries: 4096
  chunks_per_minute: 1200
  layouts_per_minute: 120
  # How long the active world's registry row is trusted before the database
  # is asked which world is active again.
  world_recheck_interval: 30s
  # GET /api/me/photo: the player's Telegram profile photo is fetched through
  # the Bot API once, kept in Redis for photo_ttl, and the absence of a photo
  # for photo_missing_ttl (the client then shows initials). photos_per_minute
  # bounds the Bot API fetches one player may cause.
  photo_ttl: 6h
  photo_missing_ttl: 30m
  photos_per_minute: 6

# The realtime server (Centrifugo, deployments/centrifugo). The client API
# issues its tokens and the notifier publishes notices to it; its API key
# is environment (CENTRIFUGO_API_KEY), and without it nothing is published.
realtime:
  api_url: http://tc-centrifugo:8000/api
  publish_timeout: 2s
  # A player reads as online for presence_ttl after their last command or
  # heartbeat (docs/adr/0030 section 3.1); nothing is written when they go.
  presence_ttl: 30s
  # The most players one settlement list returns.
  roster_limit: 200
  # How long a settlement channel event remembers its version, so a
  # redelivered event is stamped the same and published once.
  settlement_event_ttl: 24h

# Client state sync (docs/adr/0034-client-state-sync.md, api/client-api.md
# "State sync"): every player has an ordered log of the changes to what
# their client holds (wallet, vitals, items, notices, their settlement...),
# numbered pts 1, 2, 3... with no holes. GET /state is the snapshot, GET
# /updates?since= what was missed, the player's realtime channel pushes new
# records, and a command's answer carries its own. The projector runs in
# cmd/notifier; the endpoints in cmd/clientapi.
state_sync:
  # The whole feature, and bootstrap.features.updates (what tells a client
  # to keep a store instead of polling). Off: no log is written and
  # clients poll as before.
  enabled: true
  # Changing the epoch voids every client's cursor: each one resets to a
  # fresh snapshot (after a bulk data repair, say).
  epoch: "1"
  # A client further behind than this many records resets instead of
  # replaying (Telegram's differenceTooLong); the most records one GET
  # /updates answers; how often one player may pull.
  reset_threshold: 2000
  pull_limit: 500
  pulls_per_minute: 240
  # How long a command's answer waits for its own records; without them in
  # time it answers anyway and the push brings them.
  command_wait: 300ms
  # A batch bigger than either is not pushed; a short "too long" poke is,
  # and the client pulls.
  push_max_records: 100
  push_max_bytes: 32768
  # An older domain event is acknowledged without projecting (a new
  # projector consumer reads the event stream from its start).
  max_event_age: 10m
  # Payload keys, besides any containing "player", that name a player an
  # event concerns.
  player_keys: [payee_id, payer_id, victim_id, target_id, buyer_id, seller_id, winner_id, member_id, holder_id,
    recipient_id, sender_id, attacker_id, defender_id, candidate_id, voter_id]
  # The most residents and visitors one settlement event re-projects.
  fanout_limit: 500
  # How many recent records are searched for a command's own.
  cause_window: 200
  # How many of the newest notices a client holds (older ones are paged).
  notices_kept: 50
  # The longest a projection waits for the player's lock.
  lock_timeout: 2s
  # Retention: a record is kept while younger than retention_age OR among
  # the player's last retention_records, whichever keeps more, never fewer
  # than retention_min. One replica trims at a time, every trim_interval,
  # trim_batch players per run.
  retention_age: 168h
  retention_records: 5000
  retention_min: 500
  trim_interval: 1h
  trim_batch: 200
  # How often each process logs its state sync counters.
  metrics_interval: 5m

# The world generator (internal/domain/worldgen; the project report at
# docs/adr proposes the schema for what gets stored). What biomes and
# resources exist, and the geology that places them, is CONTENT
# (configs/content/world.yml) — these are the coefficients that shape the
# planet a seed produces, not what it is made of.
worldgen:
  # How many mesh cells cover the sphere, and how many of them each connect
  # to (a k-nearest-neighbour graph approximating hexagonal adjacency).
  # Generation time and memory both scale with cell_count.
  cell_count: 40000
  neighbor_k: 6
  # How many tectonic plates the mesh is partitioned into, and what share of
  # them are oceanic (permille) rather than continental.
  plate_count: 16
  oceanic_plate_fraction_permille: 550
  # The target share of cells that end up above sea level, permille. 450
  # (45%) rather than Earth's own ~29%: the world exists for Telegram
  # groups to settle on, so more land means more room for groups.
  land_fraction_permille: 450
  # Elevation noise: how many octaves are summed, the coarsest octave's
  # spatial frequency, and the amplitude multiplier each further octave
  # contributes (permille; 500 = half the amplitude of the octave before).
  noise_octaves: 6
  noise_base_frequency: 2.0
  noise_persistence_permille: 520
  # Domain warp applied to the sampling coordinates before reading the
  # elevation noise field, so a coastline or mountain range does not trace
  # the smooth geometric shape of the plate boundary that produced it.
  # warp_amplitude is in sphere-coordinate units (roughly -1..1 per axis);
  # warp_frequency is in the same units as noise_base_frequency.
  warp_amplitude: 0.45
  warp_frequency: 1.1
  # How many graph-steps a plate boundary's effect (mountain building,
  # rifting) reaches before decaying to zero.
  boundary_influence_steps: 9
  # How many latitude bands the prevailing-wind/moisture simulation divides
  # the sphere into. More bands approximate the Hadley/Ferrel/polar
  # circulation cells more finely, at the cost of generation time.
  moisture_bands: 90
  # The minimum flow accumulation (a cell count) before a cell is
  # classified as carrying a river. A filled depression (priority-flood
  # fills every one it finds, however small, to keep the drainage network
  # free of dead ends) is only rendered as a lake, rather than just being
  # part of the terrain a river flows through, when it clears BOTH the
  # minimum fill depth (elevation units) and the minimum area (cells) below
  # — area is what keeps the map to a handful of notable lakes instead of
  # every small filled dip.
  river_flow_threshold: 12
  lake_min_depth: 40
  lake_min_area_cells: 20
  # Minecraft-style chunking over a cube-sphere (6 quadtree faces). Base LOD
  # 10 (1024 chunks along a face edge, 32x32 tiles each) puts a tile at
  # ~305m across on an Earth-sized planet — see the world-chunking report
  # for the derivation and why that comfortably fits a village's 5x5 and a
  # city's 15x15 lot grid inside one base chunk.
  planet_radius_km: 6371
  chunk_base_lod: 10
  chunk_tile_edge: 32
  # Base-LOD-only local FastNoiseLite detail added on top of the coarse
  # mesh's interpolated elevation (hills, coastline wrinkling too fine for
  # the 40k-cell mesh) and the noise that meanders a small stream tile off
  # a dead-straight line between coarse drainage cells. The noise library
  # feeds it coordinate*frequency directly (internal/domain/worldgen's
  # fastnoise package), so real wavelength = planet_radius_km/frequency:
  # noise_base_frequency above (2.0) shapes continents (thousands of km);
  # this shapes one ~10km chunk, so it needs a MUCH higher frequency for a
  # wavelength around a kilometre — 2000/1200 give ~3.2km/~5.3km base-octave
  # wavelengths, keeping even the finest (doubled) FBm octave several tiles
  # wide rather than aliasing into static finer than the tile grid itself
  # resolves; the stream frequency stays on the gentler end so its narrow
  # threshold band (chunk.go) is crossed by a run of adjacent tiles, not
  # an isolated one. Amplitude is in elevation units.
  chunk_detail_frequency: 2000
  chunk_detail_amplitude: 300
  chunk_stream_frequency: 1200
  chunk_stream_amplitude: 60
  # How many exact tiles a coarse-mesh resource deposit expands into inside
  # whichever base chunk it falls in.
  chunk_deposit_tiles_per_deposit: 5

# Organic settlement growth (docs/adr/0044-organic-growth-alliances-countries.md,
# phases G0 and G1): what a settlement HAS (buildings, research, staff) replaces
# its tier label as the thing every gate asks.
growth:
  # authoritative (default since the promotion ladder was retired, 2026-10-04):
  # what the settlement has decides every gate. shadow: the same answer decides
  # for buildings, other gates keep the tier answer and each disagreement is
  # metered (growth_disagreements, `admin growth report`). off: no capability
  # computation; the size label no longer lists buildings, so do not run off.
  capabilities: authoritative
  # How long, REAL time, computed capabilities are reused by the gates that read
  # them outside a transaction (ADR 0044 section 5.1: pure, cached).
  cache_ttl: 5s
  # Damage, basis points, from which a building no longer stands (10000 = a ruin).
  ruined_bps: 10000
  # How often a process writes the disagreements it metered.
  flush_interval: 30s

# Group founding (docs/adr/0028-world-and-settlements.md section 3.2): the
# starting-spot algorithm's search bounds and the beginner-protection
# window. A founded settlement's buildings, tiers and levies are CONTENT
# (governance.yml, buildings.yml) — these are the coefficients the
# algorithm itself runs on.
settlement:
  # How long, REAL time, a freshly founded settlement's territory cannot be
  # claimed, contested or struck. Ends early the moment its country goes to
  # war (docs/adr/0022, part two) — the same shape as Travian's and OGame's
  # beginner-protection window.
  protection_window: 168h
  # How long, REAL time, a player who moved their home (joined a village or
  # went back to the neutral city) must wait before moving it again. It runs
  # from the last change of residence.
  # How long a charter must wait before it changes the settlement's time zone again.
  timezone_cooldown: 168h
  residence_cooldown: 72h
  # The content city a player returns to when they leave a village.
  home_city_code: support
  # The smallest stage (village, town, city) from which the Economy hub lists
  # the property market «ملک». Below it, lots and houses are in the village menu.
  property_hub_min_stage: town
  # The least great-circle distance (km) a candidate spot must keep from
  # every existing settlement's centre: more than twice a village's
  # automatic territory radius, so a spawn can never land inside another
  # settlement's claim.
  min_spawn_distance_km: 30
  # How far a stronger neighbour's weight still steers a new spawn away, as
  # a preference rather than a wall.
  threat_radius_km: 150
  # The outward walk from a lattice point's nearest cell gives up on that
  # point (and the caller advances to the next one) after visiting this
  # many cells with no eligible one among them.
  search_max_cells: 2000
  # How many lattice points one founding may try, in total, before giving
  # up outright.
  search_max_attempts: 200
  # Spawn circles (ADR 0028 section 3.2, amendment 2026-10-09): new settlements are founded close together. One
  # circle at a time is filled with foundings; when it holds spawn_circle_capacity settlements, or no eligible cell
  # is left in it, the next circle opens beside the filled ones, spiralling outward on a hex lattice, so the settled
  # area grows as one connected region and neighbours meet. The world's cells are about 110 km apart (40000 cells),
  # so a radius of 300 km is about 20 cells: 12 settlements fit with land and sea mixed, neighbours are a bus ride of
  # 2 to 4 hours apart (transport.yml: bus 60 km/h), the far side of a circle about 10 hours.
  spawn_circle_radius_km: 300
  spawn_circle_capacity: 12
  # A circle fills from its centre outward in bands this wide (km); inside a band the better land comes first.
  spawn_circle_fill_band_km: 120
  # How many full or empty (sea) circles one founding may skip before it falls back to the old lattice.
  spawn_circle_max_advance: 200
  # The lot a resident builds (ADR 0045 phase B1): the owner chooses the function and what is inside, the game builds
  # it. Floor area: a footprint cell gives this much per storey; a bedroom takes 2, a hearth or a storeroom 1, a
  # cellar none (configs/content/building_functions.yml, module_kinds). A storey costs per footprint cell: timber,
  # and stone from the third storey up; the support table says how many storeys the settlement's knowledge allows
  # ("knowledge=storeys", one storey with none). Taking a module out gives back building_salvage_bps of its
  # materials. A change of use costs use_change_fee_bps of the building's assessed value (ADR 0044 5.5; at most
  # 1000). A look differs from its neighbours' by up to building_look_rerolls re-rolls of its seed.
  building_area_per_cell: 6
  building_storey_timber_per_cell: 4
  building_storey_stone_per_cell: 6
  building_storey_stone_from: 3
  building_storey_shifts_per_cell: 4
  building_storey_knowledge: ["carpentry_ii=2", "masonry=2", "masonry_ii=3", "masonry_iii=5"]
  building_salvage_bps: 3000
  use_change_fee_bps: 200
  building_look_rerolls: 8
  building_templates_max: 20
  # Biome codes (configs/content/world.yml) a village may never be placed
  # on: only truly uninhabitable land. Harsh but livable biomes are not
  # banned; they cost score through biome_penalties below.
  excluded_biomes: [polar_ice]
  # The highest |latitude|, in degrees, of any spawn. The spawn lattice is
  # squeezed into this band, so early villages spread over the habitable
  # latitudes instead of trying the frozen caps. Must be in (0, 90].
  max_abs_latitude_deg: 70
  # Score a spawn loses for standing on a harsh but livable biome, as
  # "biome_code=points" (the ADR 0028 section 3.2 terrain penalty, same
  # units as resource and freshwater bonuses; a deposit is worth ~1 point
  # per 1000 permille grade, fresh water 3).
  biome_penalties: ["desert=4", "tundra=6", "boreal_forest=1"]
  # A village's local placement grid, per side, in lots (ADR 0028 section
  # 4: 5x5).
  village_grid_lots: 5
  # The least share of a village's lot grid (basis points, 10000 = every
  # lot) that must be buildable land - not lake, sea or river. Judged on the
  # grid the village would really get, with the placement rules' own sampler:
  # a spot whose grid is mostly water is never chosen. The centre lot and the
  # founding kit's lots must be buildable whatever the share.
  min_buildable_lot_share_bps: 7000
  # How many lots, each way, the grid may slide from its cell's centre to
  # find a placement that meets the share before the cell is passed over.
  grid_shift_max_lots: 3
  # Land: there is no paid expansion step any more (ADR 0044, owner decision
  # 2026-10-03). The grid is the first block of land; a road drawn out of it
  # opens the land it reaches (road_* below).
  # What the treasury pays for each lot of road the game lays by itself to
  # connect a new building (a road laid by hand costs 50).
  auto_road_cost: 10
  # Lot access (docs/adr/0043): a lot is sold only when a road can reach it.
  # A lot of culvert or footbridge over water costs lot_access_crossing_cost
  # (a road lot costs auto_road_cost); one route crosses at most
  # lot_access_max_crossing water lots. A village whose grid side reaches
  # street_plan_min_grid platts its streets ahead, one every street_pitch lots,
  # as reserved right-of-way that is never sold.
  lot_access_crossing_cost: 60
  lot_access_max_crossing: 2
  street_pitch: 5
  street_plan_min_grid: 12
  # A road opens the land it reaches (ADR 0044 5.5, owner decision 2026-10-03).
  # How many lots deep a road opens the land along it (the frontage band, ADR 0044 5.5/5.6).
  road_frontage_depth_lots: 3
  # The longest single road plan, in lots (a TECHNICAL bound on one plan's size, about 45 km; the real limits are terrain, other settlements' land and the cost of building it when lots are bought).
  road_plan_max_lots: 1500
  # The most unsold lots a settlement's roads may hold open at once (a TECHNICAL bound against claiming a whole continent with free plans; selling lots or cancelling an unbought plan frees room).
  road_open_lots_max: 30000
  # How many tiles round another settlement's first grid are closed to our roads (its land; ADR 0044 5.5 claim rule).
  road_foreign_buffer_tiles: 3
  # A lot whose ground differs from a side neighbour by more than this many metres cannot be built on (shown as steep).
  road_steep_slope_m: 30
  # How many tiles the lot router may stray from the world router's line.
  road_corridor_ring_tiles: 1
  # Price of a lot of the researched track class against a footpath lot, in basis points of auto_road_cost.
  road_track_cost_bps: 15000
  # The founding form (docs/adr/0028 section 3): «ساخت روستا» opens a draft
  # that the founder completes in the game client - name, national currency,
  # emblem - and only its submission founds the village. An open draft waits
  # founding_draft_ttl; then nothing is founded and the group may ask again.
  founding_draft_ttl: 30m
  # Bounds, in characters. The code is exactly currency_code_len capital
  # letters (2 to 6); the currency is only RESERVED for the village and
  # becomes its national money when it declares a country (ADR 0029).
  founding_name_min: 3
  founding_name_max: 24
  founding_motto_max: 60
  founding_currency_name_min: 3
  founding_currency_name_max: 24
  founding_currency_code_len: 3
  founding_currency_symbol_max: 3
  # K2/W5 (docs/adr/0031-knowledge-and-village-progression.md): how often
  # a settlement's own literacy tick runs, GAME time, and the diffusion
  # formula's own rate (section 4.4).
  teach_period: 24h
  teach_rate_bps: 1500
  base_school_capacity_bps: 8000
  # The scarcity price curve's own shared coefficients (section 10 point
  # 3): price = base_cost x clamp(k / holders_share, floor, cap). base_cost
  # is content, per item; these three are one set for the whole game.
  scarcity_k_bps: 10000
  scarcity_floor_bps: 3000
  scarcity_cap_bps: 80000
  # How far a settlement-to-settlement sale may deviate from the reference
  # price, either way.
  seller_band_bps: 500
  # The share of a demolished building's own money cost credited back to
  # the settlement's treasury (ADR 0028 section 6.2).
  demolition_salvage_bps: 2000
  # What a village pays Support for a material it buys with SUP from its
  # treasury (ADR 0033 section 4.1; items.yml village_buy): the component's
  # reference price times this over 10000. 12000 = the reference price + 20 %,
  # so producing a material at a workplace is always cheaper than buying it.
  material_markup_bps: 12000
  # How many units of goods a village's stock holds without a granary (each
  # standing building's `storage` in settlement_buildings.yml adds to it), and
  # the most units of one material bought in one purchase. The base capacity
  # must hold the largest single building cost, or a village could never
  # stock what it needs to build; production and purchases stop at the
  # capacity, so a granary is what lets a village keep more.
  stock_base_capacity: 60
  # Homes a settlement needs for each building it may raise at once beyond the
  # first (the people who can raise them); 16 keeps a fresh city at one.
  build_homes_per_crew: 16
  # The caps of the charter (ADR 0044 6.4 rail R4): offices per settlement, seats per
  # office, permissions per office, and the length of an office title in characters.
  charter_max_offices: 24
  charter_max_seats: 15
  charter_max_permissions: 40
  charter_title_min: 2
  charter_title_max: 32
  # Charter phase 2 (docs/adr/0044 6.5, 6.6): elections, recall, amendments, the acting head.
  # the term of an elected seat, REAL days
  charter_election_term_days: 14
  # how long residents may stand in an election, REAL hours
  charter_candidacy_hours: 48
  # how long an election votes, REAL hours
  charter_voting_hours: 72
  # days a holder must have served before a recall petition may start
  charter_recall_min_tenure_days: 5
  # share of eligible residents that must sign a recall petition (2000 = 20 percent)
  charter_recall_signature_bps: 2000
  # the floor of signatures for a tiny town (never more than everyone)
  charter_recall_min_signatures: 3
  # how long a recall vote runs, REAL hours
  charter_recall_vote_hours: 72
  # days a holder is left alone after a recall vote and cannot be re-appointed to that office if removed
  charter_recall_cooldown_days: 14
  # how long an amendment vote runs, REAL hours
  charter_amend_vote_hours: 72
  # share of eligible residents that must vote for an amendment to count
  charter_amend_quorum_bps: 3000
  # residents from which a structural change goes to a vote (below it the office holder decides)
  charter_amend_vote_min_residents: 6
  # REAL days an acting head may act while the head seat is vacant
  charter_acting_days: 7
  # the most one spend of an acting head may be, minor units
  charter_acting_spend_cap: 2000
  # days a resident must have lived in the settlement to vote or stand
  charter_min_residency_days: 3
  # Food in the stock spoils a share per game day (basis points of the food):
  # little with a staffed granary keeping it, more in the open yard.
  storage_spoil_kept_bps: 5
  storage_spoil_unkept_bps: 30
  # Stores that stood before the storekeeper rule keep their full room for this many
  # real days after the rule date (a grace, so no town loses room overnight); the
  # screen warns "no keeper" and says until when.
  storage_keeper_rule_at: "2026-10-03T00:00:00Z"
  storage_keeper_grace_days: 14
  # The real village goods (docs/adr/0050): firewood, paper and tools are goods with producers now. For this many
  # real days after the rule date the older stand-in (timber for firewood, wool for paper) still serves a settlement
  # that has none of the real item, and a workplace without tools keeps its full output; after it a shift without
  # tools yields tool_bare_hands_bps of its output (10000 = all of it).
  real_items_rule_at: "2026-10-10T18:00:00Z"
  real_items_grace_days: 7
  tool_bare_hands_bps: 6000
  # The daily services (docs/adr/0052): a watch post, a health house and an inn are open on a day they are staffed,
  # paid and supplied. A post that stood complete before this date counts as open for this many real days after it
  # while a person of the pool staffs it, even with the store thin, so no live settlement loses its coverage overnight.
  service_rule_at: "2026-10-10T12:00:00Z"
  service_grace_days: 7
  # Personal prerequisites of a post (docs/adr/0055): a workplace's staff role may ask a level, a skill, a certificate or
  # literacy of the player who works there, a scholar's post literacy. From this date a player who lacks them is
  # refused, naming what is missing; for this many real days after it he may still work, with a notice.
  personal_rule_at: "2026-10-10T00:00:00Z"
  personal_grace_days: 7
  # Research capacity and speed (docs/adr/0048): slots from staffed research buildings, speed from
  # the scholars, a dearer price for what is ahead of the world, a discount for real work in the field.
  # research projects every settlement can run with no research building (ADR 0048)
  research_free_slots: 1
  # the slowest a research slot may work, 10000 = the old single project; staff and buildings only add
  research_speed_floor_bps: 10000
  # speed any staffed scholar adds, however unskilled
  research_scholar_floor_bps: 500
  # speed each level of the scholarship skill adds to a scholar
  research_skill_bps_per_level: 100
  # the most one scholar adds
  research_scholar_cap_bps: 2000
  # the scholarship level an NPC scholar of the labour pool is taken to have
  research_npc_scholar_level: 3
  # speed a fully literate settlement adds to every slot (scaled by its literacy)
  research_literacy_bonus_bps: 2000
  # speed an item held by every settlement adds for one that lacks it (diffusion: the more the world knows it, the easier to learn)
  research_catch_up_bps: 4000
  # the world frontier is never lower than this depth of the knowledge tree
  research_era_base_depth: 4
  # share of settlements that must hold an item for its depth to count as reached by the world (Rogers: the innovators and early adopters together are about 16 percent)
  research_era_share_bps: 1600
  # extra cost and time per depth step an item is beyond the world frontier
  research_ahead_per_step_bps: 3000
  # the most extra cost and time for being ahead of the world
  research_ahead_cap_bps: 10000
  # speed each research-sharing partner that holds the item adds
  research_share_per_partner_bps: 1000
  # the most speed sharing pacts add to one project (the owner: +50 percent)
  research_share_cap_bps: 5000
  # points of real work in the item's field, per depth of the item, that give the whole breakthrough discount
  research_breakthrough_need_per_depth: 100
  # the most a breakthrough takes off the price and time of a project
  research_breakthrough_max_bps: 4000
  # points a finished work shift adds to its field (learning by doing)
  research_experience_per_shift: 10
  # scholarship experience a player scholar on duty earns each research day
  research_scholar_xp: 40
  # The market day (docs/adr/0049): a travelling trader buys the surplus the head puts on sale.
  # share of an item's reference price the travelling trader pays on market day (below 10000: he resells elsewhere, and a round trip through Support, where the settlement buys above the reference price, always loses)
  export_price_bps: 9000
  # most one trader's visit pays in all, minor units, whatever the size of the settlement
  export_cap_base: 400
  # what each resident adds to the visit's cap, minor units
  export_cap_per_resident: 40
  # the amounts the trade desk offers to keep back of an item
  export_keep_presets: [10, 25, 50, 100]
  material_buy_max: 200
  material_buy_presets: [5, 20, 50]
  # Village treasury start-up. A village has no income until its abstract
  # sales exist (ADR 0028 section 8.3), so it is founded with this many SUP
  # in its treasury (system_source -> city_treasury, reason
  # settlement_grant, exactly once per village). 10000 covers the first two
  # or three tier-1 buildings (300-2500 each: a workshop 1200, a farm 2000,
  # a granary 500) plus one first research (carpentry 1000 ... basic_literacy
  # 4000).
  founding_grant: 10000
  # A resident may give from their own cash to their village's treasury
  # (settlement.donate, reason settlement_donation): the least and the most
  # of one gift, and the amounts the donate buttons offer.
  donation_min: 100
  donation_max: 100000
  donation_presets: [250, 1000, 5000]
  # The citizen loop (docs/adr/0033 sections 4.4-4.5, migration 0058): a
  # resident buys a free lot from the village and builds a private house on it.
  # Everything the citizen pays lands in the village treasury (lot, permit,
  # property tax) or leaves the world (the building's own cost, bought
  # materials); nothing pays a resident for living there. The head's levers
  # (lot price, permit fee, property tax) move inside the *_min/*_max bounds.
  citizen_lot_price: 400
  citizen_lot_price_min: 100
  citizen_lot_price_max: 5000
  citizen_permit_fee: 100
  citizen_permit_fee_max: 1000
  # Property tax a period on the assessed value (lot price plus building
  # cost): 200 = 2 %. The period is GAME time; the village's own tick
  # collects it, and what a resident cannot pay stays a debt.
  citizen_tax_bps: 200
  citizen_tax_bps_max: 500
  citizen_tax_period: 24h
  # A missing building material is bought at items.yml's base_price times
  # this (12000 = 20 % over the reference price).
  citizen_material_markup_bps: 12000
  # One wallet cannot buy the village: most lots per player, and the zoning
  # cap on the share of buildable lots that may be private.
  citizen_max_lots_per_player: 6
  citizen_private_share_max_bps: 6000
  # Resting in one's own house: real-time cooldown, and what one rest gives.
  citizen_home_rest_cooldown: 6h
  citizen_home_rest_health: 10
  citizen_home_rest_happiness: 5

# The village labour market (docs/adr/0037-labor-market.md). Construction is
# done by workers: a building needs `reference_crew` workers for its build time,
# every shift adds work, and no timer finishes it. An NPC labourer's wage is
# `base_wage` moved along the wage curve by how tight the labour market is
# (demand over the labour force, in bps): slack -> below base, short -> above.
# The labour force follows housing: (base_housing + the homes' capacity - the
# players who live there) x participation_bps.
# Teaching (docs/research/2026-10-03-activities-audit.md section 7). A public school's
# fee goes to the settlement treasury; the teacher is paid from it per student.
education:
  teacher_wage_bps: 6000   # a teacher earns this share of the course's listed fee for each student, paid from the treasury when the class ends
  teacher_min_wage: 40   # the least a class pays its teacher, minor units
  teacher_max_students: 12   # students one teacher teaches at once

# Training (same audit): a session spends energy and gives stamina and strength.
training:
  energy_cost: 10   # energy one session spends
  stamina_gain: 6   # stamina a session gives at full efficiency, before diminishing returns
  strength_xp: 30   # strength skill experience a session gives at full efficiency
  diminish_stamina: 400   # every this much stamina above the starting 100 halves the next gains (1/(1+extra/this))
  stamina_per_max_energy: 50   # stamina that adds one point of max energy
  max_energy_bonus_cap: 30   # the most max energy training can add
  yard_bps: 4000   # efficiency of bodyweight training on open ground (no building)
  ground_bps: 6000   # efficiency at a settlement training ground (ADR 0038 4.6: 60 percent)
  gym_bps: 10000   # efficiency at the neutral city gym
  ground_fee: 20   # session fee at a training ground, to the settlement treasury, minor units
  gym_fee: 60   # session fee at the neutral city gym, minor units

labor:
  shift_minutes: 60            # one construction shift in WORK minutes (the unit build times and points are counted in)
  shift_real_minutes: 1        # what a shift takes a player, REAL minutes (a sitting stays minutes)
  reference_crew: 4            # workers the content's build time assumes
  base_wage: 30                # NPC wage per shift in a balanced market
  min_wage_village: 10         # statutory floor per settlement tier
  min_wage_town: 15
  min_wage_city: 25
  participation_bps: 6000      # share of NPC residents who work
  base_housing: 8              # households a settlement has before any home
  npc_productivity_bps: 8500   # an NPC labourer works at 85 %
  fee_bps: 500                 # the village's levy on a citizen employer's wage
  budget_slack_bps: 5000       # an automatic job pays 50 % more shifts than the work needs
  # How many hours of work an NPC crew may do at one post per local day of the settlement
  # (owner, 2026-10-10: 8): a post's daily output is slots x this x the output of an hour, so a
  # shorter shift means more shifts. Tune it with the balance sheet.
  npc_hours_per_slot_day: 8
  # A player may start a workplace shift with the village out of food (ADR 0041 owner
  # decision 3): they work hungry at this share of the output, and their own hunger need
  # rises by this many points. An NPC refuses a shift with no food.
  hungry_output_bps: 5000
  hungry_shift_hunger: 5
  # Condition, decay and repair of a production workplace (ADR 0041 6.10; owner decision 2 of
  # 2026-10-01: money upkeep is replaced by decay and repair in kind). A workplace loses
  # decay_bps_per_day of its condition per whole local day (10000 is new). From worn_bps down
  # it works at worn_output_bps of its output; under closed_bps it is closed (needs repair).
  # The head posts a repair job under repair_below_bps: repair_shifts_full labourer shifts
  # restore a ruined workplace, the missing share of them a worn one, and the materials are
  # the building's cost_materials x the missing share x repair_material_share_bps.
  decay_bps_per_day: 50
  repair_below_bps: 7000
  worn_bps: 5000
  closed_bps: 2500
  worn_output_bps: 7500
  repair_shifts_full: 10
  repair_material_share_bps: 2000
  journeyman_shifts: 6         # skill ladder: apprentice, from this many shifts journeyman, then master
  master_shifts: 30
  apprentice_bps: 7000         # productivity of each rung
  journeyman_bps: 10000
  master_bps: 13000
  tight_balanced_bps: 5000     # the wage curve: at 0 % tightness the slack wage,
  tight_tight_bps: 10000       # then these points, ascending; beyond the last it holds
  tight_short_bps: 20000
  wage_slack_bps: 7000
  wage_balanced_bps: 10000
  wage_tight_bps: 15000
  wage_short_bps: 25000
  hire_presets: [1, 2, 4]      # NPC crew sizes the hire buttons offer
  wage_presets: [100, 125, 150, 200]  # the employer's wage buttons, % of the market wage

# What a player can carry (docs/adr/0046 section 4; internal/domain/carry).
# Space is in «جا»: every good takes room (items.yml bulk, 1 if omitted) and a
# purchase that does not fit is refused, "no room, no buy". Hands and pockets
# give carry_base; a bag adds its own. Weight is the soft rule: a player with no
# bag carries base_comfort_kg comfortably and base_hard_kg at most, a bag adds
# its own loads (items.yml bag block). A bag wears one point per game day it is
# carried at least full_share_bps full (of the player's whole space); at zero it
# is torn and gives torn_space_bps of its space until it is mended; a full
# repair costs repair_share_bps of its price. Nil never buys any of this.
bag:
  carry_base: 8
  base_comfort_kg: 7
  base_hard_kg: 20
  full_share_bps: 5000
  torn_space_bps: 5000
  repair_share_bps: 2500
  wear_per_day: 1

# The village shop (docs/adr/0046 section 5; internal/domain/vshop). The lines
# it sells are content (configs/content/village_shop.yml). The shop only sells:
# there is no buy-back at all (a buy-back is a money faucet), so there is no
# switch for it here.
#   restock_hour        the game hour of the morning delivery (6 = 06:00 game
#                       clock, once per game day, whichever replica gets there)
#   markup_min_bps/max  no price under the reference price and none over this
#                       share of it; the head's price cap moves inside it
#   stock_days          a shelf holds at most this many days of delivery
#   food_share_bps      the share of a resident's daily food need the shop covers
#   other_share_bps     the same for every other line
#   player_day_food     one player's daily cap on a food line, in multiples of
#                       one head's daily need of it
#   player_day_other    one player's daily cap on any other line, in units
#   supply_value_per_resident_day  the most goods value, in reference minor
#                       units, one resident draws from the shop a day
#   building_boost_bps  the delivery of a village that has built a shop
#                       building, over the founding stall's (10000 = the same)
#   cap_presets         the price caps the head's buttons offer
#   buy_presets         the quantities the buy buttons offer
#   tax_default_bps     the village's sales tax on a purchase until its head sets
#                       one, in basis points of the price; the tax goes to the
#                       treasury, which pays the shopkeeper
#   tax_max_bps         the most the head may set
#   tax_presets         the taxes the head's buttons offer
#   output_days         the game days the money panel reads a village's output
#                       over (the goods its workplaces made, at reference prices)
merchant:
  restock_hour: 6
  markup_min_bps: 10000
  markup_max_bps: 15000
  stock_days: 2
  food_share_bps: 4000
  other_share_bps: 3000
  player_day_food: 3
  player_day_other: 2
  supply_value_per_resident_day: 600
  building_boost_bps: 15000
  cap_presets: [10000, 11000, 12500, 15000]
  buy_presets: [1, 3, 5]
  tax_default_bps: 300
  tax_max_bps: 1500
  tax_presets: [100, 300, 500, 1000]
  output_days: 7

# Nil as a unit of account (docs/adr/0046 section 7.4). One Nil stands for this
# many neutral-currency units: a village currency is QUOTED in Nil as
# (x_ref / r0) / nil_unit_sup. It is a display constant. Nothing converts at it:
# Nil never becomes money (ADR 0029 10.4), the TON purchase of Nil stays off
# (finance.yml ton_exchange), and no ledger moves because of it.
#   nil_examples  the amounts of the neutral currency the money panel spells out in Nil
premium:
  nil_unit_sup: 100
  nil_examples: [100, 1000, 10000]

# A settlement's own money (docs/adr/0033 section 6; the owner's decisions of 2026-10-06). Every
# settlement is chartered automatically at founding from its reservation and, once, at deploy for
# the old ones (admin settlement charter-currencies); a head may charter by hand when the automatic
# one could not be paid. There is no fixed rate: the demand for the money sets it (the book, phase 3);
# charter_r0 is only the starting scale of the numbers, and until a trade the reference rate is 1.00.
currency:
  charter_r0: 10               # units of the currency per SUP at charter
  charter_fee: 1000            # SUP, a sink
  charter_min_deposit: 5000    # SUP, the first deposit into the reserve pot
  mint_fee_bps: 50             # issuance fee kept in the pot (0.5 %)
  # An existing settlement is never stripped: after the fee it deposits the smaller of the minimum
  # and this share of what is left; under the floor the charter is skipped and the head keeps the offer.
  auto_charter_share_bps: 5000
  auto_charter_floor: 500
  # The village desk (ADR 0033 6.8, 6.10): how far its price may move between the quote and the
  # confirm (price protection), and the SUP amounts its menu offers. Its fee is the head's lever,
  # 10 to 300 bps, stored on the money (default 30).
  desk_slippage_bps: 100
  desk_presets: [100, 500, 2000]
  # The floating VC/SUP book (ADR 0033 6.8, phase 3). Prices are micro-SUP per unit. A fee on selling
  # SUP goes to Support's treasury (fx_reserve_fee_bps), on selling the money to the village's (its
  # own lever, the desk's fee). An order priced further than fx_max_move_bps from the reference rate is
  # refused. The reference rate (x_ref) is the average of the last fx_window_periods periods, and does
  # not move until the window holds fx_min_trades fills.
  fx_reserve_fee_bps: 30
  fx_max_move_bps: 2000
  fx_min_trades: 8
  fx_window_periods: 7
  fx_min_order_sup: 10
  fx_book_limit: 200
  fx_max_open_orders: 20
  fx_convert_slippage_bps: 100
  fx_order_ttl: 168h
  fx_period: 24h
  fx_unit_presets: [1000, 5000, 20000]
  # The Reserve Bank's levers are held by its governor (policy.Get); these are only what applies while the
  # content has no such lever. The rest are the head's tools over the reserve (ADR 0033 6.7, 6.13, 7): the
  # intervention's limits and delay, the claim window of a wind-down, and the macro tick's constants.
  reserve_gold_haircut_bps: 1000
  reserve_withdraw_notice_hours: 72
  reserve_policy_rate_bps: 1200
  intervention_cap_bps: 800
  intervention_pot_floor_bps: 3000
  wind_down_days: 60
  macro_m_norm_bps: 2000
  macro_kappa_bps: 200
  macro_pi_max_bps: 300
  macro_w_tradable_bps: 6000
  intervention_delay: 24h
