# Routes between cities.
#
# The travel RULE lives in internal/domain/travel: how a distance and a chosen
# speed become a duration and a cost. This file holds only the DATA that rule
# operates on — which cities connect, and how far apart they are.
#
# See docs/adr/0004-content-system.md for that split.
#
# Fields
#   from, to        city codes. Both must exist in cities.yml or the load fails.
#   distance        abstract distance units, must be positive.
#   bidirectional   optional; may only be true (the default). Every route is
#                   travelled both ways at the same distance. One-way routes
#                   are not supported by the travel rules yet, so writing
#                   false is REJECTED rather than silently treated as two-way:
#                   a key the system would ignore is worse than no key.
#
# The loader rejects: an unknown city code, a distance of zero or less, a
# duplicate edge (including the same pair written in reverse), a route from a
# city to itself, and bidirectional: false. It also reports any city
# that no route reaches, because an unreachable city is almost always a typo
# rather than a design choice.

version: 1

routes:
  # The Ostmarch corridor: cheap, well connected, where new players start.
  - {from: ostmarch, to: fenwick_span, distance: 120}
  - {from: ostmarch, to: brennhaven, distance: 260}
  - {from: fenwick_span, to: aldrin_hollow, distance: 180}
  - {from: fenwick_span, to: brennhaven, distance: 210}

  # Inland industry.
  - {from: brennhaven, to: kessmoor, distance: 340}
  - {from: aldrin_hollow, to: kessmoor, distance: 290}

  # The coast. Calderis is expensive to reach, which is part of why it is
  # expensive to live in.
  - {from: kessmoor, to: calderis, distance: 520}
  - {from: aldrin_hollow, to: calderis, distance: 610}

  # Vantor Reach sits at the far end: one way in, high tax, high cost.
  - {from: calderis, to: vantor_reach, distance: 480}
