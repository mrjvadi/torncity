# Items: the goods of the game, on the production model of ADR 0005.
#
# docs/adr/0005-item-and-production-model.md is the governing decision: a
# production METHOD is code, everything inside a method is data. So this file
# first declares the model — component categories, starter components and
# archetypes — and then the goods players buy, carry, use, trade and steal,
# each a kind of one archetype. The rules of holding and using goods are
# internal/domain/inventory; of selling them, internal/domain/shop (shops.yml).
#
# No unit of any good ever appears from nothing: every one is recorded as a
# shop's sale by the NPC economy, a crime's loot, a reward or a production
# order, and after that only changes hands (the item journal).
#
# ---------------------------------------------------------------------------
# component_categories   the kinds of part a slot accepts.
# components             parts and materials: code, name, category, shelf,
#                        attributes, base_price (the reference price, minor
#                        units: a design's cost floor counts it), optional
#                        requires_technology (what a company must know to MAKE
#                        it or design around it — never to buy or use one;
#                        production.yml technologies), optional production:
#                        how a company makes it — {method: extract | grow |
#                        formulate | assemble, by: [company types], inputs:
#                        [{component, quantity}] one batch consumes, batch:
#                        units one batch yields, skill: the craft whose level
#                        raises the quality}. A component without production
#                        is only bought from an NPC supplier. A component's
#                        code is never an item's: a warehouse holds both.
# archetypes             ADR 0005 section 1: code, method (extract, assemble,
#                        formulate, grow, author, construct, serve), slots
#                        ({name, accepts, min, max, unit, optional}),
#                        attributes ({name, aggregate, from: [slots] or
#                        [all], input, divisor, observable}), value (derived |
#                        subjective), cost (itemized | discretionary),
#                        durability (consumable | durable), reverse_difficulty
#                        (0..100), reverse_skill (a skill code).
#
# items
#   code            stable identifier; stored holdings, orders and the
#                   journal name it. Never change one after it ships.
#   name            display name, the fallback for item.<code>.
#   category        how screens group goods: food, drink, medicine, gear,
#                   electronics, valuables.
#   shelf           the leaf of item_categories.yml the good sits on, written
#                   <group>.<leaf> (food.cooked). Required for every good and
#                   component: how a market groups, searches and filters.
#                   Different from `category`, which stays as it was.
#   tags            optional labels that cross shelves: crime_tool, crime_gear,
#                   black_market. A good on a restricted shelf (tools.locks,
#                   documents.forged) carries black_market or crime_tool.
#   archetype       the archetype above the good is a kind of.
#   form            stack — counted units, all alike (bread); unique —
#                   pieces with a serial, a quality and uses left (a phone).
#   base_price      the reference price, minor units: what a shop asks
#                   before demand, and what restitution pays for a stolen
#                   good that is gone.
#   tradeable       optional, default true: may be given, sold, auctioned.
#   stealable       optional, default true: a thief may take it from the
#                   one carrying it.
#   effects         what using one does: [{target: energy | health |
#                   happiness | nerve | hunger | sleep | stress, op: add |
#                   multiply | cap, value}]. The needs (life.yml) are
#                   0..100 and higher is worse: food adds a negative hunger.
#                   Using a stack unit consumes it; a durable piece loses a
#                   use. A good without effects is held, not used.
#   cooldown        GAME time a cooldown group rests after a use.
#   cooldown_group  goods sharing a group share the rest (all food).
#   durability      uses a unique piece is made with; omitted never wears.
#   quality         {min, max} a piece is made in, 0..100 (unique only).
#   gear            what it does while carried, to crimes of `categories`
#                   or `crimes` (crimes.yml): success_bps, catch_bps,
#                   witness_bps, solve_bps (a later investigation),
#                   reward_bps (the take), nerve (the cost), all signed and
#                   summed across tools, then held inside config crime.gear_*
#                   caps; wear — uses (piece) or units (stack) one attempt
#                   takes; confiscated — the police take it on an arrest.
#   black_market    no city shop may sell it: found through crime, and later
#                   the black market. Still tradeable between players.
#   requires_technology  optional: technologies (production.yml) a company
#                   must know to start a new design of this good at all,
#                   whatever parts it uses — a car needs vehicle
#                   engineering. It never gates a design a company holds,
#                   nor buying or using one. With the technologies of its
#                   parts it stages what a company is offered: a new company
#                   sees the basic goods it can design now and the ones one
#                   research away, never the whole catalogue
#                   (docs/adr/0021, section 14).
#   vehicle         a car or a motorbike its owner drives
#                   (docs/adr/0024-property-and-politics.md): {mode: the
#                   private transport mode (transport.yml) it drives without
#                   that mode's fare, fuel_per_distance: minor units burned
#                   per distance unit instead, repair_per_journey: what one
#                   journey of wear costs to repair}. A vehicle is a unique
#                   good; its durability is the journeys a new one holds,
#                   one worn by each journey.

version: 1

component_categories: [grain, water, leavening, flavouring, alkaloid, binder, fibre, steel, casing, circuit, battery, gem, metal,
                       fuel, seed, salt, mineral, ore, oil, crop, wood, wire, resin, board, tool, pottery]

components:
  # --- Bought from NPC suppliers only (production.yml suppliers) -----------
  - {code: diesel, shelf: materials.fuel,       name: Diesel fuel,   category: fuel,       base_price: 4,   attributes: {quality: 50}}
  - {code: seed_grain, shelf: materials.seed_crop,   name: Seed grain,    category: seed,       base_price: 2,   attributes: {quality: 50}}
  - {code: lithium_salt, shelf: materials.mineral, name: Lithium salt,  category: salt,       base_price: 12,  attributes: {quality: 55}}
  - {code: spring_water, shelf: drink.cold, name: Spring water,  category: water,      base_price: 1,   attributes: {quality: 60}}
  - {code: yeast, shelf: food.spice,        name: Yeast,         category: leavening,  base_price: 2,   attributes: {quality: 50}}
  - {code: coffee_bean, shelf: drink.hot,  name: Coffee beans,  category: flavouring, base_price: 3,   attributes: {quality: 55}}
  - {code: herb_extract, shelf: medicine.drugs, name: Herb extract,  category: alkaloid,   base_price: 1,   attributes: {quality: 50, potency: 10}}
  - {code: starch, shelf: food.spice,       name: Starch,        category: binder,     base_price: 1,   attributes: {quality: 40}}
  - {code: gemstone, shelf: valuables.gems_metal,     name: Gemstone,      category: gem,        base_price: 250, attributes: {quality: 70}}
  - {code: silver, shelf: valuables.gems_metal,       name: Silver,        category: metal,      base_price: 120, attributes: {quality: 60}}
  - {code: copper_wire, shelf: materials.metal,  name: Copper wire,   category: wire,       base_price: 2,   attributes: {quality: 55}}
  - {code: resin, shelf: materials.mineral,        name: Epoxy resin,   category: resin,      base_price: 2,   attributes: {quality: 50}}

  # --- Raw materials: extracted by mines, grown on farms --------------------
  - code: silica
    shelf: materials.mineral
    name: Silica sand
    category: mineral
    base_price: 5
    attributes: {quality: 55}
    production: {method: extract, by: [mine], inputs: [{component: diesel, quantity: 1}], batch: 10, skill: engineering}
  - code: iron_ore
    shelf: materials.metal
    name: Iron ore
    category: ore
    base_price: 6
    attributes: {quality: 50}
    production: {method: extract, by: [mine], inputs: [{component: diesel, quantity: 1}], batch: 10, skill: engineering}
  - code: crude_oil
    shelf: materials.fuel
    name: Crude oil
    category: oil
    base_price: 8
    attributes: {quality: 50}
    production: {method: extract, by: [mine], inputs: [{component: diesel, quantity: 1}], batch: 8, skill: engineering}
  - code: wheat
    shelf: materials.seed_crop
    name: Wheat
    category: crop
    base_price: 3
    attributes: {quality: 55}
    production: {method: grow, by: [farm], inputs: [{component: seed_grain, quantity: 1}], batch: 20, skill: logistics}
    # a village buys food from Support (ADR 0041 12: procurement is always there), so a new
    # city's hired crews can eat before it has a farm of its own
    village_buy: true
    village_sell: true
  - code: cotton
    shelf: materials.fibre
    name: Cotton
    category: fibre
    base_price: 20
    attributes: {quality: 50}
    production: {method: grow, by: [farm], inputs: [{component: seed_grain, quantity: 2}], batch: 5, skill: logistics}
  - code: timber
    shelf: materials.wood
    weight_g: 8000
    name: Timber
    category: wood
    base_price: 15
    attributes: {quality: 50}
    production: {method: grow, by: [farm], inputs: [{component: seed_grain, quantity: 3}], batch: 4, skill: logistics}
    village_buy: true
    village_sell: true

  # --- Village materials (docs/adr/0033, section 4.1) ---------------------------
  # What a village builds with and works in. `village_buy: true` lets the
  # village buy it from Support's market with SUP from its treasury (base_price
  # plus settlement.material_markup_bps), so a prerequisite is never a dead
  # end; the settlement_buildings.yml workplaces `produce` and `consume` them.
  # The reachability lint (internal/content/villagereach.go) refuses a material
  # a village could neither buy nor produce.
  - {code: stone, shelf: materials.mineral, weight_g: 10000, name: Stone,  category: mineral, base_price: 6,  attributes: {quality: 50}, village_buy: true, village_sell: true}
  - {code: wool, shelf: materials.fibre, weight_g: 500,  name: Wool,   category: fibre,   base_price: 12, attributes: {quality: 50}, village_buy: true, village_sell: true}
  - {code: plank, shelf: materials.wood, weight_g: 6000, name: Planks, category: wood,    base_price: 30, attributes: {quality: 50}, village_sell: true}
  - {code: brick, shelf: materials.mineral, weight_g: 3000, name: Bricks, category: mineral, base_price: 14, attributes: {quality: 50}, village_sell: true}
  - {code: cloth, shelf: materials.fibre, weight_g: 400, name: Cloth,  category: fibre,   base_price: 40, attributes: {quality: 50}, village_sell: true}

  # --- Village goods of the first workplaces (docs/adr/0050, plan A2) -------------------------------
  # Each has a producer a settlement can place and staff (settlement_buildings.yml) and a user in the
  # village machinery: firewood fuels hearths and the research buildings, paper is the research upkeep,
  # tools wear out on workplaces, clay and firewood fire pots, rags are the weaving shed's offcuts that
  # the paper mill pulps, hides come off the pasture. `stand_in` is the older material that served
  # until these existed; it still works for settlement.real_items_grace_days after the rule date.
  - {code: firewood, shelf: materials.fuel, weight_g: 4000, name: Firewood, category: fuel, base_price: 4, attributes: {quality: 50}, village_sell: true, stand_in: timber}
  - {code: clay, shelf: materials.mineral, weight_g: 6000, name: Clay, category: mineral, base_price: 3, attributes: {quality: 50}, village_buy: true}
  - {code: hide, shelf: materials.fibre, weight_g: 7000, name: Hide, category: fibre, base_price: 14, attributes: {quality: 50}, village_sell: true}
  - {code: rag, shelf: materials.fibre, weight_g: 300, name: Rags, category: fibre, base_price: 2, attributes: {quality: 40}}
  - {code: paper, shelf: materials.fibre, weight_g: 200, name: Paper, category: fibre, base_price: 18, attributes: {quality: 50}, village_buy: true, village_sell: true, stand_in: wool}
  - {code: tools, shelf: tools.work, weight_g: 1500, name: Tools, category: tool, base_price: 30, attributes: {quality: 50}, village_buy: true}
  - {code: flour_sack, shelf: food.grain, weight_g: 5000, name: Flour sack, category: grain, base_price: 4, attributes: {quality: 50}}
  - {code: charcoal, shelf: materials.fuel, weight_g: 2000, name: Charcoal, category: fuel, base_price: 12, attributes: {quality: 55}, village_sell: true}
  - {code: bloom, shelf: materials.metal, weight_g: 9000, name: Iron bloom, category: metal, base_price: 90, attributes: {quality: 45}}
  - {code: pots, shelf: household.kitchen, weight_g: 2000, name: Pots, category: pottery, base_price: 22, attributes: {quality: 50}, village_sell: true}

  # --- Made from other components by factories and kitchens ----------------
  # A design counts flour in grams: one wheat mills into a hundred.
  - code: flour
    shelf: food.grain
    name: Flour
    category: grain
    base_price: 1
    attributes: {quality: 50}
    production: {method: formulate, by: [factory, restaurant], inputs: [{component: wheat, quantity: 1}], batch: 100, skill: cooking}
  - code: tool_steel
    shelf: materials.metal
    name: Tool steel
    category: steel
    base_price: 60
    attributes: {quality: 60}
    production: {method: formulate, by: [factory], inputs: [{component: iron_ore, quantity: 3}, {component: diesel, quantity: 1}], batch: 1, skill: engineering}
  - code: plastic_case
    shelf: electronics.parts
    name: Plastic case
    category: casing
    base_price: 40
    attributes: {quality: 40}
    production: {method: formulate, by: [factory], inputs: [{component: crude_oil, quantity: 2}], batch: 2, skill: engineering}
  # The first thing a tech studio makes: a plain circuit board, from wire
  # and resin the electronics wholesaler sells. No technology: it is where
  # electronics starts.
  - code: circuit_board
    shelf: electronics.parts
    name: Circuit board
    category: board
    base_price: 20
    attributes: {quality: 50}
    production: {method: assemble, by: [tech_studio, factory], inputs: [{component: copper_wire, quantity: 2}, {component: resin, quantity: 1}], batch: 2, skill: engineering}
  # The phone scenario's gate: nobody makes a chipset or a battery cell, or
  # designs a phone around one, without the technology — or a license.
  - code: chipset
    shelf: electronics.parts
    name: Chipset
    category: circuit
    base_price: 400
    attributes: {quality: 60}
    requires_technology: [microchips]
    production: {method: assemble, by: [factory, tech_studio], inputs: [{component: silica, quantity: 3}, {component: diesel, quantity: 1}], batch: 1, skill: engineering}
  - code: cell
    shelf: electronics.parts
    name: Battery cell
    category: battery
    base_price: 150
    attributes: {quality: 50, capacity: 3000}
    requires_technology: [batteries]
    production: {method: formulate, by: [factory, tech_studio], inputs: [{component: lithium_salt, quantity: 2}, {component: iron_ore, quantity: 1}], batch: 1, skill: engineering}

archetypes:
  - code: food
    method: formulate
    slots:
      - {name: base, accepts: grain, min: 50, max: 500, unit: g}
      - {name: leaven, accepts: leavening, min: 1, max: 20, unit: g, optional: true}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: consumable
    reverse_difficulty: 10
    reverse_skill: cooking
  - code: drink
    method: formulate
    slots:
      - {name: water, accepts: water, min: 100, max: 1000, unit: ml}
      - {name: flavour, accepts: flavouring, min: 1, max: 50, unit: g, optional: true}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: consumable
    reverse_difficulty: 10
    reverse_skill: cooking
  - code: medicine
    method: formulate
    slots:
      - {name: active, accepts: alkaloid, min: 10, max: 500, unit: mg}
      - {name: carrier, accepts: binder, min: 10, max: 200, unit: mg}
    attributes:
      - {name: potency, aggregate: scaled, from: [active], divisor: 100, observable: true}
      - {name: quality, aggregate: weighted, from: [all]}
    value: derived
    cost: itemized
    durability: consumable
    reverse_difficulty: 70
    reverse_skill: medicine
  - code: tool
    method: assemble
    slots:
      - {name: body, accepts: steel, min: 1, max: 1}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 25
    reverse_skill: mechanics
  - code: apparel
    method: assemble
    slots:
      - {name: fabric, accepts: fibre, min: 1, max: 1}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 15
    reverse_skill: mechanics
  # Basic electronics: a circuit board in an optional case. What a new tech
  # studio designs first, long before a phone.
  - code: gadget
    method: assemble
    slots:
      - {name: board, accepts: board, min: 1, max: 1}
      - {name: shell, accepts: casing, min: 1, max: 1, optional: true}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 20
    reverse_skill: engineering
  - code: device
    method: assemble
    slots:
      - {name: board, accepts: circuit, min: 1, max: 1}
      - {name: power, accepts: battery, min: 1, max: 1}
      - {name: shell, accepts: casing, min: 1, max: 1}
    attributes:
      - {name: battery_life, aggregate: sum, from: [power], input: capacity, observable: true}
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 50
    reverse_skill: engineering
  # A car or a motorbike: a frame of steel and a body shell. Factories build
  # them (companies.yml produces); dealers sell them.
  - code: vehicle
    method: assemble
    slots:
      - {name: frame, accepts: steel, min: 1, max: 1}
      - {name: body, accepts: casing, min: 1, max: 1}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 45
    reverse_skill: mechanics
  - code: jewel
    method: assemble
    slots:
      - {name: stone, accepts: gem, min: 1, max: 1}
      - {name: setting, accepts: metal, min: 1, max: 1}
    attributes:
      - {name: quality, aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 40
    reverse_skill: mechanics

items:
  # --- Food and drink: energy and hunger, one group resting between meals ---
  # (life.yml: hunger is 0..100 and higher is worse, so food takes it away.)
  - {code: bread, shelf: food.cooked, weight_g: 300,        name: Bread,        category: food,  archetype: food,  form: stack, base_price: 40,
     effects: [{target: energy, op: add, value: 10}, {target: hunger, op: add, value: -25}], cooldown: 30s, cooldown_group: food}
  - {code: sandwich, shelf: food.cooked, weight_g: 250,     name: Sandwich,     category: food,  archetype: food,  form: stack, base_price: 90,
     effects: [{target: energy, op: add, value: 20}, {target: hunger, op: add, value: -40}], cooldown: 30s, cooldown_group: food}
  - {code: hot_meal, shelf: food.cooked, weight_g: 500,     name: Hot meal,     category: food,  archetype: food,  form: stack, base_price: 180,
     effects: [{target: energy, op: add, value: 35}, {target: happiness, op: add, value: 5}, {target: hunger, op: add, value: -70},
               {target: stress, op: add, value: -5}], cooldown: 1m, cooldown_group: food}
  - {code: water_bottle, shelf: drink.cold, weight_g: 500, name: Bottle of water, category: drink, archetype: drink, form: stack, base_price: 20,
     effects: [{target: energy, op: add, value: 5}, {target: hunger, op: add, value: -5}], cooldown: 20s, cooldown_group: drink}
  - {code: coffee, shelf: drink.hot, weight_g: 350,       name: Coffee,       category: drink, archetype: drink, form: stack, base_price: 60,
     effects: [{target: energy, op: add, value: 8}, {target: nerve, op: add, value: 1}, {target: sleep, op: add, value: -10}],
     cooldown: 45s, cooldown_group: drink}
  - {code: energy_drink, shelf: drink.energy, weight_g: 330, name: Energy drink, category: drink, archetype: drink, form: stack, base_price: 150,
     effects: [{target: energy, op: add, value: 25}, {target: sleep, op: add, value: -15}, {target: stress, op: add, value: 3}],
     cooldown: 2m, cooldown_group: energy_drink}

  # --- Medicine: health ---------------------------------------------------
  - {code: bandage, shelf: medicine.first_aid, weight_g: 50,       name: Bandage,       category: medicine, archetype: medicine, form: stack, base_price: 80,
     effects: [{target: health, op: add, value: 10}], cooldown: 15s, cooldown_group: medical}
  - {code: painkillers, shelf: medicine.drugs, weight_g: 40,   name: Painkillers,   category: medicine, archetype: medicine, form: stack, base_price: 150,
     effects: [{target: health, op: add, value: 20}], cooldown: 30s, cooldown_group: medical}
  - {code: first_aid_kit, shelf: medicine.first_aid, weight_g: 600, name: First aid kit, category: medicine, archetype: medicine, form: stack, base_price: 400,
     effects: [{target: health, op: add, value: 50}], cooldown: 1m, cooldown_group: medical}

  # --- Tools of the trade: gear while carried ------------------------------
  # A lockpick set is what a burglary needs at all (crimes.yml
  # required_tools), and what makes it likelier. It wears with every job.
  - code: lockpick_set
    weight_g: 300
    shelf: tools.locks
    tags: [crime_tool]
    name: Lockpick set
    category: gear
    archetype: tool
    form: unique
    base_price: 1200
    durability: 25
    quality: {min: 40, max: 70}
    gear: {categories: [burglary], success_bps: 1200, wear: 1, confiscated: true}
  # Forces a car door or a window: quicker, but loud.
  - code: crowbar
    weight_g: 1500
    bulk: 2
    shelf: tools.hand
    tags: [crime_tool]
    name: Crowbar
    category: gear
    archetype: tool
    form: unique
    base_price: 600
    durability: 40
    quality: {min: 40, max: 80}
    gear: {crimes: [car_break_in, home_burglary], success_bps: 800, catch_bps: 300, wear: 1, confiscated: true}
  # A pair per job; fewer prints for the police to find.
  - code: gloves
    weight_g: 150
    shelf: clothing.hands
    tags: [crime_gear]
    name: Pair of gloves
    category: gear
    archetype: apparel
    form: stack
    base_price: 50
    gear: {categories: [burglary, petty_theft], solve_bps: -1500, wear: 1, confiscated: true}
  - code: ski_mask
    weight_g: 100
    shelf: clothing.head
    tags: [crime_gear]
    name: Ski mask
    category: gear
    archetype: apparel
    form: unique
    base_price: 300
    durability: 30
    quality: {min: 30, max: 60}
    gear: {categories: [street_crime, burglary], witness_bps: -1500, catch_bps: -500, wear: 1, confiscated: true}
  # Not evidence of anything: the police leave a runner's shoes alone.
  - code: running_shoes
    weight_g: 800
    shelf: clothing.foot
    tags: [crime_gear]
    name: Running shoes
    category: gear
    archetype: apparel
    form: unique
    base_price: 900
    durability: 60
    quality: {min: 40, max: 80}
    gear: {categories: [petty_theft, street_crime], catch_bps: -1000, wear: 1}
  - code: fake_documents
    weight_g: 50
    shelf: documents.forged
    tags: [black_market]
    name: Forged documents
    category: gear
    archetype: tool
    form: unique
    base_price: 2500
    durability: 5
    quality: {min: 30, max: 70}
    black_market: true
    gear: {categories: [fraud, smuggling], success_bps: 1500, solve_bps: -1000, wear: 1, confiscated: true}
  - code: card_skimmer
    weight_g: 200
    shelf: tools.locks
    tags: [crime_tool, black_market]
    name: Card skimmer
    category: gear
    archetype: device
    form: unique
    base_price: 3000
    durability: 20
    quality: {min: 30, max: 70}
    black_market: true
    gear: {crimes: [street_scam], success_bps: 1000, reward_bps: 1500, wear: 1, confiscated: true}

  # --- Things worth stealing ---------------------------------------------
  - {code: phone, shelf: electronics.phones, weight_g: 200,      name: Phone,       category: electronics, archetype: device, form: unique, base_price: 2500, quality: {min: 40, max: 80}}
  - {code: watch, shelf: valuables.watches, weight_g: 100,      name: Wristwatch,  category: valuables,   archetype: jewel,  form: unique, base_price: 800,  quality: {min: 30, max: 80}}
  - {code: car_stereo, shelf: electronics.parts, weight_g: 1500, bulk: 2, name: Car stereo,  category: electronics, archetype: device, form: unique, base_price: 700,  quality: {min: 20, max: 60}}
