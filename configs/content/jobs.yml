# Careers: what a player can work as, rung by rung.
#
# docs/adr/0004-content-system.md draws the line this file sits on. Everything
# here is CONTENT: which careers exist, what each rung asks for, what a shift
# of it costs and earns, and what earns the step up. The RULES — how a shift
# pays, how fatigue cuts output, how performance moves, when a promotion is
# earned — live in internal/domain/job and are not described here.
#
# What is NOT here: the minimum wage, income tax and the fatigue limits. They
# are policy, set by a city's office holders within the operator's bounds
# (configs/content/governance.yml, docs/adr/0015-player-held-offices.md).
#
# Editing this file changes nothing until `admin content load` validates and
# loads it as a new content version.
#
# Fields
#   code        stable identifier; never change it after it ships — a
#               player's job names it.
#   name        display name, the fallback when the message catalogue has no
#               career.<code>.name entry.
#   category    open vocabulary, for grouping.
#   cities      city codes whose base employer hires into this career.
#               Omitted means every city.
#   tiers       from the most junior up. Each:
#     rank                     entry | skilled | senior | specialist |
#                              manager | executive | owner. Must rise.
#     title                    display title, the fallback when the catalogue
#                              has no career.<code>.<rank> entry.
#     min_level                character level needed to hold it.
#     required_skills          [{skill, level}], checked in this order.
#     required_certifications  course codes (education.yml) whose certificate
#                              must be held. The course must certify.
#     base_salary              pay per full-output shift, minor units.
#     energy_cost              energy one shift costs, paid when it starts.
#     shift_duration           how long one shift lasts, in GAME time (e.g.
#                              8h). The player waits it through the game
#                              clock (config.yml game.time_scale): at 60 an
#                              8h shift is an 8-minute wait. They are at work
#                              until it ends and are paid then. Required.
#     xp_per_shift             character XP for a full-output shift.
#     skill_xp_per_shift       [{skill, xp}] for a full-output shift.
#     promotion                what earns the step to the next tier:
#                              min_performance (0..100), min_time_in_tier (a
#                              GAME-time duration, e.g. 48h, waited through the
#                              game clock), min_shifts. Ignored on the last
#                              tier.
#
# A player may hold a job only in the city they live in (a work permit for
# other cities arrives with residency changes, ADR 0014).

