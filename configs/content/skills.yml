# Skills.
#
# The CATALOGUE of skills is content (2026-10-03, activities follow-up): a skill
# is added here, with its `requires` as a `kind: skill` row in availability.yml,
# and a job, course, crime, recipe, item or workplace (`trains`) uses it. The
# content lint proves every skill any file names is listed here, and that the
# codes the engine itself names in code (internal/domain/player.SkillCodes,
# for example programming and driving) are all present. A skill nobody uses is
# a dead end: add one only together with what trains it and what uses it.
#
# See docs/adr/0004-content-system.md.
#
# Fields
#   code       one of the fixed skill codes; never change it after it ships.
#   name       display name.
#   category   presentation group; open vocabulary.

version: 1

skills:
  - {code: programming, name: Programming, category: technology}
  - {code: engineering, name: Engineering, category: technology}
  - {code: mechanics,   name: Mechanics,   category: trades}
  - {code: cooking,     name: Cooking,     category: trades}
  - {code: logistics,   name: Logistics,   category: trades}
  # The village crafts and farming (ADR 0041 5.1): trained by the journeyman
  # courses (education.yml) and by working a shift in the matching workplace
  # (`trains` in settlement_buildings.yml); used by the recipes and staff roles.
  - {code: carpentry,   name: Carpentry,   category: crafts}
  - {code: masonry,     name: Masonry,     category: crafts}
  - {code: smithing,    name: Smithing,    category: crafts}
  - {code: farming,     name: Farming,     category: land}
  # Trained by the training activity (training.start), read by the crimes that
  # need force (crimes.yml skill_weights).
  - {code: strength,    name: Strength,    category: physical}
  - {code: herbalism,   name: Herbal Medicine, category: professional}
  - {code: driving,     name: Driving,     category: trades}
  - {code: medicine,    name: Medicine,    category: professional}
  - {code: management,  name: Management,  category: professional}
  # ADR 0048: the scholar's trade, trained by finishing a research project at a research building.
  - {code: scholarship, name: Scholarship, category: professional}
  - {code: finance,     name: Finance,     category: professional}
  # The criminal skills (crimes.yml). Streetwise is also how alert a player
  # is to a thief.
  - {code: stealth,     name: Stealth,     category: criminal}
  - {code: lockpicking, name: Lockpicking, category: criminal}
  - {code: deception,   name: Deception,   category: criminal}
  - {code: streetwise,  name: Streetwise,  category: criminal}
