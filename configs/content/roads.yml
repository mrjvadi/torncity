version: 1
# World roads (roadmap step 0.5; ADR 0042 6.1 to 6.3, phase T0): the classes and
# the planner numbers `roads.Plan` reads. All numbers are the ADR's draft values.
# Work-hours are the real 2,600 to 2,800 person-days per km of a gravel road
# (ADR 0042 R34) compressed by road.work_scale to the game clock.
#
# Not here, needs research: the classes `paved` and `highway` (ADR 0042 6.1:
# stage city and country) because ADR 0044 5.5 replaces the stage with a research
# ladder (dirt, gravel, macadam, Telford, stone, asphalt) and names the research
# only for gravel (`roadcraft`), Telford (`road_engineering`) and macadam
# (`macadam`); the research that opens asphalt and the highway class is not
# written, and the grade and span of the middle rungs are not either. road.work_scale
# and road.quote_ttl (10 minutes) are config, not content.
road_classes:
  - {code: path,  name: "راه مالرو", source: "ADR 0042 6.1", evidence: adr, requires: {}, max_grade_bps: 2500, speed_kmh: 4, work_hours_per_km: 40, bridge_max_span_m: 10, fords: true, note: "a ford on a stream; a timber footbridge up to 10 m"}
  - {code: track, name: "جادهٔ خاکی", source: "ADR 0042 6.1, ADR 0044 5.5", evidence: adr, requires: {knowledge: [masonry]}, planned_knowledge: [roadcraft], max_grade_bps: 1200, speed_kmh: 6, work_hours_per_km: 160, materials_per_km: {stone: 20}, bridge_max_span_m: 60, needs_research: [bridge_research_split], note: "timber bridge to 30 m needs carpentry_ii, stone bridge to 60 m masonry_ii; the class carries 60 m, the research split is applied by the quote"}

road_planner:
  source: "ADR 0042 6.2, 6.3"
  evidence: adr
  requires: {}
  search_margin_m: 5000
  max_expansions: 200000
  bridge_cost_ratio: 25
  stream_crossing_steps: 3
  stream_width_m: 10
  river_width_m: 40
  great_river_width_m: 200
  high_mountain_m: 2500
  high_mountain_bps: 18000
  terrain_bps:
    # the clearing multiplier of a tile's biome (10000 = grassland)
    temperate_grassland: 10000
    tropical_savanna: 10000
    desert: 12000
    tundra: 14000
    boreal_forest: 16000
    temperate_forest: 16000
    temperate_rainforest: 22000
    tropical_rainforest: 22000
  needs_research: [terrain_bps_wetland, terrain_bps_polar_ice]
  note: "ADR 0042 6.2 lists grassland, desert, tundra, temperate forest, rainforest, wetland and high mountain; boreal forest is read as forest and the savanna as grassland. Wetland and polar ice have no biome entry in world.yml and no value in the ADR."
