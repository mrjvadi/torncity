# The production economy: how long each production method takes, the
# technology tree companies research, and the NPC suppliers that sell the
# basic inputs every production chain starts from.
#
# The RULES — how a design's recipe is derived from its parts, what an order
# consumes (all of it or none), how long it takes for its crew, the quality
# it comes out at, what reverse engineering yields, who may research what and
# what an owner may do with a technology — are internal/domain/item,
# production and technology (docs/adr/0005-item-and-production-model.md,
# docs/adr/0021-production-economy.md). What is here is parameter. How each
# component is made is on the component (items.yml); which kinds of company
# design and make which goods is on the company type (companies.yml,
# produces).
#
# Loaded and versioned with the rest of the content (`admin content load`).
#
# ---------------------------------------------------------------------------
# production_methods — how long a method takes, GAME time (config.yml
# game.time_scale: at 60, an hour is a minute).
#   method              extract, grow, formulate or assemble.
#   setup               paid once per order, however large.
#   work_per_unit       one unit's (or one batch's) labour for one worker.
#                       Every worker of the company adds a worker's pace: the
#                       crew is the owner and the company's employees.
#   min_cycle           optional: the shortest an order runs whatever the
#                       crew — a field takes a season.
#   machine_output_bps  optional: one machine's work in basis points of a
#                       worker (no machines are sold yet).
#
# technologies — the tree.
#   code            stable identifier; stored on every owner and license.
#   name            display name, the fallback for technology.<code>.
#   requires        technologies the company must have unlocked first —
#                   owned, or published by anyone.
#   cost            what research costs the company, minor units; it leaves
#                   the economy.
#   time            how long research takes, GAME time.
#   company_types   the kinds of company that may research it.
#   skill, level    what the company's best member (owner, manager or an
#                   employee) must know.
#
# suppliers — the NPC economy's wholesale trade with companies.
#   code, name      identifier and display name (supplier.<code>).
#   place           where in a city it trades; a city without the place has
#                   none. Deliveries go to the company's warehouse.
#   cities          optional: only these cities.
#   shelves         {component, price (per unit, minor units, leaves the
#                   economy), stock (the most it holds in a city), restock
#                   (units back every `every` of GAME time)}. The stock is
#                   the bound on the goods this faucet lets into the world.

version: 1

production_methods:
  - {method: extract,   setup: 15m, work_per_unit: 1h,  min_cycle: 2h}
  - {method: grow,      setup: 30m, work_per_unit: 30m, min_cycle: 12h}
  - {method: formulate, setup: 15m, work_per_unit: 20m}
  - {method: assemble,  setup: 30m, work_per_unit: 45m}

technologies:
  - code: semiconductors
    name: Semiconductors
    cost: 30000
    time: 8h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 1
    family: semiconductors
    generation: 1
  # Generations of the same gate (chipset also requires semiconductors,
  # below): a process shrink never opens a new part, it makes every chipset
  # already being made better — same mechanism as radar_systems.
  - code: semiconductors_ii
    name: Semiconductors II (28nm)
    requires: [semiconductors]
    cost: 70000
    time: 16h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 3
    family: semiconductors
    generation: 2
    effects: [{target: quality, op: multiply, value: 11200}]
  - code: semiconductors_iii
    name: Semiconductors III (14nm FinFET)
    requires: [semiconductors_ii]
    cost: 140000
    time: 28h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 5
    family: semiconductors
    generation: 3
    effects: [{target: quality, op: multiply, value: 10700}]
  - code: microchips
    name: Microchips
    requires: [semiconductors]
    cost: 60000
    time: 12h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 2
    family: microchips
    generation: 1
  - code: microchips_ii
    name: Microchips II (multi-core architecture)
    requires: [microchips]
    cost: 100000
    time: 20h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 4
    family: microchips
    generation: 2
    effects: [{target: quality, op: multiply, value: 11400}]
  - code: microchips_iii
    name: Microchips III (on-chip AI accelerator)
    requires: [microchips_ii]
    cost: 180000
    time: 32h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 6
    family: microchips
    generation: 3
    effects: [{target: quality, op: multiply, value: 10800}]
  - code: batteries
    name: Battery chemistry
    cost: 25000
    time: 6h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 1
    family: batteries
    generation: 1
  - code: batteries_ii
    name: Battery chemistry II (lithium-polymer)
    requires: [batteries]
    cost: 55000
    time: 14h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 3
    family: batteries
    generation: 2
    effects: [{target: capacity, op: multiply, value: 11500}]
  - code: batteries_iii
    name: Battery chemistry III (solid-state)
    requires: [batteries_ii]
    cost: 110000
    time: 24h
    company_types: [factory, tech_studio]
    skill: engineering
    level: 5
    family: batteries
    generation: 3
    effects: [{target: capacity, op: multiply, value: 11000}]
  # A factory's first step up from tools and clothes: cars and motorbikes
  # (items.yml requires_technology). This is the one family in this file that
  # gates a GOOD, not a component (items.yml requires_technology is on the
  # car/motorbike item, not on steel or casing): its generations still exist
  # for a company to research and show in the tree, but today have no
  # component attribute to lift — the vehicle archetype (items.yml) computes
  # only quality from generic steel and casing. A later content pass that
  # gives vehicles a real engine slot is what would let vehicle_engineering
  # II/III move a "speed" attribute the way jet_propulsion moves an
  # aircraft's.
  - code: vehicle_engineering
    name: Vehicle engineering
    cost: 40000
    time: 8h
    company_types: [factory]
    skill: engineering
    level: 1
    family: vehicle_engineering
    generation: 1
  - code: vehicle_engineering_ii
    name: Vehicle engineering II (unibody chassis)
    requires: [vehicle_engineering]
    cost: 80000
    time: 16h
    company_types: [factory]
    skill: engineering
    level: 3
    family: vehicle_engineering
    generation: 2
  - code: vehicle_engineering_iii
    name: Vehicle engineering III (lightweight composite chassis)
    requires: [vehicle_engineering_ii]
    cost: 150000
    time: 26h
    company_types: [factory]
    skill: engineering
    level: 5
    family: vehicle_engineering
    generation: 3

suppliers:
  - code: industrial_supplier
    name: Industrial supplier
    place: industrial_zone
    shelves:
      - {component: diesel,       price: 5,   stock: 2000, restock: 400, every: 1h}
      - {component: lithium_salt, price: 15,  stock: 400,  restock: 80,  every: 1h}
      - {component: gemstone,     price: 300, stock: 20,   restock: 2,   every: 6h}
      - {component: silver,       price: 150, stock: 40,   restock: 4,   every: 6h}
  - code: farm_supply
    name: Farm supply store
    place: farmland
    shelves:
      - {component: seed_grain, price: 3, stock: 2000, restock: 400, every: 1h}
  # A tech studio's supplier: the wire and resin its first circuit boards
  # are made of.
  - code: electronics_wholesaler
    name: Electronics wholesaler
    place: business_district
    shelves:
      - {component: copper_wire, price: 3, stock: 2000, restock: 400, every: 1h}
      - {component: resin,       price: 3, stock: 2000, restock: 400, every: 1h}
  - code: wholesale_market
    name: Wholesale market
    place: bazaar
    shelves:
      - {component: spring_water, price: 1, stock: 20000, restock: 4000, every: 1h}
      - {component: yeast,        price: 2, stock: 2000,  restock: 400,  every: 1h}
      - {component: coffee_bean,  price: 4, stock: 2000,  restock: 400,  every: 1h}
      - {component: herb_extract, price: 2, stock: 5000,  restock: 1000, every: 1h}
      - {component: starch,       price: 1, stock: 5000,  restock: 1000, every: 1h}
