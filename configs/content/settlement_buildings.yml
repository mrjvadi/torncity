  # ---------------------------------------------------------------------
  # forestry — the village's own timber. It needs no knowledge and no
  # material to build, so the first material a village needs is never a
  # dead end (ADR 0033 section 4.1; the reachability lint keeps it so).
  # A workplace: a resident works a shift here (settlement.work), the shift
  # puts `produces` into the village stock and the treasury pays the `wage`.
  # No worker, no timber: nothing is produced by being idle.
  # ---------------------------------------------------------------------
  - code: woodcutter_camp
    name: "کارگاه هیزم‌شکنی"
    role: forestry
    tier: 1
    footprint: [2, 2]
    cost_money: 300
    build_time: 30m
    upkeep: 20
    produces: {timber: 4}
    workers: 3
    shift: 1h
    wage: 40

