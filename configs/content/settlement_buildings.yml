version: 1
# The village construction catalogue (docs/adr/0028-world-and-settlements.md
# section 7, extended by docs/adr/0031-knowledge-and-village-progression.md
# section 3.2 with role/tier). Rules: internal/domain/settlementbuilding.
# Loaded and validated by internal/content/settlementbuilding.go; stored as
# content_documents rows, kind "settlement_building".
#
# TIER DECIDES WHAT A SETTLEMENT LISTS (ADR 0033 sections 3 and 5). Every entry
# declares a role and a tier; a village lists and may build tier 1, a town tier
# 2 and up, a city tier 3 and up, and a building of a bigger settlement is never
# listed, refused with a neutral "not available" if asked for by code, and
# refused at content load if it has no tier. Tier 1 = village (a bank, port or
# airport is a city's: tier 3; barracks and police posts a town's: tier 2).
#
# ROLE AND TIER (ADR 0031 section 3.2). Several codes may share one
# role/tier pair — the branching mechanism for institutions, mirroring
# settlement_knowledge.yml's capabilities: watch_hut, militia_camp,
# retainer_hall and constable_post are four peers of role: security,
# tier: 1. A tier-2 promotion (police_post) needs ANY tier-1 building of
# its role already standing (requires_building_role), never one specific
# code. road and civic_hall keep NO role: the universal founding kit,
# present in every settlement regardless of branch (ADR 0028 section 3.1).
#
# WORKPLACES (ADR 0033 section 4.1). A building with `produces` is a place a
# resident works in: `workers` shifts may run at once, each lasts `shift`
# (game time), takes `consumes` out of the village stock when it starts, puts
# `produces` into it when it ends and is paid `wage` from the treasury. Every
# material a building costs or consumes must be reachable from the founding
# state - bought from Support (items.yml village_buy) or produced by a
# workplace that is itself reachable - or the content load fails.
#
# V1 SCOPE NOTES (deliberate simplifications, offered for the owner to
# widen later, ADR 0031 section 9 open question 4's own precedent):
#   * craft role tier 2 ("the same code, _ii") is a KNOWLEDGE generation
#     upgrade to the SAME standing workshop, not a second building row —
#     ADR 0031 section 3.2's own words. Only tier 1 (the five workshops),
#     tier 3 (manufactory) and tier 4 (factory, unchanged from ADR 0028)
#     are placeable rows here.
#   * water_infra/food tier 2 ("capacity-upgraded _ii form") is the same
#     knowledge-generation-upgrades-the-standing-building shape; only
#     tier 1 is placeable in v1.
#   * market tier 2 gates on requires_knowledge_capability:
#     [formal_market_access] — any of periodic_market, endowed_market_hall
#     or trading_post, never the founding-only barter_ring, which provides
#     the (deliberately weaker) market_access tag instead. See that field's
#     own doc comment (internal/domain/settlementbuilding) and
#     settlement_knowledge.yml's note by the three items' provides: lines.
#   * CostMaterials names village materials (items.yml: timber, stone, ...),
#     checked by internal/content/settlementbuilding.go. ADR 0028 section 7's
#     illustrative "steel N" entries are dropped: no "steel" component is
#     shipped yet, and inventing one is production economy (ADR 0021) scope.
# BUILD CATEGORIES (ADR 0046 phase M0). The groups the build menu is drawn in. A
# building lands in the group holding its role, or in its own `build_category`
# when the role does not say; an unmapped role falls into "other". The web used
# to keep this table itself (buildCategories.ts); the content owns it now and the
# build menu lines carry the code. Locale: build_category.<code>.
build_categories:
  - {code: housing, roles: [housing]}
  - {code: shops, roles: [market, finance]}
  - {code: construction, roles: [infrastructure, forestry, extraction, storage]}
  - {code: production, roles: [craft]}
  - {code: farming, roles: [food, water_infra]}
  - {code: public, roles: [governance, health, education, research, recreation, training, transport]}
  - {code: security, roles: [security, military]}
  - {code: other, roles: []}

settlement_buildings:
  # ---------------------------------------------------------------------
  # No role: the universal founding kit and the existing city-tier systems
  # ADR 0028 section 7 already fully specifies, unchanged.
  # ---------------------------------------------------------------------
  - code: road
    name: "جاده"
    role: infrastructure
    tier: 1
    footprint: [1, 1]
    cost_money: 50
    build_time: 10m
    upkeep: 2
    # Roads are laid many at a time (settlement.build.place_many) and never
    # queue behind, or hold up, the concurrent-construction cap.
    cap_exempt: true

  - code: civic_hall
    name: "شهرداری"
    role: governance
    tier: 1
    footprint: [2, 2]
    cost_money: 1000
    cost_materials: {timber: 5}
    build_time: 2h
    upkeep: 20

  - code: housing_block
    name: آپارتمان
    role: housing
    tier: 1
    footprint: [2, 2]
    cost_money: 3000
    cost_materials: {timber: 10}
    build_time: 3h
    upkeep: 30
    effects: [{target: housing_capacity, op: add, value: 20}]

  # A single-lot home: the smallest residential option a village can place
  # (the housing_block below is the 2x2 block of homes).
  - code: cottage
    name: "خانهٔ کوچک"
    role: housing
    tier: 1
    footprint: [1, 1]
    cost_money: 400
    cost_materials: {timber: 3}
    build_time: 1h
    upkeep: 8
    effects: [{target: housing_capacity, op: add, value: 4}]

  - code: park
    name: "پارک"
    role: recreation
    tier: 1
    footprint: [2, 2]
    cost_money: 800
    build_time: 1h
    upkeep: 10
    effects: [{target: happiness_bps, op: add, value: 150}]

  - code: bank
    name: "بانک"
    waits_for: "C6: deposits, loans and the bank licence (tellers, loan officer, the charter permission bank.licence); a bank that only costs upkeep is not offered"
    role: finance
    tier: 3
    footprint: [3, 3]
    cost_money: 50000
    build_time: 10h
    upkeep: 300

  - code: barracks
    name: "پادگان"
    waits_for: "B12: armies belong to countries (every military action refuses a settlement without a country); a barracks that only opens an empty hub is not offered"
    role: military
    tier: 2
    footprint: [4, 4]
    cost_money: 60000
    build_time: 14h
    upkeep: 500

  - code: port
    name: "بندر"
    waits_for: "C2: ships between settlements (a quay, a harbour master, a crew, a timetable); a port that only adds a percentage is not offered"
    role: transport
    tier: 3
    footprint: [4, 4]
    terrain_tags: [coastal_lot]
    terrain_mode: required
    cost_money: 80000
    build_time: 16h
    upkeep: 600

  - code: airport
    name: "فرودگاه"
    waits_for: "C2: flights between settlements (a runway, a flight crew, fuel, a timetable); an airport that only adds a percentage is not offered"
    role: transport
    tier: 3
    footprint: [5, 5]
    cost_money: 120000
    build_time: 20h
    upkeep: 800

  # ---------------------------------------------------------------------
  # forestry — the village's own timber. It needs no knowledge and no
  # material to build, so the first material a village needs is never a
  # dead end (ADR 0033 section 4.1; the reachability lint keeps it so).
  # A workplace: a resident works a shift here (settlement.work), the shift
  # puts `produces` into the village stock and the treasury pays the `wage`.
  # No worker, no timber: nothing is produced by being idle.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # security — watch -> post (ADR 0031 section 3.2, section 7's own
  # example table).
  # ---------------------------------------------------------------------
  - code: watch_hut
    name: نگهبانی محله
    role: security
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [communal_watch]
    cost_money: 300
    build_time: 30m
    upkeep: 30
    effects: [{target: local_security_bps, op: add, value: 300}]

  - code: militia_camp
    name: اردوگاه سواران محلی
    waits_for: "B12: the security forces (a roster, drill, patrols, arms, the head of security); a camp that only adds a percentage is not offered"
    role: security
    tier: 1
    footprint: [2, 1]
    requires_knowledge: [mounted_militia]
    cost_money: 500
    build_time: 45m
    upkeep: 40
    effects: [{target: local_security_bps, op: add, value: 350}]

  - code: retainer_hall
    name: تالار محافظان
    waits_for: "B12: the security forces (retainers sworn to a lord, arms, upkeep); a hall that only adds a percentage is not offered"
    role: security
    tier: 1
    footprint: [2, 1]
    requires_knowledge: [sworn_retainers]
    cost_money: 600
    build_time: 50m
    upkeep: 45
    effects: [{target: local_security_bps, op: add, value: 380}]

  - code: constable_post
    name: "پاسگاه ژاندارمری"
    waits_for: "B12: the security forces (a constable and his deputies, patrols, arrests, a lock-up); a post that only adds a percentage is not offered"
    role: security
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [formal_constabulary]
    cost_money: 900
    build_time: 1h10m
    upkeep: 60
    effects: [{target: local_security_bps, op: add, value: 420}]

  - code: police_post
    name: "کلانتری"
    waits_for: "B12: the police (officers, patrols, investigation, a station with cells and a prosecutor); a post that only adds a percentage is not offered"
    role: security
    tier: 2
    footprint: [2, 2]
    requires_building_role: {role: security, tier: 1}
    requires_knowledge: [record_keeping]
    cost_money: 5000
    build_time: 4h
    upkeep: 50
    effects: [{target: local_security_bps, op: add, value: 900}]

  # ---------------------------------------------------------------------
  # craft — workshop -> manufactory -> factory.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Plan A2 (docs/adr/0050): the first workplaces of the real village goods.
  # ---------------------------------------------------------------------
  # clay_pit: clay is dug where the river leaves it, on a riverside lot.
  - code: clay_pit
    name: "گودال گِل"
    role: extraction
    tier: 1
    footprint: [2, 2]
    requires_knowledge: [pottery]
    terrain_tags: [river_lot]
    terrain_mode: required
    cost_money: 500
    build_time: 1h
    upkeep: 20
    effects: [{target: job_coverage_bps, op: add, value: 100}]
    produces: {clay: 14}
    workers: 2
    shift: 30m
    wage: 50
    tool_wear_bps: 250

  # tool_workshop: the first tools of a village are a wooden haft and a stone head (hoe, adze, axe, sickle).
  # Iron tools wait for the smithy, an ore mine and charcoal.
  - code: tool_workshop
    name: "کارگاه ابزارسازی"
    role: craft
    tier: 1
    footprint: [2, 2]
    requires_knowledge: [carpentry]
    cost_money: 1100
    cost_materials: {timber: 4}
    build_time: 3h
    upkeep: 55
    effects: [{target: job_coverage_bps, op: add, value: 140}]
    consumes: {timber: 1, stone: 1}
    produces: {tools: 1}
    workers: 2
    shift: 30m
    wage: 65
    trains: {skill: carpentry, xp: 15}

  # paper_mill: paper is beaten from rags in running water.
  - code: paper_mill
    name: "کارگاه کاغذسازی"
    role: craft
    tier: 1
    footprint: [2, 2]
    requires_knowledge: [papermaking]
    terrain_tags: [river_lot]
    terrain_mode: required
    cost_money: 1600
    cost_materials: {timber: 6, stone: 4}
    build_time: 4h
    upkeep: 70
    effects: [{target: job_coverage_bps, op: add, value: 140}]
    consumes: {rag: 3}
    produces: {paper: 2}
    workers: 2
    shift: 30m
    wage: 65
    tool_wear_bps: 150
    output_target: papermaking_output_bps

  - code: manufactory
    name: "کارگاه بزرگ"
    waits_for: "C5: the manufactory chain (benches, workers, inputs, outputs); a manufactory that only adds a percentage is not offered"
    role: craft
    tier: 3
    footprint: [3, 3]
    requires_building_role: {role: craft, tier: 1}
    requires_knowledge: [record_keeping]
    cost_money: 15000
    build_time: 20h
    upkeep: 200
    effects: [{target: job_coverage_bps, op: add, value: 500}]

  - code: factory
    name: "کارخانه"
    waits_for: "C5: the factory chain (a production line, workers, inputs, outputs); a factory that only adds a percentage is not offered"
    role: craft
    tier: 4
    footprint: [4, 4]
    requires_building_role: {role: craft, tier: 3}
    cost_money: 40000
    build_time: 12h
    upkeep: 400

  # ---------------------------------------------------------------------
  # extraction — pit -> mine.
  # ---------------------------------------------------------------------
  - code: small_pit
    name: گودال معدن
    role: extraction
    tier: 1
    footprint: [1, 1]
    terrain_tags: [ore_deposit]
    terrain_mode: required
    cost_money: 400
    build_time: 1h
    upkeep: 30
    effects: [{target: job_coverage_bps, op: add, value: 100}]
    produces: {stone: 8}
    workers: 2
    shift: 30m
    wage: 50
    tool_wear_bps: 250

  - code: mine
    name: "معدن"
    waits_for: "B6: mining (shafts, a crew, timbering, hauling, ore); the legacy mine only adds a percentage and is not offered"
    role: extraction
    tier: 2
    footprint: [3, 3]
    requires_building_role: {role: extraction, tier: 1}
    terrain_tags: [ore_deposit]
    terrain_mode: required
    cost_money: 8000
    build_time: 6h
    upkeep: 80
    effects: [{target: job_coverage_bps, op: add, value: 300}]

  # ---------------------------------------------------------------------
  # water_infra — one per arable_farming branch held (tier 1 only, v1).
  # ---------------------------------------------------------------------
  - code: canal_channel
    name: "کانال آبرسانی"
    waits_for: "B2: irrigation of fields (water reaches the farm, a dry season costs the crop); a channel that only costs upkeep is not offered"
    role: water_infra
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [canal_irrigation]
    cost_money: 500
    build_time: 1h
    upkeep: 20

  - code: shaft_well
    name: چاه قنات
    waits_for: "B2: irrigation of fields (water reaches the farm, a dry season costs the crop); a qanat shaft that only costs upkeep is not offered"
    role: water_infra
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [shaft_irrigation]
    cost_money: 800
    build_time: 1h30m
    upkeep: 25

  - code: terrace_works
    name: دیوارهای پلکانی
    waits_for: "B2: irrigation of fields (water reaches the farm, a dry season costs the crop); terraces that only cost upkeep are not offered"
    role: water_infra
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [terrace_irrigation]
    cost_money: 700
    build_time: 1h20m
    upkeep: 22

  - code: paddy_banks
    name: پشته‌های شالیزار
    waits_for: "B2: irrigation of fields (water reaches the farm, a dry season costs the crop); paddy banks that only cost upkeep are not offered"
    role: water_infra
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [paddy_cultivation]
    cost_money: 750
    build_time: 1h25m
    upkeep: 24

  # ---------------------------------------------------------------------
  # food — one per branch held, matching the water_infra it sits on
  # (tier 1 only, v1).
  # ---------------------------------------------------------------------
  - code: farm_canal
    name: "مزرعهٔ نهری"
    role: food
    tier: 1
    footprint: [3, 3]
    requires_knowledge: [canal_irrigation]
    cost_money: 2000
    build_time: 4h
    upkeep: 40
    effects: [{target: food_coverage_bps, op: add, value: 600}]
    produces: {wheat: 12}
    workers: 4
    shift: 30m
    wage: 50
    tool_wear_bps: 100
    trains: {skill: farming, xp: 15}

  - code: farm_shaft
    name: "مزرعهٔ قناتی"
    role: food
    tier: 1
    footprint: [3, 3]
    requires_knowledge: [shaft_irrigation]
    cost_money: 2500
    build_time: 4h30m
    upkeep: 45
    effects: [{target: food_coverage_bps, op: add, value: 600}]
    produces: {wheat: 12}
    workers: 4
    shift: 30m
    wage: 50
    tool_wear_bps: 100
    trains: {skill: farming, xp: 15}

  - code: farm_terrace
    name: مزرعهٔ پلکانی
    role: food
    tier: 1
    footprint: [3, 3]
    requires_knowledge: [terrace_irrigation]
    cost_money: 2300
    build_time: 4h15m
    upkeep: 42
    effects: [{target: food_coverage_bps, op: add, value: 600}]
    produces: {wheat: 12}
    workers: 4
    shift: 30m
    wage: 50
    tool_wear_bps: 100
    trains: {skill: farming, xp: 15}

  - code: farm_paddy
    name: "شالیزار"
    role: food
    tier: 1
    footprint: [3, 3]
    requires_knowledge: [paddy_cultivation]
    cost_money: 2400
    build_time: 4h20m
    upkeep: 44
    effects: [{target: food_coverage_bps, op: add, value: 600}]
    produces: {wheat: 12}
    workers: 4
    shift: 30m
    wage: 50
    tool_wear_bps: 100
    trains: {skill: farming, xp: 15}

  - code: pasture_range
    name: "چراگاه"
    role: food
    tier: 1
    footprint: [3, 3]
    requires_knowledge: [open_range_herding]
    cost_money: 1800
    build_time: 3h30m
    upkeep: 38
    effects: [{target: food_coverage_bps, op: add, value: 550}]
    produces: {wool: 4, hide: 1}
    workers: 3
    shift: 30m
    wage: 50
    trains: {skill: herding, xp: 15}
  # ---------------------------------------------------------------------
  # health — house -> clinic.
  # ---------------------------------------------------------------------
  - code: health_house
    name: خانهٔ بهداشت
    role: health
    tier: 1
    footprint: [2, 2]
    requires_knowledge: [basic_medicine]
    cost_money: 1500
    build_time: 3h
    upkeep: 60
    effects: [{target: service_coverage_bps, op: add, value: 300}]

  - code: clinic
    name: "درمانگاه"
    waits_for: "C4: the care and medicine chain (a doctor, medicine, treatment of injuries); a clinic that only adds a percentage is not offered"
    role: health
    tier: 2
    footprint: [3, 3]
    requires_building_role: {role: health, tier: 1}
    requires_knowledge: [basic_medicine_ii]
    cost_money: 7000
    build_time: 5h
    upkeep: 70
    effects: [{target: service_coverage_bps, op: add, value: 700}]

  # ---------------------------------------------------------------------
  # education — circle -> school.
  # ---------------------------------------------------------------------
  - code: teaching_circle
    name: کلاس درس
    role: education
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [kin_apprenticeship]
    cost_money: 400
    build_time: 1h
    upkeep: 20
    effects: [{target: service_coverage_bps, op: add, value: 150}]

  # Training ground (docs/research/2026-10-03-activities-audit.md section 7): a levelled
  # yard where the settlement's people exercise together under an experienced trainer
  # (the zurkhaneh and the village wrestling ground are the Iranian forms). `upkeep`
  # pays the trainer and the tools; a session there costs the player a small fee to the
  # treasury (config training.ground_fee) and trains at ground_bps. Without the building
  # the same exercise is still possible on open ground, at yard_bps and for nothing.
  - code: training_ground
    name: "زمین تمرین"
    role: training
    tier: 1
    footprint: [2, 2]
    requires_knowledge: [kin_apprenticeship]
    cost_money: 700
    cost_materials: {timber: 4}
    build_time: 2h
    upkeep: 45
    effects: [{target: happiness_bps, op: add, value: 100}]

  # ---------------------------------------------------------------------
  # research — reading room -> laboratory -> higher school (ADR 0048). Each is a working node
  # (building_functions.yml): scholars hired through the labour market open its research slots;
  # the day's paper, fuel and reagents are drawn from the stock; with no scholars it stands idle.
  # ---------------------------------------------------------------------
  - code: library
    name: "کتابخانه"
    role: research
    tier: 1
    footprint: [2, 2]
    requires_knowledge: [basic_literacy]
    cost_money: 1500
    cost_materials: {timber: 8}
    build_time: 3h
    upkeep: 25

  - code: laboratory
    name: "آزمایشگاه"
    role: research
    tier: 2
    footprint: [2, 2]
    requires_knowledge: [basic_mathematics]
    requires_building_role: {role: research, tier: 1}
    cost_money: 5000
    cost_materials: {timber: 10, stone: 10}
    build_time: 6h
    upkeep: 60

  - code: academy
    name: "مدرسهٔ عالی"
    role: research
    tier: 3
    footprint: [3, 3]
    requires_knowledge: [state_school]
    requires_building_role: {role: research, tier: 2}
    min_literacy_share_bps: 5000
    cost_money: 15000
    cost_materials: {timber: 20, stone: 20}
    build_time: 12h
    upkeep: 120

  - code: school
    name: "مدرسه"
    role: education
    tier: 2
    footprint: [3, 3]
    requires_building_role: {role: education, tier: 1}
    min_literacy_share_bps: 5000
    cost_money: 6000
    cost_materials: {timber: 10}
    build_time: 5h
    upkeep: 60
    effects: [{target: service_coverage_bps, op: add, value: 800}]

  # ---------------------------------------------------------------------
  # market — ring -> market.
  # ---------------------------------------------------------------------
  - code: barter_post
    name: "بازارچه"
    role: market
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [barter_ring]
    cost_money: 200
    build_time: 40m
    upkeep: 15
    effects: [{target: job_coverage_bps, op: add, value: 80}]

  # The village shop building (ADR 0046 5.1, «دکان»). The founding stall already
  # sells the basics from day one (a counter, not a building); this is the shop
  # that grows out of it: a bigger daily delivery, the lines that need a
  # building (the small rucksack), and a mending counter for bags. It runs on a
  # shopkeeper and does nothing without one. Its research is the barter ring
  # every settlement is founded with, so it is within reach from the start.
  - code: general_store
    name: "دکان"
    role: market
    tier: 1
    footprint: [2, 1]
    requires_knowledge: [barter_ring]
    cost_money: 600
    cost_materials: {timber: 4}
    build_time: 90m
    upkeep: 12

  - code: market
    name: "بازار"
    role: market
    tier: 2
    footprint: [3, 3]
    requires_building_role: {role: market, tier: 1}
    # Any of periodic_market/endowed_market_hall/trading_post satisfies
    # this — formal_market_access, not market_access itself: barter_ring
    # (the founding grant) already provides market_access, so gating on
    # that alone would be satisfied from founding and never gate anything
    # (see settlement_knowledge.yml's own note on the two tags). Closes the
    # v1 gap this file's header used to note: trading_post (coastal/river
    # route) now reaches market tier 2 too.
    requires_knowledge_capability: [formal_market_access]
    cost_money: 6000
    cost_materials: {timber: 5}
    build_time: 4h
    upkeep: 60
    effects: [{target: job_coverage_bps, op: add, value: 400}]

  # ---------------------------------------------------------------------
  # storage — needs nothing, a small food-coverage stabiliser (ADR 0031
  # section 3.2's own words).
  # ---------------------------------------------------------------------
  - code: granary
    name: "انبار غله"
    role: storage
    tier: 1
    footprint: [1, 1]
    cost_money: 500
    build_time: 1h
    upkeep: 20
    # Its room is the food class of building_functions.yml (`granary`: food 300)
    # and it only counts while a storekeeper keeps it: the stock is kept in
    # classes (bulk, food, goods), each with the base room of storage_classes
    # and whatever a KEPT store adds. Unkept, the granary gives nothing.
    effects: [{target: food_coverage_bps, op: add, value: 150}]

  # The storehouse (ADR 0041 8.23): a covered store for bulk goods and finished
  # goods. A storekeeper keeps it (an NPC citizen of the labour pool, a day's
  # wage from the treasury); unkept it gives nothing beyond the open yard.
  - code: storehouse
    name: "انبار"
    role: storage
