  # ---------------------------------------------------------------------
  # market — ring -> market.
  # ---------------------------------------------------------------------
  - code: barter_post
    name: "جایگاه پایاپای"
    role: market
    tier: 1
    footprint: [1, 1]
    requires_knowledge: [barter_ring]
    cost_money: 200
    build_time: 40m
    upkeep: 15
    effects: [{target: job_coverage_bps, op: add, value: 80}]

  - code: market
    name: "بازار"
    role: market
    tier: 2
    footprint: [3, 3]
    requires_building_role: {role: market, tier: 1}
    # Any of periodic_market/endowed_market_hall/trading_post satisfies
    # this — formal_market_access, not market_access itself: barter_ring
    # (the founding grant) already provides market_access, so gating on
    # that alone would be satisfied from founding and never gate anything
    # (see settlement_knowledge.yml's own note on the two tags). Closes the
    # v1 gap this file's header used to note: trading_post (coastal/river
    # route) now reaches market tier 2 too.
    requires_knowledge_capability: [formal_market_access]
    cost_money: 6000
    cost_materials: {timber: 5}
    build_time: 4h
    upkeep: 60
    effects: [{target: job_coverage_bps, op: add, value: 400}]

  # ---------------------------------------------------------------------
  # storage — needs nothing, a small food-coverage stabiliser (ADR 0031
  # section 3.2's own words).
  # ---------------------------------------------------------------------
  - code: granary
    name: "انبار غله"
    role: storage
    tier: 1
    footprint: [1, 1]
    cost_money: 500
    build_time: 1h
    upkeep: 20
    # Adds this many units to the village stock's capacity
    # (settlement.stock_base_capacity is what a village holds without one):
    # the wheat, wool, timber and stone its workplaces make and the materials
    # it buys are kept here.
    storage: 300
    effects: [{target: food_coverage_bps, op: add, value: 150}]
