version: 1
# The village construction catalogue (docs/adr/0028-world-and-settlements.md
# section 7, extended by docs/adr/0031-knowledge-and-village-progression.md
# section 3.2 with role/tier). Rules: internal/domain/settlementbuilding.
# Loaded and validated by internal/content/settlementbuilding.go; stored as
# content_documents rows, kind "settlement_building".
#
# TIER DECIDES WHAT A SETTLEMENT LISTS (ADR 0033 sections 3 and 5). Every entry
# declares a role and a tier; a village lists and may build tier 1, a town tier
# 2 and up, a city tier 3 and up, and a building of a bigger settlement is never
# listed, refused with a neutral "not available" if asked for by code, and
# refused at content load if it has no tier. Tier 1 = village (a bank, port or
# airport is a city's: tier 3; barracks and police posts a town's: tier 2).
#
# ROLE AND TIER (ADR 0031 section 3.2). Several codes may share one
# role/tier pair — the branching mechanism for institutions, mirroring
# settlement_knowledge.yml's capabilities: watch_hut, militia_camp,
# retainer_hall and constable_post are four peers of role: security,
# tier: 1. A tier-2 promotion (police_post) needs ANY tier-1 building of
# its role already standing (requires_building_role), never one specific
# code. road and civic_hall keep NO role: the universal founding kit,
# present in every settlement regardless of branch (ADR 0028 section 3.1).
#
# WORKPLACES (ADR 0033 section 4.1). A building with `produces` is a place a
# resident works in: `workers` shifts may run at once, each lasts `shift`
# (game time), takes `consumes` out of the village stock when it starts, puts
# `produces` into it when it ends and is paid `wage` from the treasury. Every
# material a building costs or consumes must be reachable from the founding
# state - bought from Support (items.yml village_buy) or produced by a
# workplace that is itself reachable - or the content load fails.
#
# V1 SCOPE NOTES (deliberate simplifications, offered for the owner to
# widen later, ADR 0031 section 9 open question 4's own precedent):
#   * craft role tier 2 ("the same code, _ii") is a KNOWLEDGE generation
#     upgrade to the SAME standing workshop, not a second building row —
#     ADR 0031 section 3.2's own words. Only tier 1 (the five workshops),
#     tier 3 (manufactory) and tier 4 (factory, unchanged from ADR 0028)
#     are placeable rows here.
#   * water_infra/food tier 2 ("capacity-upgraded _ii form") is the same
#     knowledge-generation-upgrades-the-standing-building shape; only
#     tier 1 is placeable in v1.
#   * market tier 2 gates on requires_knowledge_capability:
#     [formal_market_access] — any of periodic_market, endowed_market_hall
#     or trading_post, never the founding-only barter_ring, which provides
#     the (deliberately weaker) market_access tag instead. See that field's
#     own doc comment (internal/domain/settlementbuilding) and
#     settlement_knowledge.yml's note by the three items' provides: lines.
#   * CostMaterials names village materials (items.yml: timber, stone, ...),
#     checked by internal/content/settlementbuilding.go. ADR 0028 section 7's
#     illustrative "steel N" entries are dropped: no "steel" component is
#     shipped yet, and inventing one is production economy (ADR 0021) scope.
settlement_buildings:
  # ---------------------------------------------------------------------
  # No role: the universal founding kit and the existing city-tier systems
  # ADR 0028 section 7 already fully specifies, unchanged.
  # ---------------------------------------------------------------------
  - code: road
    name: "جاده"
    role: infrastructure
    tier: 1
    footprint: [1, 1]
    cost_money: 50
    build_time: 10m
    upkeep: 2

  - code: civic_hall
    name: "خانهٔ دهیاری"
    role: governance
    tier: 1
    footprint: [2, 2]
    cost_money: 1000
    cost_materials: {timber: 5}
    build_time: 2h
    upkeep: 20

  - code: housing_block
    name: "بلوک مسکونی"
    role: housing
    tier: 1
    footprint: [2, 2]
    cost_money: 3000
    cost_materials: {timber: 10}
    build_time: 3h
    upkeep: 30
    effects: [{target: housing_capacity, op: add, value: 20}]

  # A single-lot home: the smallest residential option a village can place
  # (the housing_block below is the 2x2 block of homes).
  - code: cottage
    name: "خانهٔ روستایی"
    role: housing
    tier: 1
    footprint: [1, 1]
    cost_money: 400
    cost_materials: {timber: 3}
    build_time: 1h
    upkeep: 8
    effects: [{target: housing_capacity, op: add, value: 4}]

  - code: park
    name: "پارک"
    role: recreation
    tier: 1
    footprint: [2, 2]
    cost_money: 800
    build_time: 1h
    upkeep: 10
    effects: [{target: happiness_bps, op: add, value: 150}]

  - code: bank
    name: "بانک"
    role: finance
    tier: 3
    footprint: [3, 3]
    cost_money: 50000
    build_time: 10h
    upkeep: 300

  - code: barracks
    name: "پادگان"
    role: military
    tier: 2
    footprint: [4, 4]
    cost_money: 60000
    build_time: 14h
