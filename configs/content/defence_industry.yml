# The defence industry: the military goods states buy, what they are made
# of, the technology that gates them, the companies that make them and the
# strategic materials they start from.
#
# docs/adr/0022-military-and-diplomacy.md is the governing decision. Nothing
# here is new machinery: military equipment is designed, manufactured, listed
# and sold through the production economy of ADR 0021 like a phone is. What
# makes it military is data:
#   - the goods carry export_control with buyer_classes [state]: no player
#     and no company may buy one; a state buys through procurement;
#   - the technologies carry export_control with buyer_classes
#     [company:defence]: only a defence-sector company may license one, and
#     across a border only where the seller's arms export policy allows;
#   - the companies are of sector defence.
# What a force does with its equipment — its branch, its upkeep — is
# military.yml. The fields are those of items.yml, production.yml and
# companies.yml; see the comments there.
#
# UNITS of the military attributes (real-world grounding in ADR 0022):
#   rcs              radar cross-section, thousandths of a square metre
#                    (1000 = 1 m²). A conventional fighter is about 5 m², a
#                    stealth fighter a few thousandths, a bomber a hundred.
#                    A coating's rcs is a factor in basis points: the
#                    archetype multiplies (aggregate product).
#   detection_range  kilometres at which a radar sees a 1 m² target. What it
#                    sees of another target falls with the FOURTH ROOT of
#                    that target's rcs (the radar equation;
#                    internal/domain/military.DetectionRangeKM).
#   rcs_gain         basis points by which a radar's band enlarges what it
#                    sees of a target: a long-wave (VHF) array resonates with
#                    a stealth airframe and sees it far larger (10000 = ×1).
#   speed            km/h.  range  km.  payload  kg.  depth  metres.
#   armour, firepower  relative points.
#   accuracy, interception  basis points (a single shot's chance).

