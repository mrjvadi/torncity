      - {name: interceptor, accepts: interceptor_long, min: 1, max: 1}
      - {name: carrier,     accepts: light_hull, min: 1, max: 1}
    attributes:
      - {name: detection_range, aggregate: max, from: [radar]}
      - {name: rcs_gain,        aggregate: max, from: [radar]}
      - {name: range,           aggregate: max, from: [interceptor], observable: true}
      - {name: interception,    aggregate: max, from: [interceptor]}
      - {name: quality,         aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 85
    reverse_skill: engineering
  - code: ballistic_missile
    method: assemble
    slots:
      - {name: motor,    accepts: rocket_motor, min: 1, max: 1}
      - {name: warhead,  accepts: warhead, min: 1, max: 1}
      - {name: guidance, accepts: guidance, min: 1, max: 1}
    attributes:
      - {name: range,     aggregate: max, from: [motor], observable: true}
      - {name: speed,     aggregate: max, from: [motor], observable: true}
      - {name: payload,   aggregate: sum, from: [warhead], observable: true}
      - {name: firepower, aggregate: sum, from: [warhead]}
      - {name: accuracy,  aggregate: max, from: [guidance]}
      - {name: quality,   aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 75
    reverse_skill: engineering
  - code: cruise_missile
    method: assemble
    slots:
      - {name: body,     accepts: missile_body, min: 1, max: 1}
      - {name: engine,   accepts: jet_engine, min: 1, max: 1}
      - {name: warhead,  accepts: warhead, min: 1, max: 1}
      - {name: guidance, accepts: guidance, min: 1, max: 1}
    attributes:
      - {name: rcs,       aggregate: product, from: [body], divisor: 10000}
      - {name: range,     aggregate: sum, from: [body], observable: true}
      - {name: speed,     aggregate: max, from: [engine], observable: true}
      - {name: firepower, aggregate: sum, from: [warhead]}
      - {name: accuracy,  aggregate: max, from: [guidance]}
      - {name: quality,   aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 65
    reverse_skill: engineering
  - code: anti_ship_missile
    method: assemble
    slots:
      - {name: body,    accepts: missile_body, min: 1, max: 1}
      - {name: engine,  accepts: jet_engine, min: 1, max: 1}
      - {name: warhead, accepts: warhead, min: 1, max: 1}
      - {name: seeker,  accepts: seeker, min: 1, max: 1}
    attributes:
      - {name: rcs,       aggregate: product, from: [body], divisor: 10000}
      - {name: range,     aggregate: sum, from: [body], observable: true}
      - {name: speed,     aggregate: max, from: [engine], observable: true}
      - {name: firepower, aggregate: sum, from: [warhead]}
      - {name: accuracy,  aggregate: max, from: [seeker]}
      - {name: quality,   aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 70
    reverse_skill: engineering
  # A guided bomb: what a strike aircraft drops. Spent on use.
  - code: guided_bomb
    method: assemble
    slots:
      - {name: warhead,  accepts: warhead, min: 1, max: 1}
      - {name: guidance, accepts: guidance, min: 1, max: 1}
    attributes:
      - {name: firepower, aggregate: sum, from: [warhead]}
      - {name: payload,   aggregate: sum, from: [warhead], observable: true}
      - {name: accuracy,  aggregate: max, from: [guidance]}
      - {name: quality,   aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 40
    reverse_skill: engineering
  - code: frigate
    method: assemble
    slots:
      - {name: hull,    accepts: ship_hull, min: 1, max: 1}
      - {name: engine,  accepts: marine_engine, min: 1, max: 1}
      - {name: radar,   accepts: radar_set, min: 1, max: 1}
      - {name: weapons, accepts: weapon_system, min: 1, max: 1}
    attributes:
      - {name: rcs,             aggregate: product, from: [hull], divisor: 10000}
      - {name: armour,          aggregate: sum, from: [hull], observable: true}
      - {name: range,           aggregate: sum, from: [hull], observable: true}
      - {name: speed,           aggregate: max, from: [engine], observable: true}
      - {name: detection_range, aggregate: max, from: [radar]}
      - {name: rcs_gain,        aggregate: max, from: [radar]}
      - {name: firepower,       aggregate: sum, from: [weapons]}
      - {name: quality,         aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 70
    reverse_skill: engineering
  - code: submarine
    method: assemble
    slots:
      - {name: hull,    accepts: pressure_hull, min: 1, max: 1}
      - {name: engine,  accepts: marine_engine, min: 1, max: 1}
      - {name: sonar,   accepts: sonar, min: 1, max: 1}
      - {name: weapons, accepts: weapon_system, min: 1, max: 1}
    attributes:
      - {name: depth,           aggregate: max, from: [hull]}
      - {name: range,           aggregate: sum, from: [hull], observable: true}
      - {name: speed,           aggregate: max, from: [engine], observable: true}
      - {name: detection_range, aggregate: max, from: [sonar]}
      - {name: firepower,       aggregate: sum, from: [weapons]}
      - {name: quality,         aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 90
    reverse_skill: engineering

