suppliers:
  # Strategic materials are scarce: small stocks that refill slowly. This is
  # the bound on how fast any country can arm.
  - code: strategic_materials
    name: Strategic materials trader
    place: industrial_zone
    shelves:
      - {component: titanium,     price: 180, stock: 400, restock: 40,  every: 6h}
      - {component: carbon_fibre, price: 150, stock: 400, restock: 40,  every: 6h}
      - {component: rare_earths,  price: 240, stock: 200, restock: 20,  every: 6h}
      - {component: explosive,    price: 50,  stock: 800, restock: 100, every: 6h}

