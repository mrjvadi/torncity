archetypes:
  # Each archetype is one kind of equipment; a design chooses its parts, and
  # what a part may be is its slot's category — a short-range air defence
  # system takes only a short-range interceptor. rcs is a product: the
  # airframe's cross-section times the coating's factor. What a rival sees
  # on a listing is what is observable: performance, never the signature.
  - code: fighter
    method: assemble
    slots:
      - {name: airframe, accepts: airframe, min: 1, max: 1}
      - {name: engine,   accepts: jet_engine, min: 1, max: 1}
      - {name: radar,    accepts: radar_set, min: 1, max: 1}
    attributes:
      - {name: rcs,             aggregate: product, from: [airframe], divisor: 10000}
      - {name: speed,           aggregate: max, from: [engine], observable: true}
      - {name: range,           aggregate: sum, from: [airframe], observable: true}
      - {name: payload,         aggregate: sum, from: [airframe], observable: true}
      - {name: detection_range, aggregate: max, from: [radar]}
      - {name: rcs_gain,        aggregate: max, from: [radar]}
      - {name: quality,         aggregate: weighted, from: [all], observable: true}
    value: derived
    cost: itemized
    durability: durable
    reverse_difficulty: 80
    reverse_skill: engineering
  - code: stealth_fighter
    method: assemble
    slots:
      - {name: airframe, accepts: stealth_airframe, min: 1, max: 1}
      - {name: coating,  accepts: ram_coating, min: 1, max: 1}
      - {name: engine,   accepts: jet_engine, min: 1, max: 1}
      - {name: radar,    accepts: radar_set, min: 1, max: 1}
    attributes:
