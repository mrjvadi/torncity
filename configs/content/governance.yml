# Governance: levels, jurisdictions, levers and offices.
#
# docs/adr/0015-player-held-offices.md is the governing decision. In one line:
# every political or economic decision is a LEVER held by an OFFICE; a player
# may hold the office, and while nobody does — or while nobody has ever moved
# the lever — its default applies. The operator writes only what this file
# holds: which levers exist, the bounds each may move within, how often and
# with how much warning it may change, and which office holds it. The value
# inside the bounds is the office holder's decision.
#
# This file is ordinary content: validated and loaded by `admin content load`
# together with the other files, as one numbered version. Editing it changes
# nothing until it is loaded. See docs/adr/0004-content-system.md.
#
# No code reads a lever's value from this file. Code asks the policy resolver
# (application.PolicyReader), which returns the office holder's value once its
# notice has passed, and the default below otherwise.
#
# ---------------------------------------------------------------------------
# levels — the kinds of jurisdiction that may exist. Content, so adding one
# needs no migration and no code change.
#   code      identifier. "world" is reserved: the implicit root, the
#             operator's level, which holds no levers and no offices.
#   parents   the levels a jurisdiction of this level may sit directly under;
#             "world" lets it be a top-level jurisdiction. Enforced on every
#             jurisdiction a load writes. No cycles.
#   overlay   optional, default false. A jurisdiction of this level overlays
#             others (a port authority inside a city, a free zone across
#             several) instead of partitioning its parent. Stored; no
#             behaviour yet. Each kind of overlay is its own level, never one
#             shared "special" level: levers attach to a level.
#
# ---------------------------------------------------------------------------
# jurisdictions — everything that is not a city (cities are cities.yml).
#   code     stable identifier; unique here and distinct from every city code.
#            Never change one after it ships.
#   name     display name.
#   level    a declared level other than world and city.
#   parent   optional: the code of the jurisdiction (or city) it sits under;
#            omitted means the world. Must be a level its level allows.
#
# A city's parent is its country (cities.yml `country:`), which must be a
# jurisdiction of level country. The structure is multi-country, and
# multi-level, from the start: adding a province or a union later must not
# mean rewriting every place that assumed one level above a city.
#
# ---------------------------------------------------------------------------
# levers
#   code             stable identifier, prefixed by its level ("city.",
#                    "country."). Never change one after it ships: stored
#                    values and the public history of changes refer to it.
#   jurisdiction     the level the lever is set at.
#   type             scalar: bps (basis points, 10000 = 100%) | money (minor
#                    units) | int — one bounded integer, fully working today.
#                    structured: bool | enum | map | allocation — a document.
#                    allocation works (a budget: category to bps, summing to
#                    at most 10000, the rest unallocated); bool, enum and map
#                    are declared and stored, refused by the resolver and by
#                    SetPolicy until their behaviour is built.
#   default          the value while nobody has set it: the game's behaviour
#                    from before the lever existed. Required. An integer for
#                    a scalar type; for bool true/false; for enum one of
#                    `options`; for map a mapping of key to one of `options`;
#                    for allocation a mapping of category to bps summing to
#                    at most 10000 ({} allocates nothing).
#   options          enum and map only: the allowed values.
#   key              map only: what the keys name, e.g. item.
#   categories       allocation only: what the whole is divided among.
#   city_default     optional, city levers only. Names a per-city default
#                    source; the only one is tax_rate_bps, which takes each
#                    city's default from its tax_rate_bps in cities.yml, so
#                    that each city keeps exactly the rate it charged before.
#                    `default` still applies to a city with no such value.
#   min, max         scalar only: the bounds every value must lie within,
#                    default included. Required. For bps, within 0..10000.
#   held_by          the office — one person or a body — that decides it.
#   decision_rule    optional, default single. How held_by decides:
#                      single         the holder decides alone (the office
#                                     and every deputy acting for it must
#                                     have one seat)
#                      majority       a vote of the body
#                      supermajority  a vote reaching `threshold`, e.g. 2/3
#                      unanimous      every seat
#                    A vote is a proposal any member of the body makes and
#                    the body's members vote on within
#                    legislature.vote_window (config.yml, REAL time); it is
#                    applied once, when it passes
#                    (docs/adr/0024-property-and-politics.md).
#   threshold        supermajority only: the fraction needed, above 1/2.
#   quorum           optional, votes only: the fraction of seats that must
#                    take part, e.g. 1/2.
#   veto_by          optional: offices that may veto a change. Stored.
#   override_rule    optional, with veto_by: majority | supermajority |
#                    unanimous — how held_by overrides a veto; omitted means
#                    a veto is final. override_threshold for a
#                    supermajority. Stored.
#   requires_confirmation_by  optional: the body (an office of the same
#                    level) whose vote must confirm a change the holder
#                    makes before it is announced — a council confirming
#                    the mayor's budget. While nobody sits in the body it
#                    confirms nothing and blocks nothing.
#   confirmation_rule         majority (default) | supermajority | unanimous;
#   confirmation_threshold    for a supermajority, e.g. 2/3;
#   confirmation_quorum       optional share of the body's seats that must
#                             vote.
#   confirm_above    optional, scalar levers only: only a change moving the
#                    value by more than this needs the confirmation.
#   change_cooldown  least time between two changes in one jurisdiction, e.g.
#                    72h. Required; 0s for none. Stops a holder raising a tax
#                    for one trade and lowering it again after.
#   notice           how long after a change is announced it takes effect.
#                    Required; 0s for immediately. No policy change is a
#                    surprise: announce, wait, then apply.
#
# ---------------------------------------------------------------------------
# offices
#   code                      stable identifier. Never change one after it
#                             ships.
#   jurisdiction              the level; one set of seats exists in every
#                             jurisdiction of that level.
#   seats                     holders per jurisdiction: 1 for a mayor, more
#                             for a council.
#   acquired_by               election | appointment | founding | conquest —
#                             how the office is normally obtained. Until
#                             elections exist, an operator appoints
#                             (`admin office appoint`).
#   levers                    the lever codes it holds. Must agree exactly
#                             with the levers whose held_by names it.
#   deputy                    optional: the office that acts for this one
#                             while it is vacant, before the default applies.
#                             Same level; chains allowed; cycles refused.
#   appointed_by              optional: the office that appoints the holder.
#                             Requires acquired_by: appointment. Stored.
#   requires_confirmation_by  optional: the office or body that confirms that
#                             appointment. Stored.
#   term                      optional duration of one tenure, e.g. 2160h;
#                             omitted means at pleasure. An appointment
#                             records when the term ends; nothing ends it yet.
#   term_limit                optional: terms one player may serve. Needs a
#                             term. Stored.
#   can_be_removed_by         optional: offices, "residents" (a recall) or
#                             "operator", that may remove the holder. Stored.
#   veto_over                 optional: lever or office codes it may veto.
#                             Stored.
#   incompatible_with         optional: offices the same player may not hold
#                             at the same time, anywhere. Symmetric: stating
#                             it on either office binds both. Enforced by
#                             `admin office appoint`. Without it, one player
#                             may hold several offices.
#
# The loader creates one seat row per office, jurisdiction and seat, vacant.
# Loading again never duplicates one and never unseats anybody.

version: 1

levels:
  - {code: union,    parents: [world]}
  - {code: country,  parents: [world, union]}
  - {code: province, parents: [country]}
  - {code: city,     parents: [country, province]}
  - {code: town,     parents: [country, province]}
  - {code: village,  parents: [country, province, town]}
  # Overlays: each is a level of its own, because levers attach to a level —
  # a free zone's tax override must not also be a port's.
  - {code: port_authority, parents: [country, province, city, town], overlay: true}
  - {code: free_zone,      parents: [union, country, province, city], overlay: true}

jurisdictions:
  - code: default_country
    name: The Commonwealth
    level: country

  # The far end of the map is a country of its own
  # (docs/adr/0022-military-and-diplomacy.md): a second state is what makes
  # sanctions, arms exports and treaties mean anything.
  - code: vantor_federation
    name: Vantor Federation
    level: country

levers:
  # Today's per-city rates carry over unchanged: the default for each city is
  # its tax_rate_bps. `default: 450` is the fallback for a city with none.
  - code: city.tax_rate
    jurisdiction: city
    type: bps
    default: 450
    city_default: tax_rate_bps
    min: 0
    max: 2500
    held_by: mayor
    # A mayor moves the rate a little alone; a move of more than 3 points
    # goes to the council's vote first (docs/adr/0024).
    requires_confirmation_by: city_council
    confirm_above: 300
    change_cooldown: 72h
    notice: 24h

  # The city's budget (budget.yml, docs/adr/0024): how the part of the
  # treasury spent every city period is divided among the lines. The mayor
  # proposes it and the council confirms it. Nothing was spent before the
  # budget existed, so by default nothing is allocated.
  - code: city.budget
    jurisdiction: city
    type: allocation
    categories: [police, hospital, transit, education, infrastructure, marketing, defence]
    default: {}
    held_by: mayor
    requires_confirmation_by: city_council
    change_cooldown: 72h
    notice: 24h

  # Property tax (property.yml, docs/adr/0024): charged every city period on
  # each property's value, paid by its owner into the treasury. City law,
  # decided by a vote of the council, not by one person. Property did not
  # exist before; the default is a moderate start.
  - code: city.property_tax
    jurisdiction: city
    type: bps
    default: 20
    min: 0
    max: 200
    held_by: city_council
    decision_rule: majority
    quorum: 1/2
    change_cooldown: 72h
    notice: 24h

  # Nothing charges an immigration fee today, so the default is none.
  - code: city.immigration_fee
    jurisdiction: city
    type: money
    default: 0
    min: 0
    max: 100000
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  # The city's bank. Both fees are charged on top of the amount and paid into
  # the city's treasury; nothing charged either before the bank existed, so
  # both default to none. A deposit and a face-to-face cash payment are always
  # free.
  - code: city.bank_withdrawal_fee
    jurisdiction: city
    type: bps
    default: 0
    min: 0
    max: 500
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  # Charged by the payer's city — where they are, or the city their journey
  # left — on a card payment to another player.
  - code: city.card_transfer_fee
    jurisdiction: city
    type: bps
    default: 0
    min: 0
    max: 500
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  # Labour law (internal/domain/job). The minimum wage is the least one shift
  # may pay in the city; the base employer never pays under it. Income tax is
  # withheld from every wage paid to a resident and paid into the city's
  # treasury. Fatigue: within any window of shift_window_hours, the first
  # shifts_before_fatigue shifts are at full output and every later one yields
  # less. shift_window_hours is GAME hours, like the shifts it counts, waited
  # through the game clock (config.yml game.time_scale). Every notice and
  # change_cooldown in this file is REAL time: it is a promise to players
  # (docs/adr/0018-game-clock.md). The defaults are the game's behaviour before anyone holds the seat.
  - code: city.minimum_wage
    jurisdiction: city
    type: money
    default: 100
    min: 0
    max: 5000
    held_by: mayor
    change_cooldown: 168h
    notice: 72h

  - code: city.income_tax
    jurisdiction: city
    type: bps
    default: 500
    min: 0
    max: 4000
    held_by: mayor
    change_cooldown: 168h
    notice: 72h

  - code: city.shift_window_hours
    jurisdiction: city
    type: int
    default: 24
    min: 1
    max: 168
    held_by: mayor
    change_cooldown: 168h
    notice: 72h

  - code: city.shifts_before_fatigue
    jurisdiction: city
    type: int
    default: 4
    min: 1
    max: 24
    held_by: mayor
    change_cooldown: 168h
    notice: 72h

  # Public transport fares (transport.yml modes with public: true): the share
  # of the full fare transport.yml authors that a rider pays on every public
  # journey departing from the city. The default, 50%, is the fare the game
  # charged before anybody held the seat; a mayor may subsidise down to a
  # quarter of the full fare or charge all of it. The fare is paid into the
  # city's treasury. A private mode (a car hire, a flight) is not the city's
  # to price. Demand pricing applies on top, whatever the city chooses.
  - code: city.transit_fare
    jurisdiction: city
    type: bps
    default: 5000
    min: 2500
    max: 10000
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  # Justice (docs/adr/0019-crime-engine.md), held by the police chief. The
  # crimes themselves — their odds, takes and the ranges their sentences and
  # fines are drawn from — are content (crimes.yml); these are the city's say
  # over what happens once a crime is reported or an offender is caught.
  #   crime_report_fee      what a victim pays the treasury to report a theft.
  #                         A fee makes a report a decision: a small theft is
  #                         not worth reporting, a large one is.
  #   bail_per_hour         what leaving jail early costs per game hour of the
  #                         sentence still to serve, paid to the treasury.
  #   jail_term_multiplier  every sentence handed down in the city, in percent
  #                         of the range the crime authors (100 = as authored).
  #   fine_multiplier       every fine, likewise.
  #   investigation_effort  how hard the police work a reported case (0..100%):
  #                         it raises the chance a report is solved.
  # The defaults are the game's behaviour before anybody holds the seat.
  - code: city.crime_report_fee
    jurisdiction: city
    type: money
    default: 200
    min: 0
    max: 5000
    held_by: police_chief
    change_cooldown: 72h
    notice: 24h

  - code: city.bail_per_hour
    jurisdiction: city
    type: money
    default: 250
    min: 50
    max: 5000
    held_by: police_chief
    change_cooldown: 72h
    notice: 24h

  - code: city.jail_term_multiplier
    jurisdiction: city
    type: int
    default: 100
    min: 50
    max: 300
    held_by: police_chief
    change_cooldown: 168h
    notice: 72h

  - code: city.fine_multiplier
    jurisdiction: city
    type: int
    default: 100
    min: 50
    max: 300
    held_by: police_chief
    change_cooldown: 168h
    notice: 72h

  - code: city.investigation_effort
    jurisdiction: city
    type: bps
    default: 5000
    min: 0
    max: 10000
    held_by: police_chief
    change_cooldown: 72h
    notice: 24h

  # Trade (items.yml, shops.yml). The sales tax is charged on top of every
  # purchase from a city shop and paid into the city's treasury; the market
  # fee is taken from the seller's side of every trade on the city's player
  # market and every sale at its auction house. Nothing charged either
  # before shops and the market existed; the defaults are a moderate start.
  - code: city.sales_tax
    jurisdiction: city
    type: bps
    default: 500
    min: 0
    max: 2500
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  - code: city.market_fee
    jurisdiction: city
    type: bps
    default: 200
    min: 0
    max: 1000
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  # Companies (companies.yml, docs/adr/0020-companies.md). The registration
  # fee a founder pays the city's treasury is each kind of business's
  # founding fee scaled by city.company_registration, in percent (100 = as
  # authored); a mayor may halve it to attract business or double it. The
  # corporate tax is taken, for the treasury, from every profit an owner
  # takes out of a company and from what is left when one closes. Companies
  # did not exist before; the defaults are a moderate start.
  - code: city.company_registration
    jurisdiction: city
    type: int
    default: 100
    min: 50
    max: 200
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  - code: city.corporate_tax
    jurisdiction: city
    type: bps
    default: 1000
    min: 0
    max: 4000
    held_by: mayor
    change_cooldown: 72h
    notice: 24h

  # The border tariff (docs/adr/0024): charged on every sale of goods from
  # a company or a market seller of another country to a buyer in this one,
  # paid by the buyer into this country's national treasury. A treaty whose
  # kind carries a tariff discount (diplomacy.yml) lowers it. A change of more
  # than 5 points goes to parliament's vote first.
  - code: country.border_tariff
    jurisdiction: country
    type: bps
    default: 0
    min: 0
    max: 2500
    held_by: president
    requires_confirmation_by: parliament
    confirm_above: 500
    change_cooldown: 168h
    notice: 72h

  # The state's money (docs/adr/0022-military-and-diplomacy.md). Every
  # defence period (config military.period, GAME time) each city of the
  # country pays the national treasury revenue_share of what its treasury
  # took in during the period, and the national treasury appropriates
  # defence_budget of that to the defence fund, which alone pays for arms and
  # the forces' upkeep. No national treasury existed before; the defaults
  # are a moderate start, not a past behaviour.
  - code: country.revenue_share
    jurisdiction: country
    type: bps
    default: 1000
    min: 0
    max: 3000
    held_by: president
    change_cooldown: 168h
    notice: 72h

  - code: country.defence_budget
    jurisdiction: country
    type: bps
    default: 3000
    min: 0
    max: 10000
    held_by: president
    change_cooldown: 168h
    notice: 72h

  # Arms export policy: to whom the country's defence companies may sell
  # arms. 0 — the country's own state only; 1 — also states it has a treaty
  # with that makes them arms partners (diplomacy.yml); 2 — any state not
  # under an arms embargo either way. Controlled technology licensed across
  # the border follows the same policy. The defence minister decides it.
  - code: country.arms_exports
    jurisdiction: country
    type: int
    default: 1
    min: 0
    max: 2
    held_by: defence_minister
    change_cooldown: 72h
    notice: 24h

  # The war economy (docs/adr/0022, part two): while the country is at war,
  # every defence period each of its cities pays war_levy of what its
  # treasury took in, on top of revenue_share and straight into the defence
  # fund (war_levy). Bounded, like any lever: a war levy that took a city's
  # whole income would starve it. Nothing is levied in peace.
  - code: country.war_levy
    jurisdiction: country
    type: bps
    default: 1000
    min: 0
    max: 2500
    held_by: president
    change_cooldown: 72h
    notice: 24h

  # Finance (docs/adr/0026). A country's central banker sets its policy
  # rate — every loan of its national bank is lent at it plus the product's
  # spread and the borrower's band, and savings earn it less a spread — and
  # the share of the bank's assets it keeps and never lends. The president
  # decides how much of the national treasury funds the bank each finance
  # period, until the bank holds finance.yml bank.capital_cap.
  - code: country.base_interest_rate
    jurisdiction: country
    type: bps
    default: 1500
    min: 0
    max: 6000
    held_by: central_banker
    change_cooldown: 168h
    notice: 24h

  - code: country.bank_reserve_ratio
    jurisdiction: country
    type: bps
    default: 2000
    min: 0
    max: 10000
    held_by: central_banker
    change_cooldown: 168h
    notice: 24h

  - code: country.bank_funding
    jurisdiction: country
    type: bps
    default: 500
    min: 0
    max: 5000
    held_by: president
    change_cooldown: 168h
    notice: 72h

offices:
  - code: mayor
    jurisdiction: city
    seats: 1
    acquired_by: election
    term: 720h
    levers: [city.tax_rate, city.immigration_fee, city.bank_withdrawal_fee, city.card_transfer_fee,
             city.minimum_wage, city.income_tax, city.shift_window_hours, city.shifts_before_fatigue,
             city.transit_fare, city.sales_tax, city.market_fee, city.company_registration,
             city.corporate_tax, city.budget]
    # While there is no mayor, the deputy mayor acts; with neither, the
    # defaults apply.
    deputy: deputy_mayor
    can_be_removed_by: [residents, operator]
    # One person does not run the city and sit on the council that checks
    # them.
    incompatible_with: [city_council]

  - code: deputy_mayor
    jurisdiction: city
    seats: 1
    acquired_by: appointment
    appointed_by: mayor
    can_be_removed_by: [mayor, operator]
    levers: []
    # In a city taken in war its offices are emptied and the military
    # governor acts for them (docs/adr/0022, part two).
    deputy: military_governor

  # City law, decided by a vote rather than one person; and the check on the
  # mayor: the council confirms the budget and large tax changes
  # (docs/adr/0024).
  - code: city_council
    jurisdiction: city
    seats: 5
    acquired_by: election
    term: 720h
    levers: [city.property_tax]

  # The city's police (docs/adr/0019-crime-engine.md). The mayor appoints the
  # chief; while the seat is vacant the deputy acts, and with neither the
  # defaults apply. One person does not run the city and its police.
  - code: police_chief
    jurisdiction: city
    seats: 1
    acquired_by: appointment
    appointed_by: mayor
    levers: [city.crime_report_fee, city.bail_per_hour, city.jail_term_multiplier,
             city.fine_multiplier, city.investigation_effort]
    deputy: deputy_police_chief
    can_be_removed_by: [mayor, operator]
    incompatible_with: [mayor]

  - code: deputy_police_chief
    jurisdiction: city
    seats: 1
    acquired_by: appointment
    appointed_by: police_chief
    can_be_removed_by: [police_chief, operator]
    levers: []
    deputy: military_governor

  # Occupation (docs/adr/0022, part two; Hague Regulations art. 42-43: the
  # authority of the occupant). When a city is taken in war its offices are
  # emptied and the commander who took it governs it, by conquest: acting for
  # the vacant mayor and police chief. The seat is emptied again when the city
  # changes hands, and stays empty everywhere else.
  - code: military_governor
    jurisdiction: city
    seats: 1
    acquired_by: conquest
    can_be_removed_by: [operator]
    levers: []
    incompatible_with: [mayor, city_council]

  - code: president
    jurisdiction: country
    seats: 1
    acquired_by: election
    term: 1440h
    levers: [country.border_tariff, country.revenue_share, country.defence_budget, country.war_levy,
             country.bank_funding]

  # The national legislature (ADR 0016: a parliament elected by the
  # residents; docs/adr/0024). It approves a declaration of war and large
  # tariff changes. While nobody sits in it, it approves nothing and blocks
  # nothing. One person does not lead the state and sit in the chamber that
  # checks them.
  - code: parliament
    jurisdiction: country
    seats: 9
    acquired_by: election
    term: 1440h
    levers: []
    incompatible_with: [president]

  # Defence (docs/adr/0022-military-and-diplomacy.md). Civilian control:
  # the minister buys and pays, the chief of the general staff and the
  # branch commanders command, and the three never sit in one person. The
  # president appoints the minister and the chief; the chief appoints the
  # commanders and acts for a vacant one.
  - code: defence_minister
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: president
    can_be_removed_by: [president, operator]
    levers: [country.arms_exports]
    incompatible_with: [president, chief_of_general_staff]

  - code: chief_of_general_staff
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: president
    can_be_removed_by: [president, operator]
    levers: []
    incompatible_with: [president]

  - code: ground_forces_commander
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: chief_of_general_staff
    can_be_removed_by: [chief_of_general_staff, president, operator]
    deputy: chief_of_general_staff
    levers: []
    incompatible_with: [president, defence_minister]

  - code: air_force_commander
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: chief_of_general_staff
    can_be_removed_by: [chief_of_general_staff, president, operator]
    deputy: chief_of_general_staff
    levers: []
    incompatible_with: [president, defence_minister]

  - code: navy_commander
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: chief_of_general_staff
    can_be_removed_by: [chief_of_general_staff, president, operator]
    deputy: chief_of_general_staff
    levers: []
    incompatible_with: [president, defence_minister]

  - code: air_defence_commander
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: chief_of_general_staff
    can_be_removed_by: [chief_of_general_staff, president, operator]
    deputy: chief_of_general_staff
    levers: []
    incompatible_with: [president, defence_minister]

  # Foreign affairs. The Vienna Convention (1969, art. 7) lets a head of
  # state and a foreign minister conclude a treaty without full powers: the
  # minister does, and the president acts while the seat is vacant.
  # The governor of the national bank (docs/adr/0016: central_banker;
  # docs/adr/0026): proposed by the president, confirmed by parliament, for
  # a fixed term longer than the president's, so the rate is not bent to an
  # election.
  - code: central_banker
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: president
    requires_confirmation_by: parliament
    term: 2688h
    can_be_removed_by: [operator]
    levers: [country.base_interest_rate, country.bank_reserve_ratio]
    incompatible_with: [president]

  - code: foreign_minister
    jurisdiction: country
    seats: 1
    acquired_by: appointment
    appointed_by: president
    can_be_removed_by: [president, operator]
    deputy: president
    levers: []

# ---------------------------------------------------------------------------
# actions — decisions that are not a value: buying arms, commanding a branch,
# sanctioning a country, concluding a treaty. Like a lever, each is held by
# one office and, while it is vacant, by the deputy acting for it; nobody
# otherwise. The code knows what each action does; who holds it is here.
#   code          stable identifier, prefixed by its level. The code
#                 implements a closed set: country.procure,
#                 country.sanction, country.treaty, and the branch commands
#                 military.yml names.
#   jurisdiction  the level it is taken at.
#   held_by       the office that takes it, at the same level.
actions:
  - {code: country.procure,             jurisdiction: country, held_by: defence_minister}
  # Defence licences (docs/adr/0022, section 2.14): approving a civilian
  # company's contractor application, rejecting it, and revoking a licence
  # with notice. The minister has no deputy: while the seat is empty,
  # applications wait.
  - {code: country.defence_licence,     jurisdiction: country, held_by: defence_minister}
  - {code: country.command_ground,      jurisdiction: country, held_by: ground_forces_commander}
  - {code: country.command_air,         jurisdiction: country, held_by: air_force_commander}
  - {code: country.command_navy,        jurisdiction: country, held_by: navy_commander}
  - {code: country.command_air_defence, jurisdiction: country, held_by: air_defence_commander}
  - {code: country.sanction,            jurisdiction: country, held_by: president}
  - {code: country.treaty,              jurisdiction: country, held_by: foreign_minister}
  # War (docs/adr/0022, part two): declaring it, joining an ally's, offering
  # and answering a ceasefire or a peace, resuming after a ceasefire. The
  # head of state decides, as the constitutions the ADR reads assign it; a
  # declaration needs parliament's approval first (docs/adr/0024) — the
  # other steps of a war stay the head of state's.
  #   requires_confirmation_by  optional: the body whose vote must approve
  #                             the action first, with confirmation_rule,
  #                             confirmation_threshold and
  #                             confirmation_quorum as on a lever.
  - {code: country.war,                 jurisdiction: country, held_by: president,
     requires_confirmation_by: parliament}

# ---------------------------------------------------------------------------
# elections — how each office acquired by election is elected
# (internal/domain/election). Every duration is REAL time, like an office's
# term: an election is a governance guarantee (docs/adr/0018-game-clock.md),
# so game.time_scale never shortens the days a resident has to stand or vote.
#
#   office               the office code; it must be acquired_by: election.
#   candidacy            how long candidates may stand, from the opening.
#   voting               how long residents may vote, after the candidacy.
#   min_level            the character level a candidate needs.
#   min_residency        how long a candidate must have lived there.
#   clean_record         a candidate may owe nothing to victims or the city
#                        and may not be serving a sentence.
#   voter_min_residency  how long a resident must have lived there to vote.
#   deposit              what standing costs, minor units, held until the
#                        count.
#   refund_share_bps     the share of the votes cast that earns the deposit
#                        back; below it the deposit goes to the treasury of
#                        the city the candidate lives in.
#   reopen_after         how long after a count that filled no seat the next
#                        election opens.
#
# An election's count vacates every seat of the office — the term is over —
# and fills them with the candidates with the most votes (at least one vote
# each; the earlier candidacy wins a tie). A seat nobody won stays vacant, so
# the policy in force stays what it was. After a count that filled a seat,
# the next election opens so that its own count falls when the new term
# ends. The first one is opened by an operator: `admin election open`.
# ---------------------------------------------------------------------------
elections:
  - office: mayor
    candidacy: 48h
    voting: 48h
    min_level: 5
    min_residency: 168h
    clean_record: true
    voter_min_residency: 24h
    deposit: 5000
    refund_share_bps: 1000
    reopen_after: 168h

  - office: city_council
    candidacy: 48h
    voting: 48h
    min_level: 3
    min_residency: 72h
    clean_record: true
    voter_min_residency: 24h
    deposit: 1000
    refund_share_bps: 500
    reopen_after: 168h

  - office: parliament
    candidacy: 72h
    voting: 72h
    min_level: 5
    min_residency: 168h
    clean_record: true
    voter_min_residency: 72h
    deposit: 5000
    refund_share_bps: 500
    reopen_after: 336h

  - office: president
    candidacy: 72h
    voting: 72h
    min_level: 10
    min_residency: 336h
    clean_record: true
    voter_min_residency: 72h
    deposit: 20000
    refund_share_bps: 1000
    reopen_after: 336h
