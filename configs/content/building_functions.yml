    ledger_reasons: [service_wage, lodging_fee]
    replaces: [teahouse_inn]
    workplace: {role: recreation, tier: 1, upkeep: 40}
    needs_research: [slot_limits, wage_bps, level_2_cost_materials, level_2_build_hours]
    note: "an inn is a function of a road and of travellers, not of population (E, read, S2, S4); the village inn needed no research (I), a hotel needs masonry_ii and record_keeping (I). A day it is open (an innkeeper and a tea server from the pool, paid by the treasury; bread, water and a fire in the store) travellers may sleep in its hostel beds (life.sleep, the lodging fee goes to the treasury). Tea is imported and no village can buy it, so the table serves what the village bakes. Role is hospitality, never housing, so housing gates are not satisfied by an inn (research 0.4). Beds are transient; level 2 (a hotel: housekeepers, manager) waits for the upgrade runtime."
