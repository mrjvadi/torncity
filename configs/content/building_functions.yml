  - {code: firewood,     source: "ADR 0041 6.4, 6.6", evidence: adr, requires: {}, class: bulk, bulk: 1}
  - {code: cut_stone,   planned: true, raw: true, source: "ADR 0041 6.4, 8.11", evidence: adr, requires: {}, class: bulk, bulk: 2, note: "no producer until phase W5 (the masonry shop makes bricks from stone today); marked raw so the lint passes while it is planned"}
