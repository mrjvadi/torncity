  - {code: yarn,        planned: true, source: "ADR 0045 4.3", evidence: adr, requires: {}, class: goods, bulk: 1, needs_research: [bulk]}
  - {code: fullers_clay, planned: true, raw: true, source: "ADR 0045 4.3", evidence: adr, requires: {}, class: bulk, bulk: 1, needs_research: [bulk]}
  - {code: fulled_cloth, planned: true, source: "ADR 0045 4.3", evidence: adr, requires: {}, class: goods, bulk: 1, needs_research: [bulk]}
