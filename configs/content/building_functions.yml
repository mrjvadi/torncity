version: 1
# The building function schema (roadmap step 0.5; ADR 0041 phase W0, ADR 0045
# phase B0, internal/content/buildingschema.go).
#
# ONE CONCEPT. A building's function IS what ADR 0035 and ADR 0040 called its
# "use" (use_code = function code; the "_let" variants are a lease on the
# function, not functions): the table `building_uses` is never created. See ADR
# 0045 "as built". The 40 settlement buildings and the citizen buildings are
# taken over through `replaces`; none is lost, and nothing is migrated yet.
#
# THE GATE IS `requires` (what the settlement has, what the player has), never a
# stage. `requires: {}` means nothing is needed. `planned_knowledge` names a
# research line an ADR gives the row that settlement_knowledge.yml does not have
# yet (needs research for the knowledge catalogue; the lint refuses a name once
# it has been added). `needs_research` lists the fields no ADR fixes: they are
# flagged, not invented. Every row cites its ADR section in `source`.
#
# WORKING MECHANIC, NEVER DECORATION (CLAUDE.md 1c). Each function lists who
# works there (`staff`, and `if_unstaffed` for what stands idle), what a shift
# consumes, what it produces and into which storage class, the room it provides
# or needs, its upkeep as decay and repair in kind, and the chain it links to.
# Shift hours are game time; wages are basis points of the market wage.

terrain_tags:
  # The vocabulary a function's terrain_tags may use besides the biome codes of
  # world.yml (ADR 0031 3.1, ADR 0028 6.1). Built: the application layer already sets
  # it. Planned: named by the accepted research of 2026-10-03; the derivation rule
  # from worldgen is open (a T0 tile query will compute it once the owner fixes it).
  - {code: river_lot,   source: "ADR 0028 6.1", evidence: adr, requires: {}, origin: lot_flag, status: built}
  - {code: sloped_lot,  source: "ADR 0028 6.1", evidence: adr, requires: {}, origin: lot_flag, status: built}
  - {code: coastal_lot, source: "ADR 0028 6.1", evidence: adr, requires: {}, origin: lot_flag, status: built}
  - {code: ore_deposit, source: "ADR 0028 5.3", evidence: adr, requires: {}, origin: deposit, status: built}
  - {code: harbour_water, source: "RESEARCH 2026-10-03 7.2, 7.5", evidence: I, requires: {}, origin: worldgen, status: planned, needs_research: [derivation_rule], note: "sheltered water deep enough for the ships: a port needs shelter from swell, depth for the ships and flat land around the harbour (E, read, S38); the depth figure is not in the source, so none is written. The tag is finer than coastal_lot"}
  - {code: flat_lot, source: "RESEARCH 2026-10-03 8.2, 14", evidence: I, requires: {}, origin: worldgen, status: planned, needs_research: [derivation_rule], note: "a lot flat enough for an airstrip, from the tile slope (roads.Plan and worldgen.TileSlopeBPS give the slope); the limit is open"}
  - {code: highland_tropics, source: "RESEARCH 2026-10-03 10.1, 10.5", evidence: I, requires: {}, origin: worldgen, status: planned, needs_research: [derivation_rule], note: "tropical band at altitude for coffee: arabica often hilly, plantations between 600 and 2,000 m and 18 to 25 C (E, read in part, S59, S60); the cut-offs are not fixed"}

storage_classes:
  # ADR 0041 6.4: the room goods occupy. Base room is the room with no building.
  - {code: bulk,  source: "ADR 0041 6.4", evidence: adr, requires: {}, base_room: 60, name: "حیاط و انبار روباز"}
  - {code: food,  source: "ADR 0041 6.4", evidence: adr, requires: {}, base_room: 20, name: "انبار غله"}
  - {code: goods, source: "ADR 0041 6.4", evidence: adr, requires: {}, base_room: 20, name: "انبار سرپوشیده"}
  - {code: ore,   source: "ADR 0045 8.3", evidence: adr, requires: {}, base_room: 0,  name: "صندوق سنگ معدن", needs_research: [base_room, bulk_per_ore_unit], note: "the minehead's ore bin; no ADR gives its size"}

