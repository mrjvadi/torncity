  - {code: stone,    source: "ADR 0041 6.4", evidence: adr, requires: {}, class: bulk,  bulk: 2}
  - {code: iron_ore, source: "ADR 0041 6.4", evidence: adr, requires: {}, class: bulk,  bulk: 2}
  - {code: wheat,    source: "ADR 0041 6.4, 6.5", evidence: adr, requires: {}, class: food, bulk: 1, food_points: 2}
  - {code: flour,    source: "ADR 0041 6.4, 6.5", evidence: adr, requires: {}, class: food, bulk: 1, food_points: 0, note: "the company flour counts grams; the village sack is flour_sack (ADR 0041 12)"}
  - {code: bread,    source: "ADR 0041 6.4, 6.5", evidence: adr, requires: {}, class: food, bulk: 1, food_points: 4}
  - {code: plank,    source: "ADR 0041 6.4", evidence: adr, requires: {}, class: goods, bulk: 2}
  - {code: cloth,    source: "ADR 0041 6.4", evidence: adr, requires: {}, class: goods, bulk: 1}
  - {code: wool,     source: "ADR 0041 6.4", evidence: adr, requires: {}, class: goods, bulk: 1}
  - {code: tools,    planned: true, source: "ADR 0041 6.4, 8.12", evidence: adr, requires: {}, class: goods, bulk: 1, note: "the village tool kit; the existing `tool` is an archetype of company goods, not a component"}
