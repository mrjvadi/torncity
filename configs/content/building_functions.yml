module_kinds:
  # ADR 0045 3.2: what the owner puts inside a lot. Each has a material list, a
  # work amount in builder shifts and an upkeep decay, and an effect that is a
  # real mechanic. The ADR fixes none of those numbers: flagged, not invented.
  - {code: bedroom,   source: "ADR 0045 3.2", evidence: D, requires: {}, effect: housing_capacity, provides: {housing_capacity: 2}, cost_materials: {timber: 3}, build_shifts: 3, area: 2, needs_research: [decay_bps_per_day], note: "the legacy private_cottage gives capacity 2, private_house 4 (citizen_buildings.yml); materials, shifts and area are B1 draft numbers (the ADR names the fields, not the figures), proportioned to the cottage (3 timber, 2 hours)"}
  - {code: hearth,    source: "ADR 0045 3.2, 0041 8.3, 8.33", evidence: D, requires: {}, effect: warmth_shelter, consumes: {timber: 1}, cost_materials: {stone: 2}, build_shifts: 2, area: 1, needs_research: [decay_bps_per_day], note: "fuel: one unit of timber per warm rest from the owner's home store (0041 8.33: rest +25 percent when warm; resting works without it). The ADR burns firewood, which is not an item yet (planned in item_storage); timber stands in until it is; B1 draft numbers"}
  - {code: kitchen,   source: "ADR 0045 3.2", evidence: adr, requires: {}, effect: cooking, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: storeroom, source: "ADR 0045 3.2, 0040 6", evidence: D, requires: {}, effect: personal_storage, provides: {personal_storage: 40}, cost_materials: {timber: 2}, build_shifts: 2, area: 1, needs_research: [decay_bps_per_day], note: "personal storage +40 / +100 / +60 by building in ADR 0040 6.2: the cottage's room is one storeroom; B1 draft numbers for the cost"}
  - {code: water_barrel, source: "ADR 0045 3.2", evidence: adr, requires: {}, effect: water_supply, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: cellar,    source: "ADR 0045 3.2, 0040 6.2", evidence: D, requires: {knowledge: [masonry]}, effect: storeroom, provides: {personal_storage: 60}, cost_materials: {stone: 3, timber: 1}, build_shifts: 3, area: 0, needs_research: [decay_bps_per_day], note: "under the floor, so it takes no floor area; 60 spaces is what the house has over the cottage (100 less 40, ADR 0040 6.2); B1 draft numbers for the cost"}
  - {code: workbench, source: "ADR 0045 3.2, 4.1", evidence: adr, requires: {}, effect: workbench, area: 2, needs_research: [cost_materials, build_shifts, decay_bps_per_day, crafting_effect], note: "the workshop's bench comes with the function; what it makes is personal crafting (ADR 0045 phase B2), so B1 lets nobody add another"}
  - {code: shelves,   source: "ADR 0045 3.2", evidence: D, requires: {}, effect: shelves, provides: {stall_slots: 1, personal_storage: 60}, cost_materials: {timber: 2}, build_shifts: 2, area: 2, needs_research: [decay_bps_per_day], note: "in a stall each shelf is one counter of its own on the village book (no listing fee, no common stall used); in any building it is room to keep stock (0040 6.2: a workshop +60); B1 draft numbers"}
  - {code: staff_post, source: "ADR 0045 3.2", evidence: adr, requires: {}, effect: staff_post, needs_research: [cost_materials, build_shifts]}
  - {code: forge,     source: "ADR 0045 3.2, 4.2", evidence: adr, requires: {knowledge: [smithing]}, effect: forge, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: loom,      source: "ADR 0045 3.2, 5.3", evidence: adr, requires: {knowledge: [weaving]}, effect: loom, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: kiln,      source: "ADR 0045 3.2", evidence: adr, requires: {knowledge: [pottery]}, effect: kiln, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: oven,      source: "ADR 0045 3.2, 4.3", evidence: adr, requires: {knowledge: [milling]}, effect: oven, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: millstone, source: "ADR 0045 4.3, 0041 8.15", evidence: adr, requires: {knowledge: [milling]}, effect: millstone, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: foundation, source: "ADR 0045 3.2", evidence: adr, requires: {knowledge: [masonry]}, effect: foundation, needs_research: [cost_materials, build_shifts, decay_bps_per_day], note: "required on a slope steeper than the lot's limit"}
  - {code: field_plot, source: "ADR 0045 3.2", evidence: adr, requires: {}, effect: field_plot, needs_research: [cost_materials, build_shifts]}
  - {code: barn,      source: "ADR 0045 3.2", evidence: adr, requires: {}, effect: barn, needs_research: [provides, cost_materials, build_shifts, decay_bps_per_day]}
  - {code: signal_fire, source: "ADR 0042 8.3", evidence: adr, requires: {knowledge: [communal_watch]}, planned_knowledge: [signal_fires], effect: signal_fire, consumes: {firewood: 1}, needs_research: [cost_materials, build_shifts], note: "the beacon's ready stack is 10 firewood"}
  - {code: lookout_platform, source: "ADR 0042 8.1", evidence: adr, requires: {knowledge: [communal_watch]}, effect: lookout_platform, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: shaft_level, source: "ADR 0045 8.3", evidence: adr, requires: {}, planned_knowledge: [prospecting, timbering], effect: shaft_level, needs_research: [cost_materials, build_shifts, decay_bps_per_day], note: "depth bands: surface pit to 3 m, timbered shaft to 30 m, ventilated and pumped to 60 m"}
  - {code: hoist,     source: "ADR 0045 8.3", evidence: adr, requires: {}, planned_knowledge: [timbering], effect: hoist, needs_research: [cost_materials, build_shifts, decay_bps_per_day]}
  - {code: guest_bed, source: "RESEARCH 2026-10-03 2.3, 2.5", evidence: I, requires: {}, effect: transient_bed, needs_research: [provides, cost_materials, build_shifts, decay_bps_per_day], note: "a bed for a traveller (sleep spot hostel); it counts as a transient bed and never as a resident's housing capacity"}
  - {code: record_vault, source: "RESEARCH 2026-10-03 5.2, 5.3", evidence: I, requires: {knowledge: [masonry]}, effect: record_vault, needs_research: [cost_materials, build_shifts, decay_bps_per_day], note: "the register's stone room: documents, not goods"}
  - {code: vault, source: "RESEARCH 2026-10-03 6.3, 6.5", evidence: I, requires: {knowledge: [masonry_ii, smithing_ii]}, effect: vault, needs_research: [vault_rating_scale, cost_materials, build_shifts, decay_bps_per_day], note: "holds cash and valuables; its vault_rating sets the theft difficulty; the door and locks need smithing_ii (E, read, S31: strongrooms in bank basements)"}
  - {code: ore_bin,   source: "ADR 0045 8.3", evidence: adr, requires: {}, effect: ore_bin, needs_research: [provides, cost_materials, build_shifts, decay_bps_per_day]}

building_functions:
  # ---- homes and private trades (ADR 0035 3, ADR 0040 Part B, ADR 0045 3.2) ----
  - code: dwelling
    source: "ADR 0045 3.2, 0041 8.3, 8.33, 0040 15"
    evidence: adr
    name: "خانه"
    requires: {}
    kind: housing
    family: home
    permit: residential
    zones: [core, residential]
    footprint: [1, 1, 1, 1]
    owners: [treasury, player, npc_household]
    slots: [{module: bedroom, max: 3}, {module: hearth, max: 1}, {module: kitchen, max: 1}, {module: storeroom, max: 2}, {module: water_barrel, max: 1}, {module: workbench, max: 1}, {module: cellar, max: 1}]
    levels:
      - {level: 1, building: private_cottage, adds: [bedroom, hearth, storeroom], requires: {}, cost_money: 800, cost_materials: {timber: 3}, build_hours: 2}
      - {level: 2, building: private_house, adds: [bedroom], requires: {knowledge: [carpentry]}, cost_money: 1800, cost_materials: {timber: 8}, build_hours: 4}
    produces: {service: housing, outputs: {}}
    ledger_reasons: [household_fuel, property_tax, permit_fee]
    links: {to: [woodcutter_yard]}
    replaces: [cottage, private_cottage, private_house]
    needs_research: [footprint_max, decay_bps_per_day, fitout]
    note: "level 1 is the legacy private_cottage (capacity 2), level 2 the private_house (capacity 4, carpentry); the treasury cottage is capacity 4 (0041 8.3). B1: a level includes the modules it adds (their cost is the level's); every module beyond that is built on its own (its cost and shifts) while the floor area lasts. The kitchen, the water barrel and the workbench of the ADR have no rule that reads them yet (food at home is B3, crafting B2): they are listed in the slots but cannot be built, and level 2 no longer adds the kitchen and the workbench. Housing and personal storage come from the bedrooms and storerooms; a hearth makes a rest warm. No staff."
  - code: stall
    source: "ADR 0040 15, 16, 0041 8.33"
    evidence: adr
    name: "دکهٔ بازار"
    requires: {buildings: [{code: barter_post}]}
    kind: service
    family: commerce
    permit: commerce
    zones: [core]
    footprint: [1, 1, 1, 1]
    owners: [player]
    slots: [{module: shelves, max: 3}]
    levels:
      - {level: 1, building: market_stall, adds: [shelves], requires: {buildings: [{code: barter_post}]}, cost_money: 500, cost_materials: {timber: 2}, build_hours: 1}
    staff: [{role: stall_keeper, slots: 1, shift_hours: 4}]
    if_unstaffed: idle
    produces: {service: stall_sales}
    ledger_reasons: [stall_rent, stall_rent_levy, npc_customer_sale]
    replaces: [market_stall]
    needs_research: [wage_bps, food_points, decay_bps_per_day]
    note: "the owner tends it himself or hires a stall_keeper (ADR 0040 16.4); open only while a village market stands (market_access capability, legacy requires_knowledge_capability). B1: each shelf is one stall of the owner's own on the village book (no listing fee, no common stall used); the owner tends it by being in the settlement (a hired keeper is not built). A leased stall is a lease on this function (commercial_leases), not another function."
  - code: general_store
    source: "ADR 0046 5.1"
    evidence: adr
    name: "دکان"
    requires: {knowledge: [barter_ring]}
    kind: service
    family: commerce
    permit: commerce
    zones: [core]
    footprint: [2, 1, 2, 1]
    owners: [treasury]
    levels:
      - {level: 1, requires: {knowledge: [barter_ring]}, cost_money: 600, cost_materials: {timber: 4}, build_hours: 2}
    staff: [{role: shopkeeper, slots: 1, shift_hours: 24}]
    if_unstaffed: idle
    consumes: {food_points: 1}
    produces: {service: shop_sales}
    links: {from: [granary, woodcutter_yard, weaving_shed]}
    ledger_reasons: [shop_purchase, labor_wage_npc, sales_tax, bag_repair]
    replaces: [general_store]
    needs_research: [slot_limits, decay_bps_per_day]
    note: "ADR 0046 5.1: the founding stall (a counter, not a placed building) sells the basics from day one; this building raises the delivery, stocks the lines that need a building and mends bags. The shopkeeper is an NPC citizen from the labour pool, paid a day's NPC wage from the treasury at each morning delivery; no shopkeeper or an empty treasury, no delivery and no sales. Money for a sale goes to the sink (shop_purchase), the goods enter the buyer's bags (no room, no sale); the shelf is limited and refilled once per game day at 06:00."
  - code: home_workshop
    source: "ADR 0040 15, 17, 0045 4.1, 3.2"
    evidence: adr
    name: "کارگاه خانگی"
    requires: {knowledge: [carpentry]}
    kind: production
    family: craft
    permit: craft
    zones: [core, residential, industry]
    footprint: [2, 1, 2, 1]
    owners: [player]
    slots: [{module: workbench, max: 1}, {module: shelves, max: 2}]
    levels:
      - {level: 1, building: home_workshop, adds: [workbench], requires: {knowledge: [carpentry]}, cost_money: 1500, cost_materials: {timber: 6}, build_hours: 3}
    staff: [{role: labourer, slots: 1, shift_hours: 2}]
    if_unstaffed: idle
    consumes: {food_points: 2}
    produces: {service: home_batch, store: goods}
    storage: {needs: {goods: 2}}
    ledger_reasons: [home_production_input, home_production_output]
    replaces: [home_workshop]
    needs_research: [wage_bps, tool_wear_bps, yield_note]
    note: "the small private form: runs the home recipes at 90 percent yield (ADR 0040 17); the owner or a hired worker works it. Recipes list only when their research is known. B1: the bench comes with the function and the owner adds shelves (stock room, +60 spaces each); what the bench makes is personal crafting, ADR 0045 phase B2."

  # ---- wood, stone, charcoal, iron (ADR 0041 8.4, 8.10, 8.11, 8.12, 0045 4.3) ----
  - code: woodcutter_yard
    source: "ADR 0041 8.4, 7.2"
    evidence: adr
    name: "کارگاه هیزم‌شکنی"
    requires: {}
    kind: extraction
    family: forestry
    permit: craft
    zones: [farm, industry]
    footprint: [2, 2, 2, 2]
    owners: [treasury, player]
    levels:
      - {level: 1, requires: {}, cost_money: 300, build_hours: 1}
    staff: [{role: woodcutter, slots: 3, shift_hours: 2}]
    if_unstaffed: idle
    consumes: {inputs: {}, food_points: 2, tool_wear_bps: 100}
    produces: {outputs: {timber: 8, firewood: 4}, store: bulk}
    storage: {needs: {bulk: 20}}
    ledger_reasons: [stumpage_fee, wages]
    links: {to: [carpentry_workshop, charcoal_clamp, bakery, smithy, kiln, storehouse]}
