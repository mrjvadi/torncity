  # land_registry 60, exchange_house 40, bank 120) are config, never content.
  - code: teahouse_inn
    source: "RESEARCH 2026-10-03 2.3, 2.5; ADR 0041 8.27; RESEARCH 2026-10-09 A4b (Wikipedia Caravanserai, Inn)"
    evidence: D
    name: "چایخانه و مسافرخانه"
    requires: {buildings: [{code: road}]}
    kind: service
    family: hospitality
    permit: lodging
    zones: [core, residential]
    footprint: [2, 2, 2, 2]
    owners: [treasury, player]
    slots: [{module: guest_bed, max: 4}, {module: hearth, max: 1}]
    levels:
      - {level: 1, adds: [guest_bed, hearth], requires: {buildings: [{code: road}]}, cost_money: 1200, cost_materials: {timber: 6, stone: 4}, build_hours: 3}
      - {level: 2, adds: [guest_bed], requires: {knowledge: [masonry_ii, record_keeping]}, cost_money: 9000}
    staff:
      - {role: innkeeper, slots: 1, shift_hours: 4, wage_bps: 12500}
      - {role: tea_server, slots: 1, shift_hours: 4, wage_bps: 10000}
      - {role: housekeeper, slots: 2, min_level: 2}
      - {role: hotel_manager, slots: 1, min_level: 2}
    if_unstaffed: idle
