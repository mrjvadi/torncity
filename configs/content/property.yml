  - city: brennhaven
    price_bps: 9000
    stock: {studio: 25, apartment: 10, family_house: 10, villa: 1, shop_unit: 5, plot: 15}
  - city: kessmoor
    price_bps: 12000
    stock: {studio: 15, apartment: 10, family_house: 5, villa: 2, shop_unit: 4, plot: 6}
  - city: calderis
    price_bps: 15000
    stock: {studio: 10, apartment: 10, family_house: 6, villa: 4, shop_unit: 6, plot: 4}
  - city: vantor_reach
    price_bps: 18000
    stock: {studio: 10, apartment: 8, family_house: 5, villa: 5, shop_unit: 5, plot: 4}
