version: 1
# The village-level settlement knowledge catalogue (ADR 0031 section 3.1,
# section 10's owner decisions). Rules: internal/domain/settlementknowledge.
# Loaded and validated by internal/content/settlementknowledge.go; stored as
# content_documents rows, kind "settlement_knowledge" (see that file's own
# comment for why there is no bespoke definitions table).
#
# CODES ARE DELIBERATELY NEUTRAL, FUNCTIONAL ENGLISH — never a borrowed
# proper noun from one real culture (ADR 0031 section 3.1): two settlements
# that both end up filling `arable_farming` should not both be flying one
# nation's flag over it. In-game display names (settlement_knowledge.<code>
# in the locales) may be evocative Persian, but the code and this file's own
# comments stay neutral and worldwide, grounded in the research table ADR
# 0031 section 0 cites (medieval European open-field/guilds, East/Southeast
# Asian paddy irrigation and village schooling, Middle Eastern qanat/waqf,
# West/East African age-grade militias and lineage smithing, Andean terrace
# irrigation and ayllu labour, Russian/Central Asian communal tenure, and
# Oceanic pondfield irrigation and oral navigation knowledge) — no single
# region's storyline is privileged; every regional analogue sits at the same
# depth in the tree as its rivals.
#
# TERRAIN TAGS mix two open vocabularies on purpose: a world.yml biome code
# (desert, temperate_grassland, tropical_savanna, tropical_rainforest,
# tundra, ...) and an ADR 0028 section 6.1 lot flag (river_lot, sloped_lot,
# coastal_lot) synthesised by the application layer from LocalSample. One
# more synthetic tag, ore_deposit, is set by the application layer when the
# settlement's own territory covers an ore-bearing world_deposits cell (ADR
# 0028 section 5.3) — smithing needs it exactly the way canal_irrigation
# needs river_lot. This package does not know what any of these mean; it
# only matches strings, which is why a new terrain source never needs a code
# change here.
#
# NUMBERS ARE A FIRST DRAFT (ADR 0031 section 9 open question 4), offered
# for the owner to tune in content once a first village is playable — the
# same precedent ADR 0028 section 12 already set for its own building
# catalogue.
knowledge:
  # ---------------------------------------------------------------------
  # Universal founding grants (ADR 0031 section 4.3): every new village is
  # granted all four, free, at founding. mode_eligible: false means never
  # offered for research, purchase or a license — a settlement either has
  # them from founding or, today, never will; there is nothing to buy.
  # ---------------------------------------------------------------------
  - code: oral_tradition
    name: دانش سینه‌به‌سینه
    cost: 0
    time: 0s
    provides: [literacy_spread]
    mode_eligible: false

  - code: communal_watch
    name: نگهبانی محله
    cost: 0
    time: 0s
    provides: [local_security]
    mode_eligible: false

  - code: kin_apprenticeship
    name: "شاگردی خانوادگی"
    cost: 0
    time: 0s
    provides: [skilled_labor]
    mode_eligible: false

  - code: barter_ring
    name: معاوضهٔ کالا
    cost: 0
    time: 0s
    provides: [market_access]
    mode_eligible: false

  # ---------------------------------------------------------------------
  # Universal, largely linear items (ADR 0031 section 3.1's own list):
  # literacy, record-keeping, basic medicine, and five craft families.
  # ---------------------------------------------------------------------
  - code: basic_literacy
    field: education
    name: "سوادآموزی پایه"
    requires: [oral_tradition]
    provides: [literacy_spread, record_keeping_gate]
    cost: 4000
    time: 48h

  - code: record_keeping
    field: market
    name: "دفترداری"
    requires_capability: [literacy_spread]
    provides: [record_keeping]
    cost: 6000
    time: 72h

  - code: basic_medicine
    field: health
    name: طبابت ساده
    family: basic_medicine
    generation: 1
    cost: 2500
    time: 30h
    effects: [{target: service_coverage_bps, op: add, value: 400}]
  - code: basic_medicine_ii
    field: health
    name: طبابت پیشرفته
    requires: [basic_medicine]
    family: basic_medicine
    generation: 2
    cost: 6000
    time: 60h
    effects: [{target: service_coverage_bps, op: add, value: 300}]

  # carpentry — the owner's own example, generations i-iv.
  - code: carpentry
    field: craft
    name: "نجاری"
    family: carpentry
    generation: 1
    cost: 1000
    time: 12h
    effects: [{target: craft_workshop_output_bps, op: add, value: 500}]
  - code: carpentry_ii
    field: craft
    name: "نجاری درجه دو"
    requires: [carpentry]
    family: carpentry
    generation: 2
    cost: 3000
    time: 24h
    effects: [{target: craft_workshop_output_bps, op: add, value: 400}]
  - code: carpentry_iii
    field: craft
    name: "نجاری درجه سه"
    requires: [carpentry_ii]
    family: carpentry
    generation: 3
    cost: 7000
    time: 48h
    effects: [{target: craft_workshop_output_bps, op: add, value: 300}]
  - code: carpentry_iv
    field: craft
    name: "نجاری استادکاری"
    requires: [carpentry_iii]
    family: carpentry
    generation: 4
    cost: 15000
    time: 96h
    effects: [{target: craft_workshop_output_bps, op: add, value: 200}]

  # masonry — generations i-iii.
  - code: masonry
    field: craft
    name: "بنایی"
    family: masonry
    generation: 1
    cost: 1200
    time: 14h
    effects: [{target: masonry_output_bps, op: add, value: 450}]
  # RESEARCH 2026-10-03 5.5 and 6.5, accepted by the owner. The cost and time numbers
  # are (D) drafts: to be proven by a balance run before they ship.
  - code: land_survey
    field: market
    name: "نقشه‌برداری و ثبت زمین"
    requires: [record_keeping, masonry]
    provides: [cadastre]
    cost: 5000
    time: 40h

  - code: double_entry_bookkeeping
    field: market
    name: "دفترداری دوطرفه"
    requires: [record_keeping, periodic_market]
    provides: [banking_ledger]
    cost: 7000
    time: 60h

  - code: masonry_ii
    field: craft
    name: "بنایی درجه دو"
    requires: [masonry]
    family: masonry
    generation: 2
    cost: 3500
    time: 28h
    effects: [{target: masonry_output_bps, op: add, value: 350}]
  - code: masonry_iii
    field: craft
    name: "بنایی استادکاری"
    requires: [masonry_ii]
    family: masonry
    generation: 3
    cost: 8000
    time: 56h
    effects: [{target: masonry_output_bps, op: add, value: 250}]

  # smithing — generations i-iii, gated to a settlement whose territory
  # covers an ore-bearing deposit (ADR 0028 section 5.3; see the file
  # comment on the synthetic ore_deposit tag).
  - code: smithing
    field: craft
    name: "آهنگری"
    family: smithing
    generation: 1
    terrain_tags: [ore_deposit]
    terrain_mode: required
    cost: 1500
    time: 16h
    effects: [{target: smithing_output_bps, op: add, value: 500}]
  - code: smithing_ii
    field: craft
    name: "آهنگری درجه دو"
    requires: [smithing]
    family: smithing
    generation: 2
    cost: 4000
    time: 32h
    effects: [{target: smithing_output_bps, op: add, value: 400}]
  - code: smithing_iii
    field: craft
    name: "آهنگری استادکاری"
    requires: [smithing_ii]
    family: smithing
    generation: 3
    cost: 9000
    time: 64h
    effects: [{target: smithing_output_bps, op: add, value: 300}]

  # weaving — generations i-ii.
  - code: weaving
    field: craft
    name: "بافندگی"
    family: weaving
    generation: 1
    cost: 900
    time: 10h
    effects: [{target: weaving_output_bps, op: add, value: 400}]
  - code: weaving_ii
    field: craft
    name: "بافندگی درجه دو"
    requires: [weaving]
    family: weaving
    generation: 2
    cost: 2600
    time: 20h
    effects: [{target: weaving_output_bps, op: add, value: 300}]

  # pottery — generations i-ii.
  - code: pottery
    field: craft
    name: "سفال‌گری"
    family: pottery
    generation: 1
    cost: 800
    time: 9h
    effects: [{target: pottery_output_bps, op: add, value: 400}]
  - code: pottery_ii
    field: craft
    name: "سفال‌گری درجه دو"
    requires: [pottery]
    family: pottery
    generation: 2
    cost: 2400
    time: 18h
    effects: [{target: pottery_output_bps, op: add, value: 300}]

  # charcoal_burning and bloomery - the road from wood and ore to iron (docs/adr/0051).
  - code: charcoal_burning
    field: craft
    name: "زغال‌پزی"
    requires: [carpentry]
    family: charcoal
    generation: 1
    cost: 1200
    time: 10h
    effects: [{target: charcoal_output_bps, op: add, value: 400}]
  - code: bloomery
    field: craft
    name: "ذوب آهن"
    requires: [smithing, charcoal_burning]
    family: smelting
    generation: 1
    cost: 3500
    time: 28h
    effects: [{target: smelting_output_bps, op: add, value: 400}]

  # papermaking — paper beaten from rags in running water (Samarkand, Fabriano; docs/adr/0050).
  - code: papermaking
    field: craft
    name: "کاغذسازی"
    requires: [basic_literacy, weaving]
    family: papermaking
    generation: 1
    cost: 1800
    time: 14h
    effects: [{target: papermaking_output_bps, op: add, value: 400}]

  # milling — generations i-ii.
  - code: milling
    field: food
    name: "آسیابانی"
    family: milling
    generation: 1
    cost: 1000
    time: 11h
    effects: [{target: milling_output_bps, op: add, value: 400}]
  - code: milling_ii
    field: food
    name: "آسیابانی درجه دو"
    requires: [milling]
    family: milling
    generation: 2
    cost: 2800
    time: 22h
    effects: [{target: milling_output_bps, op: add, value: 300}]

  # ---------------------------------------------------------------------
  # arable_farming — four rival branches, each terrain-required, each
  # Providing the same capability so downstream content never names one
  # by name (ADR 0031 section 3.1's table).
  # ---------------------------------------------------------------------
  - code: canal_irrigation
    field: water_infra
    name: "آبیاری نهری"
    terrain_tags: [river_lot]
    terrain_mode: required
    provides: [arable_farming]
    cost: 3000
    time: 24h
  - code: shaft_irrigation
    field: water_infra
    name: "آبیاری قناتی"
    terrain_tags: [desert]
    terrain_mode: required
    provides: [arable_farming]
    cost: 5000
    time: 48h
  - code: terrace_irrigation
    field: water_infra
    name: آبیاری پلکانی
    terrain_tags: [sloped_lot]
    terrain_mode: required
    provides: [arable_farming]
    cost: 4000
    time: 36h
  - code: paddy_cultivation
    field: food
    name: "شالی‌کاری"
    terrain_tags: [river_lot, tropical_rainforest, tropical_savanna]
    terrain_mode: required
    provides: [arable_farming]
    cost: 4500
    time: 40h

  # ---------------------------------------------------------------------
  # pastoral_husbandry — one branch in v1 (steppe/tundra pastoralism).
  # ---------------------------------------------------------------------
  - code: open_range_herding
    field: food
    name: "دام‌داری صحرایی"
    terrain_tags: [temperate_grassland, tropical_savanna, tundra]
    terrain_mode: required
    provides: [pastoral_husbandry]
    cost: 1500
    time: 12h

  # ---------------------------------------------------------------------
  # aquatic_harvest — two branches, both needing a coastal lot.
  # ---------------------------------------------------------------------
  - code: coastal_fishing
    field: food
    name: "ماهی‌گیری ساحلی"
    terrain_tags: [coastal_lot]
    terrain_mode: required
    provides: [aquatic_harvest]
    cost: 1800
    time: 14h
  - code: pondfield_aquaculture
    field: food
    name: پرورش ماهی در استخر
    terrain_tags: [coastal_lot, tropical_rainforest, tropical_savanna]
    terrain_mode: required
    provides: [aquatic_harvest]
    cost: 3200
    time: 26h

  # ---------------------------------------------------------------------
  # local_security — communal_watch is the founding grant above; three
  # more branches, one terrain-preferred (a discount, not a gate) and two
  # gated on record_keeping/basic_literacy instead of terrain at all.
  # ---------------------------------------------------------------------
  - code: mounted_militia
    field: security
    name: سواران محلی
    terrain_tags: [temperate_grassland, tropical_savanna]
    terrain_mode: preferred
    provides: [local_security]
    cost: 2500
    time: 18h
  - code: sworn_retainers
    field: security
    name: نگهبانان سوگندخورده
    requires: [record_keeping]
    provides: [local_security]
    cost: 4000
    time: 30h
  - code: formal_constabulary
    field: security
    name: "ژاندارمری رسمی"
    requires: [record_keeping, basic_literacy]
    provides: [local_security]
    cost: 7000
    time: 50h

  # ---------------------------------------------------------------------
  # skilled_labor — kin_apprenticeship is the founding grant above; three
  # more branches, the last gated on the settlement's own literacy_share
  # (ADR 0031 section 4.4 — a real literacy movement, not just a document).
  # ---------------------------------------------------------------------
  - code: craft_guild_charter
    field: market
    name: اتحادیهٔ اصناف
    requires: [record_keeping]
    provides: [skilled_labor]
    cost: 5000
    time: 40h
  - code: temple_school
    field: education
    name: "مکتب‌خانه"
    requires: [basic_literacy]
    provides: [skilled_labor]
    cost: 4500
    time: 36h
  - code: state_school
    field: education
    name: "آموزش همگانی"
    requires: [basic_literacy]
    provides: [skilled_labor]
    min_literacy_share_bps: 5000
    cost: 8000
    time: 60h

  # ---------------------------------------------------------------------
  # market_access — barter_ring is the founding grant above; three more
  # branches.
  # ---------------------------------------------------------------------
  - code: periodic_market
    field: market
    name: بازار هفتگی
    requires: [record_keeping]
    # formal_market_access is distinct from market_access: barter_ring (the
    # founding grant) already provides market_access, so a gate that needed
    # only market_access would be satisfied from founding and never really
    # gate anything. This second tag is provided only by the three
    # post-founding market branches, for a building (or a future knowledge
    # item) that genuinely needs one of THOSE, not just "some market
    # institution exists".
    provides: [market_access, formal_market_access]
    cost: 3500
    time: 30h
  - code: endowed_market_hall
    field: market
    name: "بازار وقفی"
    requires: [record_keeping]
    provides: [market_access, formal_market_access]
    cost: 6000
    time: 45h
  - code: trading_post
    field: market
    name: "ایستگاه بازرگانی"
    terrain_tags: [coastal_lot, river_lot]
    terrain_mode: required
    requires: [basic_literacy]
    provides: [market_access, formal_market_access]
    cost: 5500
    time: 42h

  # ---------------------------------------------------------------------
  # The training chain (docs/research/2026-10-03-activities-audit.md). A
  # course, a career, a skill or a crime that needs a body of know-how names
  # the research below; a settlement that has not researched it does not
  # offer it. Order of the chain: literacy -> mathematics -> mechanics ->
  # electricity -> computing. Codes stay neutral and functional.
  # ---------------------------------------------------------------------
  - code: basic_mathematics
    field: education
    name: "حساب و هندسه"
    requires: [basic_literacy]
    provides: [numeracy]
    cost: 5000
    time: 48h
  - code: applied_mechanics
    field: craft
    name: "مکانیک کاربردی"
    requires: [smithing_ii, basic_mathematics]
    provides: [machine_craft]
    cost: 9000
    time: 72h
  # electricity is KNOWLEDGE only (how generators, wires and motors work). No
  # power building exists, so nothing is supplied with current: no screen,
  # course or building may say a settlement "has power". The generation and
  # distribution chain belongs to ADR 0045 production chains (a later step).
  - code: electricity
    field: craft
    name: "دانش برق"
    requires: [applied_mechanics]
    provides: [electrification]
    cost: 14000
    time: 96h
  - code: computing
    field: craft
    name: "رایانه"
    requires: [electricity, record_keeping]
    provides: [computing]
    family: computing
    generation: 1
    cost: 24000
    time: 120h
  - code: computing_ii
    field: craft
    name: "رایانهٔ پیشرفته"
    requires: [computing]
    family: computing
    generation: 2
    cost: 40000
    time: 160h
  - code: culinary_craft
    field: food
    name: "آشپزی حرفه‌ای"
    requires: [milling]
    provides: [cookery]
    cost: 2500
    time: 20h
  - code: retail_trade
    field: market
    name: "فروشندگی و حساب مغازه"
    requires: [periodic_market, basic_mathematics]
    provides: [retail_practice]
    cost: 4000
    time: 36h
  - code: road_code
    field: infrastructure
    name: "قانون راه و رانندگی"
    requires: [record_keeping, applied_mechanics]
    provides: [traffic_law]
    cost: 5000
    time: 40h
  - code: military_drill
    field: security
    name: "آموزش نظامی"
    requires: [formal_constabulary]
    provides: [local_security]
    restricted: true
    cost: 6000
    time: 48h
  - code: printing
    field: education
    name: "چاپ"
    requires: [basic_literacy, applied_mechanics]
    provides: [printing]
    cost: 6000
    time: 48h
