version: 1
# Recipes (roadmap step 0.5; ADR 0045 4.3, first draft: every number is content).
# A recipe appears only after its research is known (`requires.knowledge`) or its
# book learned (recipe-book idea, ADR 0045 4.1). No weapon, ammunition or
# explosive recipe is written here (ADR 0045 4.3 leaves them to the ADR 0036
# items and the defence industry).
#
# ADR 0068 (B4): the recipe runtime reads these. A recipe is made at its stations (a workshop crew
# makes it as an alternative to the standard shift, `batch` cycles a shift) and at a home station (a
# lot module that stands for the station, `craft_minutes` a cycle); `home_only` marks a recipe the
# workshop already has as its standard shift; `default_at` lists the stations whose standard shift IS
# the recipe. A recipe with `waits_for` is not read: its source goods or its reader come with the plan
# item it names (the lint refuses a recipe with an input nobody makes unless it waits).
#
# Left out because the ADR fixes no quantity and no mechanic reads the goods yet (deferred to the plan
# item that gives them a reader, ADR 0068 3.6): 14 garments (survival, B6), 17 iron tools are written
# here, 18 nails, hinges and lock and 20 barrel, crate and sack (a construction or storage reader),
# 21 timber props, 25 wagon and mine cart, 28 gravel, 29 locomotive and boiler, 23 rail, 24 sleeper
# (mining and rail, B11), 22 lamp and oil, 27 bucket and waterskin (night work and thirst, B6).
#
# The first number in a name is the ADR table row. Where the ADR 0041 building
# spec and this table disagree the row says so in `note` and the owner settles it.
recipes:
  - {code: firewood, name: "هیزم", source: "ADR 0045 4.3 #1", evidence: adr, requires: {}, stations: [woodcutter_yard], inputs: {timber: 1}, outputs: {firewood: 4}, batch: 3, craft_minutes: 15, note: "splitting logs from the store; felling is the camp's standard shift"}
