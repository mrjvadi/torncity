# Cities.
#
# This file is the authoring source for the world's cities. It is validated and
# loaded into the database by `admin content load`; the database is what every
# running service reads. Editing this file alone changes nothing until it is
# loaded. See docs/adr/0004-content-system.md.
#
# Adding a city needs no code change and no restart: add an entry, run the
# loader, and every service picks it up.
#
# Fields
#   code             stable identifier. NEVER change one after it ships: routes,
#                    saved player locations and past events all reference it.
#   name             display name.
#   tax_rate_bps     tax in basis points. 10000 = 100%. Integer only.
#   cost_of_living   baseline living cost, in minor currency units.
#   spawn_weight     optional, default 0. How likely a NEW player is to start
#                    in this city, RELATIVE to the other cities. It is a weight,
#                    not a percentage: the weights need not add up to 100, and
#                    a city of weight 30 receives about three times the
#                    newcomers of a city of weight 10. 0 means nobody starts
#                    here. Negative is refused, and at least one city must have
#                    a positive weight or the loader refuses the whole file.
#                    The pick is fixed per Telegram user: the same person always
#                    lands in the same city under the same weights. The city a
#                    player starts in is also where they live (their residence)
#                    until a deliberate residency change. Changing a weight only
#                    affects future newcomers; nobody already placed is moved.
#   country          required. The code of the country this city belongs to,
#                    declared in governance.yml. Country levers and offices
#                    reach a city through it.
#
# tax_rate_bps is also the DEFAULT of the city.tax_rate lever for this city
# (governance.yml, `city_default: tax_rate_bps`): the rate the city charges
# while no mayor has set one. Nothing reads it as the tax rate directly; the
# policy resolver does, and a mayor's change, once its notice has passed,
# takes precedence. It must lie within the lever's min and max, or the loader
# refuses the file. See docs/adr/0015-player-held-offices.md.
#
# Tax and cost are deliberately decorrelated. A city that is cheap to live in is
# not automatically a cheap place to trade, which gives location more than one
# economic dimension to reason about.

version: 1

cities:
  - code: ostmarch
    name: Ostmarch
    tax_rate_bps: 120
    cost_of_living: 980
    spawn_weight: 30
    country: default_country

  - code: fenwick_span
    name: Fenwick Span
    tax_rate_bps: 640
    cost_of_living: 1540
    spawn_weight: 25
    country: default_country

  - code: aldrin_hollow
    name: Aldrin Hollow
    tax_rate_bps: 720
    cost_of_living: 2450
    spawn_weight: 15
    country: default_country

  - code: brennhaven
    name: Brennhaven
    tax_rate_bps: 310
    cost_of_living: 2600
    spawn_weight: 20
    country: default_country

  - code: kessmoor
    name: Kessmoor
    tax_rate_bps: 980
    cost_of_living: 3100
    spawn_weight: 10
    country: default_country

  # Calderis and Vantor Reach are the expensive far end of the map: places a
  # player travels to, not places anyone is born. Hence spawn_weight 0.
  - code: calderis
    name: Calderis
    tax_rate_bps: 450
    cost_of_living: 3780
    spawn_weight: 0
    country: default_country

  - code: vantor_reach
    name: Vantor Reach
    tax_rate_bps: 1450
    cost_of_living: 4200
    spawn_weight: 0
    country: default_country
