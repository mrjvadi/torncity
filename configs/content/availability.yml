version: 1
# AVAILABILITY TAGS (docs/audit/2026-10-01-rules-audit.md; schema in
# internal/content/availability.go). For every player-facing entry: the stage it
# becomes available at, what it needs, and where it can be had if the
# settlement lacks it. DATA ONLY: nothing reads these yet; the activities work
# (ADR 0038) starts reading them where the audit's table says.
#
#   stage     village | town | city | country | support | undecided
#             the smallest stage that has it; a bigger settlement has it too.
#             support = the neutral city only. country = needs a state around
#             the settlement (province and above). undecided = the owner must
#             answer `question` (listed in the audit); nothing is guessed.
#   requires  knowledge   settlement_knowledge codes the settlement researched
#             buildings   standing: {code} or {role, tier} (tier or better)
#             staff       staff_roles below: someone qualified is present
#             personal    the player's own: literacy, certificate (a course
#                         that certifies), skill + min, rank, level + min
#             `requires: {}` = nothing needed. Buildings and knowledge carry
#             their own requires_* fields and their tag leaves `requires` out.
#   elsewhere where a missing thing can be obtained: support (always open) or
#             a stage, with `needs` naming what that place must have.
#
# THE LINT (internal/content/availability.go, run by `admin content load`):
# every entry below is tagged exactly once, every reference resolves, a
# building's stage equals its tier's, and every prerequisite is reachable from
# Support or from a village's founding state. A dead end fails the load.

# ADR 0044 PHASE G0, THE GROWTH LINT. A settlement stage is not a gate. A tag may
# carry no `stage`, if it says what the settlement must have (`requires`, or an
# own requirement of the building or knowledge item) or carries a `growth` block:
#   growth: {open: true}            nothing is needed (open from founding, earned by
#                                   doing the thing, or carried by the shop or recipe)
#   growth: {open: true, founding: true}
#                                   Appendix A class A, open from founding: the ONLY
#                                   kind of row that may drop its `stage` with nothing
#                                   else gating it. A bare open row keeps its stage,
#                                   and so does a deferral: dropping the stage of a row
#                                   with an empty `requires` would open it to everyone.
#   growth: {requires: {...}}       the new gate of ADR 0044 Appendix A class D; read
#                                   only while growth.capabilities is on (phase G1)
#   growth: {deferred: charter|building_missing|finance}
#                                   the real gate is built by a later phase (see note)
# `row` is the Appendix A row. A tag gated ONLY by a stage label is refused by the
# lint, except the entries below: grandfathered buildings whose only gate is their
# tier (the ADR's "the building itself is the gate"), kept readable until their own
# prerequisites are written. The list may only shrink: gating an entry makes the
# lint demand its removal, and the shipped-content test pins its size.
legacy_stage_only: []

