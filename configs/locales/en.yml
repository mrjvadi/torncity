  pay: "💰 Pay per shift: {pay}"
  energy: "⚡ Energy per shift: {energy} · you have {current} of {max_energy}"
  energy_plain: "⚡ Energy per shift: {energy}"
  performance: "📈 Performance: {performance} of {max}"
  shifts: "🔁 Shifts in this position: {shifts}"
  earned: "💵 Earned in this job: {amount}"
  away: "📍 Your job is in {city}. You need to be there to work."
  promotion_top: "⭐ You are at the top of this career."
  promotion_ready: "⬆️ You are ready for a promotion to {title}. Tap “Promotion”."
  promotion_next: |-
    ⬆️ Next position: {title}
    Still needed for a promotion:
  openings_heading: "💼 Job openings"
