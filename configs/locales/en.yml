# English messages.
#
# The key set here must match every other locale exactly, including the
# placeholders each message uses. Validate() reports any key that exists in
# one locale and not another, and any message whose placeholders differ.
#
# Quote any message that STARTS with a placeholder: bare {name} at the start of
# a value is a YAML mapping, not text. Quote any message that contains ": " as
# well, for the same reason. Mid-sentence placeholders need nothing.
#
# Terminology and emoji anchors follow the glossary at the top of fa.yml:
# Energy ⚡, Health ❤️, Level ⭐, XP, City 📍, Journey 🧭, Time left ⏳, Map 🗺,
# Skills 🛠, Friends 👥, Profile 👤, Search 🔎, Refresh 🔄, Settings ⚙️,
# Player code 🆔, Language 🌐 (a language is always named in itself), Cash 💵,
# Bank 🏦, Card payment 💳, Pay 💸; a bank fee is a "fee". Address the player
# as "you"; durations read "2h 15m"; numbers use "," as the thousands
# separator (inserted by the code).. Facts sharing a line are separated by
# " - " (a hyphen with a space on each side), never "·"; a hyphen never
# touches a number.

