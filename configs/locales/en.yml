# English messages.
#
# The key set here must match every other locale exactly, including the
# placeholders each message uses. Validate() reports any key that exists in
# one locale and not another, and any message whose placeholders differ.
#
# Quote any message that STARTS with a placeholder: bare {name} at the start of
# a value is a YAML mapping, not text. Quote any message that contains ": " as
# well, for the same reason. Mid-sentence placeholders need nothing.
#
# Terminology and emoji anchors follow the glossary at the top of fa.yml:
# Energy ⚡, Health ❤️, Level ⭐, XP, City 📍, Journey 🧭, Time left ⏳, Map 🗺,
# Skills 🛠, Friends 👥, Profile 👤, Search 🔎, Refresh 🔄, Settings ⚙️,
# Player code 🆔, Language 🌐 (a language is always named in itself), Cash 💵,
# Bank 🏦, Card payment 💳, Pay 💸; a bank fee is a "fee". Address the player
# as "you"; durations read "2h 15m"; numbers use "," as the thousands
# separator (inserted by the code).

profile:
  # The one-time welcome, shown only while the player has not earned any XP.
  body: |-
    👋 Welcome to the game!
    This is your home: your condition, your money and your work at a glance. Use the buttons below to go anywhere.

  name: "👤 {name}"
  city: "📍 {city}"
  travelling: "🧭 On the way to {city} · {remaining} left"
  level: "⭐ Level {level} · {xp_to_next} XP to level {next_level}"
  level_plain: "⭐ Level {level}"
  level_max: "⭐ Level {level} · highest level reached"
  energy: "⚡ Energy: {energy} of {max_energy}"
  energy_refilling: "⚡ Energy: {energy} of {max_energy} · full in {duration}"
  health: "❤️ Health: {health} of {max_health}"
  # A player's money: the cash they carry and their bank balance. Private:
  # only the player sees these.
  cash: "💵 Cash: {cash}"
  bank: "🏦 Bank balance: {bank}"
  code: "🆔 Player code: {code}"
  code_hint: "Friends can find you by sending /social {code}."
  unavailable: "Your profile is not available right now. Please try again in a moment."

  # The player's work and studies, between their condition and their money.
  job: "💼 {title} in {city} · {pay} per shift"
  job_none: "💼 No job yet"
  shift_running: "⏳ On shift · {remaining} left"
  shift_ending: "⏳ Shift over · your pay is on its way"
  course: "📖 {course} · {remaining} left"
  course_finishing: "📖 {course} · finishing any moment"
  certificates: "📜 {count} certificates"
map:
  title: "🗺 Map"
  origin: "📍 You are in {city}."
  destinations: "From here you can travel to:"
  destination: "• {city} · {distance} km"
  no_routes: "There is no route from here to another city yet. Check again later with “Refresh”."
  no_city: "You have not settled in a city yet. Once you do, your travel destinations appear here."
  travelling: "🧭 You are on the way to {city}. You can start a new journey once you arrive."

travel:
  # The choice of transport, shown when a destination is pressed on the Map.
  # Nothing departs until a mode is chosen. {fare} and {cash} arrive already
  # formatted through format.money; {wait} is the real time the trip takes.
  options_title: |-
    🧭 Travel to {to}
    📍 From: {from}
  options_choose: "How would you like to travel?"
  option: "• {mode} · {fare} · {wait} on the way · {energy} energy"
  option_busy: "• {mode} · {fare} (busy route) · {wait} on the way · {energy} energy"
  requoted: "⚠️ The fare has changed since you looked. Nothing was charged — here are the current prices."
  cash: "💵 Your cash: {cash}"
  insufficient_funds: |-
    💵 Not enough cash to travel by {mode}.
    Fare: {fare} · Your cash: {cash}
    Nothing was charged; a cheaper way to travel may still be in reach.
  # Shown only if a mode has neither a translation nor an authored name.
  mode_unnamed: Other transport
  # What a journey that costs nothing shows instead of a price of zero.
  free: "Free"
  started: |-
    🧭 Your journey to {to} by {mode} has begun
    You left {from} and will arrive in {duration}.
    ⚡ {energy} energy used.
  started_fare: "💵 Fare paid: {fare}"
  # When the journey lands, as a clock time in the player's time zone.
  arrives_at: "🕒 Arrives at {time}"
  status_mode: "Travelling by: {mode}"
  status: |-
    🧭 On the way to {to}
    📍 From: {from}
    ⏳ Arriving in {remaining}
  status_arriving: |-
    🧭 On the way to {to}
    📍 From: {from}
    ⏳ Arriving any moment now.
  arrived: "📍 You have arrived in {city}."
  arrived_xp: "⭐ You earned {xp} XP."
  # Added to the arrival notice when the XP of the journey lifted the player
  # to a new level; {level} is the highest level reached.
  arrived_level: "⭐ Congratulations — you reached level {level}."
  none: "You are not travelling right now. Open the “Map” to choose a destination."
  same_city: "You are already in this city. Choose another destination on the “Map”."
  no_route: "There is no route there from your current city. Choose one of the destinations on the “Map”."
  mode_unavailable: "That way of travelling does not serve this route. Choose the destination on the “Map” again to see the ways that do."

# Transport mode names, keyed on the mode's content code
# (configs/content/transport.yml). A mode with no entry here falls back to its
# authored name.
transport_mode:
  bus: Bus
  car: Car
  train: Train
  flight: Flight

skills:
  title: "🛠 Skills"
  empty: "You have no skills yet. You gain them by working and by taking courses, and they appear here."
  line: "• {skill} · level {level} · {percent}% to next level"
  line_max: "• {skill} · level {level} · highest level"

skill:
  programming: Programming
  mechanics: Mechanics
  medicine: Medicine
  management: Management
  finance: Finance
  engineering: Engineering
  cooking: Cooking
  logistics: Logistics
  driving: Driving
  stealth: Stealth
  lockpicking: Lockpicking
  deception: Deception
  streetwise: Streetwise

# City display names, keyed on the city's content code (configs/content/cities.yml).
# The code never changes after a city ships; the name here may. A city with no
# entry here falls back to the `name:` in cities.yml, but a test fails CI until
# every shipped city is translated in every locale.
city:
  ostmarch: Ostmarch
  fenwick_span: Fenwick Span
  aldrin_hollow: Aldrin Hollow
  brennhaven: Brennhaven
  kessmoor: Kessmoor
  calderis: Calderis
  vantor_reach: Vantor Reach

# The answer to a message the game did not understand. The commands listed in
# help.body are the shortcuts internal/gateway/routing accepts; keep the two
# in step.
help:
  unknown: I did not understand that message.
  body: |-
    The game is played with the buttons. You can also send these commands:
    /profile — your profile and home
    /map — the map and travel
    /job — my job
    /jobs — job openings
    /study — education and courses
    /bank — the bank, deposits and withdrawals
    /pay — pay another player
    /skills — your skills
    /social — your friends
    /find — find a player
    /city — offices and policies of your city
    /office — my office
    /settings — settings

settings:
  title: "⚙️ Settings"
  language: "🌐 Game language: {language}"
  language_changed: "✅ The game language is now {language}."

# Language names, keyed on the locale file's name (fa.yml -> language.fa).
# Each language is written in ITSELF, in every locale: a player who landed in
# a language they cannot read must still be able to find their own. A new
# locale file needs its name added here, in every locale; a test enforces it.
language:
  fa: فارسی
  en: English

social:
  unknown_player: A player
  search:
    help: |-
      🔎 Find a player
      Search by one of these:
      • Telegram username: /social @username
      • Player code: /social K7Q2M9A
      • Telegram ID: /social 123456789
    title: "🔎 Search result"
    player: "👤 {player}"
    self: This is you. Share your player code so friends can find you.
    not_found_username: No player has the username {query}. They may have changed it or not started the game yet — ask them for their player code.
    not_found_code: No player has the code {query}. Check the code; to search by username, put @ in front of it.
    not_found_id: No player has this Telegram ID. They may not have started the game yet.
  friends:
    title: "👥 Friends"
    empty: |-
      You have no friends yet.
      To find a player, send their Telegram username or player code, for example /social @username
    line: "• {player}"
    line_pending: "• {player} · waiting for a reply"
    line_blocked: "• {player} · blocked"
  friend:
    requested: "✅ Friend request sent to {player}. They will appear in your friends list once they accept."
    requested_anon: "✅ Friend request sent. The player will appear in your friends list once they accept."
    accepted: "✅ You and {player} are now friends."
    accepted_anon: "✅ Friend request accepted. This player is now in your friends list."

page:
  indicator: "Page {page} of {pages}"

format:
  # How numbers are written: the ten digits from zero to nine, the mark
  # between groups of three digits, and the decimal mark. The code writes
  # every number through these; never type digits into a message by hand.
  digits: "0123456789"
  group_separator: ","
  decimal_separator: "."
  duration_hm: "{hours}h {minutes}m"
  duration_h: "{hours}h"
  duration_m: "{minutes}m"
  duration_s: "{seconds}s"
  # A clock time, shown in the player's time zone. {hour} and {minute} are
  # always two digits, already in the digits above.
  clock: "{hour}:{minute}"
  # A sum of money. {amount} is already written with the digits and the
  # group separator above.
  money: "{amount} Nil"

button:
  refresh: "🔄 Refresh"
  back: "🔙 Back"
  next: "Next ➡️"
  previous: "⬅️ Previous"
  profile: "👤 Profile"
  map: "🗺 Map"
  journey: "🧭 My journey"
  travel_to: "🧭 {city}"
  travel_by: "{mode} · {fare}"
  travel_options: "🧭 Ways to travel"
  skills: "🛠 Skills"
  social: "👥 Friends"
  settings: "⚙️ Settings"
  change_language: "🌐 Switch to {language}"
  add_friend: "➕ Add {player}"
  accept: "✅ Accept {player}"
  bank: "🏦 Bank"
  deposit: "📥 Deposit {amount}"
  withdraw: "📤 Withdraw {amount}"
  find_player: "🔎 Find a player"
  pay: "💸 Pay {player}"
  pay_cash: "💵 Cash · {amount}"
  pay_card: "💳 Card · {amount}"
  pay_again: "💸 Pay again"
  confirm: "✅ Confirm"
  cancel: "✖️ Cancel"

error:
  unknown_command: "I do not know that command. Send /start to open your profile."
  not_enough_energy: |-
    ⚡ Not enough energy.
    This needs {needed} and you have {current}. Energy refills over time; you will have enough within {wait}.
  not_enough_energy_later: "⚡ Not enough energy. It refills over time, so please try again a little later."
  cooldown: "⏳ Please wait — you can do this again in {wait}."
  internal: Something went wrong. Please try again in a moment.
  not_found: We could not find what you were looking for. Go back to your profile and try again.
  invalid_input: I could not understand that request. Please use the buttons.
  conflict: "That cannot be done right now. Please try again in a moment."
  rate_limited: Too many requests in a row. Please wait a few seconds and try again.
  unauthorized: "You are not allowed to do that. Tap “Back” to return to your profile."
  city_not_found: "That city could not be found. Choose one of the destinations on the “Map”."
  already_travelling: You are already on a journey. Tap “My journey” to see how it is going.
  at_work: "💼 You are at work right now. You can set off once your shift ends."
  skill_not_found: "That skill could not be found. See your skills under “Skills”."
  not_friends: "You are not friends with this player, and there is no request from them waiting for you. See your friends and requests under “Friends”."
  already_friends: "You are already friends with this player. You will find them under “Friends”."
  player_not_found: Player not found. If you have not started the game yet, send /start.
  unsupported_language: "That language is not available. Choose one of the available languages under “Settings”."

# Player-held offices (docs/adr/0015-player-held-offices.md): the offices and
# policies of a city, the office holder's own screen, the flow that changes a
# policy, and the public history of changes.
#
# Terms: office 🏛 (a seat a player holds: mayor, president), policy (what an
# office decides: a tax rate, a fee), vacant (nobody holds the office),
# acting (a deputy exercising a vacant office's powers), announced (a change
# is public at once and takes effect after its notice), public history 📜.
# Percentages are written "{value}%"; money goes through format.money.
gov:
  player: "{name} ({code})"
  list_separator: ", "
  percent: "{value}%"
  span_d: "{days}d"
  span_dh: "{days}d {hours}h"
  unnamed_office: an office
  unnamed_lever: a policy
  city:
    title: "🏛 Offices and policies — {city}"
    title_plain: "🏛 Offices and policies"
    no_city: You have not settled in a city yet. Once you do, its offices and policies appear here.
    place: "📍 {place}"
    offices: "Offices:"
    no_offices: • There are no offices here.
    policies: "Policies:"
  office:
    held: "• {office}: {players}"
    seats: "• {office}: {held} of {seats} seats held · {players}"
    acting: "• {office}: vacant · acting: {deputy} {players}"
    vacant: "• {office}: vacant"
  lever:
    line_default: "• {lever}: {value} · default"
    line_set: "• {lever}: {value} · set by {player}"
    pending: "  ⏳ Changes to {value} in {when}"
  mine:
    title: "🏛 My office"
    none: You do not hold any office. For now, office holders are appointed by the game's administrators; elections will come later.
    seat: "📍 {office} of {place}"
    acting_for: You are acting for the vacant office of {office}.
    no_levers: This office has no policy you can change right now.
    lever: "• {lever}: {value}"
    lever_vote: "• {lever}: {value} · decided by a vote, which is not available yet"
  edit:
    title: "🏛 {lever} — {place}"
    bounds: "Allowed range: {min} to {max}"
    default: "Default: {value}"
    notice: A change takes effect {notice} after it is announced.
    cooldown: After a change, the next one can be made {cooldown} later.
    cooldown_active: "⏳ You can change this policy again in {wait}."
    draft: |-
      New value: {value}
      Adjust it with the buttons, then tap “Review change”.
  confirm:
    title: "📝 Confirm the change"
    change: "{lever} in {place}: from {old} to {new}"
    notice: It will be announced now and take effect in {notice}.
    cooldown: You will not be able to change this policy again for {cooldown}.
  announced:
    title: "📢 Change announced"
    body: "{lever} in {place} will change from {old} to {new} in {when}. The change is recorded in the public history."
  history:
    title: "📜 Policy history — {city}"
    empty: No policy has been changed here yet.
    change: "• {lever} ({place}): {old} → {new}"
    by: "  Announced by {office} {player} · {ago} ago"
    effective_in: "  ⏳ Takes effect in {when}"
    effective_since: "  In force for {when}"
  button:
    city: "🏛 Offices and policies"
    history: "📜 Policy history"
    my_office: "🏛 My office"
    change: "✏️ {lever} — {place}"
    down: "➖ {amount}"
    up: "➕ {amount}"
    min: Minimum ({value})
    default: Default ({value})
    max: Maximum ({value})
    review: "📝 Review change"
    confirm: "✅ Confirm"
    cancel: "✖️ Cancel"
  refusal:
    not_holder: "Only the {office} can change this policy. If you held that office, you may have been replaced."
    requires_vote: This policy is decided by a vote of the {office}, and voting is not available yet.
    out_of_range: That value is outside the allowed range of {min} to {max}. Choose a value within it.
    out_of_range_plain: That value is outside the allowed range. Choose a value within it.
    cooldown: This policy was changed recently. You can change it again in {wait}.
    cooldown_later: This policy was changed recently. Please try again later.
    unsupported: This kind of policy cannot be changed yet.
    unknown_lever: This policy no longer exists. Open “My office” to see the policies you can change.
    unknown_place: "This place could not be found. Open the “Map” and try again."
    wrong_place: This policy does not apply to this place.
    office_not_found: This office does not exist here.
    office_occupied: Someone already holds this office.
    office_vacant: This office is already vacant.
    already_holds: You already hold this office.
    incompatible: This office cannot be held together with an office you already hold.

# Office names, keyed on the office's content code (configs/content/governance.yml).
office:
  mayor: Mayor
  deputy_mayor: Deputy mayor
  city_council: City council
  police_chief: Police chief
  deputy_police_chief: Deputy police chief
  president: President

# Policy names, keyed on the lever's content code (configs/content/governance.yml).
lever:
  city:
    tax_rate: Tax rate
    immigration_fee: Immigration fee
    bank_withdrawal_fee: Bank withdrawal fee
    card_transfer_fee: Card transfer fee
    transit_fare: Public transport fare
    minimum_wage: Minimum wage
    income_tax: Income tax
    shift_window_hours: Working-hours window (game hours)
    shifts_before_fatigue: Shifts before fatigue
    crime_report_fee: Crime report fee
    bail_per_hour: Bail per game hour
    jail_term_multiplier: Jail sentences (% of standard)
    fine_multiplier: Fines (% of standard)
    investigation_effort: Investigation effort
  country:
    border_tariff: Border tariff

# Names of places above a city, keyed on the jurisdiction's content code.
# Cities are named under city.* above.
jurisdiction:
  default_country: The Commonwealth

# Playing in a group (internal/gateway/groups). A screen with a player's own
# details is shown only to that player; these lines are all the rest of the
# group ever sees of it, so they name no screen and no number.
group:
  # A press on a button that belongs to another player. Shown in a popup to
  # the presser only; at most 200 characters.
  not_yours: This button belongs to another player. Send the command yourself to open your own screen.
  # Posted in the group (or shown as a popup) when the screen went to the
  # player's private chat with the bot.
  sent_privately: Your reply was sent to your private chat with the bot.
  # The player has never started the bot, so nothing can be sent privately.
  start_bot_first: This screen is for you only. Open the bot in a private chat and press Start first, and it will be shown there.
  # The button under either line; it opens the bot's private chat.
  open_bot: Open the bot
  # Posted once when the bot is added to a group.
  welcome: |-
    Hello everyone! You can now play the game right here in this group; send /start to begin.
    Your money, your bank and your settings stay private: those screens are sent to your private chat with the bot.

# Descriptions in the bot's command menu, shown in private chats only: a
# group shows no command menu at all. One per command in menu.commands
# (configs/config.yml).
command_menu:
  profile: Your profile
  skills: Your skills
  map: The world map
  social: Your friends
  find: Find a player by player code
  settings: Settings
  help: Help
  job: "Your job"
  study: "Education and courses"
  bank: "The bank and your money"
  city: "Offices and policies of your city"
  crime: "The underworld: crime, jail and your cases"

# The bank: cash on hand and a bank balance. A bank is a city service, so
# deposits and withdrawals happen only in a city; card payments work from
# anywhere, and cash changes hands only between players in the same city.
# Fees are each city's policy and are always shown before money moves.
bank:
  title: "🏦 Bank"
  branch: "📍 {city} branch"
  withdrawal_fee: "Withdrawals here carry a fee of {percent}%, added on top of the amount. Deposits are always free."
  withdrawal_free: Withdrawals and deposits here are free.
  closed_travelling: "🧭 You are travelling. You can deposit and withdraw once you arrive in any city; card payments work from anywhere."
  closed_no_city: You have not settled in a city yet, so there is no bank to visit.
  hint: "Choose an amount below, or type one, for example /bank deposit 5000"
  pay_hint: "💸 To pay another player, send /pay with their username or player code, for example /pay @username"
  deposited: "✅ {amount} deposited into your bank account."
  withdrew: "✅ You withdrew {amount} in cash."
  withdrew_fee: "✅ You withdrew {amount} in cash · fee: {fee}"
  error:
    not_in_city: The bank is only open in a city. You can deposit and withdraw once you arrive; card payments work from anywhere.
    not_together: You can only hand cash to a player who is in the same city as you. Send the money by card instead — it works from anywhere.
    self_payment: You cannot pay yourself.
    payee_not_found: No player to pay was found. Check the username or player code and try again.
    invalid_amount: "Please write the amount as a whole number, for example /bank deposit 5000"
    below_minimum: The smallest amount allowed is {min}.
    above_maximum: The largest amount allowed at once is {max}.
    not_enough_cash: "You do not have enough cash. Cash on you: {available}"
    not_enough_in_bank: |-
      Your bank balance is not enough.
      This needs {needed} including the fee, and you have {available}.
    insufficient: There is not enough money for this. Open “Bank” to see your balances.
    unavailable: The bank is not available right now. Please try again in a moment.

# Paying another player. {player} is the other player's name.
pay:
  help: |-
    💸 Pay a player
    Name the player in one of these ways:
    • Telegram username: /pay @username
    • Player code: /pay K7Q2M9A
    You can add the amount and the method: /pay K7Q2M9A 5000 card
    Cash changes hands only when you are both in the same city; card payments work from anywhere.
  title: "💸 Pay {player}"
  together: "📍 You and {player} are both in {city}; pay in cash or by card."
  apart: "You and {player} are not in the same city, so cash is not possible. Card payments work from anywhere."
  card_fee: "Card payments from {city} carry a fee of {percent}%, added on top of the amount."
  card_free: Card payments from {city} are free.
  hint: "Another amount? Type it: /pay {code} 5000 card or /pay {code} 5000 cash"
  confirm_cash: "💵 Hand {amount} in cash to {player}?"
  confirm_card: "💳 Send {amount} by card to {player}?"
  confirm_card_fee: |-
    💳 Send {amount} by card to {player}?
    Fee: {fee} · Total from your bank: {total}
  sent_cash: "✅ You handed {amount} in cash to {player}."
  sent_card: "✅ You sent {amount} by card to {player}."
  sent_card_fee: "✅ You sent {amount} by card to {player} · fee: {fee}"
  not_together: "{player} is not here with you, so you cannot hand over cash. Send the money by card instead — card payments work from anywhere."
  received_cash: "💵 {player} handed you {amount} in cash."
  received_card: "💳 {player} sent you {amount} by card. The money is in your bank account."

# Work (internal/domain/job, configs/content/jobs.yml). Terms: job 💼, shift,
