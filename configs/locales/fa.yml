# Commands typed without a slash (internal/gateway/routing/alias.go). The key
# is the slash-command a word stands for: crime is "/crime", bank.deposit is
# "/bank deposit". Several words are separated by «|». What follows the word
# is read as the command's arguments: «واریز 5000» is a deposit of 5000. Every
# language's words work for everyone, so a word here must not mean another
# command in another locale (a test checks). help and cancel are answered by
# the gateway itself: the help screen, and dropping a question the bot asked.
# In a group, a word works only on its own or followed by numbers, @usernames
# or player codes, so ordinary chat is never mistaken for a command.
command_alias:
  profile: "پروفایل | من | خانه"
