# Persian messages. This is the default locale: it is the one language that
# must be complete, because every other language falls back to it.
#
# Nothing here is compiled into the binary. Change the wording, restart, done.
#
# Placeholders are written {name} and are substituted literally. Keep every
# placeholder that the other locales use — a line that drops {amount} is not a
# shorter sentence, it is a wrong one, and Validate() fails the build for it.
#
# Quote any message that STARTS with a placeholder: bare {name} at the start of
# a value is a YAML mapping, not text. Mid-sentence placeholders need nothing.

profile:
  title: پروفایل

  # |- keeps the newlines and drops the trailing one, so the message ends
  # where the text ends.
  body: |-
    پروفایل

    شناسه: {id}
    زبان: {language}
    وضعیت: {status}

  # The condition block is a separate message from the identity block above:
  # it changes on every read as energy accrues, and keeping the two apart
  # keeps each placeholder set small enough to check by eye.
  condition: |-
    شهر: {city}
    سطح: {level} ({xp} تجربه)
    انرژی: {energy}/{max_energy}
    سلامتی: {health}/{max_health}

  unavailable: پروفایل در دسترس نیست.
  city_unknown: هنوز هیچ‌جا

  id_label: شناسه
  language_label: زبان
  status_label: وضعیت
  level_label: سطح
  energy_label: انرژی
  health_label: سلامتی

dashboard:
  title: خانه
  body: |-
    {name}

    شهر: {city}
    سطح: {level}
    انرژی: {energy}/{max_energy}

map:
  title: نقشهٔ جهان
  origin: "در {city} هستی."
  empty: هنوز هیچ شهری بارگذاری نشده است.
  depart: "سفر به {city}"
  city:
    current: "{city} — همین‌جایی · مالیات {tax}٪ · هزینهٔ زندگی {cost}"
    reachable: "{city} — {distance} کیلومتر · مالیات {tax}٪ · هزینهٔ زندگی {cost}"
    unreachable: "{city} — از اینجا مسیری نیست · مالیات {tax}٪ · هزینهٔ زندگی {cost}"

travel:
  title: سفر
  started: "از {from} به {to} راه افتادی. {duration} دیگر می‌رسی. انرژی مصرف‌شده: {energy}."
  status: "{from} به {to}. {remaining} باقی مانده."
  none: الان در سفر نیستی.
  arrived: "به {city} رسیدی. {xp} تجربه گرفتی."
  same_city: همین حالا در همان شهر هستی.
  no_route: از اینجا مسیری به آن شهر نیست.
  unknown_speed: این گزینهٔ سفر در دسترس نیست.

skills:
  title: مهارت‌ها
  empty: هنوز هیچ مهارتی را تمرین نکرده‌ای.
  line: "{skill} — سطح {level} · {xp}/{next} تجربه ({percent}٪)"
  line_untrained: "{skill} — تمرین‌نشده · {xp}/{next} تجربه ({percent}٪) · سطح {level}"

