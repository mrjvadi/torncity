  accept: "✅ پذیرفتن {player}"
  bank: "🏦 بانک"
  deposit: "📥 واریز {amount}"
  deposit_all: "📥 واریز همه - {amount}"
  deposit_custom: "✏️ واریز مبلغ دلخواه"
