# Persian messages. This is the default locale: it is the one language that
# must be complete, because every other language falls back to it.
#
# Nothing here is compiled into the binary. Change the wording, restart, done.
#
# Placeholders are written {name} and are substituted literally. Keep every
# placeholder that the other locales use — a line that drops {amount} is not a
# shorter sentence, it is a wrong one, and Validate() fails the build for it.
#
# Quote any message that STARTS with a placeholder: bare {name} at the start of
# a value is a YAML mapping, not text. Quote any message that contains ": " as
# well, for the same reason. Mid-sentence placeholders need nothing.
#
# ---------------------------------------------------------------------------
# GLOSSARY — use exactly these words and anchors on every screen
# ---------------------------------------------------------------------------
#   concept         word                  anchor   notes
#   energy          انرژی                  ⚡
#   health          سلامت                  ❤️       never «سلامتی»
#   level           سطح                    ⭐
#   XP              امتیاز تجربه                    never «XP» or «تجربه» alone
#   city            شهر                    📍       where the player is
#   travel/journey  سفر                    🧭       «در راه» = en route, «مقصد» = destination
#   time left       «… مانده» / «تا رسیدن»  ⏳
#   map             نقشه                   🗺
#   skill           مهارت / مهارت‌ها         🛠
#   friends         دوستان                 👥       «درخواست دوستی» = friend request
#   profile         پروفایل                 👤
#   search          جست‌وجو                 🔎
#   refresh         به‌روزرسانی              🔄       never «بروزرسانی»
#   player          بازیکن
#   player code     کد بازیکن               🆔       7 characters on the profile, e.g. K7Q2M9A; «/social کد» finds that player
#   settings        تنظیمات                ⚙️
#   language        زبان                   🌐       a language is always named in itself: «English», not «انگلیسی»
#   transport mode  وسیلهٔ سفر                       «با اتوبوس»، never the content code
#   fare            کرایه                           always through format.money
#   cash            پول نقد                💵       what the player carries; «نقد» for short
#   bank            بانک / موجودی بانک       🏦       the bank balance; «حساب بانکی» = bank account
#   card payment    پرداخت کارتی             💳       bank to bank, from anywhere
#   pay             پرداخت                 💸       «پرداخت به {player}»
#   fee             کارمزد                          never «هزینه» for a bank fee
#   deposit         واریز                  📥
#   withdraw        برداشت                 📤
#   job             شغل / شغل من            💼       «فرصت‌های شغلی» = job openings; «شیفت» = a shift of work
#   pay per shift   دستمزد هر شیفت          💰
#   performance     عملکرد                 📈       «۵۳ از ۱۰۰»
#   promotion       ارتقا                  ⬆️
#   education       آموزش                  🎓       «دوره» = course, «شهریه» = fee, «ثبت‌نام» = enrol
#   course          دوره                   📖
#   certificate     مدرک                   📜
#   office          منصب / مناصب            🏛       «سیاست» = policy
#   back            بازگشت                 🔙       every screen has one, except the profile itself
#   currency        نیل (Nil، پول بازی)             always through format.money: «۵٬۰۰۰ نیل»
#
# Voice: address the player as «شما», polite and direct. No exclamation marks
# except in the one-time welcome. At most one emoji per line, at the head of
# the line, and only the anchor of the concept that line is about. A screen
# reads: a title line, then the facts, then one hint.
#
# Separator: facts that share one line are separated by « - », a plain
# hyphen with ONE SPACE ON EACH SIDE: «📖 دوره - ۲ ساعت مانده». Never «·»
# (it reads like a decimal mark beside Persian digits), and never a hyphen
# touching a number, which reads as a minus sign. The snapshot lint
# (screens/screentest) fails the build on either.
#
# Commands: a Persian screen never shows English command syntax. Where a
# screen tells the player what to type, it uses the Persian word from
# command_alias below («واریز ۵۰۰۰»), or better, a button.
#
# Numbers: never type a number into a message. The code writes every number
# in Persian digits with «٬» between thousands and «٫» as the decimal mark
# (format.digits, format.group_separator, format.decimal_separator), and turns
# durations into «۲ ساعت و ۱۵ دقیقه» through format.duration_*. A count out of
# a maximum reads «{energy} از {max_energy}». Percent is written «٪» after the
# number.
#
# Always use the نیم‌فاصله (ZWNJ) where Persian needs it: «می‌توانید»،
# «مهارت‌ها»، «به‌روزرسانی»، «دست‌به‌دست».
#
# Button labels name the place they open («نقشه»), and messages refer to
# buttons by that same label in «گیومه», without the emoji.
# ---------------------------------------------------------------------------

profile:
  # The one-time welcome. It is shown above the profile only while the player
  # has not earned any XP, and it takes no placeholders. (The key name is
  # pinned by internal/telegram/i18n's shipped-locale test.)
  body: |-
    👋 به بازی خوش آمدید!
    اینجا خانهٔ شماست: وضعیت، پول و کارتان را همین‌جا می‌بینید. با دکمه‌های پایین به هر جای بازی بروید.

  name: "👤 {name}"
  city: "📍 {city}"
  # Where in the city the player stands, or the walk they are on.
  place: "📍 {place} - {city}"
  walking: "🚶 در راه {place} - {remaining} مانده - رسیدن ساعت {time}"
  travelling: "🧭 در راه {city} - {remaining} مانده"
  level: "⭐ سطح {level} - {xp_to_next} امتیاز تجربه تا سطح {next_level}"
  level_plain: "⭐ سطح {level}"
  level_max: "⭐ سطح {level} - بالاترین سطح بازی"
  energy: "⚡ انرژی: {energy} از {max_energy}"
  energy_refilling: "⚡ انرژی: {energy} از {max_energy} - {duration} تا پر شدن"
  health: "❤️ سلامت: {health} از {max_health}"
  # پول بازیکن: نقدی که همراه دارد و موجودی بانکش. خصوصی است و فقط خود
  # بازیکن آن را می‌بیند.
  cash: "💵 پول نقد: {cash}"
  bank: "🏦 موجودی بانک: {bank}"
  # The public player code, and how a friend uses it. The code is the one
  # identifier a player is meant to see and share; see
  # internal/shared/playercode. social.search reuses profile.code.
  code: "🆔 کد بازیکن: {code}"
  code_hint: "دوستانتان با فرستادن «پیدا {code}» شما را پیدا می‌کنند."
  unavailable: "پروفایل شما الان در دسترس نیست. چند لحظهٔ دیگر دوباره امتحان کنید."

  # The player's work and studies, between their condition and their money.
  job: "💼 {title} در {city} - {pay} برای هر شیفت"
  job_none: "💼 هنوز شغلی ندارید"
  shift_running: "⏳ در حال شیفت - {remaining} مانده"
  shift_ending: "⏳ شیفت تمام شد؛ دستمزد در راه است"
  course: "📖 {course} - {remaining} مانده"
  course_finishing: "📖 {course} - چند لحظهٔ دیگر تمام می‌شود"
  course_paused: "📖 {course} - متوقف (در زندان)، {remaining} مانده"
  # A player in jail sees it first on the home screen.
  jail: "⛓ در زندان هستید - {remaining} مانده"
  jail_in: "⛓ در زندان {city} هستید - {remaining} مانده"
  jail_blocks: "تا آزادی نمی‌توانید سفر کنید، شیفت کار کنید، از بانک برداشت کنید یا دورهٔ تازه‌ای شروع کنید؛ دورهٔ در حال گذراندن هم متوقف می‌ماند."
  certificates: "📜 {count} مدرک"
map:
  cities_title: "🧭 سفر به شهر دیگر"
  title: "🗺 نقشه"
  origin: "📍 شما در {city} هستید."
  destinations: "از اینجا به این شهرها می‌توانید سفر کنید:"
  destination: "• {city} - {distance} کیلومتر"
  no_routes: "فعلاً از اینجا راهی به شهر دیگری نیست. کمی بعد با «به‌روزرسانی» دوباره نگاه کنید."
  no_city: "هنوز در هیچ شهری مستقر نشده‌اید. پس از استقرار، مقصدهای سفر همین‌جا نمایش داده می‌شوند."
  travelling: "🧭 در راه {city} هستید. پس از رسیدن می‌توانید سفر تازه‌ای را آغاز کنید."

travel:
  # The choice of transport, shown when a destination is pressed on the Map.
  # Nothing departs until a mode is chosen. {fare} and {cash} arrive already
  # formatted through format.money; {wait} is the real time the trip takes.
  options_title: |-
    🧭 سفر به {to}
    📍 مبدأ: {from}
  options_choose: "با چه وسیله‌ای می‌روید؟"
  option: "• {mode} - {fare} - {wait} در راه - {energy} انرژی"
  option_busy: "• {mode} - {fare} (مسیر شلوغ) - {wait} در راه - {energy} انرژی"
  requoted: "⚠️ کرایه از وقتی که قیمت‌ها را دیدید تغییر کرده است. پولی کسر نشد؛ قیمت‌های تازه را ببینید و دوباره انتخاب کنید."
  cash: "💵 پول نقد شما: {cash}"
  # The fare of the chosen mode and the ways to pay it: the step between
  # choosing a mode and departing.
  checkout_title: |-
    🧭 سفر به {to} با {mode}
    📍 مبدأ: {from}
  checkout_fare: "💰 کرایه: {fare}"
  checkout_fare_busy: "💰 کرایه: {fare} (مسیر شلوغ)"
  checkout_wait: "⏳ {wait} در راه"
  checkout_energy: "⚡ {energy} انرژی"
  # Shown only if a mode has neither a translation nor an authored name.
  mode_unnamed: وسیلهٔ دیگر
  # What a journey that costs nothing shows instead of a price of zero.
  free: "رایگان"
  started: |-
    🧭 سفر با {mode} به سوی {to} آغاز شد
    {from} را ترک کردید و {duration} دیگر می‌رسید.
    ⚡ {energy} انرژی مصرف شد.
  started_fare: "💵 کرایهٔ پرداخت‌شده: {fare}"
  # زمان رسیدن سفر، به وقت منطقهٔ زمانی بازیکن.
  arrives_at: "🕒 ساعت رسیدن: {time}"
  status_mode: "وسیلهٔ سفر: {mode}"
  status: |-
    🧭 در راه {to}
    📍 مبدأ: {from}
    ⏳ {remaining} تا رسیدن
  status_arriving: |-
    🧭 در راه {to}
    📍 مبدأ: {from}
    ⏳ چند لحظهٔ دیگر می‌رسید.
  arrived: "📍 به {city} رسیدید."
  arrived_xp: "⭐ {xp} امتیاز تجربه گرفتید."
  # Added to the arrival notice when the XP of the journey lifted the player
  # to a new level; {level} is the highest level reached.
  arrived_level: "⭐ تبریک؛ به سطح {level} رسیدید."
  none: "الان در سفر نیستید. برای سفر، «نقشه» را باز کنید."
  same_city: "همین حالا در این شهر هستید. مقصد دیگری را از «نقشه» انتخاب کنید."
  no_route: "از شهری که در آن هستید راهی به آنجا نیست. یکی از مقصدهای «نقشه» را انتخاب کنید."
  mode_unavailable: "این وسیله در این مسیر رفت‌وآمد نمی‌کند. مقصد را دوباره از «نقشه» بزنید تا وسیله‌های همین مسیر را ببینید."

# Transport mode names, keyed on the mode's content code
# (configs/content/transport.yml). A mode with no entry here falls back to its
# authored name.
transport_mode:
  bus: اتوبوس
  car: خودرو
  train: قطار
  flight: هواپیما

skills:
  title: "🛠 مهارت‌ها"
  empty: "هنوز مهارتی ندارید. با کار کردن و گذراندن دوره‌ها مهارت به دست می‌آورید و همین‌جا می‌بینیدشان."
  line: "• {skill} - سطح {level} - {percent}٪ تا سطح بعد"
  line_max: "• {skill} - سطح {level} - بالاترین سطح"

skill:
  programming: برنامه‌نویسی
  mechanics: مکانیک
  medicine: پزشکی
  management: مدیریت
  finance: امور مالی
  engineering: مهندسی
  cooking: آشپزی
  logistics: لجستیک
  driving: رانندگی
  stealth: پنهان‌کاری
  lockpicking: قفل‌بازکنی
  deception: فریبکاری
  streetwise: خیابان‌شناسی

# City display names, keyed on the city's content code (configs/content/cities.yml).
# The code never changes after a city ships; the name here may. A city with no
# entry here falls back to the `name:` in cities.yml, but a test fails CI until
# every shipped city is translated in every locale.
city:
  ostmarch: استمارچ
  fenwick_span: فنویک اسپن
  aldrin_hollow: آلدرین هالو
  brennhaven: برنهاون
  kessmoor: کسمور
  calderis: کالدریس
  vantor_reach: ونتور ریچ

# The answer to a message the game did not understand. The commands listed in
# help.body are the shortcuts internal/gateway/routing accepts; keep the two
# in step.
help:
  unknown: "این پیام را متوجه نشدم."
  body: |-
    بازی با دکمه‌ها پیش می‌رود. این کلمه‌ها را هم می‌توانید بفرستید، بدون «/»:
    • پروفایل - خانه و وضعیت شما
    • دزدی - خلاف، فقط در گروه شهر
    • زندان - وضعیت زندان شما و وثیقه
    • نقشه - نقشهٔ شهر شما و رفتن به جاهای آن
    • شغل - شغل من؛ «استخدام» فرصت‌های شغلی است
    • آموزش - دوره‌ها
    • بانک - موجودی؛ «واریز ۵۰۰۰» و «برداشت ۵۰۰۰»
    • پرداخت - پول دادن به بازیکن دیگر؛ در گروه، روی پیام او «پرداخت ۵۰۰۰» را پاسخ بدهید
    • مهارت‌ها
    • دوستان - و «پیدا» با کد بازیکن یا نام کاربری
    • شهر - مناصب و سیاست‌های شهر؛ «منصب» منصب شما
    • تنظیمات
    • راهنما - همین صفحه

settings:
  title: "⚙️ تنظیمات"
  language: "🌐 زبان بازی: {language}"
  language_changed: "✅ زبان بازی به {language} تغییر کرد."

# Language names, keyed on the locale file's name (fa.yml -> language.fa).
# Each language is written in ITSELF, in every locale: a player who landed in
# a language they cannot read must still be able to find their own. A new
# locale file needs its name added here, in every locale; a test enforces it.
language:
  fa: فارسی
  en: English

social:
  unknown_player: یک بازیکن
  # A search names one player exactly, in one of three forms; there is no
  # search by display name. {query} is echoed only for a username (with its
  # @) or a code — never for a Telegram ID, which no screen prints.
  search:
    help: |-
      🔎 پیدا کردن بازیکن
      بازیکن را با یکی از این‌ها پیدا کنید:
      • نام کاربری تلگرام: «پیدا @username»
      • کد بازیکن: «پیدا K7Q2M9A»
      • شناسهٔ عددی تلگرام: «پیدا» و پس از آن شناسه
    title: "🔎 نتیجهٔ جست‌وجو"
    player: "👤 {player}"
    self: "این خودتان هستید. کد بازیکنتان را به دوستانتان بدهید تا پیدایتان کنند."
    not_found_username: "بازیکنی با نام کاربری {query} پیدا نشد. شاید نام کاربری‌اش را عوض کرده یا هنوز بازی را شروع نکرده است؛ کد بازیکنش را از خودش بپرسید."
    not_found_code: "بازیکنی با کد {query} پیدا نشد. کد را دوباره بررسی کنید؛ برای جست‌وجوی نام کاربری، @ را اول آن بگذارید."
    not_found_id: "بازیکنی با این شناسهٔ تلگرام پیدا نشد. شاید هنوز بازی را شروع نکرده است."
  friends:
    title: "👥 دوستان"
    empty: |-
      هنوز دوستی ندارید.
      برای پیدا کردن بازیکن، «پیدا» را با نام کاربری یا کد بازیکنش بفرستید؛ مثلاً «پیدا @username»
    line: "• {player}"
    # A request this player sent, waiting for the other one.
    line_pending: "• {player} - در انتظار پاسخ او"
    # A request the other player sent; it has the accept button.
    line_incoming: "• {player} - می‌خواهد با شما دوست شود"
    line_blocked: "• {player} - مسدود"
  friend:
    requested: "✅ درخواست دوستی برای {player} فرستاده شد. پس از پذیرفتن، در فهرست دوستانتان می‌آید."
    requested_anon: "✅ درخواست دوستی فرستاده شد. پس از پذیرفتن، در فهرست دوستانتان می‌آید."
    accepted: "✅ شما و {player} از این پس دوست هستید."
    accepted_anon: "✅ درخواست دوستی را پذیرفتید. این بازیکن حالا در فهرست دوستان شماست."
    # Notices to the other player, sent to their private chat.
    incoming: "👥 {player} می‌خواهد با شما دوست شود."
    incoming_anon: "👥 بازیکنی می‌خواهد با شما دوست شود."
    incoming_hint: برای پذیرفتن، دکمهٔ زیر را بزنید. درخواست در فهرست دوستانتان هم می‌ماند.
    now_friends: "👥 {player} درخواست دوستی شما را پذیرفت. از این پس دوست هستید."
    now_friends_anon: "👥 درخواست دوستی شما پذیرفته شد. این بازیکن حالا در فهرست دوستان شماست."

page:
  indicator: "صفحهٔ {page} از {pages}"

format:
  # Which way the language is written: "rtl" or "ltr". A name, a code or a
  # username written the other way is isolated inside a sentence so it cannot
  # scramble the line around it.
  direction: "rtl"
  # How numbers are written: the ten digits from zero to nine, the mark
  # between groups of three digits, and the decimal mark. The code writes
  # every number through these; never type digits into a message by hand.
  digits: "۰۱۲۳۴۵۶۷۸۹"
  group_separator: "٬"
  decimal_separator: "٫"
  duration_hm: "{hours} ساعت و {minutes} دقیقه"
  duration_h: "{hours} ساعت"
  duration_m: "{minutes} دقیقه"
  duration_s: "{seconds} ثانیه"
  # زمان ساعتی، به وقت منطقهٔ زمانی بازیکن. {hour} و {minute} همیشه دورقمی
  # و با همان رقم‌های بالا هستند.
  clock: "{hour}:{minute}"
  # A sum of money. {amount} is already written with the digits and the
  # group separator above.
  money: "{amount} نیل"

button:
  refresh: "🔄 به‌روزرسانی"
  back: "🔙 بازگشت"
  next: "بعدی ⬅️"
