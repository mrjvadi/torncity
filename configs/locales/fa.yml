# Playing in a group (internal/gateway/groups). A screen with a player's own
# details is shown only to that player; these lines are all the rest of the
# group ever sees of it, so they name no screen and no number.
group:
  # A press on a button that belongs to another player. Shown in a popup to
  # the presser only; at most 200 characters.
  not_yours: این دکمه متعلق به بازیکن دیگری است. برای دیدن صفحهٔ خودتان، دستور را خودتان بفرستید.
  # Posted in the group (or shown as a popup) when the screen went to the
  # player's private chat with the bot.
  sent_privately: پاسخ شما در گفت‌وگوی خصوصی با ربات فرستاده شد.
  # The player has never started the bot, so nothing can be sent privately.
  start_bot_first: این صفحه فقط برای شماست. ابتدا ربات را در گفت‌وگوی خصوصی باز کنید و «شروع» را بزنید تا صفحه همان‌جا نمایش داده شود.
  # The button under either line; it opens the bot's private chat.
  open_bot: باز کردن ربات
  # Posted once when the bot is added to a group.
  welcome: |-
    سلام به همه! از این پس می‌توانید در همین گروه بازی کنید.
    صفحه‌هایی که اطلاعات شخصی شما را دارند فقط به خود شما نشان داده می‌شوند، نه به بقیهٔ گروه. برای شروع از منوی دستورها استفاده کنید.
  # Descriptions in the group command menu, one per command in
  # groups.menu (configs/config.yml).
  menu:
    profile: پروفایل شما
    skills: مهارت‌های شما
    map: نقشهٔ شهرها
    social: دوستان شما
    find: جست‌وجوی بازیکن با کد بازیکن
    settings: تنظیمات
    help: راهنما

# بانک: پول نقد همراه بازیکن و موجودی حساب بانکی. بانک خدمتی شهری است، پس
# واریز و برداشت فقط در شهر انجام می‌شود؛ پرداخت کارتی از همه‌جا ممکن است و
# پول نقد فقط بین دو بازیکنِ هم‌شهر دست‌به‌دست می‌شود. کارمزدها سیاست هر شهر
# است و همیشه پیش از جابه‌جایی پول نشان داده می‌شود.
bank:
  title: "🏦 بانک"
  branch: "📍 شعبهٔ {city}"
  withdrawal_fee: کارمزد برداشت در این شهر {percent}٪ است و روی مبلغ برداشت اضافه می‌شود. واریز همیشه رایگان است.
  withdrawal_free: واریز و برداشت در این شهر کارمزد ندارد.
  closed_travelling: "🧭 شما در سفر هستید. بانک در هر شهری به شما خدمت می‌دهد؛ پرداخت کارتی از همه‌جا ممکن است."
  closed_no_city: هنوز در شهری مستقر نشده‌اید، پس بانکی در دسترس نیست.
  hint: یکی از مبلغ‌های زیر را انتخاب کنید یا مبلغ را بنویسید؛ مثلاً /bank deposit 5000 یا /bank withdraw 5000
  pay_hint: برای پرداخت به یک بازیکن، /pay را همراه با نام کاربری یا کد بازیکن او بفرستید؛ مثلاً /pay @username
