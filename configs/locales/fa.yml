# Group founding (docs/adr/0028-world-and-settlements.md section 3): a group
# admin registers the group and the game places the new village on the map.

# The founding form (docs/adr/0028-world-and-settlements.md section 3): «ساخت شهر»
# opens a draft in the group; the founder completes the village's details in
# the game client, and only submitting the form founds the village.

# Playing in a group (internal/gateway/groups). A screen with a player's own
# details is shown only to that player; these lines are all the rest of the
# group ever sees of it, so they name no screen and no number.
group:
  # A press on a button that belongs to another player. Shown in a popup to
  # the presser only; at most 200 characters.
  not_yours: این دکمه متعلق به بازیکن دیگری است. برای دیدن صفحهٔ خودتان، دستور را خودتان بفرستید.
  # Posted in the group (or shown as a popup) when the screen went to the
  # player's private chat with the bot.
  sent_privately: پاسخ شما در گفت‌وگوی خصوصی با ربات فرستاده شد.
  # The player has never started the bot, so nothing can be sent privately.
  start_bot_first: "این صفحه فقط برای شماست. ابتدا ربات را در گفت‌وگوی خصوصی باز کنید و «شروع» را بزنید تا صفحه همان‌جا نمایش داده شود."
  # The button under either line; it opens the bot's private chat.
  open_bot: باز کردن ربات
  # In a group, the one button that stands in for every private-chat button
  # of a screen (the bank, the bag, the job…): it opens the bot's private
  # chat, where those live.
  continue_private: "🔒 ادامه در پی‌وی"
  # Web-app buttons do not open inside a group (Telegram allows them only in
  # a private chat), so under each one sits a button that sends it there.
  webapp_send_private: "📩 ارسال در پیوی من"
  webapp_sent: "📩 در پیوی برایت فرستادم."
  webapp_start_bot: "ابتدا ربات را در پی‌وی باز کنید و «شروع» را بزنید، بعد دوباره این دکمه را بزنید."
  webapp_slow_down: "⏳ همین الان فرستاده شد؛ پیوی خودتان را ببینید."
  webapp_unavailable: "این بخش فعلاً در دسترس نیست. کمی بعد دوباره امتحان کنید."
  webapp_text: "🌐 برای ورود به بازی روی دکمهٔ زیر بزنید تا در همین گفت‌وگو باز شود."
  webapp_text_founding: "🏡 برای پر کردن فرم تأسیس شهر روی دکمهٔ زیر بزنید تا در همین گفت‌وگو باز شود."
  webapp_open: "🌐 باز کردن"
  # Posted once when the bot is added to a group.
  welcome: |-
    سلام به همه! از این پس می‌توانید در همین گروه بازی کنید؛ برای شروع «پروفایل» یا «راهنما» را بفرستید.
    خلاف و زندان در گروه است؛ پول، بانک، سفر و تنظیمات شما خصوصی می‌ماند و در پی‌وی ربات انجام می‌شود.
  # Added to the welcome when the bot joins without admin rights while its
  # privacy mode is on: in that group it would see only slash-commands and
  # replies to its own messages.
  make_admin: "🛠 مدیران گروه: برای اینکه کلمه‌هایی مثل «دزدی» و «پروفایل» بدون «/» کار کنند، ربات را مدیر (ادمین) گروه کنید. تا آن وقت دستورها را با «/» بفرستید."

