  # city carries these codes any more; the names stay so history that
  # mentions them (past events, old records) still reads.
  ostmarch: استمارچ
  fenwick_span: فنویک اسپن
  aldrin_hollow: آلدرین هالو
  brennhaven: برنهاون
  kessmoor: کسمور
  calderis: کالدریس
  vantor_reach: ونتور ریچ

# Currency display names, keyed on the currency code (the currencies table).
# SUP is the neutral money of Support; NIL is the premium currency
# (docs/adr/0029-currencies-and-premium.md).
currency:
  SUP: ساپ
  NIL: نیل

# The answer to a message the game did not understand. The commands listed in
# help.body are the shortcuts internal/gateway/routing accepts; keep the two
# in step.
help:
  unknown: "این پیام را متوجه نشدم."
  body: |-
    بازی با دکمه‌ها پیش می‌رود. این کلمه‌ها را هم می‌توانید بفرستید، بدون «/»:
    • پروفایل - خانه و وضعیت شما
    • دزدی - خلاف، فقط در گروه شهر
    • زندان - وضعیت زندان شما و وثیقه
    • نقشه - نقشهٔ شهر شما و رفتن به جاهای آن
    • شغل - شغل من؛ «استخدام» فرصت‌های شغلی است
    • آموزش - دوره‌ها
    • بانک - موجودی؛ «واریز 5000» و «برداشت 5000»
    • پرداخت - پول دادن به بازیکن دیگر؛ در گروه، روی پیام او «پرداخت 5000» را پاسخ بدهید
    • مهارت‌ها
    • دوستان - و «پیدا» با کد بازیکن یا نام کاربری
    • شهر - مناصب و سیاست‌های شهر؛ «منصب» منصب شما
    • ارتش - وزارت دفاع و نیروهای مسلح کشور؛ «تحریم» و «پیمان» دیپلماسی آن
    • بیمارستان - سلامت شما، بستری و درمان
    • مأموریت - مأموریت‌های من؛ «تابلو» تابلوهای مأموریت شهر
    • جناح - جناح من؛ «جناح‌ها» جناح‌های شهر
    • وام - بانک ملی، امتیاز اعتباری و وام‌ها؛ «پس‌انداز» و «بیمه»
    • بورس - سهام شرکت‌ها؛ «سبد» سرمایهٔ شما؛ «طلا» طلافروشی
    • تنظیمات
    • راهنما - همین صفحه

# Language names, keyed on the locale file's name (fa.yml -> language.fa).
# Each language is written in ITSELF, in every locale: a player who landed in
# a language they cannot read must still be able to find their own. A new
# locale file needs its name added here, in every locale; a test enforces it.
language:
  fa: فارسی
  en: English

page:
  indicator: "صفحهٔ {page} از {pages}"

format:
  # Which way the language is written: "rtl" or "ltr". A name, a code or a
  # username written the other way is isolated inside a sentence so it cannot
  # scramble the line around it.
  direction: "rtl"
  # How numbers are written: the ten digits from zero to nine, the mark
  # between groups of three digits, and the decimal mark. The code writes
  # every number through these; never type digits into a message by hand.
  #
  # Western (ASCII) digits and Western separators, by product decision: a
  # Persian sentence with Persian digits still has to be compared, copied and
  # typed back by a player on an ordinary keyboard, and every Persian app a
  # player already uses for money (banking, e-commerce, ride-hailing) shows
  # amounts in Western digits with a comma. Matching that is what reads as
  # native, not the Perso-Arabic digit shapes.
  digits: "0123456789"
  group_separator: ","
  decimal_separator: "."
  # Between the plain-noun items of a short list (a settlement's starting
  # buildings, say) — punctuation, not grammar, but still locale data: a
  # Persian sentence uses the Arabic comma, never the ASCII one.
  list_separator: "، "
  duration_hm: "{hours} ساعت و {minutes} دقیقه"
  duration_h: "{hours} ساعت"
  duration_m: "{minutes} دقیقه"
  duration_s: "{seconds} ثانیه"
  # زمان ساعتی، به وقت منطقهٔ زمانی بازیکن. {hour} و {minute} همیشه دورقمی
  # و با همان رقم‌های بالا هستند.
  clock: "{hour}:{minute}"
  # A sum of money. {amount} is already written with the digits and the
  # group separator above.
  money: "{amount} ساپ"
  # An amount in a settlement's own money, with the SUP amount beside it (ADR 0033 6.9).
  money_local: "{amount} {name} ({sup})"
  # A sum in a settlement's own money that was never SUP (a payment between two neighbours in it).
  units: "{amount} {name}"
  # An amount of Nil, the premium unit, shown only as a quote (ADR 0046 7.4).
  nil: "{amount} نیل"
  # A date: the calendar it is counted in (jalali, the Solar Hijri calendar,
  # or gregorian), its shape, and the month names.
  calendar: jalali
  date: "{day} {month} {year}"
  month:
    m1: فروردین
    m2: اردیبهشت
    m3: خرداد
    m4: تیر
    m5: مرداد
    m6: شهریور
    m7: مهر
    m8: آبان
    m9: آذر
    m10: دی
    m11: بهمن
    m12: اسفند

