  withdrew: "✅ {amount} به‌صورت نقد برداشت شد."
  withdrew_fee: "✅ {amount} به‌صورت نقد برداشت شد. کارمزد: {fee}"
  error:
    not_in_city: بانک فقط در شهر باز است. پس از رسیدن به مقصد می‌توانید واریز و برداشت کنید؛ پرداخت کارتی از همه‌جا ممکن است.
    not_together: پول نقد را فقط به بازیکنی می‌توانید بدهید که با شما در یک شهر باشد. به‌جای آن با کارت پرداخت کنید؛ پرداخت کارتی از همه‌جا ممکن است.
