# Player-held offices (docs/adr/0015-player-held-offices.md): the offices and
# policies of a city, the office holder's own screen, the flow that changes a
# policy, and the public history of changes.
#
# Terms: office منصب 🏛 (a seat a player holds: شهردار، رئیس‌جمهور), policy
# سیاست (what an office decides: نرخ مالیات، عوارض), vacant «خالی», acting
# «سرپرستی» (a deputy exercising a vacant office's powers), announced «اعلام»
# (a change is public at once and «اجرا» after its notice), public history
# «تاریخچهٔ عمومی» 📜. Percent is «{value}٪»; money goes through format.money.
