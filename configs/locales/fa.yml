# Player-held offices (docs/adr/0015-player-held-offices.md): the offices and
# policies of a city, the office holder's own screen, the flow that changes a
# policy, and the public history of changes.
#
# Terms: office منصب 🏛 (a seat a player holds: شهردار، رئیس‌جمهور), policy
# سیاست (what an office decides: نرخ مالیات، عوارض), vacant «خالی», acting
# «سرپرستی» (a deputy exercising a vacant office's powers), announced «اعلام»
# (a change is public at once and «اجرا» after its notice), public history
# «تاریخچهٔ عمومی» 📜. Percent is «{value}٪»; money goes through format.money.
gov:
  player: "{name} ({code})"
  list_separator: "، "
  percent: "{value}٪"
  span_d: "{days} روز"
  span_dh: "{days} روز و {hours} ساعت"
  unnamed_office: یک منصب
  unnamed_lever: یک سیاست
  city:
    title: "🏛 مناصب و سیاست‌های {city}"
    title_plain: "🏛 مناصب و سیاست‌ها"
    no_city: "هنوز در هیچ شهری مستقر نشده‌اید. پس از استقرار، مناصب و سیاست‌های شهرتان همین‌جا نمایش داده می‌شوند."
    place: "📍 {place}"
    offices: "مناصب:"
    no_offices: "• منصبی در اینجا تعریف نشده است."
    policies: "سیاست‌ها:"
  office:
    held: "• {office}: {players}"
    seats: "• {office}: {held} از {seats} کرسی · {players}"
    acting: "• {office}: خالی · سرپرست: {deputy} {players}"
    vacant: "• {office}: خالی"
  lever:
    line_default: "• {lever}: {value} · پیش‌فرض"
    line_set: "• {lever}: {value} · تعیین‌شده به دست {player}"
    pending: "  ⏳ {when} دیگر به {value} تغییر می‌کند"
  mine:
    title: "🏛 منصب من"
    none: "شما منصبی ندارید. فعلاً صاحبان مناصب از سوی مدیران بازی منصوب می‌شوند؛ انتخابات بعداً به بازی می‌آید."
    seat: "📍 {office} {place}"
    acting_for: "شما سرپرست منصب خالی {office} هستید."
    no_levers: "این منصب فعلاً سیاستی ندارد که بتوانید تغییرش دهید."
    lever: "• {lever}: {value}"
    lever_vote: "• {lever}: {value} · با رأی‌گیری تعیین می‌شود که هنوز در دسترس نیست"
  edit:
    title: "🏛 {lever} — {place}"
    bounds: "بازهٔ مجاز: {min} تا {max}"
    default: "مقدار پیش‌فرض: {value}"
    notice: "هر تغییر {notice} پس از اعلام اجرا می‌شود."
    cooldown: "میان دو تغییر دست‌کم {cooldown} فاصله لازم است."
    cooldown_active: "⏳ {wait} دیگر می‌توانید این سیاست را دوباره تغییر دهید."
    draft: |-
      مقدار تازه: {value}
      با دکمه‌ها تنظیمش کنید و سپس «بازبینی تغییر» را بزنید.
  confirm:
    title: "📝 تأیید تغییر"
    change: "{lever} در {place}: از {old} به {new}"
    notice: "این تغییر همین حالا اعلام می‌شود و {notice} بعد اجرا خواهد شد."
    cooldown: "پس از آن تا {cooldown} نمی‌توانید این سیاست را دوباره تغییر دهید."
  announced:
    title: "📢 تغییر اعلام شد"
    body: "{lever} در {place} از {old} به {new} تغییر می‌کند و {when} دیگر اجرا می‌شود. این تغییر در تاریخچهٔ عمومی ثبت شد."
  history:
    title: "📜 تاریخچهٔ سیاست‌های {city}"
    empty: هنوز هیچ سیاستی در اینجا تغییر نکرده است.
    change: "• {lever} ({place}): {old} ← {new}"
    by: "  اعلام {office} {player} · {ago} پیش"
    effective_in: "  ⏳ {when} دیگر اجرا می‌شود"
    effective_since: "  {when} است که اجرا می‌شود"
  button:
    city: "🏛 مناصب و سیاست‌ها"
    history: "📜 تاریخچهٔ سیاست‌ها"
    my_office: "🏛 منصب من"
    change: "✏️ {lever} — {place}"
    down: "➖ {amount}"
    up: "➕ {amount}"
    min: حداقل ({value})
    default: پیش‌فرض ({value})
    max: حداکثر ({value})
    review: "📝 بازبینی تغییر"
    confirm: "✅ تأیید"
    cancel: "✖️ انصراف"
  refusal:
    not_holder: "تنها {office} می‌تواند این سیاست را تغییر دهد. اگر این منصب را داشتید، ممکن است جایگزین شده باشید."
    requires_vote: این سیاست با رأی‌گیری در {office} تعیین می‌شود و رأی‌گیری هنوز در دسترس نیست.
    out_of_range: "این مقدار بیرون از بازهٔ مجاز {min} تا {max} است. مقداری در همین بازه انتخاب کنید."
    out_of_range_plain: "این مقدار بیرون از بازهٔ مجاز است. مقداری در بازهٔ مجاز انتخاب کنید."
    cooldown: این سیاست به‌تازگی تغییر کرده است. {wait} دیگر می‌توانید دوباره تغییرش دهید.
    cooldown_later: این سیاست به‌تازگی تغییر کرده است. کمی بعد دوباره امتحان کنید.
    unsupported: این نوع سیاست هنوز قابل تغییر نیست.
    unknown_lever: این سیاست دیگر وجود ندارد. برای دیدن سیاست‌هایی که می‌توانید تغییر دهید، «منصب من» را باز کنید.
    unknown_place: این مکان پیدا نشد. «نقشه» را باز کنید و دوباره امتحان کنید.
    wrong_place: این سیاست در این مکان کاربردی ندارد.
    office_not_found: چنین منصبی در اینجا وجود ندارد.
    office_occupied: این منصب در اختیار کس دیگری است.
    office_vacant: این منصب از قبل خالی است.
    already_holds: شما همین حالا این منصب را دارید.
    incompatible: این منصب را نمی‌توان هم‌زمان با منصبی که اکنون دارید در اختیار داشت.

# Office names, keyed on the office's content code (configs/content/governance.yml).
office:
  mayor: شهردار
  deputy_mayor: معاون شهردار
  city_council: شورای شهر
  police_chief: رئیس پلیس
  deputy_police_chief: معاون رئیس پلیس
  president: رئیس‌جمهور

# Policy names, keyed on the lever's content code (configs/content/governance.yml).
lever:
  city:
    tax_rate: نرخ مالیات
    immigration_fee: عوارض مهاجرت
    bank_withdrawal_fee: کارمزد برداشت از بانک
    card_transfer_fee: کارمزد انتقال کارتی
    transit_fare: کرایهٔ حمل‌ونقل عمومی
    minimum_wage: حداقل دستمزد
    income_tax: مالیات بر درآمد
    shift_window_hours: بازهٔ ساعات کار (ساعت بازی)
    shifts_before_fatigue: شیفت‌های پیش از خستگی
    crime_report_fee: هزینهٔ ثبت شکایت
    bail_per_hour: وثیقه به ازای هر ساعت بازی
    jail_term_multiplier: مدت حبس (درصد از میزان پایه)
    fine_multiplier: جریمه‌ها (درصد از میزان پایه)
    investigation_effort: شدت پیگیری پرونده‌ها
  country:
    border_tariff: تعرفهٔ مرزی

# Names of places above a city, keyed on the jurisdiction's content code.
# Cities are named under city.* above.
jurisdiction:
  default_country: مشترک‌المنافع

# Playing in a group (internal/gateway/groups). A screen with a player's own
# details is shown only to that player; these lines are all the rest of the
# group ever sees of it, so they name no screen and no number.
group:
  # A press on a button that belongs to another player. Shown in a popup to
  # the presser only; at most 200 characters.
  not_yours: این دکمه متعلق به بازیکن دیگری است. برای دیدن صفحهٔ خودتان، دستور را خودتان بفرستید.
  # Posted in the group (or shown as a popup) when the screen went to the
  # player's private chat with the bot.
  sent_privately: پاسخ شما در گفت‌وگوی خصوصی با ربات فرستاده شد.
  # The player has never started the bot, so nothing can be sent privately.
  start_bot_first: "این صفحه فقط برای شماست. ابتدا ربات را در گفت‌وگوی خصوصی باز کنید و «شروع» را بزنید تا صفحه همان‌جا نمایش داده شود."
  # The button under either line; it opens the bot's private chat.
  open_bot: باز کردن ربات
  # Posted once when the bot is added to a group.
  welcome: |-
    سلام به همه! از این پس می‌توانید در همین گروه بازی کنید؛ برای شروع /start را بفرستید.
    پول، بانک و تنظیمات شما خصوصی می‌ماند: این صفحه‌ها در گفت‌وگوی خصوصی با ربات برای شما فرستاده می‌شوند.

# Descriptions in the bot's command menu, shown in private chats only: a
# group shows no command menu at all. One per command in menu.commands
# (configs/config.yml).
command_menu:
  profile: پروفایل شما
  skills: مهارت‌های شما
  map: نقشهٔ شهرها
  social: دوستان شما
  find: جست‌وجوی بازیکن با کد بازیکن
  settings: تنظیمات
  help: راهنما
  job: "شغل من"
  study: "آموزش و دوره‌ها"
  bank: "بانک و پول شما"
  city: "مناصب و سیاست‌های شهر"
  crime: "دنیای زیرزمینی: خلاف، زندان و پرونده‌های شما"

# بانک: پول نقد همراه بازیکن و موجودی حساب بانکی. بانک خدمتی شهری است، پس
# واریز و برداشت فقط در شهر انجام می‌شود؛ پرداخت کارتی از همه‌جا ممکن است و
# پول نقد فقط بین دو بازیکنِ هم‌شهر دست‌به‌دست می‌شود. کارمزدها سیاست هر شهر
# است و همیشه پیش از جابه‌جایی پول نشان داده می‌شود.
bank:
  title: "🏦 بانک"
  branch: "📍 شعبهٔ {city}"
  withdrawal_fee: "کارمزد برداشت در این شهر {percent}٪ است و به مبلغ برداشت اضافه می‌شود. واریز همیشه رایگان است."
  withdrawal_free: واریز و برداشت در این شهر کارمزد ندارد.
  closed_travelling: "🧭 در سفر هستید. واریز و برداشت پس از رسیدن به هر شهری ممکن است؛ پرداخت کارتی از همه‌جا انجام می‌شود."
  closed_no_city: "هنوز در هیچ شهری مستقر نشده‌اید، پس بانکی در دسترس نیست."
  hint: "مبلغی را از دکمه‌ها انتخاب کنید یا خودتان بنویسید؛ مثلاً /bank deposit 5000"
  pay_hint: "💸 برای پرداخت به بازیکن دیگر، /pay را با نام کاربری یا کد بازیکن او بفرستید؛ مثلاً /pay @username"
  deposited: "✅ {amount} به حساب بانکی شما واریز شد."
  withdrew: "✅ {amount} نقد برداشت کردید."
  withdrew_fee: "✅ {amount} نقد برداشت کردید · کارمزد: {fee}"
  error:
    not_in_city: "بانک فقط در شهر باز است. پس از رسیدن به مقصد می‌توانید واریز و برداشت کنید؛ پرداخت کارتی از همه‌جا ممکن است."
    not_together: "پول نقد را فقط به بازیکنی می‌توانید بدهید که با شما در یک شهر است. به‌جای آن با کارت پرداخت کنید؛ پرداخت کارتی از همه‌جا ممکن است."
    self_payment: نمی‌توانید به خودتان پرداخت کنید.
    payee_not_found: "بازیکنی برای پرداخت پیدا نشد. نام کاربری یا کد بازیکن را بررسی کنید و دوباره امتحان کنید."
    invalid_amount: "مبلغ را به عدد صحیح بنویسید؛ مثلاً /bank deposit 5000"
    below_minimum: کمترین مبلغ مجاز {min} است.
    above_maximum: بیشترین مبلغ مجاز در هر بار {max} است.
    not_enough_cash: "پول نقد کافی ندارید. پول نقد همراه شما: {available}"
    not_enough_in_bank: |-
      موجودی بانک کافی نیست.
      این کار با کارمزد {needed} لازم دارد و موجودی شما {available} است.
    insufficient: "پول کافی برای این کار ندارید. موجودی‌هایتان را در «بانک» ببینید."
    unavailable: "بانک الان در دسترس نیست. چند لحظهٔ دیگر دوباره امتحان کنید."

# پرداخت به بازیکن دیگر. {player} نام آن بازیکن است.
pay:
  help: |-
    💸 پرداخت به بازیکن
    بازیکن را با یکی از این‌ها مشخص کنید:
    • نام کاربری تلگرام: /pay @username
    • کد بازیکن: /pay K7Q2M9A
    مبلغ و روش را هم می‌توانید بنویسید: /pay K7Q2M9A 5000 card
    پول نقد فقط وقتی دست‌به‌دست می‌شود که هر دو در یک شهر باشید؛ پرداخت کارتی از همه‌جا ممکن است.
  title: "💸 پرداخت به {player}"
  together: "📍 شما و {player} هر دو در {city} هستید؛ نقدی یا کارتی پرداخت کنید."
  apart: "شما و {player} در یک شهر نیستید، پس پرداخت نقدی ممکن نیست. پرداخت کارتی از همه‌جا انجام می‌شود."
  card_fee: "کارمزد پرداخت کارتی از {city} {percent}٪ است و به مبلغ اضافه می‌شود."
  card_free: پرداخت کارتی از {city} کارمزد ندارد.
  hint: "مبلغ دیگری در نظر دارید؟ بنویسید: /pay {code} 5000 card یا /pay {code} 5000 cash"
  confirm_cash: "💵 {amount} به‌صورت نقد به {player} داده شود؟"
  confirm_card: "💳 {amount} با کارت برای {player} فرستاده شود؟"
  confirm_card_fee: |-
    💳 {amount} با کارت برای {player} فرستاده شود؟
    کارمزد: {fee} · مجموع کسر از بانک: {total}
  sent_cash: "✅ {amount} نقد به {player} دادید."
  sent_card: "✅ {amount} با کارت برای {player} فرستادید."
  sent_card_fee: "✅ {amount} با کارت برای {player} فرستادید · کارمزد: {fee}"
  not_together: "{player} اینجا کنار شما نیست، پس نمی‌توانید به او پول نقد بدهید. به‌جای آن با کارت پرداخت کنید؛ پرداخت کارتی از همه‌جا ممکن است."
  received_cash: "💵 {player} مبلغ {amount} را نقد به شما داد."
  received_card: "💳 {player} مبلغ {amount} را با کارت برای شما فرستاد. این پول به حساب بانکی شما واریز شد."

