# entry here falls back to the `name:` in cities.yml, but a test fails CI until
# every shipped city is translated in every locale.
city:
  ostmarch: استمارچ
  fenwick_span: فنویک اسپن
  aldrin_hollow: آلدرین هالو
  brennhaven: برنهاون
