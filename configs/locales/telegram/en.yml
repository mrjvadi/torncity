construction:
  title: "⏳ Construction queue of {name}"
  empty: "Nothing is queued."
  line:
    queued: "📋 {building} - queued - not yet started"
    building: "🏗 {building} - under construction - finishes at {time} - {duration} left"
    work: "🏗 {building} - {percent}% built, {left} to go (it advances only by workers)"
  button:
    open: "🏗 {building}"
  standing_hint: "Tap a finished building to see it."

# Buying more land: the grid grows by a column east and a row north.
grow:
  title: "🗺 Expand the land of {name}"
  body: |-
    The land grows from {side}x{side} to {new_side}x{new_side}: {lots} new lots, {buildable} of them dry buildable ground.
    Price: {price}
    Treasury: {treasury}
  note: "Standing buildings stay where they are. Water and steep ground stay unbuildable. Each expansion costs more than the last."
  button: "✅ Confirm and expand"

# The panel of one placed building (internal/telegram/screens/village_building.go):
# what it is and what it does; demolishing is the last, quiet button.
building:
  view:
    title: "🏛 {building}"
    state_complete: "✅ Built and working."
    under_construction: "🏗 Under construction: {percent}% - finishes at {time} ({duration} left)."
    upkeep: "🧾 Upkeep: {amount} per period"
    demolish_ask: "🗑 This building is removed for good and its lot is free again; only part of its cost returns to the treasury. Are you sure?"
    demolish_yes: "🗑 Yes, demolish it"
    cancel_ask: "🛑 Construction stops and what was paid is not returned. Are you sure?"
    cancel_yes: "🛑 Yes, cancel the build"
  button:
    upgrade: "⬆️ Upgrade"
    demolish: "🗑 Demolish"
    cancel: "🛑 Cancel the build"
  desc:
    road: "A village road; it joins the lots and is the way the villagers walk. It does nothing else."
    civic_hall: "The village's seat of office, where the head runs the village. The treasury, knowledge and construction are reached from here."
    role:
      security: "Watches over the village and raises local security."
      craft: "A workshop, the base of making goods in the village."
      extraction: "Takes raw materials out of the ground."
      water_infra: "Brings and holds water for the village's life and farming."
      food: "Grows the village's food and raises its food coverage."
      health: "Looks after the villagers' health."
      education: "Teaches the villagers; while it stands, literacy slowly spreads."
      market: "Where the villagers trade and goods change hands."
      storage: "The village store: the shared materials and goods are kept here, and construction draws from this stock."
      housing: "Homes for the villagers; raises the population capacity."
    code:
      housing_block: "New homes for the villagers; raises the population capacity."
      park: "Green space that lifts the villagers' mood."
      bank: "A building of larger towns; its use opens as the village grows."
      barracks: "A building of larger towns; its use opens as the village grows."
      port: "A building of larger towns; its use opens as the village grows."
      airport: "A building of larger towns; its use opens as the village grows."
  effect:
    local_security_bps: "🛡 Local security: +{value}%"
    food_coverage_bps: "🌾 Food coverage: +{value}%"
    job_coverage_bps: "💼 Job coverage: +{value}%"
    service_coverage_bps: "🏥 Service coverage: +{value}%"
    happiness_bps: "🙂 Happiness: +{value}%"
    housing_capacity: "🏠 Population capacity: +{value}"
  storage:
    title: "📦 In store:"
    line: "• {item}: {qty}"
    capacity: "📦 Store room: {used} of {capacity} units"
    empty: "📦 The store is empty for now."
  school:
    literacy: "📖 Village literacy: {percent}%"
    teaching: "🧑‍🏫 Teaching is under way and literacy is slowly rising."
    idle: "🧑‍🏫 Nothing is being taught."
  civic:
    population: "👥 Population: {population}"
    research: "🔬 Research under way: {knowledge} - {duration} left"
    no_research: "🔬 No research is running."
  upgrade:
    intro: "⬆️ The next step after {building}:"
    line: "✅ {building} - cost {cost} - build time {time}"
    locked: "🔒 {building} - you need {missing} first"
    locked_other: "🔒 {building} - its prerequisites are not met yet"
    needs_tier: "🔒 {building} - opens when the settlement becomes a {tier}"
    none: "There is no next step."

