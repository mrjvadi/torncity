# Telegram wording (en), layered over configs/locales/en.yml by the catalogue loader.
# Wording moves here area by area with its screens (docs/adr/0037-presentation-split.md).
# Natural everyday speech; a key is defined once across the layers.

# ---- city ----
# The citizen loop (docs/adr/0033 sections 4.4 and 4.5): a resident buys land
# from the city, builds a house on it and lives there.
citizen:
  hub:
    hint: "🌱 This is your home: buy land, build a house and help the city grow."
  button:
    buy_land: "🏡 Buy land"
    build_house: "🏠 Build a house"
    more_land: "🏡 More land"
    work: "🛠 Work"
    mine: "🧾 My property"
    manage_lot: "🏠 Manage my lot"
    terms: "⚖️ Land terms"
    rest: "🛋 Rest at home"
    rest_wait: "🛋 Rest ({time} left)"
    pay_tax: "💳 Pay tax ({debt})"
  land:
    title: "🏡 Land in {village}"
    body: |-
      Any free lot can be yours: the price goes to the city treasury and the lot is yours for good.
      💵 Price per lot: {price}
      👛 Your money: {cash}
      📌 Your lots: {owned} of {max}
    body_shared: |-
      Any free lot can be yours: the price goes to the city treasury and the lot is yours for good.
      💵 Price per lot: {price}
      📌 Your lots: {owned} of {max}
    legend: "🟩 free, on the road - 🟨 free, road to lay - 🟦 free, road crosses water - 🟥 free, no road possible - 🏡 yours - 🔒 someone else's - 🏠 building - 🛣 road - 🚧 road reserve, not for sale - 💧 water - ⛰ steep"
    cannot_buy: "To buy more land you must be under the personal lot limit and have enough money."
  buy:
    ask_title: "🏡 Buy a lot"
    ask_body: |-
      Row {row}, column {col}
      Price: {price}
      Your money after buying: {left}

      The money goes to the city treasury.
    ask_body_shared: |-
      Row {row}, column {col}
      Price: {price}

      The money goes to the city treasury.
    done_body_shared: |-
      Row {row}, column {col} is registered in your name and {price} went to the city treasury.
      You can build a house on it now.
    button_yes: "✅ Buy - {price}"
    done_title: "✅ This lot is yours now"
    done_body: |-
      Row {row}, column {col} is registered in your name and {price} went to the city treasury.
      Money left: {cash}
      You can build a house on it now.
  access:
    title: "🛣 Road to the lot at row {row}, column {col}"
    refused: "No road reaches this lot, so \"{building}\" cannot be built on it. Here is what you can do:"
    road: "🛣 This lot is on the road; no road is needed."
    needs_road: "🛣 No road reaches this lot yet. {roads} lots of road are laid over public land for {cost}. The road stays public for good."
    needs_road_carve: "🛣 No road reaches this lot yet. {roads} lots of road are laid, {carved} of them on your own lots, for {cost}."
    needs_bridge: "🌉 Reaching this lot takes {roads} lots of road and a crossing over water ({crossings} lots of culvert or footbridge). Whole road: {cost}. The road stays public for good."
    needs_bridge_carve: "🌉 The road to this lot crosses water ({crossings} lots of culvert or footbridge) and {carved} lots of it are your own. Whole road: {cost}."
    none: "⛔ No road can reach this lot: other people's lots, buildings, slopes or wide water close it in. That is why it is not for sale."
    none_carve: "⛔ There is no way in over public land."
    total: "You pay in all: {total}"
    nearby: "These lots are close and have a road:"
    no_nearby: "No free lot with a road was found for now."
    button_nearby: "🏡 Row {row}, column {col} ({cost})"
    button_connect: "🛣 Lay the road - {cost}"
    button_carve: "🪓 Cut the road through my own land ({carved} lots, {cost})"
    button_refund: "💸 Cancel the sale and give me my money back - {refund}"
    refund_note: "If you do not want a road, the sale is cancelled, {refund} comes back to you from the city treasury and the lot returns to the city."
    done:
      connect: "✅ The road to the lot at row {row}, column {col} is laid for {paid}. Your money: {cash}"
      carve: "✅ The road was cut through your own land: {carved} of your lots became road and it cost {paid}. Your money: {cash}"
      refund: "✅ The sale is cancelled and {refund} came back to you. Your money: {cash}"
  private:
    title: "🏠 Private building in {village}"
    no_land: "To build a house you need a lot first. Buy a free lot and come back."
    intro: |-
      On your own lot you can build a house or a small business. You pay from your own pocket; missing timber is bought for you at the reference price.
      👛 Your money: {cash}
      📌 Free lots of yours: {free}
    intro_shared: |-
      On your own lot you can build a house or a small business. You pay from your own pocket; missing timber is bought for you at the reference price.
      📌 Free lots of yours: {free}
    line: |-
      🔨 {name} ({w}×{h})
      Cost: {cost} - Permit: {permit} - Time: {time}
      Cash total: {total}
    material: "   • {name}: {need} (you have {have}, buy {buy} for {cost})"
    short: "⚠️ You cannot afford this building."
    button: "🔨 {name} - {total}"
    none: "The city cannot build any private building yet; more open up as its knowledge grows."
    no_free_lot: "All your lots are taken; buy another lot to build again."
    total: "Cash total: {total}"
  lots:
    title: "📍 Where to build in {village}"
    building: "Building: {building}"
    legend: "✅ build here (your own free lot) - 🏠 taken - 🛣 road - 💧 water - ⛰ steep - ⬜ not your lot"
  confirm:
    title: "🏗 Build {name}"
    lines: |-
      Place: row {row}, column {col}
      Building cost: {cost}
      Building permit (to the treasury): {permit}
      Materials bought: {materials}
      Build time: {time}
    total: |-
      Cash total: {total}
      Your money after building: {left}
    total_shared: "Cash total: {total}"
    button_yes: "✅ Confirm and build - {total}"
  mine:
    title: "🧾 My property in {village}"
    no_home: "🏚 You have no house yet; build one on your lot to live in it."
    home: "🏠 Your home: {name}"
    lot_bare: "🟩 Row {row}, column {col}: empty lot"
    lot_no_road: "🟥 Row {row}, column {col}: empty lot, no road"
    button_road: "🛣 Road to row {row}, column {col}"
    lot_building: "🏗 Row {row}, column {col}: {name} under construction - {time} left"
    lot_built: "🏡 Row {row}, column {col}: {name}"
    no_lots: "You own no lots."
    tax: "📊 Property tax: {percent}% of the value {assessed} each period, that is {per}"
    debt: "⚠️ Tax debt: {debt} ({periods} periods)"
    cash: "👛 Your money: {cash}"
    notice:
      rested: "🛋 You rested at home and feel better."
      rested_warm: "🔥 You rested by a warm hearth and feel much better."
      tax_paid: "✅ Tax paid."
      tax_none: "There is no debt to pay, or you cannot afford it."
  terms:
    title: "⚖️ Land and building terms in {village}"
    body: |-
      💵 Lot price: {price} (between {pmin} and {pmax})
      📜 Building permit: {permit} (up to {fmax})
      📊 Property tax each period: {tax}% (up to {tmax}%)

      All of it goes to the city treasury.
    button_price: "💵 Lot {amount}"
    button_permit: "📜 Permit {amount}"
    button_tax: "📊 Tax {percent}%"
  work:
    title: "🛠 Work in {village}"
    body: |-
      The city's workshops and farms open as they are built, and their work will be here.
      Until then, jobs are in {city}.
    button_support: "💼 Work in {city} - travel"
  refusal:
    citizen_lot_taken: "Someone bought this lot just now. Pick another one."
    citizen_lot_limit: "You have reached the personal lot limit; build on your lots first."
    citizen_zoning: "The share of private lots in this city is full, to keep public space."
    citizen_not_owner: "This lot is not yours; you can only build on your own lot."
    citizen_no_cash: "You do not have enough money for this."
    citizen_private_only: "This is a private building: residents build it on their own lot, not the mayor."
    citizen_lot_private: "This lot is private and belongs to a resident."
    citizen_rest_wait: "You are still rested; you can rest again in {time}."
    citizen_no_house: "You need a finished house to rest at home."
    citizen_terms_range: "That number is outside the allowed range."
    citizen_no_debt: "You have no tax debt."
    citizen_off: "Buying land is not open in this city yet."
    citizen_lot_reserved: "This lot is road reserve and not for sale. Pick another one."
    citizen_no_access: "No road can reach this lot, so it is not sold. Pick another one."
    citizen_no_option: "That cannot be done for this lot."
    citizen_refund_treasury: "The city treasury cannot cover the refund right now. You can lay the road, or try again later."
    citizen_no_lots: "You own no lots; buy one first."

