    no_home: "🏚 هنوز خانه‌ای نداری؛ روی زمینت خانه بساز تا ساکن آن شوی."
    home: "🏠 خانهٔ تو: {name}"
    lot_bare: "🟩 ردیف {row}، ستون {col}: زمین خالی"
    lot_building: "🏗 ردیف {row}، ستون {col}: {name} در حال ساخت - {time} دیگر"
    lot_built: "🏡 ردیف {row}، ستون {col}: {name}"
    no_lots: "زمینی نداری."
    tax: "📊 مالیات دارایی: {percent}٪ از ارزش {assessed} در هر دوره؛ یعنی {per}"
    debt: "⚠️ بدهی مالیاتی: {debt} ({periods} دوره)"
    cash: "👛 پول تو: {cash}"
    notice:
      rested: "🛋 در خانه استراحت کردی و سرحال‌تر شدی."
      tax_paid: "✅ مالیات پرداخت شد."
      tax_none: "بدهی‌ای برای پرداخت نیست یا پولت کافی نبود."
  terms:
    title: "⚖️ شرایط زمین و ساخت در {village}"
    body: |-
      💵 قیمت زمین: {price} (بین {pmin} و {pmax})
      📜 مجوز ساخت: {permit} (تا {fmax})
      📊 مالیات دارایی هر دوره: {tax}٪ (تا {tmax}٪)

      همهٔ این‌ها به خزانهٔ روستا می‌رود.
    button_price: "💵 زمین {amount}"
    button_permit: "📜 مجوز {amount}"
    button_tax: "📊 مالیات {percent}٪"
  work:
    title: "🛠 کار در {village}"
    body: |-
      کارگاه‌ها و مزرعه‌های روستا با ساخته‌شدن باز می‌شوند و کار آن‌ها را اینجا می‌بینی.
      تا آن روز، کار و شغل در «{city}» است.
    button_support: "💼 کار در {city} - سفر"
  refusal:
    citizen_lot_taken: "این زمین را همین حالا کس دیگری خرید. زمین دیگری انتخاب کن."
    citizen_lot_limit: "به سقف زمین‌های شخصی رسیده‌ای؛ اول روی زمین‌هایت بساز."
    citizen_zoning: "سهم زمین‌های شخصی این روستا پر شده است تا فضای عمومی حفظ شود."
    citizen_not_owner: "این زمین مال تو نیست؛ فقط روی زمین خودت می‌توانی بسازی."
    citizen_no_cash: "پولت برای این کار کافی نیست."
    citizen_private_only: "این ساختمان شخصی است و ساکنان روی زمین خودشان می‌سازند، نه دهیار."
    citizen_lot_private: "این زمین شخصی است و مال یکی از اهالی است."
    citizen_rest_wait: "هنوز سرحال هستی؛ {time} دیگر می‌توانی دوباره استراحت کنی."
    citizen_no_house: "برای استراحت اول باید خانه‌ات ساخته شود."
    citizen_terms_range: "این عدد خارج از محدودهٔ مجاز است."
    citizen_no_debt: "بدهی مالیاتی‌ای نداری."
    citizen_off: "خرید زمین هنوز در این روستا باز نشده است."
    citizen_no_lots: "زمینی نداری؛ اول یک زمین بخر."

