    short: "⚠️ پولت برای این ساختمان کافی نیست."
    button: "🔨 {name} - {total}"
    none: "فعلاً ساختمان شخصی‌ای که روستا بتواند بسازد وجود ندارد؛ با پیشرفت دانش روستا گزینه‌های بیشتری باز می‌شود."
    no_free_lot: "همهٔ زمین‌های تو پر است؛ برای ساختن دوباره، زمین دیگری بخر."
    total: "جمع نقدی: {total}"
  lots:
    title: "📍 جای ساخت در {village}"
    building: "ساختمان: {building}"
    legend: "✅ همین‌جا بساز (زمین خودت و آزاد) - 🏠 پر - 🛣 جاده - 💧 آب - ⛰ شیب - ⬜ زمین تو نیست"
  confirm:
    title: "🏗 ساخت {name}"
