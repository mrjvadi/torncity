# Telegram wording (fa), layered over configs/locales/fa.yml by the catalogue loader.
# Wording moves here area by area with its screens (docs/adr/0037-presentation-split.md).
# Natural everyday speech; a key is defined once across the layers.

# ---- village ----
# The citizen loop (docs/adr/0033 sections 4.4 and 4.5): a resident buys land
# from the village, builds a house on it and lives there.
