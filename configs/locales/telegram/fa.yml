# Telegram wording (fa), layered over configs/locales/fa.yml by the catalogue loader.
# Wording moves here area by area with its screens (docs/adr/0039-presentation-split.md).
# Natural everyday speech; a key is defined once across the layers.

# ---- village ----
# The citizen loop (docs/adr/0033 sections 4.4 and 4.5): a resident buys land
# from the village, builds a house on it and lives there.
citizen:
  hub:
    hint: "🌱 اینجا خانهٔ توست؛ زمین بخر، خانه بساز و روستا را آباد کن."
  button:
    buy_land: "🏡 زمین بخر"
    build_house: "🏠 خانه بساز"
    more_land: "🏡 زمین دیگر"
    work: "🛠 کار کن"
    mine: "🧾 دارایی من"
    terms: "⚖️ شرایط زمین"
    rest: "🛋 استراحت در خانه"
    rest_wait: "🛋 استراحت ({time} دیگر)"
    pay_tax: "💳 پرداخت مالیات ({debt})"
  land:
    title: "🏡 زمین‌های {village}"
    body: |-
      هر زمین آزاد را می‌توانی بخری؛ پولش به خزانهٔ روستا می‌رود و زمین مال خودت می‌شود.
      💵 قیمت هر زمین: {price}
      👛 پول تو: {cash}
      📌 زمین‌های تو: {owned} از {max}
    body_shared: |-
