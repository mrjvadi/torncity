      📌 زمین‌های تو: {owned} از {max}
    legend: "🟩 آزاد و قابل خرید - 🏡 زمین تو - 🔒 زمین دیگران - 🏠 ساختمان - 🛣 جاده - 💧 آب - ⛰ شیب"
    cannot_buy: "برای خرید زمین بیشتر باید به سقف زمین‌های شخصی نرسیده باشی و پول کافی داشته باشی."
  buy:
    ask_title: "🏡 خرید زمین"
    ask_body: |-
      ردیف {row}، ستون {col}
      قیمت: {price}
      پول تو پس از خرید: {left}

      پول به خزانهٔ روستا می‌رود.
    ask_body_shared: |-
      ردیف {row}، ستون {col}
      قیمت: {price}

      پول به خزانهٔ روستا می‌رود.
    done_body_shared: |-
      ردیف {row}، ستون {col} به نام تو ثبت شد و {price} به خزانهٔ روستا رفت.
      حالا می‌توانی رویش خانه بسازی.
    button_yes: "✅ بخر - {price}"
    done_title: "✅ این زمین حالا مال توست"
    done_body: |-
      ردیف {row}، ستون {col} به نام تو ثبت شد و {price} به خزانهٔ روستا رفت.
      پول باقی‌مانده: {cash}
      حالا می‌توانی رویش خانه بسازی.
  private:
    title: "🏠 ساخت‌وساز شخصی در {village}"
    no_land: "برای ساختن خانه اول باید یک زمین داشته باشی. زمین آزادی بخر و برگرد."
    intro: |-
      روی زمین خودت می‌توانی خانه یا کسب‌وکار کوچک بسازی. هزینه از جیب خودت است؛ اگر الوار نداشته باشی، به قیمت مرجع برایت خریده می‌شود.
      👛 پول تو: {cash}
      📌 زمین آزاد برای ساخت: {free}
    intro_shared: |-
      روی زمین خودت می‌توانی خانه یا کسب‌وکار کوچک بسازی. هزینه از جیب خودت است؛ اگر الوار نداشته باشی، به قیمت مرجع برایت خریده می‌شود.
