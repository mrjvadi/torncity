# Telegram wording (fa) of the politics and society area: offices and governance, elections, factions,
# diplomacy, the legislature, friends and search (docs/adr/0039-presentation-split.md).
# Natural everyday speech; a key is defined once across the layers.

social:
  unknown_player: یک بازیکن
  # A search names one player exactly, in one of three forms; there is no
  # search by display name. {query} is echoed only for a username (with its
  # @) or a code — never for a Telegram ID, which no screen prints.
  search:
    help: |-
      🔎 پیدا کردن بازیکن
      بازیکن را با یکی از این‌ها پیدا کنید:
      • نام کاربری تلگرام: «پیدا @username»
      • کد بازیکن: «پیدا K7Q2M9A»
      • شناسهٔ عددی تلگرام: «پیدا» و پس از آن شناسه
    title: "🔎 نتیجهٔ جست‌وجو"
    player: "👤 {player}"
    self: "این خودتان هستید. کد بازیکنتان را به دوستانتان بدهید تا پیدایتان کنند."
    not_found_username: "بازیکنی با نام کاربری {query} پیدا نشد. شاید نام کاربری‌اش را عوض کرده یا هنوز بازی را شروع نکرده است؛ کد بازیکنش را از خودش بپرسید."
    not_found_code: "بازیکنی با کد {query} پیدا نشد. کد را دوباره بررسی کنید؛ برای جست‌وجوی نام کاربری، @ را اول آن بگذارید."
    not_found_id: "بازیکنی با این شناسهٔ تلگرام پیدا نشد. شاید هنوز بازی را شروع نکرده است."
  friends:
    title: "👥 دوستان"
    empty: |-
      هنوز دوستی ندارید.
      برای پیدا کردن بازیکن، «پیدا» را با نام کاربری یا کد بازیکنش بفرستید؛ مثلاً «پیدا @username»
    line: "• {player}"
    # A request this player sent, waiting for the other one.
    line_pending: "• {player} - در انتظار پاسخ او"
    # A request the other player sent; it has the accept button.
    line_incoming: "• {player} - می‌خواهد با شما دوست شود"
    line_blocked: "• {player} - مسدود"
  friend:
    requested: "✅ درخواست دوستی برای {player} فرستاده شد. پس از پذیرفتن، در فهرست دوستانتان می‌آید."
    requested_anon: "✅ درخواست دوستی فرستاده شد. پس از پذیرفتن، در فهرست دوستانتان می‌آید."
    accepted: "✅ شما و {player} از این پس دوست هستید."
    accepted_anon: "✅ درخواست دوستی را پذیرفتید. این بازیکن حالا در فهرست دوستان شماست."
    # Notices to the other player, sent to their private chat.
    incoming: "👥 {player} می‌خواهد با شما دوست شود."
    incoming_anon: "👥 بازیکنی می‌خواهد با شما دوست شود."
    incoming_hint: برای پذیرفتن، دکمهٔ زیر را بزنید. درخواست در فهرست دوستانتان هم می‌ماند.
    now_friends: "👥 {player} درخواست دوستی شما را پذیرفت. از این پس دوست هستید."
    button_view: "👤 {player}"
    detail_title: "👤 {player}"
    detail_faction: "جناح: {faction}"
    button_invite: "🦁 دعوت به جناح من"
    button_remove: "➖ حذف از دوستان"
    button_remove_yes: "✅ بله، حذفش کن"
    ask_remove: "{player} را از دوستانتان حذف می‌کنید؟"
    removed: "{player} دیگر در فهرست دوستان شما نیست."
    now_friends_anon: "👥 درخواست دوستی شما پذیرفته شد. این بازیکن حالا در فهرست دوستان شماست."

# Player-held offices (docs/adr/0015-player-held-offices.md): the offices and
# policies of a city, the office holder's own screen, the flow that changes a
# policy, and the public history of changes.
#
# Terms: office منصب 🏛 (a seat a player holds: شهردار، رئیس‌جمهور), policy
# سیاست (what an office decides: نرخ مالیات، عوارض), vacant «خالی», acting
# «سرپرستی» (a deputy exercising a vacant office's powers), announced «اعلام»
# (a change is public at once and «اجرا» after its notice), public history
# «تاریخچهٔ عمومی» 📜. Percent is «{value}٪»; money goes through format.money.
gov:
  player: "{name} ({code})"
  list_separator: "، "
  percent: "{value}٪"
  span_d: "{days} روز"
  span_dh: "{days} روز و {hours} ساعت"
  unnamed_office: یک منصب
  unnamed_lever: یک سیاست
  city:
    title: "🏛 مناصب و سیاست‌های {city}"
    title_plain: "🏛 مناصب و سیاست‌ها"
    no_city: "هنوز در هیچ شهری مستقر نشده‌اید. پس از استقرار، مناصب و سیاست‌های شهرتان همین‌جا نمایش داده می‌شوند."
    place: "📍 {place}"
    offices: "مناصب:"
    no_offices: "• منصبی در اینجا تعریف نشده است."
    policies: "سیاست‌ها:"
  office:
    held: "• {office}: {players}"
    seats: "• {office}: {held} از {seats} کرسی - {players}"
    acting: "• {office}: خالی - سرپرست: {deputy} {players}"
    vacant: "• {office}: خالی"
  lever:
    line_default: "• {lever}: {value} - پیش‌فرض"
    line_set: "• {lever}: {value} - تعیین‌شده به دست {player}"
    pending: "  ⏳ {when} دیگر به {value} تغییر می‌کند"
  mine:
    title: "🏛 منصب من"
    none: "شما منصبی ندارید. شهردار، اعضای شورای شهر و رئیس‌جمهور انتخاب می‌شوند و مناصب دیگر انتصابی‌اند."
    seat: "📍 {office} {place}"
    acting_for: "شما سرپرست منصب خالی {office} هستید."
    no_levers: "این منصب فعلاً سیاستی ندارد که بتوانید تغییرش دهید."
    lever: "• {lever}: {value}"
    lever_vote: "• {lever}: {value} - با رأی {office} تعیین می‌شود"
    confirmed_by: "  🗳 برای تغییرش ممکن است تأیید {office} لازم باشد."
  edit:
    title: "🏛 {lever} — {place}"
    bounds: "بازهٔ مجاز: {min} تا {max}"
    default: "مقدار پیش‌فرض: {value}"
    notice: "هر تغییر {notice} پس از اعلام اجرا می‌شود."
    cooldown: "میان دو تغییر دست‌کم {cooldown} فاصله لازم است."
    cooldown_active: "⏳ {wait} دیگر می‌توانید این سیاست را دوباره تغییر دهید."
    draft: |-
      مقدار تازه: {value}
      با دکمه‌ها تنظیمش کنید و سپس «بازبینی تغییر» را بزنید.
  confirm:
    title: "📝 تأیید تغییر"
    change: "{lever} در {place}: از {old} به {new}"
    notice: "این تغییر همین حالا اعلام می‌شود و {notice} بعد اجرا خواهد شد."
    cooldown: "پس از آن تا {cooldown} نمی‌توانید این سیاست را دوباره تغییر دهید."
    vote: "🗳 این تغییر پیش از اعلام به رأی {office} گذاشته می‌شود و تنها در صورت تصویب اجرا خواهد شد."
  announced:
    title: "📢 تغییر اعلام شد"
    body: "{lever} در {place} از {old} به {new} تغییر می‌کند و {when} دیگر اجرا می‌شود. این تغییر در تاریخچهٔ عمومی ثبت شد."
  history:
    title: "📜 تاریخچهٔ سیاست‌های {city}"
    empty: هنوز هیچ سیاستی در اینجا تغییر نکرده است.
    change: "• {lever} ({place}): {old} ← {new}"
    by: "  اعلام {office} {player} - {ago} پیش"
    effective_in: "  ⏳ {when} دیگر اجرا می‌شود"
    effective_since: "  {when} است که اجرا می‌شود"
  button:
    city: "🏛 مناصب و سیاست‌ها"
    history: "📜 تاریخچهٔ سیاست‌ها"
    elections: "🗳 انتخابات"
    my_office: "🏛 منصب من"
    change: "✏️ {lever} — {place}"
    down: "➖ {amount}"
    up: "➕ {amount}"
    min: حداقل ({value})
    default: پیش‌فرض ({value})
    max: حداکثر ({value})
    review: "📝 بازبینی تغییر"
    propose: "🗳 پیشنهاد {lever} — {place}"
    budget: "💰 بودجهٔ شهر"
    laws: "⚖️ طرح‌ها و رأی‌گیری‌ها"
    confirm: "✅ تأیید"
    cancel: "✖️ انصراف"
    appoint: "👤 انتصاب {office}"
    dismiss: "✖️ برکناری {office}"
    confirm_appoint: "✅ منصوب کن"
    confirm_dismiss: "✅ برکنار کن"
  refusal:
    not_holder: "تنها {office} می‌تواند این سیاست را تغییر دهد. اگر این منصب را داشتید، ممکن است جایگزین شده باشید."
    requires_vote: این سیاست با رأی {office} تعیین می‌شود و تنها اعضای آن می‌توانند تغییرش را پیشنهاد دهند.
    requires_confirmation: این تغییر پیش از اجرا باید به تأیید {office} برسد.
    invalid_allocation: "این تقسیم مجاز نیست: فقط خطوط همین بودجه سهم می‌گیرند و جمع سهم‌ها حداکثر 100٪ است."
    out_of_range: "این مقدار بیرون از بازهٔ مجاز {min} تا {max} است. مقداری در همین بازه انتخاب کنید."
    out_of_range_plain: "این مقدار بیرون از بازهٔ مجاز است. مقداری در بازهٔ مجاز انتخاب کنید."
    cooldown: این سیاست به‌تازگی تغییر کرده است. {wait} دیگر می‌توانید دوباره تغییرش دهید.
    cooldown_later: این سیاست به‌تازگی تغییر کرده است. کمی بعد دوباره امتحان کنید.
    unsupported: این نوع سیاست هنوز قابل تغییر نیست.
    unknown_lever: این سیاست دیگر وجود ندارد. برای دیدن سیاست‌هایی که می‌توانید تغییر دهید، «منصب من» را باز کنید.
    unknown_place: این مکان پیدا نشد. «نقشه» را باز کنید و دوباره امتحان کنید.
    wrong_place: این سیاست در این مکان کاربردی ندارد.
    city_only: "این بخش مخصوص شهرهاست؛ شهر هنوز بودجه و شورای شهر ندارد. وقتی شهر رشد کند، این‌ها هم باز می‌شوند."
    office_not_found: چنین منصبی در اینجا وجود ندارد.
    office_occupied: این منصب در اختیار کس دیگری است.
    office_vacant: این منصب از قبل خالی است.
    already_holds: شما همین حالا این منصب را دارید.
    incompatible: این منصب را نمی‌توان هم‌زمان با منصبی که اکنون دارید در اختیار داشت.
  alloc:
    draft: "✏️ پیش‌نویس تقسیم:"
    line: "• {line}: {share}"
    down: "➖ {line}"
    up: "➕ {line}"
    total: "جمع: {total} - {left} خرج نمی‌شود و در خزانه می‌ماند."
    spend_share: "هر دورهٔ شهر، بودجه تا {share} از موجودی خزانه را خرج می‌کند."
  appoint:
    heading: "انتصاب‌ها:"
    vacant: "• {office}: خالی"
    held: "• {office}: {player}"
    confirm: "👤 {player} را به‌عنوان {office} {place} منصوب می‌کنید؟\nهمین حالا بر صندلی می‌نشیند و اگر منصب شما اجازه دهد، بعداً می‌توانید برکنارش کنید."
    done: "✅ {player} اکنون {office} {place} است."
    term: "دورهٔ این منصب {term} است."
    announce: "🎖 {player} به‌عنوان {office} {place} منصوب شد."
    refused:
      not_appointer: "تنها {office} می‌تواند این کار را انجام دهد. اگر این منصب را داشتید، ممکن است جایگزین شده باشید."
      no_player: "بازیکنی با این کد یا نام کاربری پیدا نشد. آن را بررسی کنید و دوباره بفرستید."
      no_seat: "این صندلی دیگر خالی نیست."
  dismiss:
    confirm: "✖️ {player} را از منصب {office} {place} برکنار می‌کنید؟\nصندلی همین حالا خالی می‌شود و اگر سرپرستی تعریف شده باشد، او به جایش عمل می‌کند."
    done: "✅ {player} دیگر {office} {place} نیست."

