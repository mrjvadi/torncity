# lines about them. Moved here with the screens (docs/adr/0039-presentation-split.md, section 7); a key is
# defined once across the layers. The names of company types, components, technologies, suppliers, design
# slots, attributes and skills, and the lists specialists are named from, stay in configs/locales: the content
# catalogue serves them to the web.
