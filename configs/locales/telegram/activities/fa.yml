# Telegram wording of the Activities hub, the work home and the health home
# (docs/adr/0038-activities-in-the-village-first-world.md). Layered over
# configs/locales/fa.yml by the catalogue loader; a key is defined once across the layers.

activities:
  hub:
    title: "🎯 فعالیت‌ها"
  entry:
    work: "⚒ کار"
    learn: "📚 آموزش"
    health: "🩺 سلامت"
    training: "💪 تمرین"
    crime: "🕶 جرم"
    missions: "📜 مأموریت‌ها"
    rankings: "🏆 رتبه‌ها"
  work:
    title: "⚒ کار"
    counts: "{village}: {jobs} آگهی کار، {places} کارگاه"
    working: "در حال کار در {building} - {duration} مانده - مزد: {wage}"
    empty:
      no_settlement: "اینجا کار همان شغل‌های شهر است."
      not_resident: "برای کار کردن باید ساکن این شهر باشی."
      no_jobs: "فعلاً کاری نیست. وقتی شهردار کارگاهی بسازد یا آگهی بگذارد، اینجا پیدا می‌شود."
  health:
    title: "🩺 سلامت"
    health: "❤️ {health} از {max}"
    admitted: "🏥 بستری هستی - {duration} تا ترخیص"
    facility:
      health_house: "🏠 {name}"
      clinic: "🏥 {name}"
    empty:
      no_facility: "اینجا جای درمانی نیست. استراحت کن یا به شهر مرکزی برو."
    refer: "برای درمان جدی به {city} برو."

# The Economy and Society hubs: the entries that exist where the player stands.
hubs:
  economy:
    title: "💰 اقتصاد"
    entry:
      inventory: "🎒 کوله‌پشتی"
      market: "🛒 بازار"
      bank: "🏦 بانک"
      companies: "💼 شرکت‌های من"
      property: "🏠 ملک"
      stocks: "📈 بورس"
  society:
    title: "👥 جامعه"
    entry:
      inbox: "✉️ پیام‌ها"
      faction: "🛡 جناح"
      friends: "🤝 دوستان"
      elections: "🗳 انتخابات"
      government: "🏛 دولت"
      war: "⚔️ ارتش و جنگ"
