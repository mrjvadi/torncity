# Telegram wording (fa) of village founding (the group draft, the form, the announcement), layered over configs/locales/fa.yml by the catalogue loader.
# Moved here with its screens (docs/adr/0039-presentation-split.md, section 7); a key is defined once across the layers.
settlement:
  found:
    # Announced in the group once the village is placed (ADR 0028 section
    # 3.1's "one admin.announced-style event tells the group where it
    # landed and what its first two buildings are building").
    title: "🏡 روستای تازه‌ای تأسیس شد!"
    body: |-
      این گروه اکنون روستای «{name}» را در نزدیکی {feature} بنا کرد.
      زمین منطقه: {biome}
      ساخت‌وسازهای آغازین: {buildings}
      تا {protection} این روستا در برابر حمله محافظت‌شده است.
    # feature has no known nearby river/continent to name (an open ocean
    # site, or the named-feature list came up empty).
    unnamed_feature: "سرزمینی ناشناخته"
    # The founding form adds these to the announcement (docs/adr/0028 section 3).
    emblem: "نشان: {emblem}"
    motto: "«{motto}»"
    founder: "👤 دهیار: {founder}"
    currency: "🪙 پول ملی: {name} ({code}) - برای روزی که این روستا کشور شود رزرو شد؛ تا آن روز ساپ رایج است."
    # Refused: this command only founds a settlement inside a group, where
    # the whole group can see the result decided (the same group-first rule
    # every civic act in this game follows).
    group_only: "🏡 تأسیس روستا فقط در یک گروه ممکن است. ربات را به گروه خود اضافه کنید و همان‌جا این دستور را بفرستید."
    # Refused: no world has been generated yet.
    no_world: "🌍 نقشهٔ جهان هنوز آماده نشده است. کمی بعد دوباره امتحان کنید."
    # This chat already founded one; shown again on a repeated command
    # (idempotent — never founds a second village).
    already:
      title: "🏡 این گروه پیش‌تر روستای «{name}» را تأسیس کرده است."
      body: "هر گروه تنها یک روستا را می‌تواند تأسیس کند؛ برای رشد، از فرمانداری روستای خود اقدام کنید."
founding:
  draft:
    title: "📝 مشخصات روستا را کامل کنید"
    body: "{founder} می‌خواهد برای این گروه روستا بسازد، اما پیش از تأسیس باید مشخصاتش را کامل کند: نام روستا، پول ملی، نشان و شعار. با دکمهٔ زیر برنامهٔ بازی باز می‌شود؛ پس از ثبت فرم، روستا تأسیس و همین‌جا اعلام می‌شود."
    deadline: "⏳ مهلت تکمیل: {minutes} دقیقه. اگر تمام نشود چیزی ساخته نمی‌شود و می‌توانید دوباره «ساخت روستا» را بفرستید."
    hint: "اگر دکمه باز نشد، برنامهٔ بازی را از پیوی ربات باز کنید؛ فرم همان‌جا منتظر شماست."
    pending_title: "📝 {founder} در حال تکمیل مشخصات روستای این گروه است."
    pending_body: "فقط خودِ ایشان می‌تواند فرم را ثبت کند و شما می‌توانید آن را ببینید. اگر تا {minutes} دقیقهٔ دیگر تمام نشود، دوباره «ساخت روستا» را بفرستید."
    button: "📝 تکمیل اطلاعات روستا"
  form:
    title: "📝 مشخصات روستا"
    mine: "نام، پول ملی، نشان و شعار روستا را انتخاب کنید و فرم را ثبت کنید."
    other: "{founder} در حال تکمیل این فرم است؛ فقط خودِ ایشان می‌تواند آن را ثبت کند."
    done: "🏡 روستای «{name}» تأسیس شده است."
  checked: "✅ فرم درست است؛ می‌توانید روستای «{name}» را تأسیس کنید."
  refusal:
    no_draft: "📝 فرمی برای تأسیس روستا پیدا نشد. در گروه «ساخت روستا» را بفرستید."
    expired: "⏳ مهلت این فرم تمام شد و روستایی ساخته نشد. در گروه دوباره «ساخت روستا» را بفرستید."
    not_founder: "🔒 این فرم را فقط کسی که «ساخت روستا» را فرستاده می‌تواند ثبت کند."
    already: "🏡 این گروه پیش‌تر روستای «{name}» را تأسیس کرده است."
    invalid: "⚠️ چند مورد فرم نیاز به اصلاح دارد:"
    no_world: "🌍 نقشهٔ جهان هنوز آماده نشده است. کمی بعد دوباره امتحان کنید."
    group_only: "🏡 تأسیس روستا فقط در یک گروه ممکن است. ربات را به گروه خود اضافه کنید و همان‌جا «ساخت روستا» را بفرستید."
    unavailable: "🛠 فرم تأسیس روستا موقتاً در دسترس نیست. کمی بعد دوباره امتحان کنید."
  problem:
    name_short: "نام روستا دست‌کم {name_min} حرف باشد."
    name_long: "نام روستا حداکثر {name_max} حرف باشد."
    name_chars: "نام روستا فقط حرف فارسی یا لاتین و فاصله داشته باشد؛ عدد و نشانه مجاز نیست."
    name_link: "نام روستا نباید پیوند، آیدی یا نشانی باشد."
    name_forbidden: "این نام مجاز نیست؛ نام دیگری انتخاب کنید."
    name_reserved: "این نام برای خود بازی رزرو شده است."
    name_taken: "روستای دیگری همین نام را دارد."
    motto_long: "شعار حداکثر {motto_max} حرف باشد."
    motto_chars: "شعار فقط حرف، عدد و نشانه‌های ساده داشته باشد."
    motto_link: "شعار نباید پیوند یا آیدی داشته باشد."
    motto_forbidden: "این شعار مجاز نیست."
    currency_name_short: "نام پول دست‌کم {currency_name_min} حرف باشد."
    currency_name_long: "نام پول حداکثر {currency_name_max} حرف باشد."
    currency_name_chars: "نام پول فقط حرف فارسی یا لاتین و فاصله داشته باشد."
    currency_name_forbidden: "این نام برای پول مجاز نیست."
    currency_name_taken: "روستای دیگری همین نام پول را برداشته است."
    currency_code_format: "کد پول باید دقیقاً {code_len} حرف بزرگ انگلیسی باشد."
    currency_code_reserved: "این کد برای پول‌های بازی یا دنیای واقعی رزرو شده است."
    currency_code_forbidden: "این کد مجاز نیست."
    currency_code_taken: "روستای دیگری همین کد پول را برداشته است."
    currency_symbol_invalid: "نماد پول باید بین 1 تا {symbol_max} نویسه باشد، بدون فاصله."
    emblem_invalid: "نشان کامل نیست؛ یک شکل، یک نماد و دو رنگ متفاوت انتخاب کنید."
