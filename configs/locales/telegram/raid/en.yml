# Telegram wording of raids, falls and the watch (docs/adr/0074): the raid screen, the settlement's insurance fund and the lines the
# group reads. Layered over configs/locales/en.yml by the catalogue loader; a key is defined once across the layers.

raid:
  title: "⚔️ Raids and the watch of {name}"
  off: "Raids have not started yet; they begin on {date}."
  rules: "Filing a raid costs {fee}. It starts between {min} and {max} hours after it is filed and stays open for {window} minutes. Nobody is at risk unless they choose to stand in it."
  mine_head: "Your raids"
  none: "No raid is on right now."
  line_attacker: "🗡 Your raid on {other} - {status}, starts at {time}, {joined} companions and {raiders} hired hands"
  line_defender: "🛡 The raid of {other} on your town - {status}, starts at {time}, {standing} stand in defence"
  warned: "🔥 The watch gave word ({by}); you have {lead}."
  not_warned: "No watch has given word; the raid will arrive unannounced."
  tribute: "Tribute offered: {amount}"
  outcome_taken: "The raid took the town: {cash} from the treasury and {goods} kinds of goods carried off; {buildings} buildings damaged and {falls} fell."
  outcome_held: "The raid was beaten back; {falls} fell."
  fell_me: "You fell and were carried to hospital."
  targets_head: "Towns you could raid"
  target_line: "▫️ {name} - {km} km, {residents} people"
  watch_head: "The town's watch"
  watch_none: "The town keeps no watch; a raid will arrive unannounced."
  watch_open: "👁 {kind} - on duty today, sees as far as {sight} m"
  watch_idle: "👁 {kind} - closed today ({idle})"
  status:
    filed: "filed"
    open: "under way"
    resolved: "over"
    settled: "ended by tribute"
  idle:
    no_staff: "nobody on duty"
    no_wage: "no money for the wage"
    no_supplies: "out of wood or food"
    unknown: "its day is not judged yet"
  button:
    join: "🗡 Ride with the raid on {other}"
    stand: "🛡 Stand in defence"
    accept: "🤝 Accept the tribute of {amount}"
    offer: "🤝 Offer tribute of {amount}"
    file: "⚔️ Raid {name} (in {hours} hours)"
  notice:
    raid_filed: "The raid is filed. Anyone who wants to ride with it can join from here."
    raid_joined: "You ride with the raid."
    raid_standing: "You stand in defence."
    raid_offered: "Tribute offered."
    raid_settled: "The tribute was accepted and the raid is over."
  line:
    detected: "🔥 The watch gave word: a raid from {other} is on its way ({band}). You have {lead}."
    opened: "⚔️ The raid of {other} has begun."
    resolved_taken: "⚔️ The raid took the town: {cash} carried off the treasury and {falls} fell."
    resolved_held: "🛡 The raid was beaten back and {falls} fell."
    settled: "🤝 The raid was ended with a tribute of {amount}."
  band:
    few: "a few people"
    group: "a group"
    band: "a band"
    host: "a host"

insurance:
  title: "🛡 Insurance of {name}"
  closed: "This town keeps no insurance fund yet. Whoever may run it can open one; until then the central city's insurance is there."
  fund: "Fund: {fund}; price level: {scale}. Claims are paid only as far as the fund holds, and shared in proportion when it falls short."
  products_head: "The fund's cover"
  product:
    death_loss: "▫️ {product}: {cover}% of what you lose carrying cash and goods when you fall in a raid, after your own share ({own}%), up to {max} - {premium} each game day - covers after {wait}"
    raid_damage: "▫️ {product}: {cover}% of a raid's damage to your building, after your own share ({own}%), up to {max} - {premium} plus {bps}% of its value each game day - covers after {wait}"
  mine: "Your policies"
  policy: "▫️ No. {no} ({product}) - {status} - paid out: {paid}"
  status:
    active: "running"
    ended: "ended"
  button:
    open: "🛡 Open the town's insurance fund"
    buy: "🛡 {product} ({premium})"
    buy_building: "🛡 {product} for {building}"
  notice:
    insurance_opened: "The town's insurance fund is open."
    insurance_scaled: "The fund's price level changed."
    insurance_bought: "The policy is taken; cover begins after the waiting time."

village:
  refusal:
