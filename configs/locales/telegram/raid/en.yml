    raid_shielded: "That town has just been hurt by you; you must wait a while."
    raid_founding_grace: "That town is newly founded and a town as big as yours cannot raid it."
    raid_nothing_to_take: "That town has nothing worth a raid."
    raid_no_money: "The treasury does not hold enough."
    raid_not_resident: "You must live in this town to do that."
    raid_not_open: "That raid is no longer open."
    raid_not_found: "No such raid was found."
    raid_tribute_low: "Tribute cannot be under {min}."
    raid_no_offer: "No tribute has been offered."
    raid_too_many_raiders: "That many hired hands cannot be had."
    raid_bad_args: "The request is not written right."
    raid_wrong_side: "That raid is not about your town, or you took the wrong side."
    insurance_not_open: "This town keeps no insurance fund."
    insurance_already_open: "The town's insurance fund is already open."
    insurance_no_product: "The fund sells no such cover."
    insurance_no_building: "That building is not yours or is not finished."
    insurance_held: "You already hold that cover."
    insurance_no_money: "You do not have enough for the premium."
    insurance_bad_scale: "The price level must be between 50 and 200 percent."
