  list_title: "📱 Your linked game clients"
  list_empty: "No game client is linked. Send /link to get a code for one."
  line: "• {name} ({via}) — linked {date}, last seen {date_seen}"
  via:
    link: "code"
    telegram: "Telegram app"
  notice:
    revoked: "✅ That client is signed out."
    gone: "That client was already signed out."
  button:
    play: "🎮 Play the web game"
    link: "➕ Link a client"
    list: "📱 Linked clients"
    revoke: "🚫 Sign out {name}"
