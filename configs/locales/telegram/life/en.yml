# Telegram wording of the life area (docs/adr/0039-presentation-split.md): the profile and its menus,
# the city map and travel, the character's life, settings, devices, achievements, the bag and property.
# Layered over configs/locales/en.yml by the catalogue loader; a key is defined once across the layers.

profile:
  # The one-time welcome, shown only while the player has not earned any XP.
  body: |-
    👋 Welcome to the game!
    This is your home: your condition, your money and your work at a glance. Use the buttons below to go anywhere.

  name: "👤 {name}"
  city: "📍 {city}"
  # Where in the city the player stands, or the walk they are on.
  place: "📍 {place} - {city}"
  walking: "🚶 On the way to the {place} - {remaining} left - arriving at {time}"
  travelling: "🧭 On the way to {city} - {remaining} left"
  level: "⭐ Level {level} - {xp_to_next} XP to level {next_level}"
  level_plain: "⭐ Level {level}"
  level_max: "⭐ Level {level} - highest level reached"
  energy: "⚡ Energy: {energy} of {max_energy}"
  energy_refilling: "⚡ Energy: {energy} of {max_energy} - full in {duration}"
  health: "❤️ Health: {health} of {max_health}"
  # A player's money: the cash they carry and their bank balance. Private:
  # only the player sees these.
  cash: "💵 Cash: {cash}"
  bank: "🏦 Bank balance: {bank}"
  code: "🆔 Player code: {code}"
  code_hint: "Friends can find you by sending \"find {code}\"."
  unavailable: "Your profile is not available right now. Please try again in a moment."

  # The player's work and studies, between their condition and their money.
  job: "💼 {title} in {city} - {pay} per shift"
  job_none: "💼 No job yet"
  shift_running: "⏳ On shift - {remaining} left"
  shift_ending: "⏳ Shift over - your pay is on its way"
  course: "📖 {course} - {remaining} left"
  course_finishing: "📖 {course} - finishing any moment"
  course_paused: "📖 {course} - paused (in jail), {remaining} left"
  jail: "⛓ You are in jail - {remaining} left"
  jail_in: "⛓ You are in jail in {city} - {remaining} left"
  jail_blocks: "Until you are free you cannot travel, work a shift, withdraw from the bank or start a new course; the course you are on is paused too."
  certificates: "📜 {count} certificates"
  achievements: "🏅 {count} achievements"
  hospital: "🏥 You are in hospital in {city} - {remaining} left"
  hospital_blocks: "Until you are discharged you cannot travel, work a shift, walk across town or commit a crime. Treatment shortens the stay."
travel:
  # The choice of transport, shown when a destination is pressed on the Map.
  # Nothing departs until a mode is chosen. {fare} and {cash} arrive already
  # formatted through format.money; {wait} is the real time the trip takes.
  options_title: |-
    🧭 Travel to {to}
    📍 From: {from}
  options_choose: "How would you like to travel?"
  option: "• {mode} - {fare} - {wait} on the way - {energy} energy"
  option_busy: "• {mode} - {fare} (busy route) - {wait} on the way - {energy} energy"
  option_own: "• In your own {mode} - fuel {fare} - {wait} on the way - {energy} energy - condition {condition}"
  requoted: "⚠️ The fare has changed since you looked. Nothing was charged — here are the current prices."
  cash: "💵 Your cash: {cash}"
  # The fare of the chosen mode and the ways to pay it.
  checkout_title: |-
    🧭 To {to} by {mode}
    📍 From: {from}
  checkout_fare: "💰 Fare: {fare}"
  checkout_fare_busy: "💰 Fare: {fare} (busy route)"
  checkout_wait: "⏳ {wait} on the road"
  checkout_energy: "⚡ {energy} energy"
  # Shown only if a mode has neither a translation nor an authored name.
  mode_unnamed: Other transport
  # What a journey that costs nothing shows instead of a price of zero.
  free: "Free"
  started: |-
    🧭 Your journey to {to} by {mode} has begun
    You left {from} and will arrive in {duration}.
    ⚡ {energy} energy used.
  started_fare: "💵 Fare paid: {fare}"
  # When the journey lands, as a clock time in the player's time zone.
  arrives_at: "🕒 Arrives at {time}"
  status_mode: "Travelling by: {mode}"
  status: |-
    🧭 On the way to {to}
    📍 From: {from}
    ⏳ Arriving in {remaining}
  status_arriving: |-
    🧭 On the way to {to}
    📍 From: {from}
    ⏳ Arriving any moment now.
  arrived: "📍 You have arrived in {city}."
  arrived_xp: "⭐ You earned {xp} XP."
  # Added to the arrival notice when the XP of the journey lifted the player
  # to a new level; {level} is the highest level reached.
  arrived_level: "⭐ Congratulations — you reached level {level}."
  none: "You are not travelling right now. Open the “Map” to choose a destination."
  here:
    no_village: "🏡 This group has no village yet, so there is nowhere to travel to. Send “found village” to start one."
    already_there: "📍 You are in {village} right now; no journey needed. Open the “Map” to go somewhere else."
    group_only: "🧭 Send “travel to this village” in the group of that village to travel straight there. Open the “Map” for other destinations."
  same_city: "You are already in this city. Choose another destination on the “Map”."
  no_route: "There is no route there from your current city. Choose one of the destinations on the “Map”."
  mode_unavailable: "That way of travelling does not serve this route. Choose the destination on the “Map” again to see the ways that do."
map:
  cities_title: "🧭 Travel to another city"
  title: "🗺 Map"
  origin: "📍 You are in {city}."
  destinations: "From here you can travel to these cities and villages:"
  destination: "• {city} - {distance} km"
  destination_priced: "• {city} - {distance} km - fare from {fare} - fastest {wait}"
  destination_free: "• {city} - {distance} km - free on foot - fastest {wait}"
  no_routes: "There is nowhere to travel to from here yet. When a route opens, its destinations will appear right here."
  no_city: "You have not settled in a city yet. Once you do, your travel destinations appear here."
  travelling: "🧭 You are on the way to {city}. You can start a new journey once you arrive."
# The map of the player's own city (configs/content/places.yml). Place names
# are under venue.<code>.
place:
  title: "🗺 Map of {city}"
  here: "📍 You are at the {place}."
  others: "👥 Other players here: {count}"
  walking: "🚶 On your way to the {place} - {remaining} left"
  arrives_at: "🕒 Arriving at {time}"
  list_title: "Places in the city:"
  line: "• {place} - {walk} walk"
  line_here: "• {place} (you are here)"
  line_with: "{line} - {what}"
  separator: ", "
  departures: "{mode} departures"
  hint: "Tap a place to walk there. Everything is done at its own place."
  walk_started: "🚶 You set off for the {place} - a {duration} walk."
  walk_energy: "⚡ {energy} energy spent."
  still_walking: "🚶 You are still on your way to the {place} - {remaining} left."
  you_are_at: "📍 You are at the {place} now."
  # A walk that does something on arrival (go, then do).
  then:
    work: "🛠 Your shift starts as soon as you arrive."
    open: "📲 What you asked for opens as soon as you arrive."
  then_hint: "One press walks you to the {place} ({walk}) and opens this page again there."
  service:
    bank: bank
    police: police
    city_hall: city hall
    market: market
    auction_house: auction house
    university: university
    training_center: training centre
  need:
    bank: "🏦 The bank is at the {place}."
    police: "🚓 The police are at the {place}."
    city_hall: "🏛 City hall is at the {place}."
    market: "🏪 The market is at the {place}."
    auction_house: "🔨 The auction house is at the {place}."
    university: "🎓 This course is taught at the {place}."
    training_center: "🎓 This course is taught at the {place}."
    departure: "🚉 Departures by {mode} are from the {place}."
    shop: "🛒 {shop} is at the {place}."
    crime: "🕶 {crime} cannot be done here; go to the {place} to do it."
    heist: "🕶 {crime} cannot be done here; the crew gathers at the {place}."
    board: "📋 Missions are taken and handed in at the {board} at the {place}."
    home: "🛏 Your home is at the {place}."
    sleep: "🛏 This place to sleep is at the {place}."
  button:
    go: "🚶 {place}"
    walk: "🚶 Walk to the {place} - {walk}"
    walk_then: "🚶 Go to the {place} ({walk})"
    other_cities: "🧭 Travel to another city"
settings:
  title: "⚙️ Settings"
  language: "🌐 Game language: {language}"
  language_changed: "✅ The game language is now {language}."
  presence: "👁 Who can see me online: {visibility}"
  presence_changed: "✅ Your online status is now visible to: {visibility}."
  presence_nobody_hint: "With \"nobody\", other players' online status is hidden from you too; only people in your own village can see you."
# Game clients (api/client-api.md): the one-time code that links a native
# client to the account, and the clients linked so far.
device:
