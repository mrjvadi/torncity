# Telegram wording of the life area (docs/adr/0039-presentation-split.md): the profile and its menus,
# the city map and travel, the character's life, settings, devices, achievements, the bag and property.
# Layered over configs/locales/fa.yml by the catalogue loader; a key is defined once across the layers.

profile:
  # The one-time welcome. It is shown above the profile only while the player
  # has not earned any XP, and it takes no placeholders. (The key name is
  # pinned by internal/telegram/i18n's shipped-locale test.)
  body: |-
    👋 به بازی خوش آمدید!
    اینجا خانهٔ شماست: وضعیت، پول و کارتان را همین‌جا می‌بینید. با دکمه‌های پایین به هر جای بازی بروید.

  name: "👤 {name}"
  city: "📍 {city}"
  # Where in the city the player stands, or the walk they are on.
  place: "📍 {place} - {city}"
  walking: "🚶 در راه {place} - {remaining} مانده - رسیدن ساعت {time}"
  travelling: "🧭 در راه {city} - {remaining} مانده"
  level: "⭐ سطح {level} - {xp_to_next} امتیاز تجربه تا سطح {next_level}"
  level_plain: "⭐ سطح {level}"
  level_max: "⭐ سطح {level} - بالاترین سطح بازی"
  energy: "⚡ انرژی: {energy} از {max_energy}"
  energy_refilling: "⚡ انرژی: {energy} از {max_energy} - {duration} تا پر شدن"
  health: "❤️ سلامت: {health} از {max_health}"
  # پول بازیکن: نقدی که همراه دارد و موجودی بانکش. خصوصی است و فقط خود
  # بازیکن آن را می‌بیند.
  cash: "💵 پول نقد: {cash}"
  bank: "🏦 موجودی بانک: {bank}"
  # The public player code, and how a friend uses it. The code is the one
  # identifier a player is meant to see and share; see
  # internal/shared/playercode. social.search reuses profile.code.
  code: "🆔 کد بازیکن: {code}"
  code_hint: "دوستانتان با فرستادن «پیدا {code}» شما را پیدا می‌کنند."
  unavailable: "پروفایل شما الان در دسترس نیست. چند لحظهٔ دیگر دوباره امتحان کنید."

  # The player's work and studies, between their condition and their money.
  job: "💼 {title} در {city} - {pay} برای هر شیفت"
  job_none: "💼 هنوز شغلی ندارید"
  shift_running: "⏳ در حال شیفت - {remaining} مانده"
  shift_ending: "⏳ شیفت تمام شد؛ دستمزد در راه است"
  course: "📖 {course} - {remaining} مانده"
  course_finishing: "📖 {course} - چند لحظهٔ دیگر تمام می‌شود"
  course_paused: "📖 {course} - متوقف (در زندان)، {remaining} مانده"
  # A player in jail sees it first on the home screen.
  jail: "⛓ در زندان هستید - {remaining} مانده"
  jail_in: "⛓ در زندان {city} هستید - {remaining} مانده"
  jail_blocks: "تا آزادی نمی‌توانید سفر کنید، شیفت کار کنید، از بانک برداشت کنید یا دورهٔ تازه‌ای شروع کنید؛ دورهٔ در حال گذراندن هم متوقف می‌ماند."
  certificates: "📜 {count} مدرک"
  achievements: "🏅 {count} دستاورد"
  hospital: "🏥 در بیمارستان {city} بستری هستید - {remaining} مانده"
  hospital_blocks: "تا ترخیص نمی‌توانید سفر کنید، سر کار بروید، در شهر جابه‌جا شوید یا خلاف کنید. درمان، بستری را کوتاه می‌کند."
travel:
  # The choice of transport, shown when a destination is pressed on the Map.
  # Nothing departs until a mode is chosen. {fare} and {cash} arrive already
  # formatted through format.money; {wait} is the real time the trip takes.
  options_title: |-
    🧭 سفر به {to}
    📍 مبدأ: {from}
  options_choose: "با چه وسیله‌ای می‌روید؟"
  option: "• {mode} - {fare} - {wait} در راه - {energy} انرژی"
  option_busy: "• {mode} - {fare} (مسیر شلوغ) - {wait} در راه - {energy} انرژی"
  option_own: "• {mode} (وسیلهٔ خودتان) - سوخت {fare} - {wait} در راه - {energy} انرژی - سلامت خودرو {condition}"
  requoted: "⚠️ کرایه از وقتی که قیمت‌ها را دیدید تغییر کرده است. پولی کسر نشد؛ قیمت‌های تازه را ببینید و دوباره انتخاب کنید."
  cash: "💵 پول نقد شما: {cash}"
  # The fare of the chosen mode and the ways to pay it: the step between
  # choosing a mode and departing.
  checkout_title: |-
    🧭 سفر به {to} با {mode}
    📍 مبدأ: {from}
  checkout_fare: "💰 کرایه: {fare}"
  checkout_fare_busy: "💰 کرایه: {fare} (مسیر شلوغ)"
  checkout_wait: "⏳ {wait} در راه"
  checkout_energy: "⚡ {energy} انرژی"
  # Shown only if a mode has neither a translation nor an authored name.
  mode_unnamed: وسیلهٔ دیگر
  # What a journey that costs nothing shows instead of a price of zero.
  free: "رایگان"
  started: |-
    🧭 سفر با {mode} به سوی {to} آغاز شد
    {from} را ترک کردید و {duration} دیگر می‌رسید.
    ⚡ {energy} انرژی مصرف شد.
  started_fare: "💵 کرایهٔ پرداخت‌شده: {fare}"
  # زمان رسیدن سفر، به وقت منطقهٔ زمانی بازیکن.
  arrives_at: "🕒 ساعت رسیدن: {time}"
  status_mode: "وسیلهٔ سفر: {mode}"
  status: |-
    🧭 در راه {to}
    📍 مبدأ: {from}
    ⏳ {remaining} تا رسیدن
  status_arriving: |-
    🧭 در راه {to}
    📍 مبدأ: {from}
    ⏳ چند لحظهٔ دیگر می‌رسید.
  arrived: "📍 به {city} رسیدید."
  arrived_xp: "⭐ {xp} امتیاز تجربه گرفتید."
  # Added to the arrival notice when the XP of the journey lifted the player
  # to a new level; {level} is the highest level reached.
  arrived_level: "⭐ تبریک؛ به سطح {level} رسیدید."
  none: "الان در سفر نیستید. برای سفر، «نقشه» را باز کنید."
  # «سفر به این روستا» typed in a village's group (travel.here): the journey to
  # that group's village, with nothing to choose. These are what it says when
  # there is no journey to offer.
  here:
    no_village: "🏡 این گروه هنوز روستایی ندارد، پس مقصدی برای سفر نیست. برای شروع «ساخت روستا» را بفرستید."
    already_there: "📍 همین حالا در {village} هستید و سفری لازم نیست. برای رفتن به جای دیگر «نقشه» را باز کنید."
    group_only: "🧭 «سفر به این روستا» را در گروهِ همان روستا بفرستید تا مستقیم به آنجا سفر کنید. برای مقصدهای دیگر «نقشه» را باز کنید."
  same_city: "همین حالا در این شهر هستید. مقصد دیگری را از «نقشه» انتخاب کنید."
  no_route: "از شهری که در آن هستید راهی به آنجا نیست. یکی از مقصدهای «نقشه» را انتخاب کنید."
  mode_unavailable: "این وسیله در این مسیر رفت‌وآمد نمی‌کند. مقصد را دوباره از «نقشه» بزنید تا وسیله‌های همین مسیر را ببینید."
map:
  cities_title: "🧭 سفر به شهر دیگر"
  title: "🗺 نقشه"
  origin: "📍 شما در {city} هستید."
  destinations: "از اینجا به این شهرها و روستاها می‌توانید سفر کنید:"
  destination: "• {city} - {distance} کیلومتر"
  # A place priced from the world: the distance, the cheapest fare and the
  # fastest way there.
  destination_priced: "• {city} - {distance} کیلومتر - کرایه از {fare} - سریع‌ترین {wait}"
  destination_free: "• {city} - {distance} کیلومتر - رایگان با پای پیاده - سریع‌ترین {wait}"
  no_routes: "فعلاً از اینجا راهی به جای دیگری نیست. هر وقت مسیری باز شود، مقصدها همین‌جا نمایش داده می‌شوند."
  no_city: "هنوز در هیچ شهری مستقر نشده‌اید. پس از استقرار، مقصدهای سفر همین‌جا نمایش داده می‌شوند."
  travelling: "🧭 در راه {city} هستید. پس از رسیدن می‌توانید سفر تازه‌ای را آغاز کنید."
# The map of the player's own city (configs/content/places.yml): where they
# stand, every place of the city with the walk to it and what is there. A
# walk is short and timed on the game clock; a service is found only at its
# place. Place names are under venue.<code>.
place:
  title: "🗺 نقشهٔ {city}"
  here: "📍 شما در {place} هستید."
  others: "👥 بازیکنان دیگر اینجا: {count}"
  walking: "🚶 در راه {place} هستید - {remaining} مانده"
  arrives_at: "🕒 رسیدن: ساعت {time}"
  list_title: "جاهای شهر:"
  line: "• {place} - {walk} پیاده‌روی"
  line_here: "• {place} (همین‌جا)"
  line_with: "{line} - {what}"
  separator: "، "
  departures: "حرکت {mode}"
  hint: "برای رفتن به هر جا دکمه‌اش را بزنید. هر کاری فقط در جای خودش انجام می‌شود."
  walk_started: "🚶 به سوی {place} راه افتادید - {duration} پیاده‌روی."
  walk_energy: "⚡ {energy} انرژی مصرف شد."
  still_walking: "🚶 هنوز در راه {place} هستید - {remaining} مانده."
  you_are_at: "📍 شما الان در {place} هستید."
  # A walk that does something on arrival (go, then do): the line the
  # started walk adds, and the hint under a refusal whose button walks there
  # and opens the same page again.
  then:
    work: "🛠 به‌محض رسیدن، شیفت کارتان شروع می‌شود."
    open: "📲 به‌محض رسیدن، صفحه‌ای که خواستید برایتان باز می‌شود."
  then_hint: "با یک دکمه تا {place} پیاده می‌روید ({walk}) و همین صفحه آنجا دوباره باز می‌شود."
  service:
    bank: بانک
    police: پلیس
    city_hall: شهرداری
    market: بازار معاملات
    auction_house: حراجی
    university: دانشگاه
    training_center: آموزشگاه
  need:
    bank: "🏦 بانک در {place} است."
    police: "🚓 پلیس در {place} است."
    city_hall: "🏛 شهرداری در {place} است."
    market: "🏪 بازار معاملات در {place} است."
    auction_house: "🔨 حراجی در {place} است."
    university: "🎓 این دوره در {place} برگزار می‌شود."
    training_center: "🎓 این دوره در {place} برگزار می‌شود."
    departure: "🚉 {mode} از {place} حرکت می‌کند."
    shop: "🛒 {shop} در {place} است."
    crime: "🕶 {crime} اینجا شدنی نیست؛ برای انجامش به {place} بروید."
    heist: "🕶 {crime} اینجا شدنی نیست؛ گروه باید در {place} جمع شود."
    board: "📋 مأموریت در تابلوی {board} در {place} گرفته و تحویل داده می‌شود."
    home: "🛏 خانهٔ شما در {place} است."
    sleep: "🛏 این جای خواب در {place} است."
  button:
    go: "🚶 {place}"
    walk: "🚶 رفتن به {place} - {walk}"
    walk_then: "🚶 رفتن به {place} ({walk})"
    other_cities: "🧭 سفر به شهر دیگر"
