    land_cell_owned: "One of these lots belongs to someone else; a zone cannot cover other people's land."
    land_cell_zoned: "One of these lots is in a zone already."
    land_zone_name: "A zone's name has to be 1 to 40 letters."
    land_zone_kind: "We do not know that kind of zone."
    land_zone_size: "A zone cannot be larger than that, or the corners are wrong."
    land_zone_none: "No such zone is open."
    land_zoning_off: "Zoning has not started yet."
    land_slope_off: "The slope rule has not started yet."
    land_tile_claimed: "Someone has claimed this block already."
    land_tile_foreign: "This block lies in another town's land or on its road."
