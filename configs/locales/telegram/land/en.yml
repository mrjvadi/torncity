# Telegram wording of the land registry (docs/adr/0072): parcels, zones, claims and foundations.
# Layered over configs/locales/en.yml by the catalogue loader; a key is defined once across the layers.

land:
  title: "🗺 Land and parcels of {village}"
  parcels_none: "No parcels yet. Every plot you buy becomes one."
  parcels_head: "Parcels ({n})"
  parcel_line: "🏡 {who}'s parcel, {cells} lots"
  parcel_commons: "🌾 The town's common land, {cells} lots"
  in_zone: "In the zone \"{zone}\""
  zones_head: "Zones"
  zone_line: "📐 {name} ({kind}) - {cells} lots, opened by {by}"
  zone_line_notice: "📐 {name} ({kind}) - {cells} lots, opened by {by}. The notice period is still running."
  claims_head: "Claimed blocks ({n})"
  claims_line: "Each block costs {upkeep} a day to keep; if the treasury cannot pay, the block lapses."
  foundations: "Lots with a foundation: {n}"
  zoning_starts: "Zoning starts on {date}."
  slope_starts: "The slope rule for new buildings starts on {date}."
  button:
    confirm: "✅ Confirm ({money})"
    join: "➕ Join ({cells} lots)"
    zone_close: "❌ Close the zone \"{name}\""
  notice:
    parcel_joined: "The two parcels are one now."
    parcel_split: "The parcel was split."
    zone_opened: "The zone is open. Its rules bite after the notice period; buildings that stand are left alone."
    zone_closed: "The zone is closed. No building was removed."
    claimed: "The block now belongs to the town's land."
    foundation_laid: "The foundation is laid. You can build here now."
  kind:
    commons: "Common land"
    core: "Centre"
    residential: "Residential"
    farm: "Farming"
    industry: "Workshops"
    military: "Military"
    port: "Port"
    site: "Building site"
    open: "Open"
  quote:
    parcel.join: "Joining the two parcels ({cells} lots) costs a registry fee of {money}."
    parcel.split: "Cutting {cells} lots out of the parcel costs a registry fee of {money}."
    zone.open: "Opening a zone over {cells} lots costs {money}."
    claim: "Claiming this block takes {money} from the treasury."
    foundation.lay: "Laying the foundation takes {stone} stone and a mason's wage (you put in {have} you carry and buy {buy}). {money} in all."

village:
  refusal:
    land_not_yours: "🔒 This parcel is not yours."
