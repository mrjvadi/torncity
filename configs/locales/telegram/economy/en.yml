# Telegram wording of the economy and finance area (en), layered over configs/locales/en.yml by
# the catalogue loader (docs/adr/0039-presentation-split.md section 7). Natural everyday
# speech; a key is defined once across the layers.

# The bank: cash on hand and a bank balance. A bank is a city service, so
# deposits and withdrawals happen only in a city; card payments work from
# anywhere, and cash changes hands only between players in the same city.
# Fees are each city's policy and are always shown before money moves.
bank:
  title: "🏦 Bank"
  title_branch: "🏦 Bank - {city} branch"
  withdrawal_fee: "Withdrawals here carry a fee of {percent}%, taken from your bank on top of the amount; deposits are free."
  withdrawal_free: "Deposits and withdrawals here are free."
  closed_travelling: "🧭 You are travelling; you can deposit and withdraw once you arrive in a city. Card payments work from anywhere."
  closed_no_city: You have not settled in a city yet, so there is no bank to visit.
  hint: "Choose an amount below; for any other amount, press \"any amount\" and type it."
  pay_hint: "💸 To give money to another player, reply to their message in the group with \"pay 5000\", or press \"Pay a player\"."
  nothing_to_deposit: "📥 You carry no cash to deposit."
  nothing_to_withdraw: "📤 Your bank balance is too low to withdraw."
  jailed_no_withdrawal: "⛓ You cannot withdraw while in jail; deposits still work."
  deposited: "✅ {amount} deposited into your bank account."
  withdrew: "✅ You withdrew {amount} in cash."
  withdrew_fee: "✅ You withdrew {amount} in cash, and a fee of {fee} was taken from your bank."
  error:
    not_in_city: The bank is only open in a city. You can deposit and withdraw once you arrive; card payments work from anywhere.
    not_together: You can only hand cash to a player who is in the same city as you. Send the money by card instead — it works from anywhere.
    self_payment: You cannot pay yourself.
    payee_not_found: No player to pay was found. Check the username or player code and try again.
    invalid_amount: "Please write the amount as a number only, for example \"deposit 5000\"."
    below_minimum: The smallest amount allowed is {min}.
    above_maximum: The largest amount allowed at once is {max}.
    not_enough_cash: "You do not have enough cash. Cash on you: {available}"
    not_enough_in_bank: |-
      Your bank balance is not enough.
      This needs {needed} including the fee, and you have {available}.
    insufficient: There is not enough money for this. Open “Bank” to see your balances.
    unavailable: The bank is not available right now. Please try again in a moment.

# Paying another player. {player} is the other player's name.
pay:
  help: |-
    💸 Pay another player
    • In a group: reply to their message with "pay 5000".
    • Here: send "pay" with their username or player code, for example "pay @username" or "pay K7Q2M9A".
    Cash changes hands only when you are both in the same city; card payments work from anywhere.
  title: "💸 Pay {player}"
  together: "📍 You are both in {city}; cash or card, either works."
  apart: "🧭 You are not in the same city, so only a card payment is possible."
  card_fee: "💳 Card payments from {city} carry a fee of {percent}%, on top of the amount."
  card_free: "💳 Card payments from {city} are free."
  hint: "Choose an amount below; for any other amount, press \"any amount\" and type it."
  cannot_afford: "💸 Neither your cash nor your bank balance is enough to pay."
  short_cash: "💵 Not enough cash: this needs {needed} and you carry {available}. Choose a smaller amount or pay by card."
  short_bank: "🏦 Not enough in your bank: with the fee this needs {needed} and you have {available}. Choose a smaller amount."
  confirm_title: "💸 Confirm your payment to {player}"
  confirm_method_cash: "💵 How: cash, hand to hand"
  confirm_method_card: "💳 How: bank card"
  short_local: "🏘 You do not hold enough of the village's money: {needed} needed, {available} held. Pick a smaller amount or buy some at the village desk."
  confirm_method_local: "🏘 How: the village's money ({name}), no fee"
  confirm_after_local: "Your {name} after paying: {after}"
  sent_local: "✅ You paid {amount} to {player}."
  local_holds: "🏘 You hold {amount}."
  confirm_amount: "Amount: {amount}"
  confirm_fee: "Fee: {fee}"
  confirm_total: "🧾 Total from your bank: {total}"
  confirm_after_cash: "Your cash after paying: {after}"
  confirm_after_bank: "Your bank balance after paying: {after}"
  sent_cash: "✅ You handed {amount} in cash to {player}."
  sent_card: "✅ You sent {amount} by card to {player}."
  sent_fee: "Fee: {fee}"
  not_together: "{player} is not here with you, so you cannot hand over cash. Send the money by card instead — card payments work from anywhere."
  announced: "💸 {payer} paid {payee}."
  held: "⏸ Your payment of {amount} to {player} is held for review. It has left your purse and waits in your escrow; after the review it reaches {player} or comes back to you."

# Paying a service (internal/domain/payment): every charge is paid from the
# cash the player carries or by bank card, as they choose. A price screen
# offers only the ways that cover the price; "balances" appears only in the
# player's own chat, never in a group.
payment:
  choose: "How would you like to pay?"
  button:
    cash: "💵 Pay cash - {amount}"
    card: "💳 Pay by card - {amount}"
  only_card: "💵 Your cash does not cover it — pay by card."
  only_cash: "💳 Your bank balance does not cover it — pay in cash."
  cash_only: "💵 Cash only here."
  card_only: "💳 Card payments only here."
  not_accepted: "That way of paying is not taken here. Open the price again and pay with the buttons on it."
  cannot_afford: "💸 Neither your cash nor your bank balance covers this."
  paid:
    cash: "💵 Paid from your cash."
    card: "💳 Paid by bank card."
  balances: "💵 Your cash: {cash} - Bank: {bank}"
  declined: |-
    💸 You do not have enough to pay {amount}.
    💵 Cash: {cash}
    🏦 Bank: {bank}
    Nothing was charged.

