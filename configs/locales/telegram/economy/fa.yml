# Telegram wording of the economy and finance area (fa), layered over configs/locales/fa.yml by
# the catalogue loader (docs/adr/0039-presentation-split.md section 7). Natural everyday
# speech; a key is defined once across the layers.

# بانک: پول نقد همراه بازیکن و موجودی حساب بانکی. بانک خدمتی شهری است، پس
# واریز و برداشت فقط در شهر انجام می‌شود؛ پرداخت کارتی از همه‌جا ممکن است و
# پول نقد فقط بین دو بازیکنِ هم‌شهر دست‌به‌دست می‌شود. کارمزدها سیاست هر شهر
# است و همیشه پیش از جابه‌جایی پول نشان داده می‌شود.
bank:
  title: "🏦 بانک"
  title_branch: "🏦 بانک - شعبهٔ {city}"
  withdrawal_fee: "کارمزد برداشت در این شهر {percent}٪ است و جدا از مبلغ از بانک کسر می‌شود؛ واریز رایگان است."
  withdrawal_free: "واریز و برداشت در این شهر کارمزد ندارد."
  closed_travelling: "🧭 در سفر هستید؛ واریز و برداشت پس از رسیدن به شهر ممکن است. پرداخت کارتی از همه‌جا انجام می‌شود."
  closed_no_city: "هنوز در هیچ شهری مستقر نشده‌اید، پس بانکی در دسترس نیست."
  hint: "مبلغ را از دکمه‌ها انتخاب کنید؛ برای هر مبلغ دیگری، دکمهٔ «مبلغ دلخواه» را بزنید و مبلغ را بنویسید."
  pay_hint: "💸 برای پول دادن به بازیکن دیگر، در گروه روی پیام او «پرداخت 5000» را پاسخ بدهید، یا دکمهٔ «پرداخت به بازیکن» را بزنید."
  nothing_to_deposit: "📥 پول نقدی برای واریز همراه ندارید."
  nothing_to_withdraw: "📤 موجودی بانک برای برداشت کافی نیست."
  jailed_no_withdrawal: "⛓ در زندان نمی‌توانید از بانک برداشت کنید؛ واریز ممکن است."
  deposited: "✅ {amount} به حساب بانکی شما واریز شد."
  withdrew: "✅ {amount} نقد برداشت کردید."
  withdrew_fee: "✅ {amount} نقد برداشت کردید و کارمزد {fee} هم از بانک کسر شد."
  error:
    not_in_city: "بانک فقط در شهر باز است. پس از رسیدن به مقصد می‌توانید واریز و برداشت کنید؛ پرداخت کارتی از همه‌جا ممکن است."
    not_together: "پول نقد را فقط به بازیکنی می‌توانید بدهید که با شما در یک شهر است. به‌جای آن با کارت پرداخت کنید؛ پرداخت کارتی از همه‌جا ممکن است."
    self_payment: نمی‌توانید به خودتان پرداخت کنید.
    payee_not_found: "بازیکنی برای پرداخت پیدا نشد. نام کاربری یا کد بازیکن را بررسی کنید و دوباره امتحان کنید."
    invalid_amount: "مبلغ را فقط به عدد بنویسید؛ مثلاً «واریز 5000»."
    below_minimum: کمترین مبلغ مجاز {min} است.
    above_maximum: بیشترین مبلغ مجاز در هر بار {max} است.
    not_enough_cash: "پول نقد کافی ندارید. پول نقد همراه شما: {available}"
    not_enough_in_bank: |-
      موجودی بانک کافی نیست.
      این کار با کارمزد {needed} لازم دارد و موجودی شما {available} است.
    insufficient: "پول کافی برای این کار ندارید. موجودی‌هایتان را در «بانک» ببینید."
    unavailable: "بانک الان در دسترس نیست. چند لحظهٔ دیگر دوباره امتحان کنید."

# پرداخت به بازیکن دیگر. {player} نام آن بازیکن است.
pay:
  help: |-
    💸 پرداخت به بازیکن دیگر
    • در گروه: روی پیام او «پرداخت 5000» را پاسخ بدهید.
    • اینجا: «پرداخت» را با نام کاربری یا کد بازیکن او بفرستید؛ مثلاً «پرداخت @username» یا «پرداخت K7Q2M9A».
    پول نقد فقط وقتی دست‌به‌دست می‌شود که هر دو در یک شهر باشید؛ پرداخت کارتی از همه‌جا ممکن است.
  title: "💸 پرداخت به {player}"
  together: "📍 هر دو در {city} هستید؛ نقد یا کارت، هر دو ممکن است."
  apart: "🧭 در یک شهر نیستید، پس فقط پرداخت کارتی ممکن است."
  card_fee: "💳 کارمزد پرداخت کارتی از {city} {percent}٪ است و جدا از مبلغ کسر می‌شود."
  card_free: "💳 پرداخت کارتی از {city} کارمزد ندارد."
  hint: "مبلغ را از دکمه‌ها انتخاب کنید؛ برای هر مبلغ دیگری، دکمهٔ «مبلغ دلخواه» را بزنید و مبلغ را بنویسید."
  cannot_afford: "💸 نه پول نقدتان و نه موجودی بانکتان برای پرداخت کافی نیست."
  # The funds are checked before the confirmation; these bring the player
  # back to the payment screen instead.
  short_cash: "💵 پول نقدتان کافی نیست: {needed} لازم است و {available} همراه دارید. مبلغ کمتری انتخاب کنید یا با کارت بپردازید."
  short_bank: "🏦 موجودی بانکتان کافی نیست: با کارمزد {needed} لازم است و {available} دارید. مبلغ کمتری انتخاب کنید."
  confirm_title: "💸 تأیید پرداخت به {player}"
  confirm_method_cash: "💵 روش: نقد، دست‌به‌دست"
  confirm_method_card: "💳 روش: کارت بانکی"
  confirm_amount: "مبلغ: {amount}"
  confirm_fee: "کارمزد: {fee}"
  confirm_total: "🧾 مجموع کسر از بانک: {total}"
  confirm_after_cash: "پول نقد شما پس از پرداخت: {after}"
  confirm_after_bank: "موجودی بانک شما پس از پرداخت: {after}"
  sent_cash: "✅ {amount} نقد به {player} دادید."
  sent_card: "✅ {amount} با کارت برای {player} فرستادید."
  sent_fee: "کارمزد: {fee}"
  not_together: "{player} اینجا کنار شما نیست، پس نمی‌توانید به او پول نقد بدهید. به‌جای آن با کارت پرداخت کنید؛ پرداخت کارتی از همه‌جا ممکن است."
  announced: "💸 {payer} به {payee} پول داد."
  held: "⏸ پرداخت {amount} به {player} برای بررسی نگه داشته شد. مبلغ از حساب شما کسر و در حساب امانی شما نگه داشته شده است؛ پس از بررسی یا به {player} می‌رسد یا به شما برمی‌گردد."

# Paying a service (internal/domain/payment): every charge — tuition, a fare,
# a police fee, bail, a shop, the market — is paid from the cash the player
# carries or by bank card, as the player chooses. A price screen offers only
# the ways that cover the price; «balances» is shown only in the player's own
# chat, never in a group.
payment:
  choose: "چطور پرداخت می‌کنید؟"
  button:
    cash: "💵 پرداخت نقدی - {amount}"
    card: "💳 پرداخت با کارت - {amount}"
  only_card: "💵 پول نقدتان کافی نیست؛ با کارت بانکی بپردازید."
  only_cash: "💳 موجودی بانکتان کافی نیست؛ نقدی بپردازید."
  cash_only: "💵 اینجا فقط پول نقد پذیرفته می‌شود."
  card_only: "💳 اینجا فقط پرداخت کارتی پذیرفته می‌شود."
  not_accepted: "این روش پرداخت اینجا پذیرفته نمی‌شود. قیمت را دوباره باز کنید و از دکمه‌های همان صفحه بپردازید."
  cannot_afford: "💸 نه پول نقدتان و نه موجودی بانکتان به این مبلغ نمی‌رسد."
  paid:
    cash: "💵 از پول نقدتان پرداخت شد."
    card: "💳 با کارت بانکی پرداخت شد."
  balances: "💵 پول نقد شما: {cash} - موجودی بانک: {bank}"
  declined: |-
    💸 پولتان برای پرداخت {amount} کافی نیست.
    💵 پول نقد: {cash}
    🏦 موجودی بانک: {bank}
    چیزی کسر نشد.

