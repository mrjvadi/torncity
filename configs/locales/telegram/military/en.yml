    offer: "• {good} - {company}, {city} ({country}) - {price} each - {left} left"
    offer_export: "🚫 {good} - {company}, {city} ({country}) - its country does not export to us"
    offer_embargo: "⛔ {good} - {company}, {city} ({country}) - under an arms embargo"
