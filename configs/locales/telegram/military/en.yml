    readiness: "🎯 Readiness: {value}"
    upkeep: "🔧 Upkeep every period: {amount}"
    moving: "🚚 {count} on the way to a garrison."
    public: "How many of each is a state secret; what the world knows is only how large each force is."
    secret: "🔒 Classified: exact numbers, readiness and upkeep are shown only to the country's defence office holders."
  equipment:
