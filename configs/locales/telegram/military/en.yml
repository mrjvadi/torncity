    choose_city: "Which city should it be stationed in?"
    choose_qty: "How many to {city}? {available} can go. The move takes {time}."
    confirm: "Send {count} to {city}? They arrive in {time} and cannot be ordered elsewhere on the way."
    started: "🚚 {count} × {good} set off for {city}; they arrive in {time}."
  procure:
