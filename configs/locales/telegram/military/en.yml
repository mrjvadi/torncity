    empty: "This branch has no equipment yet."
    group: "▪️ {good} - {count} in service - quality {quality}"
    attribute: "  {name}: {value}"
    seen_at: "  📡 A radar that finds a 1 m² target at {radar} km finds this one at {km} km."
    garrison: "  📍 {city}: {count}"
    depot: "  📦 In depot, not stationed: {count}"
    moving: "  🚚 On the move: {count}"
    committed: "  ⚔️ In an operation: {count}"
    damaged: "  🔧 Damaged, awaiting repair: {count}"
    moves: "On the move:"
    move: "• {count} × {good} to {city} - {left} left, arriving at {at}"
  station:
