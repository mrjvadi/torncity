    exports: "🚢 Export policy: {policy}."
    last: "📅 Last period: {levy} came in from the cities, {appropriation} of it to defence."
    upkeep_paid: "🔧 Upkeep paid in full: {paid}."
    upkeep_short: "⚠️ Upkeep short: {paid} of {due} paid, and readiness fell."
    next: "⏳ The next defence period ends in {in}, at {at}."
