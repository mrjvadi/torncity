    ifv: "Infantry fighting vehicles"
    artillery: "Artillery"
    ballistic: "Ballistic missiles"
    cruise: "Cruise missiles"
    anti_ship: "Anti-ship missiles"
    frigate: "Frigates"
    submarine: "Submarines"
