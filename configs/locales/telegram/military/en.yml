# Telegram wording of the military, war and defence area (docs/adr/0039-presentation-split.md):
# the ministry of defence and the forces, stationing, procurement, the war board and its flows,
# the war room and operations, and the defence licences, with their notices and the group lines.
# The names of branches, classes, bands, grounds, operations and objectives are content names the
# client API serves by code (internal/clientapi/catalogue.go).

