    head: "👛 در {venue} شهر {city} از شما دزدی شد ({crime}). {amount} از دست دادید."
    unseen: "کسی ندید چه کسی این کار را کرد."
    seen: "👀 شاهدی دیده است چه کسی این کار را کرد: {thief} ({code})."
    report: "🚔 می‌توانید به پلیس شکایت کنید. هزینهٔ ثبت شکایت {fee} است و به خزانهٔ شهر می‌رود."
    item: "🎒 {item} شما را هم بردند."
  case_closed: "🗂 پرونده بسته شد: پلیس نتوانست کسی را که در {city} از شما دزدی کرد پیدا کند."
  case_solved: "🚔 پرونده حل شد: پلیس {thief} ({code}) را به خاطر دزدی در {city} ({crime}) دستگیر کرد. {restored} به شما بازگردانده شد."
  case_shortfall: "{short} قابل بازگرداندن نبود و در سابقهٔ او می‌ماند."
  case_item_returned: "🎒 {item} شما به شما برگشت."
