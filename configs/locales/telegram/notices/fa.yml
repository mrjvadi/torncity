# Telegram wording (fa) of notices and the inbox (what the notifier pushes), layered over configs/locales/fa.yml by the catalogue loader.
# Moved here with its screens (docs/adr/0039-presentation-split.md, section 7); a key is defined once across the layers.
gov:
  appoint:
    notice: "🎖 {by_office} {by} شما را به‌عنوان {office} {place} منصوب کرد. «منصب من» را باز کنید تا ببینید از این پس دربارهٔ چه چیزهایی تصمیم می‌گیرید."
  dismiss:
    notice: "📭 {by_office} {by} شما را از منصب {office} {place} برکنار کرد."
pay:
  received_cash: "💵 {player} مبلغ {amount} را نقد به شما داد."
  received_card: "💳 {player} مبلغ {amount} را با کارت برای شما فرستاد. این پول به حساب بانکی شما واریز شد."
crime:
