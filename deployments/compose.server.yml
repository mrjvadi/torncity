# Server override: run alongside an existing stack on a shared host.
#
# Usage:
#   docker compose -f docker-compose.yml -f deployments/compose.server.yml up -d
#
# Three differences from the local stack:
#
#  1. No telegram-bot-api service. The host already runs one in --local mode;
#     starting a second would mean a second api_id/api_hash and a second copy
#     of every bot's state on disk for no benefit.
#  2. Host port mappings stay as the base file defines them: loopback only, on
#     non-default ports (55432/56379/54222), which are free on this host.
#  3. The gateway joins the external network the bot api server lives on, so it
#     can reach it by container name.
#  4. The web panel joins that network too, as tc-panel, for the host's
#     reverse proxy.
#  5. So do the game client API (tc-clientapi) and the realtime server
#     (tc-centrifugo).
#  6. The game client's web build is served by a small static server, tc-web,
#     from files on the host (WEB_ROOT), outside the repository.
services:
  telegram-bot-api:
    # Disabled here: the host's existing server is used instead. Compose has no
    # "remove a service" directive, so it is reduced to a no-op that exits 0 and
    # is never started (it is not a dependency of anything).
    image: alpine:3.20
    command: ["true"]
    restart: "no"
    profiles: ["unused"]

  gateway:
    networks: [default, botapi]

  # The web panel joins the same external network, where the host's Caddy
  # reverse-proxies panelomm.ir404.site to tc-panel:8080 (TLS and Cloudflare
  # in front of it). Only peers on the docker networks may name the client
  # (CF-Connecting-IP / X-Forwarded-For); the panel has no public port.
  panel:
    networks:
      botapi:
        aliases: ["tc-panel"]
    environment:
      TORN_PANEL_LISTEN: "0.0.0.0:8080"
      TORN_PANEL_PUBLIC_URL: "https://panelomm.ir404.site"
      TORN_PANEL_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"

  # The game client API and the realtime server join the same network, as
  # tc-clientapi and tc-centrifugo, for the host's reverse proxy to expose
  # later (not configured here). Peers on the docker networks may name the
  # client for rate limiting (X-Forwarded-For).
  clientapi:
    networks:
      botapi:
        aliases: ["tc-clientapi"]
    environment:
      TORN_CLIENT_LISTEN: "0.0.0.0:8081"
      TORN_CLIENT_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"

  centrifugo:
    networks:
      botapi:
        aliases: ["tc-centrifugo"]

  web:
    image: caddy:2-alpine
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.25"
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    # The image's caddy binary carries the file capability to bind low
    # ports; without it in the bounding set the exec itself is refused.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./deployments/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_ROOT:-/opt/torncity-web}:/srv:ro
    tmpfs: ["/data", "/config"]
    ports: ["127.0.0.1:58093:8080"]
    networks:
      botapi:
        aliases: ["tc-web"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  botapi:
    external: true
    name: antispam_default
