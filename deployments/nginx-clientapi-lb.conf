# Stands in for the reverse proxy a real multi-host deploy puts in front of
# clientapi (docker-compose.yml's comment on the clientapi service already
# says this is the production model; this file is the local proof of it).
#
# The `set` + `resolver` combination is what makes this balance across
# replicas rather than pinning to whichever one Docker's embedded DNS
# answered with at container start: nginx re-resolves "clientapi" per
# request through the embedded DNS server (127.0.0.11), which round-robins
# the A records of every replica behind that service name. A plain
# `proxy_pass http://clientapi:8081;` with no variable is resolved once, at
# startup, and would send every request to whichever replica happened to
# come up first.
resolver 127.0.0.11 valid=5s;

server {
    listen 8080;

    location / {
        set $upstream http://clientapi:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
    }
}
